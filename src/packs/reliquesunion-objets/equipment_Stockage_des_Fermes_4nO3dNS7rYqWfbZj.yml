system:
  description: "<p>Trouvé dans la cité de Glanae'Reth, ces multiples caisses, sacs, cagettes, panier, tonneaux... contiennent divers produits.</p><ul><li><p class=\"MsoListParagraphCxSpFirst\">Des vêtements,</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">De la nourriture,\_</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Des outils de tous les jours,\_</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Du papier et matériel d'écriture,</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Des bouteilles de sirop ou d'alcool</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Des tonneaux d'huile, de vinaigre, de bière et cidre</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Des sacs de céréales,</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Des ustensiles de cuisine</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Des sacs de charbons</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">Des cordes</p></li><li><p class=\"MsoListParagraphCxSpLast\">…</p></li></ul><p class=\"MsoNormal\">Le poids total des différents stocks dans les pièces représente des centaines de kilogrammes.</p><p>Après inspection, on remarque qu'une partie non négligeable des stocks proviennent de différentes cultures et on peut se douter qu'ils proviennent de pillages de caravanes ou de villages.</p>"
