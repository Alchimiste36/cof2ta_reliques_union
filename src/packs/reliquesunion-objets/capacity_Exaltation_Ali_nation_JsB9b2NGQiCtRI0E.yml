system:
  description: >-
    <p><strong>Le porteur exerce une influence mentale intense sur toutes les
    créatures dans un rayon de 10 mètres par rang.</strong></p><p>Selon son
    intention, <strong>cette influence renforce ses alliés</strong> (Exaltation)
    ou <strong>affaiblit ses adversaires</strong> (Aliénation). </p><p>À chaque
    tour, les cibles affectées obtiennent au choix :</p><p>soit un Dé Bonus à
    leurs actions, </p><p>soit une action supplémentaire (Exaltation), ou
    subissent soit un Dé Malus à leurs actions, soit une action en moins
    (Aliénation).</p><p>L’effet dure une heure par rang pour le peuple associé à
    la Relique et une minute par rang pour les autres peuples.</p>
  source: ''
  origin: ''
  slug: ''
  inGame: >-
    <p>La première action permet de donner un Effet personnalisé sur les tokens
    ciblés offrant un Dé Bonus à toutes les actions. Si la cible choisi
    d'obtenir une action supplémentaire à son tour, il DOIT retirer manuellement
    le Dé Bonus pour les actions entreprisent. L'effet dure 1 minute par
    rang.</p><p>La deuxième action est identique pour l'Aliénation avec un Effet
    personnalisé qui donne un Dé Malus à tous les tests.</p>
