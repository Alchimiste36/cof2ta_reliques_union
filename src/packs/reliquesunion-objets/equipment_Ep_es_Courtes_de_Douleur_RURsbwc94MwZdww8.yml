system:
  description: >-
    <p>Ce duo d'épée courte est redoutable surtout si elles sont utilisées par
    un combattant ambidextre. Les deux lames émettent une vibration malsaine
    quand on les manipule.</p><p>Chaque épée courte de douleur <strong>inflige
    1d4° DM supplémentaires</strong> et elle donne un <strong>bonus de +1en
    Attaque et aux DM.</strong></p><p>A chaque fois qu'elle inflige des DM, la
    cible doit faire un <strong>test de CON (Résistance douleur) Diff.16 ou elle
    est affaiblie pendant 1 round</strong> à cause des terribles douleurs
    qu'elle ressent.</p>
