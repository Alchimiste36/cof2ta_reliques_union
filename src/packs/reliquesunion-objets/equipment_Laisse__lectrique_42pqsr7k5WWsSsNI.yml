system:
  description: >-
    <p>Ce collier en cuir, parcouru de pièces métalliques, est relié à une fine
    chaine terminée par une pierre gravée d'une série de runes
    magiques.</p><p>Lorsque l'on installe le collier sur une partie du corps
    (cou, tête, membre...), à même la peau, et qu'on frotte les runes avec les
    doigts, une décharge électrique parcourt le porteur.</p><p>La décharge
    <strong>inflige 2d4+2 DM d'électricité au porteur maximum 1
    fois/round.</strong></p>
