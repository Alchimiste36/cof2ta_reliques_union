folder: ChuAzsLAKPjeo4jX
name: Ascension/Domination/Asservissement
type: capacity
img: icons/magic/holy/prayer-hands-glowing-yellow-green.webp
_id: RjLqKMiJV0JaFOIU
system:
  description: >-
    <p><strong>Le porteur libère toute la puissance de la Relique et impose sa
    volonté à toutes les créatures capables de l’entendre.</strong> Il choisit
    l’un des trois effets suivants :</p><ul><li><p><strong>Ascension =&gt;
    renforce les alliés :</strong> les cibles bénéficient des effets
    d’Inspiration (rang 2), d’Exaltation (rang 4), et récupèrent 5 PV par
    tour.</p></li><li><p><strong>Domination =&gt; écrase les
    adversaires</strong> : les cibles subissent les effets d’Intimidation (rang
    2), d’Aliénation (rang 4), et perdent 5 PV par
    tour.</p></li><li><p><strong>Asservissement =&gt; impose un contrôle total
    :</strong> le porteur effectue une <strong>attaque magique opposée</strong>,
    avec réussite automatique sur les cibles de NC 4 ou moins. <strong>En cas de
    réussite, les cibles deviennent des esclaves soumis à sa
    volonté.</strong></p></li></ul><p><strong>Chaque effet dure un jour lors de
    la première utilisation sur une cible, puis deux jours, puis quatre jours,
    puis huit jours, et ainsi de suite à chaque nouvelle utilisation de la
    capacité sur cette même cible.</strong></p><p>Lorsque l’effet prend fin,
    <strong>la cible reste affaiblie pendant une durée équivalente.</strong></p>
  source: ''
  origin: ''
  slug: ''
  inGame: "<p>La première action permet d'activer la capacité et faire apparaitre les autres\_ actions.</p><p>Les 4 premières acions permettent de donner un Effet personnalisé sur les tokens ciblés avec les Bonus ou Malus en fonction du peuple des cibles. Ciblez les bons tokens et activer la bonne action pour donner les Bonus ou les Malus. Si la cible choisi d'avoir une action en plus ou en moins à son tour, elle DOIT retirer manuellement le Dé Bonus ou Malus pour les actions entreprisent.</p><p>La dernière action permet de réaliser une attaque magique opposée et d'affecter le statut Asservi sur les cibles qui ratent leur test.</p>"
