system:
  description: "<p>Ce marteau n'est pas bien long ni aussi impressionnant que les gros et lourds marteaux à deux mains de certains combattants nains. Il ressemble plus à un marteau de forge mais quand on sait l'utiliser, il devient incroyable dans un combat.</p><p>La marteu de guerre donne un bonus de +2 en Attaque et aux DM et il inflige +1d4° DM de poison.\_</p><h4>Pouvoirs d'Arme Traditionnelle naine :\_</h4><p><span style=\"text-decoration:underline\"><strong><span style=\"text-decoration:underline\">Affaiblissement (coût : 1 PM - Action Limitée) :</span></strong></span> la prochaine attaque qui touche inflige le statut <strong>Affaibli sur la cible et 1d4° DM pendant 1d4+CON rounds</strong>. La cible peut réduire les DM de moitié et la durée à un seul round en <strong>réussissant un test de CON Diff.15</strong>.</p><p><span style=\"text-decoration:underline\"><strong><span style=\"text-decoration:underline\">Immunité aux poisons (coût : 2 PM) :</span></strong></span> lorsqu'il active ce pouvoir, l'utilisateur reçoit une <strong>immunité totale aux poisons naturels et magiques pendant CON heures</strong>.</p>"
