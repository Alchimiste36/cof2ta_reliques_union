system:
  description: >-
    <p>Ce délicat collier, composé d'une chaine en argent sur laquelle est fixé
    un pendentif en forme de lézard serti d'une belle pierre orangée, permet au
    porteur d'être beaucoup plus stable sur les terrains
    difficiles.</p><p><strong>Le porteur ne peut plus glisser ou tomber
    lorsqu'il marche sur des surfaces glissantes ou instables</strong> (neige,
    glace, huile, sable, boue, flaque d'eau...). <strong>Si le porteur court, il
    gagne un bonus de +5 aux tests pour éviter de tomber ou
    glisser.</strong></p><p>Cet effet ne s'applique pas pour tenir en équilibre
    sur des cordes, des poutres, une corniche...</p>
