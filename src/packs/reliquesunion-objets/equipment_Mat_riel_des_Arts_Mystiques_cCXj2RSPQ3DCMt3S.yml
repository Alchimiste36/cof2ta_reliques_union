  description: "<p>Trouvé dans la cité de Glanae'Reth, sur le plan de travail du laboratoire, ce matériel est très divers et complet pour faire des expériences magiques multiples.\_Des carnets remplies de notes peuvent être très utiles ainsi que de nombreux composants rares voir même inconnus (insectes, animaux, poudres, résines, ...)</p><p class=\"MsoNormal\">En utilisant cet équipement dans un laboratoire, pendant au moins une heure, l'utilisateur gagne :\_</p><ul><li><p class=\"MsoListParagraphCxSpFirst\">+5 aux tests pour faire des créations magiques ou alchimiques</p></li><li><p class=\"MsoListParagraphCxSpMiddle\">+10 aux tests pour des rituels</p></li><li><p class=\"MsoListParagraphCxSpLast\">+5 aux variables des sorts</p></li><li><p>Une facilité pour créer des alternatives de sorts.</p></li></ul>"
