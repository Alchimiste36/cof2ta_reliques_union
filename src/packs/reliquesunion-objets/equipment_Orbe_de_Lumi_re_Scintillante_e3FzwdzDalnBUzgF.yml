system:
  description: "<p>Trouvé dans la cité de Glanae'Reth, cet orbe était posé dans la main d'une statue représentant une Matrone Elfe Exsangue.\_L'orbe projette, autour de lui, une lumière multicolore vibrante et bougeant en tout sens créant un effet optique assez joli mais hypnotisant.</p><p><strong>Lorsque l'on fixe pendant une minute</strong> la lumière de l'orbe, on ressent un sentiment de vide et de calme se traduisant par <strong>une perte temporaire de -6 en PER et INT.</strong> Ces points reviennent à raison de <strong>1 point de chaque caractéristique par heure</strong> après la fin de la vision de la lumière de l'orbe.</p><p>Si une cible est mise en contact avec la lumière de l'orbe pendant 6h minimum (enfermé dans une pièce baignée par la lumière de l'orbe, par exemple), <strong>elle perd les 6 points en PER et INT temporaire</strong> comme l'effet précédent mais, en plus, répondra à des ordres simples plus facilement <strong>comme s'il était soumis au sort\_@UUID[Compendium.cof2ta_reliques_union.cof2ta-objets.Item.RSEg3oO03Ok34Kwr]{Injonction}</strong>. L'effet dure <strong>3d4+1 heures</strong> à partir du moment où la cible n'est plus en contact avec la lumière de l'orbe.</p><p>La cible peut résister à cet effet en réussissant un test de <strong>INT (Arcanes) Diff.15</strong>. Il peut refaire un test tous les jours tant qu'il est sous l'effet de l'orbe.</p>"
  source: ''
