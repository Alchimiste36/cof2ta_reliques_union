system:
  description: >-
    <h4>Télépathie</h4><p>Le porteur de la Relique peut <strong>établir un lien
    mental avec les membres du peuple associé</strong> à celle-ci, <strong>lui
    permettant de communiquer directement par la
    pensée</strong>.</p><ul><li><p><strong>Avec une cible consentante</strong>,
    cet échange est naturel, fluide et sans limite de durée tant que la
    concentration est maintenue.</p></li><li><p><strong>Pour imposer ce contact
    à une créature non consentante</strong>, le porteur doit réussir une attaque
    magique opposée. En cas de réussite, la télépathie s’établit normalement ;
    en cas d’échec, la connexion ne se fait pas.</p></li></ul><h4>Lecture de
    pensées</h4><p><strong>Le porteur peut sonder l’esprit de ses
    adversaires.</strong> Il peut cibler jusqu’à <strong>deux créatures par
    rang, à portée de vue</strong>, tant qu’il maintient sa
    concentration.</p><p>L’effet nécessite une attaque magique
    opposée.</p><ul><li><p><strong>En cas d’échec</strong>, aucun effet ne se
    produit.</p></li><li><p><strong>En cas d’échec critique</strong>, la cible
    ressent la tentative d’intrusion.</p></li><li><p><strong>En cas de
    réussite</strong>, le porteur choisit l’un des effets suivants
    :</p><ul><li>obtenir un bonus de <strong>+3 par rang en Défense, en
    Initiative et aux tests pour manipuler, intimider ou interagir</strong>
    contre les cibles affectées et pour <strong>résister à ses
    manipulations</strong></li><li>ou <strong>effectuer un test d’Intelligence
    (Investigation) pour extraire des informations</strong> de leur esprit. La
    difficulté est variable en fonction de l’information
    cherchée.</li></ul></li></ul>
