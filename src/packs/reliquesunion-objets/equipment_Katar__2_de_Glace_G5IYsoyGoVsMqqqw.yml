  description: "<p>Ce duo de Katar est gravé de plusieurs séries de runes magiques sur la lame et la poignée. Quand on l'a prend un frisson glacé remonte autour des mains de l'utilisateur.</p><p>Chaque katar <strong>octroi +1d4° DM de glace et un bonus de +2 en Attaque et aux DM</strong>.</p><p><strong><span style=\"text-decoration:underline\">Eclats de Glace (L) :</span></strong>\_en frappant les deux Katar l'un contre l'autre, l'impacte projette une nuée d'aiguilles de glace sur un arc de 180° en face de l'utilisateur et sur une distance de 3 cases.\_Toutes les cibles situées dans la zone <strong>doivent réussir un\_test d'AGI (Esquive) Diff.16 ou subir 2d4° DM de glace et être Étourdie pendant 1 round</strong>. En cas de réussite, la cible subit la moitié des DM uniquement.</p>"
