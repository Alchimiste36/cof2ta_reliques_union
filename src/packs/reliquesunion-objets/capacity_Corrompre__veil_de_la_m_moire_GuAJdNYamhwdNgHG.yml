system:
  description: >-
    <ul><li><p><strong>Sur une cible appartenant au peuple associé</strong> à la
    Relique, l’effet fonctionne automatiquement.</p></li><li><p><strong>Pour les
    autres peuples</strong>, il nécessite un test de CHA (psychologie)
    difficulté 15.</p></li></ul><h4>Éveil de la mémoire</h4><p><strong>Le
    porteur ravive les souvenirs et les émotions d’une créature au
    contact.</strong></p><p><strong>La cible retrouve des souvenirs ciblés, même
    enfouis, avec une grande précision,</strong> y compris des détails oubliés.
    Cette capacité <strong>permet également d’apaiser les émotions, de soulager
    certains traumatismes et d’offrir un repos mental profond</strong>, souvent
    accompagné de rêves calmes et réparateurs. Une cible se reposant sous cet
    effet récupère 1 DR supplémentaire.</p><h4>Corrompre la
    mémoire</h4><p><strong>Le porteur altère les souvenirs et les émotions d’une
    créature au contact.</strong></p><p>Le porteur peut <strong>modifier ou
    supprimer des souvenirs ciblés</strong>, en altérant la perception qu’en a
    la cible. Il peut également <strong>accéder directement à des informations
    secrètes ou enfouies</strong> dans son esprit, sans avoir à effectuer de
    recherche.</p>
