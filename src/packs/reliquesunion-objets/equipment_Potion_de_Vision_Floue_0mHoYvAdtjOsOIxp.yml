system:
  description: >-
    <p>Cette potion est séparé en deux liquides l'un sur l'autre. Avant de
    consommer la potion, il faut la secouer avec force (une <strong>Action de
    Mouvement</strong> <strong>donc Action Limitée pour la secouer ET la
    boire</strong>). Après l'ingestion, le consommateur et son équipement
    deviennent légèrement flou à cause d'un effet ressemblant à une vibration
    quand on le regarde. Ces vibrations rend plus difficile de le
    distinguer.</p><p>Le consommateur <strong>gagne +2 DEF Magique et +5 aux
    tests de Discrétion</strong>. Le <strong>bonus de Discrétion est doublé
    (+10) si le consommateur ne bouge pas du tout</strong> (aucune action durant
    son tour).</p><p>L'effet dure <strong>1d6+PER Minutes</strong>.</p>
