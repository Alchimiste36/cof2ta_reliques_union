system:
  description: >-
    <p>Cette large chevalière en métal mat est sertie d'une pierre ambrée. A
    l'intérieur, des runes naines magiques sont gravées avec
    délicatesse.</p><p>Grâce à cet anneau, le porteur peut, <strong>une fois par
    jour par une action de mouvement, obtenir (Niveau*3)+CON PV
    temporaires</strong>. Ces Points de Vie temporaires sont les premiers à être
    retranchés en cas de dégâts. <strong>Les PV temporaires s'estompent après
    2d4 heures</strong> s'ils ne sont pas perdus.</p><p>Lorsqu'il perd les PV
    temporaires, si le porteur tombe à 0 PV ou moins, il tombe inconscient ou
    mort instantanément.</p>
