system:
  description: "<p>Dans la grande ferme souterraine de la cité de Glanae'Reth, les esclaves kidnappés faisaient pousser et entretenaient des parcelles de plantes pouvant vivre dans l'obscurité des grottes.</p><p>Certaines variétés sont parfaitement connues de tout bon explorateurs mais certaines espèces sont étranges voir inconnues.\_Champignons de plusieurs formes et couleurs, lianes à épines ou sans, plantes à feuilles multicolores... la variété est grande.</p><p>La majorité des plantes servent à la consommation mais certaines sont plutôt utiliser pour fabriquer des produits alchimiques ou d'autres produits.</p><p>La grande majorité des plantes peuvent être conservées par séchage mais il est peu probable de pouvoir cultiver ces plantes dans un autres environnement que des grottes sombres, humides et fraiches comme les fermes de Glanae'Reth.</p>"
