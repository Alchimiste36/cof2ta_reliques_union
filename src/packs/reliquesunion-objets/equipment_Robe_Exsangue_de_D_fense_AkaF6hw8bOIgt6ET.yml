  description: "<p>Portée par la Matrone Zarsa, cette robe de combat est particulièrement belle et ajustée.\_Une série de runes magiques est gravée à plusieurs endroits de la tenue pour la rendre plus souple et confortable sans perdre de sa résistance.\_Elle s'adapte à la personne qui l'équipe pour s'approcher du corps et devenir très souple dans les déplacements.</p><p>L'utilisateur obtient <strong>un bonus de +3 DEF magique</strong> qui n'influe pas sur l'encombrement et d'<strong>une RD de +1.</strong></p><p>La coupe de la tenue est tellement bien réalisée que l'utilisateur gagne <strong>un bonus de +5 aux tests de CHA pour toutes les interactions sociales.</strong></p>"
