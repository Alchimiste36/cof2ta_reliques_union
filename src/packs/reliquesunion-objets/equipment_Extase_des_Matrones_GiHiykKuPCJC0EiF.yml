  gmNotes: >-
    <p>A chaque ingestion le consommateur doit <strong>réussir un test de CON
    Diff.5 au subir un arrêt cardiaque</strong>. La Difficulté augmente de +5
    pour chaque dose supplémentaire consommée en moins de 24h après la première
    dose.</p>
