  description: >-
    <p>Cette petite gélule bleue peut être ingérée. Elle a un goût très
    désagréable qui reste plusieurs minutes en bouche et pique le
    palet.</p><p>En plus de créer un forte érection incontrôlable chez les
    consommateurs masculins et une lubrification vaginale pour les
    consommatrices féminines, cette pilule donne un <strong>bonus de +5 à tous
    les tests de CON pendant une heure.</strong> Les consommateurs <strong>ne
    ressentent plus la fatigue</strong> et <strong>ne peuvent plus dormir
    pendant tout le temps d'effet du sort</strong>.</p>
  source: ''
  origin: ''
