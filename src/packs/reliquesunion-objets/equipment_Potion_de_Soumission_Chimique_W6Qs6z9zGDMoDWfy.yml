system:
  description: "<p>Cette petite fiole contient un liquide visqueux rosée. Son goût est piquant et assez mauvais pour la plupart des palets.\_Le consommateur perd une partie de sa faculté de jugement et de réflexion, le rendant plus facilement manipulable.</p><p>Le consommateur <strong>obtient un Dé Malus</strong> pour tous les tests qu'il effectue <strong>pour résister à une manipulation, une négociation, une intimidation, ...</strong> <strong>L'effet dure 1d4+1 Heure</strong>.</p><p>De plus, tous les sorts de la @UUID[Compendium.cof2ta_reliques_union.cof2ta-objets.Item.DnDhWcVc0TJuEqA8]{Voie de l'Envoutement} et le sort @UUID[Compendium.cof2ta_reliques_union.cof2ta-objets.Item.SBFxn79C8nPVk656]{Suggestion} de la @UUID[Compendium.cof2ta_reliques_union.cof2ta-objets.Item.YMshIWoU6Zfjs3lq]{Voie du Charme} ont <strong>une durée doublée</strong> et <strong>une Difficulté augmentée de +2 pour résister</strong> contre une personne ayant consommée une dose de Soumission Chimique.</p>"
