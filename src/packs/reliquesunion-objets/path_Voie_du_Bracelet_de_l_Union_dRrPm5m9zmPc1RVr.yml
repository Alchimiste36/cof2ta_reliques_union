system:
  description: "<p>Cette voie permet au porteur de la Relique de l'Union d'obtenir les capacités lorsque la Relique est activée.</p><ul><li><p><strong>Le porteur utilise un seul pouvoir lorsqu'il déclenche une capacité. Chaque pouvoir est indépendant.</strong> Le porteur doit donc activer Inspiration (rang 2) pour donner un bonus aux alliés et activer ensuite Intimidation (rang 2) pour donner dans un second temps un malus aux ennemis.\_</p></li><li><p><strong>Si une capacité mentionne \"le peuple associé\"</strong>, cela signifie, pour le Bracelet de l'Union, le peuple elfique et les sang-mêlés ayant un mélange elfique.</p></li><li><p><strong>Toutes les capacités nécessitent une action de mouvement pour être déclenchées</strong>.</p></li></ul><hr /><p>Les rangs de cette voie ne sont pas \"achetables\" avec des Points de Capacités lors d'un passage de niveau (les capacités ne coûtent pas de PC). C'est au MJ d'informer le porteur du moment où il débloque une nouvelle capacité.</p>"
