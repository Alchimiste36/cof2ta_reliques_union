system:
  description: "<p>Cette crème épaisse ressemble à première vu à du miel onctueux. L'odeur de vinaigre est assez forte avec des relents de champignon.\_Manger de la crème fait vomir directement et rend somnolent mais elle devient très intéressante quand on l'injecte via une flèche, un carreau ou une lame.</p><p><strong>En réussissant une attaque</strong> avec une arme trempée au préalable dans la crème de Sommeil, la victime, en plus de subir les DM de l'attaque, doivent effectuer <strong>un test de CON (Résitance sommeil) Diff.15.\_</strong>En cas d'échec du test, <strong>la cible est inconsciente pendant 1d6+1 rounds.</strong> Il s'endort sur place directement.</p><p><strong>A chaque tour, la victime peut effectuer un nouveau test de CON (Résitance sommeil) Diff.15\_</strong>pour se réveiller.</p><p>Chaque dose permet d'enduire une fois sa lame ou une flèche ou un carreau. Si l'attaque rate, la crème coule de l'arme et n'est plus efficace.</p>"
