system:
  description: "<p>Ce magnifique bâton, renforcé par des pièces de métal, est ciselé avec soin de symboles en langue Centaure.\_Au niveau de sa poignée, sous les lanières de tissus, on peut trouver des runes magiques gravées dans une configuration très subtile.</p><p class=\"MsoNormal\"><strong>3 fois par jour</strong>, le porteur <strong>peut faire gagner 1 PR à une cible</strong> que la pointe du Bâton Ferré de Repos touche.</p><p class=\"MsoNormal\">A chaque fois que le Bâton ferré de repos blesse une cible<span style=\"text-decoration:underline\">,</span> en plus des DM de l'attaque, <strong>la cible doit réaliser un test de CON Diff.10 ou être affaibli jusqu'à sa prochaine récupération complète</strong>.</p>"
