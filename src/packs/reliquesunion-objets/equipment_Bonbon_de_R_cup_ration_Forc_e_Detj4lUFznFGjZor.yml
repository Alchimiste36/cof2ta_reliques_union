  description: "<p>Ce bonbon rosâtre et cristallin a une odeur de champignon. Il fond dans ala bouche rapidement colorant la langue en rose.\_En consommant un bonbon, le consommateur ressent une forte fatigue. <strong>Après 1d6 minutes, il s'endort profondément pendant 1d4+2 heures.</strong>\_</p><p><strong>Il récupère 1 DR toutes les 2H de sommeil.</strong></p>"
  source: ''
  origin: ''
  slug: ''
  gmNotes: "<p>Une consommation excessive de Bonbon de Récupération Forcée diminue rapidement l'état physique du consommateur car son corps est trop intensément sollicité.</p><p><strong>Pour chaque dose consommée, après la première, en moins de 7 jours, le consommateur perd 1 point de CON ou de FOR ou d'AGI.</strong>\_Seuls des soins magiques spéciaux ou une semaine de sport et de récupération permet de récupérer ces points de caractéristiques perdus.</p><p><em><strong>ATTENTION :</strong> La combinaison des\_Bonbons de Récupération Forcée avec la @UUID[Compendium.cof2ta_reliques_union.reliquesunion-objets.Item.N3BxttgQEP1nXujD]{potion Tienbon} est très efficace. A chaque MJ d'imaginer les effets pour le corps et l'esprit pour le consommateur s'il en abuse.</em></p>"
