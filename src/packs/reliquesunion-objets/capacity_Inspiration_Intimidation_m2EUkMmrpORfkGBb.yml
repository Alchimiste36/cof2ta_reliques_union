system:
  description: >-
    <p><strong>Le porteur influence mentalement les créatures autour de lui,
    soit en renforçant ses alliés, soit en affaiblissant ses
    adversaires.</strong> Il peut cibler jusqu’à <strong>deux créatures par
    rang</strong>.</p><ul><li><p><strong>Les cibles appartenant au peuple
    associé</strong> à la Relique reçoivent un effet amplifié de +<strong>3 ou
    -3 par rang à tous les tests.</strong></p></li><li><p><strong>Les autres
    peuples</strong> ne subissent qu’un effet réduit de +<strong>1 ou -1 par
    rang en bonus ou en malus à tous les tests.</strong></p></li></ul><p>Selon
    l’intention du porteur, cet effet accorde un bonus à tous les tests des
    alliés (Inspiration) ou impose un malus aux ennemis
    (Intimidation).</p><p><strong>L’effet dure 1H / Rang.</strong></p>
  source: ''
  origin: ''
  slug: ''
  inGame: >-
    <p>La première action, lorsqu'elle est activée, permet d'afficher les 4
    autres actions.</p><p>Les 4 actions suivantes permettent de donner les bonus
    ou les malus sur les tokens ciblés pendant une durée illimitée. Ciblez les
    tokens en fonction de leur peuple et activer la bonne action qui donnera aux
    cibles un effet personnalisé qui faudra supprimer manuellement lorsque
    l'effet prendra fin.</p><p></p>
