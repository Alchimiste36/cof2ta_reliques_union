    name: Vision lointaine
    img: icons/svg/d20-black.svg
    description: >-
      <p>Grâce à un point de vue en hauteur, la rencontre avec un habitant local
      amical, la découverte d'une carte dans un ancien camp… l'Explorateur
      cartographie les alentours.</p><p>Sur une carte avec des cases
      Hexagonales, révéler les cases adjacentes voir plus au groupe. Pour un
      voyage sans carte hexagonale, accorder un bonus aux prochains tests de
      l'Explorateur.</p>
