    _id: STfrppJKMFeY5rTz
    name: Campement abandonné
    img: icons/svg/d20-black.svg
    description: >-
      <p>Que ce soit un camp d'orc abandonné, une caverne confortable ou une
      vallée bucolique, l'Explorateur trouve un lieu idéal pour établir un camp
      ou faire une pause reposante.</p><p>Si le groupe fait seulement une pause
      courte, tous les membres du groupe qui se reposent gagne un DR
      immédiatement.</p><p>Si le groupe décide d'établir un campement durant la
      prochaine période à cet endroit, le groupe obtient un Événement bénéfique
      du Campeur automatiquement durant cette période.</p>
