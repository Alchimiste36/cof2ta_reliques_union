    name: Traces de danger
    img: icons/svg/d20-black.svg
    description: >-
      <p>L'Explorateur remarque des traces de passages fréquents sur la piste.
      Que ce soit des animaux sauvages ou des ennemis, l'Explorateur prévient le
      Gardien de ces trouvailles.</p><p>Si un individu a choisi le rôle de
      Gardien, il obtient, au choix un bonus de +10 aux deux prochains tests ou
      un bonus de +5 aux quatre prochains tests.</p><p>Si personne a choisi le
      rôle de Gardien, le groupe ne sera pas surpris par un attaque éventuelle
      durant les 4 prochaines périodes.</p>
