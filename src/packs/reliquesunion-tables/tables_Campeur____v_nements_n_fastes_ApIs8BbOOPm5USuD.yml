    name: Rencontre nocturne
    img: icons/svg/d20-black.svg
    description: >-
      <p>En plein milieu de la période de repos, une créature sauvage attaque le
      camp prenant legroupe par surprise.</p><p>Une reussite majeur du rôle de
      Gardien peut annuler cet événement.</p><p>Sinon vous pouvez jouer un
      combat contre une créature sauvage adaptée à la région, répartir 4d4° DM
      sur un ou plusieurs membres du groupe pour simuler les dommages reçu ou
      endommager des équipements du camp.</p>
