    _id: khjZoZ28VgWCjZEh
    name: Prise de tête matinale
    img: icons/svg/d20-black.svg
    description: >-
      <p>A cause de la mauvaise nuit et d'un camp mal disposé, les membres du
      groupes se réveillent agacés.</p><p>Les discussions s'enveniment et
      l'ambiance est délétère. Tous les choix sont remis en questions et chacun
      donne son avis sur tout.</p><p>Tous les tests des deux prochaines
      périodent subissent un malus de -5.</p>
