    _id: U8oe8c8RSPnKSk1i
    name: Équipements endommagés
    img: icons/svg/d20-black.svg
    description: >-
      <p>Que ce soit par le feu, le mauvais stockage, l'intervention d'un animal
      suavage curieux, un éboulement de roches dessus… une partie des
      équipements du groupe est endommagé durant la nuit.</p><p>En fonction de
      la situation, déterminez au hasard les équipements cassés ou endommagés ou
      choisissez-les.</p>
