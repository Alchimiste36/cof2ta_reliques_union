    _id: yeB7mHlpPWym1i4d
    name: Blessure majeur
    img: icons/svg/d20-black.svg
    description: >-
      <p>Pas le choix de s'installer ici pour ce reposer. La zone est pas idéale
      mais ça fera l'affaire. Un événement non prévu survient durant la période
      sur une ou plusieurs membres du groupe.</p><p>L'attaque surprise d'une
      bête sauvage, l'effondrement d'une paroi, une nuée de rongeur, des spores
      empoisonnés à proximité… le groupe dort mal et subit des blessures durant
      la période.</p><p>Répartissez 4d4° DM sur un ou plusieurs membres du
      groupe.</p>
