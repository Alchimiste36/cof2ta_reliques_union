      - 3
    _id: RZ7P8GACnyw2jfRv
    name: Confort oublié
    img: icons/svg/d20-black.svg
    description: >-
      <p>Au moment de s'endormir, le camp paraissait confortable pour résister à
      la météo (un bon feu, une caverne fraiche et ventilée, un matelas de
      mousse épaisse…).</p><p>A cause des choix du Campeur, l'élément de confort
      disparait pendant la nuit (le feu s'éteint, la ventilation de la caverne
      est bouclée, la mousse glisse ou s'écrase…). Au réveil, les membres du
      groupe sentent que les prochaines périodes du voyage vont être
      difficiles.</p><p>Tous les membres du groupe reçoivent un malus de -10 aux
      deux prochains tests d'Endurance.</p>
    drawn: false
