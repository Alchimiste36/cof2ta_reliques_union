    name: Nuit difficile
    img: icons/svg/d20-black.svg
    description: >-
      <p>Le camp a subit des distraction régulièrement durant la nuit,
      réveillant les membres du groupe et empêchant un repos
      ravigorant.</p><p>Bruits de bêtes sauvages, plaques de neiges qui tombent,
      attaques d'insectes… les membres du groupe perdent 1 DR en plus de ne pas
      récupérer celui de la nuit.</p>
    drawn: false
