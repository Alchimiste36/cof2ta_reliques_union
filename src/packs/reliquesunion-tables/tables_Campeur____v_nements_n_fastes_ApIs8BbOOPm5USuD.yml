    name: Équipement perdu
    img: icons/svg/d20-black.svg
    description: >-
      <p>Durant la période de repos, un glissement de terrain, une petite
      avalanche, la curiosité d'un animal sauvage, un mauvais stockage… un objet
      utile ou précieux pour un PJ ou pour le groupe est égaré.</p><p>Le temps
      pour le retrouver fait perdre une période au groupe ou l'objet est
      définitivement perdu si le groupe décide d'avancer.</p>
