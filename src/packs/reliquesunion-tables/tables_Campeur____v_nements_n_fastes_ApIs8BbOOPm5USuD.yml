    description: "<p>Entre le temps qu'il a fallu pour trouver un endroit convenable pour établir el camp et les problèmes sans fins qu'il a fallu pour monter l'équipement et préparer à manger, la période de repos est\_ bien plus courte que prévue avec un confort sommaire.</p><p>Chaque PJ et membre du groupe choisi entre :</p><ul><li><p>Perdre 1 DR supplémentaire</p></li><li><p>Subir un malus de -5 aux quatre prochains tests de voyage</p></li><li><p>subir 2d4° DM</p></li><li><p>perdre une partie de son équipement (au choix du MJ)</p></li></ul><p></p>"
