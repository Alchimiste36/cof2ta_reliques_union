    description: "<p>Le camp semble idéal pour le groupe. Un bon repas, quelques étirements et un bon sommeil réparateur.\_</p><p>Au réveil, les membres du groupes sont affaiblis pour une ou plusieurs périodes à cause d'une intoxication alimentaire, l'infestation de puces, un courant d'air glaciale, un nuage de poussière remplissant la grotte…</p><p>Appliquer le statut Affaibli sur tous les membres du groupe.</p>"
