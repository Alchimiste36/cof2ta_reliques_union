      - 8
    _id: pYY4v2YO8tXpbudS
    name: Ressources abondantes
    img: icons/svg/d20-black.svg
    description: >-
      <p>Situé à proximité de buissons de baies sauvages bien sucrées, d'une
      piste de gibier, d'une zone de nidification d'oiseaux… le camp permet au
      groupe de récolter ou de chasser facilement.</p><p>Si une personne a
      choisi le rôle de Chasseur-Cueilleur, il obtient, au choix, un bonus de
      +10 pour les deux prochains tests ou un bonus de +5 aux quatre prochains
      tests.</p><p>Si personne n'a choisi ce rôle, le groupe obtient directement
      un Événement bénéfique pour le Chasseur-Cueilleur.</p>
