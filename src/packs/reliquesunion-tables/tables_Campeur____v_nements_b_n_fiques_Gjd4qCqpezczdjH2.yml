      - 6
    _id: JUs5eFo73EA5UIwo
    name: Exploration lointaine
    img: icons/svg/d20-black.svg
    description: >-
      <p>Le camp est installé de façon à avoir une vue dégagée sur les
      alentours.</p><p>En haute d'un point haut, à côté d'un grand arbre facile
      à grimper, dans une grande tour en ruine… le groupe peut observer la
      région autour sur uen grande distance.</p><p>Si le voyage se fait sur une
      carte avec des cases hexagonales, révélez toutes les cases adjacentes
      (voir plus au choix du MJ).</p><p>Si le voyage n'utilise pas de carte,
      donnez au groupe un événement bénéfique majeur d'Exploration pour la
      prochaine période.</p>
    drawn: false
