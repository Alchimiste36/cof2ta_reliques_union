  - type: text
    weight: 1
    range:
      - 7
      - 7
    _id: zL8ONclkG5MMNrEY
    name: Découverte incroyable
    img: icons/svg/d20-black.svg
    description: >-
      <p>La ruine d'un avant-poste, la cabane d'un berger, une mine abandonnée,
      les reste du camp d'une tribu nomade… le Campeur installe le groupe dans
      un lieu inattendu.</p><p>Pendant que certains membres installent le camp,
      certains décident de fouiller les lieux et découvrent des équipements
      encore en bon état pouvant servir durant le voyage (raquettes, sacs de
      voyage, pioche, crampon, couverture…) ou d'une valeur interressante
      (bijoux, petits objets anciens, fourrure précieuse d'une bête sauvage…).
      Le Campeur découvre même une ancienne sacoche en cuir avec de l'argent
      dedans.</p>
    drawn: false
    flags: {}
