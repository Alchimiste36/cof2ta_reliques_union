    _id: WApneivrERb0CMNm
    name: Réveil tôt
    img: icons/svg/d20-black.svg
    description: >-
      <p>Grâce au campement trouvé par le Campeur, le repos est efficace et
      rapide.</p><p>Les membres du groupe se réveillent en pleines formes
      plusieurs heures plus tôt qu'habituellement. Ainsi, le groupe gagne une
      période de voyage supplémentaire.</p>
