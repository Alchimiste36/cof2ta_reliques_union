    _id: fssFtTSzwfFtuqbp
    name: Hopital de campagne
    img: icons/svg/d20-black.svg
    description: >-
      <p>Grâce au camp trouvé et organisé par le Campeur, le groupe à accès à
      une source d'eau pure, des herbes médicinales et de tout le nécessaire
      pour soigner les blessés.</p><p>Tous les membres du groupe blessés
      reçoivent +2d4° PV avant de dormir.</p>
    drawn: false
