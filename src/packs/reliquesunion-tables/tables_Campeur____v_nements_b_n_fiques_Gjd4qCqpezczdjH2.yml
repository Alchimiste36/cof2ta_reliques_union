    _id: d8bjDs6zCC9kFVPD
    name: Repos excellent
    img: icons/svg/d20-black.svg
    description: >-
      <p>Le camp est très agréable grâce à sa localisation (caverne abritée,
      bosquet reposant…), à son organisation ou à la rapidité pour s'installer
      laissant plus de temps pour le repos.</p><p>En plus des gains d'une
      Récupération Complète, chaque membre du groupe gagne un DR
      supplémentaire.</p>
    drawn: false
