    description: "<p>Grâce à l'organisation du campement, les membres du groupe ont un temps de discussion efficace au moment du réveil.\_</p><p>Tous les membres du groupe qui choisissent un rôle gagnent, au choix, un bonus de +10 aux deux prochaines périodes ou un bonus de +5 aux quatre prochaines périodes.</p>"
