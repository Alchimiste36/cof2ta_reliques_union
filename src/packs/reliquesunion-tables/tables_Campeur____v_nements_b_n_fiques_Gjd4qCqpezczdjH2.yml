      - 3
    _id: gIJ0ywcv5TaE2zWJ
    name: Chaleur/fraicheur réconfortante
    img: icons/svg/d20-black.svg
    description: >-
      <p>Malgré le climat extrême de la région, le Campeur arrive à trouver un
      lieux idéal pour installer le camp. Si la météo est normale, les individus
      du groupe peuvent effetuer des étirements ou des massages pour se
      dégourdir les muscles.</p><p>Les membres du groupe gagnent un bonus de +10
      au tests de résistance au climat ou au tests d'endurance pour les deux
      prochaines périodes ou un bonus de +5 pour les quatre prochaines
      périodes.</p>
    drawn: false
