    _id: nOGoUcMKzUTGELJ6
    name: Rencontre sauvage
    img: icons/svg/d20-black.svg
    description: >-
      <p>L'Explorateur entraine le groupe tout droit vers la tanière d'une bête
      sauvage, un buisson infesté d'inscetes piqueurs, le nid d'un rapace
      belliqueux…</p><p>Une reussite sur le test du Gardien pour cette période
      peut annuler cet événement.</p><p>Sinon jouez une rencontre contre un
      animal sauvage ou répartissez 4d4° DM sur plusieurs membres du groupe pour
      simuler le combat.</p>
