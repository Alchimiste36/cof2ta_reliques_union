    img: icons/svg/d20-black.svg
    description: >-
      <p>L'Explorateur est perdu et n'arrive pas à s'orienter dans cette zone de
      leur voyage. Plus il essaye de lire les éléments du décors plus il fait
      des choix douteux voir dangereux.</p><p>L'Explorateur reçoit, au choix, un
      malus de -10 pour les deux prochains tests soit un malus de -5 aux quatre
      prochains tests.</p>
