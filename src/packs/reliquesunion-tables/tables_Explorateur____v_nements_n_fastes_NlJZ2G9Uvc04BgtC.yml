    name: Blessure mineure
    img: icons/svg/d20-black.svg
    description: >-
      <p>L'Explorateur n'a pas bien lu les signes de la région. Il entrainement
      le groupe vers une mauvaise zone. Des crevasses pour se tordre la
      chevilles, des buissons d'épines, des nuages de noustiques, des éboulis de
      cailloux… quelque soit la nature du danger, les membres du groupe
      reçoivent 2d4° DM.</p>
