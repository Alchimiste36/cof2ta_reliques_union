      - 7
    _id: gTLkazwTdv67Dn9Z
    name: Équipement perdu
    img: icons/svg/d20-black.svg
    description: >-
      <p>Lors de cette période, le groupe avance dans des zones étroites ou
      escarpées. Que ce soit des buissons denses, un chemin étroit le long d'une
      falaise, une rivière avec de l'eau jusqu'aux hanches… le groupe est
      malmené durant plusieurs heures.</p><p>Un faux mouvement et un PJ fait
      tomber un équipement utile ou de valeur pour lui (son arme, ses munitions,
      un bijou important, son carnet de notes…).</p><p>Le groupe à le choix de
      perdre une période pour récupérer l'équipement perdu ou poursuivre son
      chemin mais l'objet est perdu certainement à jamais.</p>
    drawn: false
