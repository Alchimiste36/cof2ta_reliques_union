    name: Blessure majeure
    img: icons/svg/d20-black.svg
    description: >-
      <p>Même en mettant du coeur à la tâche on évite pas toujours les
      risques.</p><p>Une chute, un trou, un chemin tortueux, une glissade sur
      une plaque de verglas… un membre du groupe subit 4d4° DM à cause d'un
      mauvais choix de l'Explorateur ou une explication approximative du
      parcours.</p>
