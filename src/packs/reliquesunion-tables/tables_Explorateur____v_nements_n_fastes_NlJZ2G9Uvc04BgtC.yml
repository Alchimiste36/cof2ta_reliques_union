    _id: tHQx1FP8hIIYdrWj
    name: Terrain inadapté
    img: icons/svg/d20-black.svg
    description: >-
      <p>L'Explorateur entraine le groupe vers une zone inadaptée pour établir
      un campement et se reposer. Terrain dégagé battu par les vents,
      craquements incessants de la végétation, chutes de blocs de glace
      régulier, zone de chasse d'animaux sauvages… il est difficile de se poser
      avec sérénité.</p><p>Si un PJ a choisi le rôle de Campeur, il obtient un
      malus de -10 à son prochain test.</p><p>Si personne n'a choisi le rôle de
      Campeur, le groupe subit un Événement néfaste du Campeur lors de leur
      prochaine période de repos.</p>
