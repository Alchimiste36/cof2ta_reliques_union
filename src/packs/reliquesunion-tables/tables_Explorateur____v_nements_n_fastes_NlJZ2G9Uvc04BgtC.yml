    _id: NKDZlXmHe4dNweW8
    name: Blocage complet
    img: icons/svg/d20-black.svg
    description: >-
      <p>Il a fallu faire un choix mais pas le bon !</p><p>Un éboulement sur le
      groupe, des sables mouvants, un maraicage profond, un chute au fond d'une
      crevasse… le groupe est bloqué pendant plusieurs heures au même endroit.
      Il faut 2 périodes pour débloquer le groupe sans parler des
      conséquences.</p><p>En fonction de la situation, infliger des DM à
      l'individu tomber dans la crevasse, par exemple, ou un équipement peut
      être détruit par l'éboulement, ou le groupe entier peut être affaibli par
      la journée passée à crapahuter dans ce marais.</p>
