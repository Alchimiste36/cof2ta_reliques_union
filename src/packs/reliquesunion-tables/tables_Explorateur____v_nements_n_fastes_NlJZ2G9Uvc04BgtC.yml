    img: icons/svg/d20-black.svg
    description: >-
      <p>Le chemin trouvé par l'Explorateur est éprouvant pour le
      groupe.</p><p>Chemin de graviers instables, montées et descentes abruptes,
      poudreuse fraiche, forêt dense… le groupe se fatigue vite dans cette
      zone.</p><p>Tous les membres du groupe perdent 1 DR.</p>
