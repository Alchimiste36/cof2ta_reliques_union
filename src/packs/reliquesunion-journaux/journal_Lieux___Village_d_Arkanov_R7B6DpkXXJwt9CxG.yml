  - sort: 1200000
    name: 'K : Four et artisanat divers'
    type: text
    _id: 2CbnDSbhN5kjd8nt
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>K. Four et Artisanat divers</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/k_gestion_artisanat.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">
              Dans cette pièce, on trouve un grand bazar organisé qui permet de réaliser beaucoup de petites tâches du quotidien et aussi de s'isoler lorsque l'on veut travailler sur une
              pièce spécifique. Même s'il n'y a pas vraiment de plan de travail, la plupart des Centaures travaillent sur les caisses, sur l'enclume ou sur la margelle du four. Ce dernier
              est assez particulier. Il permet de transformer du bois en charbon très calorifique en étouffant la combustion et sert aussi fréquemment pour faire cuire des réalisations
              simples de la poterie (tuiles, briques, bols…). Le plus agaçant ici c'est de devoir aller chercher dans les autres bâtiments d'artisanat certains outils spécifiques ou des
              matériaux manquants.
            </p>
            <p class="paragraphe">
              On peut trouver dans cette pièce plusieurs jours par semaine, le père de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata},
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.fTbuMNahY2sBxbQd]{Kaiwhakairo} occupé à réparer des objets ou meubles du village lorsqu'il n'est pas dans
              l'atelier de sculpture.
            </p>
            <p class="paragraphe">
              Réparer certains meubles, faire du petit artisanat divers, fabriquer le charbon… Il y a toujours quelque chose à faire ici. Souvent seul, le Personnage pourra être «dérangé»
              par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.fTbuMNahY2sBxbQd]{Kaiwhakairo} qui vient réparer un tiroir ou un manche d'outil.
            </p>
            <hr />
            <h3>Réaliser des travaux utilitaires :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
              <li><p class="paragraphe">@Test[car:int|comp:Comprendre des plans]</p></li>
              <li><p class="paragraphe">@Test[car:for|comp:Travail de force]</p></li>
            </ul>
          </div>
          <hr />

          <h2>Assemblage Robuste :</h2>
          <p class="paragraphe">
            Khaiwakairo vient chercher un PJ de bon matin pour lui demander de l'aide. Il doit assembler un grand établi et remplacer la table centrale dans le bâtiment de production de
            nourriture. L'établi est costaud, muni de nombreux tiroirs de différentes tailles et surtout, chaque partie a été sculptée avec soin par Khaiwakairo durant de longues nuits. Il
            est tout simplement magnifique et cela fait des années que @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.UjoNhFYhsg97Pavf]{Kahao} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.N0rh5EXxLtPGjz5r]{Whakaaro} demande l'installation d'un meuble plus fonctionnel. Toutes les pièces sont
            préparées devant ce bâtiment. Le travail n'est pas extrêmement physique mais il faut emboîter chaque pièce dans le bon ordre avec soin et minutie. Il faudra surtout une bonne
            compréhension entre Khaiwakairo et le Personnage pour ne pas s'emmêler les pinceaux.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:agi|diff:15|comp:Rester concentré et précis]</p></li>
            <li><p class="paragraphe">@Test[car:cha|diff:20|comp:Respecter les consignes - Compréhension - Anticipation]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si réussi :</strong> le Personnage et le centaure passe une excellente matinée à assembler cette belle pièce de menuiserie, mange ensemble cordialement et
                  installe l'établi à sa place définitive dans l'après-midi sous l'œil reconnaissant de
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.UjoNhFYhsg97Pavf]{Kahao} et
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.N0rh5EXxLtPGjz5r]{Whakaaro}.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si échoué :</strong> le grand établi mais monté mais ça n'a pas été une partie de plaisir pour se faire comprendre entre le centaure et le PJ.
                </p>
              </li>
            </ul>
          </ul>
          <hr />

          <h2>Inspection Surprise :</h2>
          <p class="paragraphe">
            Si un Personnage prend l'initiative d'une création artisanale dans ce bâtiment (fabrication d'un meuble, d'un objet, réparation d'une structure…), il se fait interrompre par
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} pendant son travail. Elle venait récupérer une petite enclume et elle commence à
            inspecter le travail du PJ et lui poser des questions sur ce qu'il fait. Elle semble intriguée par cette initiative et elle montre des signes d'encouragement pour l'aventurier
            qui réalise ce travail.
          </p>
          <ul>
            <li>
              <p class="paragraphe"><strong>Si le travail est pour la communauté :</strong> @Test[car:cha|diff:15|comp:Expliquer - Argumenter - Convaincre]</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Si le travail est uniquement pour le PJ ou ses compagnons :</strong> @Test[car:cha|diff:20|comp:Baratiner - Mentir - Embrouiller]</p>
            </li>
          </ul>

          <hr />

          <h2>Un Roupillon et de la Mauvaise Foi :</h2>
          <p class="paragraphe">
            Un PJ qui a besoin d'un outil, de réparer un objet ou simplement passant dans ce bâtiment pour affûter un outil, tombe face à
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0V16m2pDnY3utxtw]{Poauau}, le vieux centaure, en train de dormir au milieu de la pièce. Il se réveille en
            sursaut faisant tomber une caisse d'outils au sol. Il semble désorienté et lance un regard noir au Personnage. Avec beaucoup de mauvaise fois, il pointe les outils au sol et
            commence à rouspéter l'aventurier pour sa maladresse.
          </p>
          <ul>
            <li>
              <p class="paragraphe">
                @Test[car:cha|diff:20|comp:Diplomacie - Politesse - Empathie] pour calmer et apaiser
                @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0V16m2pDnY3utxtw]{Poauau}.
              </p>
            </li>
            <li><p class="paragraphe">@Test[car:cha|diff:15|comp:Bagou - Manipuler - Jouer de la situation] pour se moquer l'absurde situation.</p></li>
            <li>
              <p class="paragraphe">
                @Test[car:for|diff:20|comp:Intimider - Autorité] pour envoyer paître @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0V16m2pDnY3utxtw]{Poauau}.
              </p>
            </li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ réussi son test :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0V16m2pDnY3utxtw]{Poauau} reconnaîtra sa tentative de
                  manipulation et demandera au PJ de ne pas ébruiter l'histoire.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si le test échoue :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0V16m2pDnY3utxtw]{Poauau} s'empressera de raconter à tout le
                  village comment il a recadre un intrus après sa maladresse.
                </p>
              </li>
            </ul>
          </ul>
        </div>
