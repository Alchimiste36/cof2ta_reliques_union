      content: |-
        <div class="journal-cof2ta-ru">
          <h1>T. Réserves de Survie</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/t_stockage_survie.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">
              Ce grand bâtiment de deux étages est quasiment tout le temps fermé à clef. Toutes les femmes aînées de chaque famille possèdent une clef pour cette zone de stockage. Lors de
              la première visite des Aventuriers, on leur explique que le contenu de ce bâtiment sert seulement dans le cas où une grande menace viendrait frapper le village. En rentrant
              des charrettes à l'intérieur, il leur sera possible de quitter rapidement Arkanov pour aller dans les montagnes.
            </p>
            <p class="paragraphe">
              A l'intérieur, on peut trouver tout le nécessaire pour que le village puisse survivre pendant plusieurs semaines. Tout y est empaqueté, emballé et trié soigneusement. On peut
              voir des numéros sur les étagères permettant de répartir les différentes caisses et sacs dans les différentes charrettes afin qu'elles reçoivent un peu de tout le nécessaire.
              Des fontes en cuir sont déjà remplies dans les étagères à l'étage et sur chacune on a soigneusement noté le nom de chaque centaure du village.
            </p>
            <p class="paragraphe">
              A côté des fontes, chaque centaure a une caisse à son nom qui contient une tenue de voyage ainsi que de l'équipement (armure, arme, outil, livres…). En cas d'alerte, chaque
              centaure sait ce qu'il doit faire pour évacuer le village de façon optimale. Des répétition sont réalisés tous les ans à différentes périodes de l'année. La gestion du stock
              et de l'organisation de cette procédure est à la charge de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki}.
            </p>
            <p class="paragraphe">
              Il est très rare qu'une autre personne aide à l'organisation, au trie ou à l'inventaire de ce lieu. Si un des PJ a obtenu une réelle confiance auprès de
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} ou de
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki}, ce serait un immense honneur qu'elle lui ferait de lui proposer de les aider
              dans cette tâche. Espérons que l'aventurier soit à la hauteur de cet honneur.
            </p>
            <hr />
            <h3>Vérifier, ranger et faire un inventaire :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:int|comp:Organisation - Rigueur]</p></li>
              <li><p class="paragraphe">@Test[car:per|comp:Analyser la situation - Observation]</p></li>
            </ul>
          </div>
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_stockage.webp" width="100" height="100" />
          <hr />

          <h2>Évacuation Surprise :</h2>
          <p class="paragraphe">
            Lors d'une soirée plaisante dans la salle commune, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.zv16OZoKKSY6bTpN]{Kupu} est en plein spectacle, lorsqu'une
            explosion retenti dans le village et tous les habitants se lèvent d'un coup entre surprise et effroi.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} entre dans la salle en criant de toute sa force «AWHINA !». En un instant,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} hausse le ton et hurle deux mots «Kia Tupato». Tout les centaures s'activent d'un
            coup comme poussé par un devoir sacré. Ils partent tous dans des directions différentes et en sortant de la salle commune, les PJs remarque un grand nuage de fumée au dessus du
            lac, non loin du compost. Au bout de quelques instant, les aventuriers observent tous les habitants réunis devant ce bâtiment fermé,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} de chaque côté de la porte. Malgré l'obscurité de la nuit, des charrettes sont
            vidés sans ménagements et apportés en ligne dans la rue non loin de la salle commune.
          </p>
          <p class="paragraphe">
            Par petit groupe, les centaures entrent dans le bâtiment sous les ordres des deux responsables. Ils en sortent entièrement équipés des sabots à la tête, avec de lourdes fontes
            sur leur dos et tirant leur charrette remplie vers les grilles du village. Pendant tout ce ballet millimétré,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} sécurisent les centaures avec leurs armes, respectant visiblement une position de
            combat précise.
          </p>
          <p class="paragraphe">
            Lorsqu'il ne reste plus qu'une charrette devant les grandes portes du bâtiment, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini}
            fait signe aux PJs de rentrer avec le dernier groupe. Ils observent que chaque centaure du groupe charge la charrette rapidement avec les caisses et sacs des étagères du RdC
            puis montent à l'étage, ouvrent la caisse à leur nom, s'habillent, s'équipent rapidement mais dans le calme, aident leur voisin à fixer les fontes sur le dos puis tous
            descendent la rampe, se positionnent autour de la charrette et sortent rejoindre les autres. Les Personnages aperçoivent
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}, muni du Duo de Marteaux de Silence, qui observe la scène. Il frappe au sol, les
            deux marteaux en respectant un rythme spécial et en un instant plus aucun son n'est perceptible. Grâce à des gestes,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} fait ouvrir les grilles du village et les chariots sortent en ligne dans la forêt
            extérieure en pleine nuit.
          </p>
          <p class="paragraphe">
            Après quelques minutes à marcher dans la forêt, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} fait un signe à
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} et lève haut le bras. Le convoi s'arrête et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} fait quelques gestes aux centaures qui l'observent avec attention. Les charrettes
            font demi-tour, tout le monde rentre tranquillement au village. Chaque habitant repositionne ses fontes et son équipement à l'endroit prévu du bâtiment, les charrettes sont
            vidées les unes après les autres et, après quelques dizaines de minutes, les centaures partent ce coucher. Certains sont excités par la manœuvre, d'autres épuisés par l'heure
            tardive et un petit groupe est encore perturbé par cette dose de stress intense.
          </p>
          <p class="paragraphe">
            Le lendemain, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} rassemblent les villageois pour faire un rapport sur cet exercice d'évacuation.
            Elles expliquent une nouvelle fois certains détails mal exécutés, félicitent des centaures et grondent ceux qui ont été trop lent ou qui ont oublié des étapes. Elles semblent,
            toutes les trois, satisfaite de la tenue de cet exercice et elles remercient chaleureusement
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} pour la belle explosion qu'elle a préparé.
          </p>
        </div>
