  - sort: 500000
    name: 'D : Préparations et stockages alimentaires'
    type: text
    _id: PKaXRrmLTYIoQkbS
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>D. Préparation et Stockage des Vivres</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/d_preparation_nourriture.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">Dans ce très grand bâtiment, on peut trouver des centaines de caisses, paniers, sacs remplis de légumes, plantes, feuilles, graines, fruits, baies…</p>
            <p class="paragraphe">
              Des plans de travail, étagères et caisses permettent de trier, stocker et garder tous ces aliments. En plus de cela, des structures permettent de préparer les aliments pour
              les conserver (séchage, bocaux, saumure, fermentation…), de les trier et de les préparer pour la cuisine collective ou pour que chaque habitant du village puisse trouver de
              quoi se nourrir au quotidien.
            </p>
            <p class="paragraphe">
              A l'étage, des stocks de nourritures sont entreposés sur des étagères bien organisées. On remarque qu'au premier étage comme au second, un ingénieux système de ventilation
              est associé à quelques runes magique qui permettent de garder la pièce fraiche et avec un bon taux d'humidité. Il y a de quoi tenir plusieurs semaines voir mois avec toute
              cette nourriture stockée.
            </p>
            <p class="paragraphe">Les Personnages peuvent être appelés pour aider à préparer les légumes, graines, plantes, fruits…</p>
            <p class="paragraphe">
              Dans ce bâtiment, il est possible de faire sécher, écraser, mettre en sacs ou sachets, découper, trier, éplucher, faire des bocaux, saler, mettre à fermenter, effeuiller,
              organiser… toute les différentes denrées venant du Verger, Champs ou Potager.
            </p>
            <p class="paragraphe">Le travail n'est pas compliqué mais il faut souvent de la minutie, une grande rigueur et une hygiène impeccable.</p>
            <p class="paragraphe">
              Dans toute la partie du village servant à la culture de la nourriture, on croise le plus souvent
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka}, une Centaure assez stressée,
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.V9ITbgWBBsUeixHA]{Kaihoroi} toujours disponible pour rendre service ainsi que la lunatique
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.UjoNhFYhsg97Pavf]{Kahao}.
            </p>
            <hr />
            <h3>S'occuper de la préparation des denrées alimentaires :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
              <li><p class="paragraphe">@Test[car:per|comp:Survie]</p></li>
            </ul>
            <hr />
            <h3>Opérations de conservation et utiliser les machines de ce bâtiment :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:int|comp:Comprendre des machines]</p></li>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
            </ul>
          </div>
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_cuisine3.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_cuisine5.webp" width="100" height="100" />
          <hr />

          <h2>Désespoir Ô Désespoir :</h2>
          <p class="paragraphe">
            En fin de journée, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka} se trouvera au deuxième étage du bâtiment en train de pleurer.
            Elle essayera d'expliquer à l'aventurier que son conjoint, Kahaki, a été kidnappé lors de la dernière attaque des Atarangi Kino. Elle est triste, désespérée et en colère de
            l'inaction du village face a cette menace. Le personnage pourra essayé de la réconforter et/ou en parler à
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} ou à un autre centaure.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:15|comp:Empathie - Diplomacie]</p></li>
          </ul>
          <hr />

          <h2>Intéraction Tendue :</h2>
          <p class="paragraphe">
            Le PJ est en train de mettre en sachet des feuilles séchées sorties du séchoir solaire au RdC du bâtiment lorsque
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.UjoNhFYhsg97Pavf]{Kahao} s'approche de lui et commence à lui expliquer quelque chose de façon agressive. Elle
            essaye de se faire comprendre mais sa manière de communiquer est assez bloquante.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:15|comp:Empathie - Diplomacie]</p></li>
            <li><p class="paragraphe">@Test[car:int|diff:10|comp:Comprendre les demandes]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si les deux tests sont réussis : </strong>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.UjoNhFYhsg97Pavf]{Kahao} se calme et arrive à se
                  faire comprendre plus ou moins bien.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si l'un des deux tests est raté :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.UjoNhFYhsg97Pavf]{Kahao} s'énerve de plus en plus et
                  deviendra véhémente envers le PJ. Elle n'arrive pas à se faire comprendre ou elle a l'impression que le PJ n'en à rien à faire ou se moque d'elle.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si les deux tests sont ratés :</strong> en plus de s'énerver de plus en plus, elle prend la réaction du PJ comme une insulte volontaire. Elle le bouscule, le
                  menace, se muni d'un bâton pour le faire sortir…
                </p>
              </li>
            </ul>
          </ul>
        </div>
