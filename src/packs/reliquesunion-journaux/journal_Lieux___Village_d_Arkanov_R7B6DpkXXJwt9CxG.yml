      content: |-
        <div class="journal-cof2ta-ru">
          <h1>U. Forêt Extérieure et Chasse</h1>
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">
              En sortant su village par les larges grilles, on arrive dans la grande forêt de feuillus en haut des hautes montagnes des Crocs d'Acier. Régulièrement, un groupe de centaures
              sortent du village pour aller chasser, cueillir des plantes, bûcheronner un arbre ou faire une ronde aux alentours du village pour vérifier si une tribus Peaux Vertes ou des
              traces d'animaux sauvages sont visibles.
            </p>
            <p class="paragraphe">
              C'est souvent @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha},
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} qui partent en chasse accompagnés ou non par
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri} ou de la jeune
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina}. Ils passent une journée ou deux dans la forêt et reviennent avec un cervidé,
              quelques lapins ou oiseaux. La forêt n'est pas «entretenue» comme la plupart des forêts proches des villes des Terres d'Arran et certaines zones sur difficiles d'accès à
              cause des buissons épineux, des fougères et autres branches basses. Seule la zone auprès du village a été dégagée pour exploiter le bois et surveiller depuis les murailles.
            </p>
            <p class="paragraphe">
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu},
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} font, aussi, de temps en temps une expédition hors du village pour aller
              récupérer des feuilles, écorces, baies, racines ou autres produits qu'ils ne cultivent pas dans le potager. Ils sont à chaque fois protégés par
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} ou
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}.
            </p>
            <p class="paragraphe">
              C'est dernières années, des expéditions ont été faites pour suivre les traces des Atarangi Kino après des attaques sur le village. Toutes les empreintes se dirigeaient vers
              le nord mais, à chaque fois, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} décidait de rebrousser chemin avant de découvrir
              quoi que ce soit.
            </p>
            <hr />
            <h3>Partir à la chasse :</h3>
            <ul>
              <li><p class="paragraphe">Réaliser des tests d'attaque de contact ou à distance avec l'arme choisie par le PJ pour estimer sa réussite ou son échec.</p></li>
              <li><p class="paragraphe">@Test[car:per|comp:Survie en milieu naturel]</p></li>
            </ul>
          </div>
          <hr />

          <h2>Partie de Chasse :</h2>
          <p class="paragraphe">
            Si un PJ a sympathisé avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} et ses deux fils, ces derniers pourront lui proposer de
            l'accompagner pour leur prochaine sortie. Si le Personnage n'est pas très doué à l'arc, ils essayeront d'attaquer plutôt un ours des montagnes sinon, les trois centaures
            préfèrent la poursuite des cervidés. Ils se préparent pour partir avant le levé du soleil et ils semblent très excités. Tout le long de la journée, les centaures essayeront de
            convaincre leur nouveau compagnon de chasse des idées qu'ils ont pour le village. Explorer, conquérir, récupérer leur place sur les montagnes et montrer au monde la puissance
            des centaures. SAG-SURVI DD20. Si réussi, le PJ trouve rapidement la piste d'un ours ou de cervidés dans la forêt. Les trois centaures sont bluffés par ces compétences en
            pistage. ATT-CONTACT DD17 pour la chasse à l'ours ou ATT-DIST DD15 pour la chasse au cervidé. Trois tests.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:per|diff:20|comp:Survie - Pistage]</p></li>
            <li><p class="paragraphe">@Test[car:con|diff:10|comp:Endurance]</p></li>
            <li><p class="paragraphe">Pour la chasse à l'ours : 3 tests d'Attaque de Contact (Difficulté 17)</p></li>
            <li><p class="paragraphe">Pour la chasse au cervidé : 3 tests d'Attaque à Distance (Difficulté 15)</p></li>
          </ul>
          <p class="paragraphe">
            En fonction du nombre de réussite, le PJ est soit une aide majeure pour cette chasse et les trois centaures seront impressionnés par le talent du Personnage soit, ils se
            moqueront ouvertement de ces peuples qui ne sont bons à rien comparés aux centaures forts, puissants et compétents. Si le Personnage fait trois échecs, il se blessera durant la
            chasse. Il subit 2d10+4 DM.
          </p>
          <hr />

          <h2>Expédition Botanique :</h2>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu} souhaite organiser une longue expédition dans la forêt et plus loin si le chef
            Kilko le permet afin d'aller étudier, répertorier, cueillir et dessiner des plantes ou des animaux. Avec l'expertise de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} et la protection de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa}, le centaure passionné de botanique pense qu'il peut trouver de nouvelles espèces
            qui pourraient être utiles pour le village. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} accepte sous certaines conditions et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu} demande à un PJ s'il souhaite les accompagner. Tout le nécessaire est prévu.
            L'expédition devrait durer trois jours et deux nuits.
          </p>

          <h3>Le premier jour :</h3>
          <p class="paragraphe">
            Le rythme est soutenue pour la journée au travers de cette partie de la forêt qui est connue. Le soir est agréable malgré l'absence de feu et la fraicheur de la nuit.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} parcourent différentes zones et récupèrent beaucoup d'échantillons de plantes,
            d'insectes ou de petits animaux. De leur côté @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa}, le père et la fille, prennent très au sérieux leur rôle de protection sans que ça
            leur empêche de papoter et rigoler ensemble.
          </p>
          <p class="paragraphe">En fonction du rôle du PJ :</p>
          <ul>
            <li>
              <p class="paragraphe">
                Aider @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu} et
                @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} à la recherche de faune et de flore intéressantes :
                @Test[car:per|diff:20|comp:Survie - Connaissance de la nature]
              </p>
            </li>
            <li><p class="paragraphe">Rester aux aguets des dangers qui pourraient subvenir : @Test[car:per|diff:15|comp:Vigilance - Observation]</p></li>
          </ul>
          <p class="paragraphe">En fonction de la réussite du ou des tests effectués, le PJ sera un atout important ou non dans sa tâche pour l'expédition.</p>

          <h3>Le deuxième jours :</h3>
          <p class="paragraphe">@Test[car:per|diff:20|comp:Vigilance - Observation]</p>
          <p class="paragraphe">En début de matinée, alors qu'ils parcourent les étendues sauvages et enneigées hors de la forêt, le PJ voit quelque chose.</p>
          <ul>
            <li>
              <p class="paragraphe">
                <strong>Si raté :</strong> le PJ semble avoir aperçu une silhouette en haute d'un pic montagneux à quelques dizaines de mètres d'eux. Rien de plus, sans être persuadé de ce
                qu'il a vu ou non. Peut-être un animal sauvage.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Si réussi :</strong> le Personnage distingue clairement quatre silhouettes positionnées sur la pente d'une montagne à quelques dizaines de mètres de leur position.
                Les intrus ne semblent pas les avoir vu. Ils sont habillés d'une tenue noire et blanche, encapuchonnés, et ils se déplacent avec l'agilité d'un elfe sur les plaques
                glissantes.
              </p>
              <ul>
                <li><p class="paragraphe">@Test[car:per|diff:20|comp:Observation Lointaine]</p></li>
              </ul>
              <p class="paragraphe">
                <strong>Si réussi :</strong> le PJ remarque, en plus, que l'un deux porte un long sac sur l'épaule pouvant ressembler à un corps emballé dans un tissu.
                @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} et
                @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} refuseront catégoriquement que leur expédition parte au-delà de l'arête
                montagneuse mais si le PJ le souhaite, ils pourront observer de cette hauteur la route empruntée par ce petit groupe. Positionnés en haut de la crête, cachés par quelques
                buissons rachitiques, le PJ et les centaures suivront des yeux les quatre humanoïdes sur plusieurs kilomètres avant qu'ils ne soient plus visibles.
              </p>
              <div class="sallemj">
                <p class="paragraphe">
                  C'est un raid d'Ombres Blanches ou Atarangi Kino pour les centaures qui reviennent avec une proie gobelin qu'ils ont kidnappé récemment. Si le PJ a observé la scène, il
                  gagnera un bonus pour traquer les Atarangi Kino après l'attaque sur le village.
                </p>
              </div>
            </li>
          </ul>
        </div>
