  - sort: 1800000
    name: 'Q : le Coeur d''Arkanov'
    type: text
    _id: IeiOoPvxliVcuC3Y
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>Q. Le Cœur d'Arkanov</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/q_coeur_arkanov.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <ul>
              <li><p class="paragraphe">Scierie et Menuiserie</p></li>
            </ul>
            <p class="paragraphe">C'est certainement le plus important bâtiment du village d'Arkanov. Le cœur d'activité du village, là où la salle commune est le cœur populaire.</p>
            <p class="paragraphe">
              Ce bâtiment est relié directement à l'immense roue à eau installée sous la cascade. La plupart de la machinerie est installée dans ce bâtiment et se connecte à toutes les
              machines qui permettent de réaliser le travail du village.
            </p>
            <p class="paragraphe">
              Dans cette grande pièce du RdC, on s'occupe des troncs, des branches, des grumes et des planches venant de la forêt intérieure et extérieure. Les troncs sont entreposés à
              l'extérieur près du lac et, au besoin, sont passés par la large ouverture dans le mur afin d'être débités sur le banc de coupe actionné par les engrenages et les cordes. Un
              centaure seul peut transformer un tronc en poutre ou en planches en quelques heures grâce à des systèmes de palans et de treuilles. Ensuite, les planches ou poutres sont
              entreposées et mises à sécher ou elles sont mises en œuvre pour la fabrication des meubles, des structures, des charpentes…
            </p>
            <p class="paragraphe">
              Les outils y sont rangés méticuleusement dans des caisses afin d'être facilement déplaçable en même temps que le chantier (haches, doloires, ciseaux, règles, compas…).
              L'atelier est très propre à tout moment du jour comme de la nuit et @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} est très
              exigeante sur l'entretien du banc de scie et des rouages de la machine. On trouve dans le scierie le plus souvent les deux frères conservateurs
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} ainsi que le calme
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.NOuO9E41cHVJuhh8]{Iti}.
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} vérifie les réalisations et supervise l'utilisation des machines.
            </p>
            <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_scierie.webp" width="100" height="100" />
            <hr />

            <ul>
              <li><p class="paragraphe">Meunerie, Pressoir, Tisseranderie et Machinerie</p></li>
            </ul>
            <p class="paragraphe">
              En montant la large rampe en colimaçon menant au premier étage, on arrive dans une immense pièce tout en longueur. Dans un des coins, on voit une immense meule qui permet de
              transformer les grains en farine. Elle aussi reliée à la machinerie de la cascade, on peut la faire tourner à trois vitesses différentes pour optimiser la finesse de la
              farine. Bien que nettoyée régulièrement, une fine pellicule blanche est présente sur chaque bout de bois et chaque pièce de métal dans cette partie de la pièce.
            </p>
            <p class="paragraphe">
              Derrière la rampe, un pressoir est installé pour extraire le jus des fruits, légumes et plantes diverses qui servent pour la cuisine, pour être transformé dans l'alambic,
              servir à aromatiser les bougies, réaliser des colorants pour les tissus ou encore pour la préparation des remèdes. Ce pressoir est relié également à la machinerie avec un
              ingénieux système qui permet de réaliser une très forte pression mais aussi de soulever le poids rapidement et sans effort.
            </p>
            <p class="paragraphe">
              Le long couloir mène à la tisseranderie et de chaque côté on parcours un chemin au milieu des tissus qui sont étendus pour sécher après leur teinture ou qui attendent d'être
              assemblé les uns avec les autres pour réaliser des vêtements, des draperies, des rembourrages de meubles… On trouve des tissus de toutes les couleurs et de toutes les
              compositions (laines d'animaux chassés dans les montagnes, cuirs, lins ou chanvres venant du jardin). Les couleurs sont issus de plantes tinctoriales triées et sélectionnées.
              La tisseuse fabriquée au fond de la pièce est une merveille de finesse et de fluidité. On peut voir les fils être assemblées lignes après lignes avec la possibilité
              d'intercaler plusieurs types de fils et plusieurs couleurs pour réaliser des étoffes multicolores et décorées. Le bruit «tchik tchik tchik» à chaque passage crée un rythme
              qui incite à danser.
            </p>
            <p class="paragraphe">
              Enfin, derrière les parois proches de la rampe, on peut accéder à la gigantesque machine d'Arkanov afin de réaliser l'entretien, changer une pièce ou tout simplement pour
              déconnecter telle ou telle machine lorsque l'on doit y faire une maintenance. Les courroies, les engrenages de plusieurs mètres de diamètre, le cordage qui décuple la force
              ou la vitesse, les rouages qui transmettent le mouvement vers les machines ou les autres bâtiments feraient rougir un nains du temple devant cette conception. Il est assez
              complexe de s'y retrouver dans se méli-mélo de coudes et cordes et c'est la raison pour laquelle
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} laisse peu de personnes s'occuper de cette complexité.
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} raconte souvent le démontage complet et le remontage effectué il y a trois ans
              pour changer un des engrenages principaux. Elle est fière de cette semaine menée d'une main de maître grâce à l'aide de la plupart des villageois.
            </p>
            <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_tissanderie.webp" width="100" height="100" />
            <hr />

            <ul>
              <li><p class="paragraphe">Corderie et Filanderie</p></li>
            </ul>
            <p class="paragraphe">
              La rampe dans le couloir nous mène au deuxième étage, là où sont fabriqués cordes, cordages et fils de tous les diamètres et dans toutes les matières. Les sacs et bottes de
              chanvre, de lin ou de laine sont montés ici et seront patiemment filés en fils pour coudre ou tisser et en solides cordes pour toutes les utilisations du village (transport
              des troncs, raccordement des machines aux poulies…). Un banc à filer parcourt tout le couloir pour torsader les cordages et au fond de la pièce, on peut utiliser le grand
              rouet à filer qui est actionné par les sabots du Centaure. Des étagères sont positionnées sur la plupart des murs pour stocker les bobines de fils, les rouleaux de cordes,
              les sacs de matières premières ainsi que les outils pour utiliser les machines et pour les entretenir.
            </p>
            <p class="paragraphe">
              A cet étage, on trouve souvent @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} qui s'occupe de filer la laine, de colorer les
              fils ou de trier les bobines. Elle ne parle pas beaucoup et on vient rarement la perturber à cet étage. Elle aime être tranquille loin de
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} son agressif conjoint. Derrière le bruit de la machinerie, on peut percevoir ses
              sanglots. Lorsqu'un autre villageois a besoin de ces machines, elle s'éclipse rapidement dans un autre coin isolé du village.
            </p>
            <p class="paragraphe">
              Il faut beaucoup de confiance pour visiter et travailler dans ce bâtiment. La machinerie principale et chaque réalisation installées ici sont très précieuses voir vitales
              pour le village. Les Personnages seront observés les premiers jours où on leur permettra de travailler sur les différentes machines, pour leur sécurité mais aussi pour la
              sécurité des machines.
            </p>
            <p class="paragraphe">
              Si un héros fait du mauvais travail et surtout s'il bloque une machine, il recevra les remontrances de
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} et de
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} mais pourra recevoir le soutien de
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} ou de
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha}.
            </p>
            <hr />
            <h3>Pour toutes les tâches artisanales :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:for|comp:Travaux physiques]</p></li>
              <li><p class="paragraphe">@Test[car:agi|comp:Travaux de précision]</p></li>
              <li><p class="paragraphe">@Test[car:con|comp:Travaux d'endurance]</p></li>
              <li><p class="paragraphe">@Test[car:int|comp:Connaissances artisanales]</p></li>
              <li><p class="paragraphe">@Test[car:int|comp:Comprendre des plans et des consignes]</p></li>
              <li><p class="paragraphe">@Test[car:per|comp:Analyser la situation - Observation]</p></li>
              <li><p class="paragraphe">@Test[car:cha|comp:Sens artistique]</p></li>
              <li><p class="paragraphe">@Test[car:cha|comp:Diplomacie - Patience]</p></li>
            </ul>
          </div>
          <hr />

          <h2>Un engrenage qui casse :</h2>
          <p class="paragraphe">
            Dans la scierie, en voulant déplacer une longue planche de bois venant juste d'être débitée, le Personnage tape par mégarde dans les engrenages qui actionnent la machine. Un
            terrible bruit mécanique se fait entendre et la machine s'arrête. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha}, à l'étage,
            descend la rampe au galop et après un temps d'arrêt devant les dégâts, elle s'agite et s'énerve. Dans tous les cas, le Personnage sera mis à contribution pour réparer la
            machine.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:15|comp:Diplomacie - Apaisement - Explications calmes]</p></li>
            <li><p class="paragraphe">@Test[car:cha|diff:15|comp:Mentir - Détourner les faits - Baratiner]</p></li>
            <li><p class="paragraphe">@Test[car:for|diff:20|comp:Imposer sa vision des événements - Répondre avec autorité]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>En cas de réussite :</strong> la situation s'apaise et @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} comprendra les
                  arguments de l'aventurier. Même si le test est réussi, si le PJ est vraiment de mauvaise fois,
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} sera déçu du PJ et de son manque de responsabilité.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>S'il échoue :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} l'engueulera sans ménagement et l'histoire fera
                  rapidement le tour du village. Si le PJ a raté son test de FOR en s'énervant ou ne veut pas accepter sa responsabilité, la perte de confiance sera d'autant plus grande.
                </p>
              </li>
            </ul>
          </ul>
          <p class="paragraphe">
            Quelques instants plus tard, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} arriveront dans la scierie. Le PJ aura le soutien ou non
            d'@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} et passera une bonne soirée ou une horrible semaine face à cet incident.
          </p>
          <hr />

          <h2>Des pleurs, un désespoir :</h2>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina} demande à un des Personnages s'il peut l'aider à plier les longues bandes de tissus
            de la tisseranderie. Maintenant qu'ils sont secs, être deux pour les plier et les ranger ferait gagner énormément de temps. Si le PJ acceptent,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina} l'amènera dans le long couloir du premier étage du bâtiment. En arrivant en haut de
            la rampe, ils entendent des sanglots au dessus d'eux. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina} semble bouleversée. Elle
            explique que c'est @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe}, la conjointe de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} qui passe son temps dans la corderie. Personne ne sait vraiment pourquoi elle est
            si triste et repliée sur elle-même. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina} se doute que c'est à cause de son agressif
            conjoint. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina} demande au PJ d'aller lui parler et la soutenir. Si le PJ accepte, il
            découvrira @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} positionnée sur le rouet à filer. Elle est surprise par la présence de
            l'aventurier. Elle est sur la défensive.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:15|comp:Diplomcaie - Empathie - Écoute] pour essayé de l'apaiser et de comprendre pourquoi elle pleure.</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si réussi :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} accordera sa confiance rapidement à cet intrus
                  sans trop savoir pourquoi. Elle expliquera que son conjoint est parfois violent avec elle. Elle est soutenue par sa fille
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga} mais son fils,
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.1TJXdxZkBi0ZRvGn]{Taitamariki}, est très perturbé par les agissements de son père. Elle a peur de lui
                  et de ses réactions.
                </p>
              </li>
            </ul>
          </ul>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:20|comp:Détendre l'atmosphère - Faire des blagues - Rigoler] pour lui changer les esprits.</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si réussi :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} arrête de pleurer et elle arrive même à sourire
                  et rigoler des traits d'humour du PJ. Elle remerciera le PJ sans forcément s'ouvrir sur la situation. Elle finira par lui dire qu'elle n'a pas d'importance et qu'il a
                  surement d'autres choses plus importantes à faire.
                </p>
              </li>
            </ul>
          </ul>
          <section class="sallemj">
            <p class="paragraphe">
              Si le PJ arrive à calmer et à sympatiser avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe}, elle descendra avec lui et ils
              plieront, avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina}, les tissus dans une joyeuse ambiance. Cet événement aura de
              grandes conséquences par la suite. Si le PJ révèle la situation à d'autres centaures,
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} mèneront une enquète approfondie et questionneront entre autre le PJ. En fonction
              de ses réponses, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et les centaures au courant de la situation seront accusés,
              jugés et surement punis. La confiance du ou des PJ avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} aideront grandement cette
              dernière à prendre la parole et à révéler les tourments qu'elle et ses enfants vivent depuis des années.
            </p>
          </section>
          <ul>
            <li><p class="paragraphe">@Test[car:for|diff:10|comp:Hausser le ton - Brusquer] pour imposer son autorité et lui intimer de se calmer.</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si réussi (c'est vraiment pas très compliqué d'initmider cette centaure soumise par la peur et la violence) :</strong>
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} arrêtera rapidement de pleurer, se donnera une lourde gifle sur la joue et
                  reprendra son travail dans le silence quelques larmes encore sur les joues. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe}
                  sera définitivement fermée pour la plupart des PJ craignant leur autorité. Si cet événement arrive aux oreilles
                  d'@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga} ou de certains centaures du village, le PJ sera prit violemment à partie
                  pour qu'il explique pourquoi il a brusquer @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} alors qu'elle est déjà
                  traumatisée.
                </p>
              </li>
            </ul>
          </ul>
          <hr />

          <h2>Joyeuse famille au pressoir :</h2>
          <p class="paragraphe">
            Le PJ est abordé par le professeur @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako} en fin de journée. Toute sa famille s'occupe de
            la récolte des Waina le lendemain. Les fruits du Hewaina sont de petites grappes sucrées et très rafraîchissantes qu'ils doivent récolter, nettoyer, transporter, presser et
            mettre en tonneau. C'est une tâche plutôt festive mais physique. Si le PJ accepte, il se retrouvera au petit matin en compagnie de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.j3OVVzmkWhACNokh]{Te'Whakama} ainsi que
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} venue aider ses amis.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:agi|diff:10|comp:Délicatesse - Précision] pour la récolte.</p></li>
            <li><p class="paragraphe">@Test[car:per|diff:10|comp:Survie - Préparation] pour le nettoyage et la préparation des fruits.</p></li>
            <li><p class="paragraphe">@Test[car:for|diff:10|comp:Tâches physiques] pour le transport et le pressage.</p></li>
            <li><p class="paragraphe">@Test[car:con|diff:10|comp:Endurance - Résistance à la fatigue] pour le transport et le pressage.</p></li>
          </ul>
          <p class="paragraphe">
            La famille échange les tâches tout au long de la journée afin de pouvoir discuter, rigoler, chanter et danser avec chaque centaure. L'ambiance est très agréable et à chaque
            fois que l'aventurier rate un test, des moqueries sympathiques feront rire toute la famille. Il est bien tard quand la tâche est terminée. Tout le monde est épuisé et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} sort une bouteille est terre cuite, scellée à la cire et la débouche. Elle contient
            une délicieuse liqueur de Waina aromatisée aux herbes par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa}. La soirée est
            merveilleuse entourée par cette charmante famille.
          </p>
        </div>
