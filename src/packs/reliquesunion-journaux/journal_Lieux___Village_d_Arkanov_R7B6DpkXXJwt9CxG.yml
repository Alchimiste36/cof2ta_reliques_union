  - sort: 800000
    name: 'G : Cuisine collective'
    type: text
    _id: QYs90mKhx9fHyy79
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>G. Cuisine Collective</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/g_cuisine_collective.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">
              Il y a tout dans ce bâtiment pour préparer un grand nombre de repas tous les jours si on organise bien le travail et l'espace. Une partie des préparation se font d'abord dans
              le bâtiment de Préparation de Nourriture. La pièce est remplie de plan de travail, d'ustensiles, de vaisselles et surtout de nourriture en tous genres. Deux belles
              cuisinières sont quasiment toujours en chauffe et des bassins, directement reliés à la nappe phréatique, sont installés pour nettoyer les légumes et autres salades. A
              l'étage, on trouve de nombreux stocks de denrées alimentaires en tout genre, ainsi que des sacs de céréales ou des caisses de produits séchés.
            </p>
            <p class="paragraphe">
              A n'importe quel moment du jour ou de la nuit, il n'est pas étonnant de croiser des Centaures dans cette cuisine collective. Que se soit la gourmande et cordon bleue
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini},
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.fTbuMNahY2sBxbQd]{Kaiwhakairo} ayant oublié de se nourrir après une soirée passé dans l'atelier de
              sculpture ou encore le fils du chef, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} qui prépare un repas copieux après un
              entraînement intensif.
            </p>
            <p class="paragraphe">
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} et sa fille
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} passent énormément de temps à préparer les repas de la collectivité quand cette
              dernière ne fait pas d'exercices d'assouplissement.
            </p>
            <p class="paragraphe">
              Les Personnages peuvent aider à préparer des repas et il faut en faire beaucoup tous les jours. Couper, cuire, rissoler, éplucher, aller chercher des herbes, touiller… et
              tout ça pour la grande majorité des Centaures du Village d'Arkanov. Certains préfèrent se restaurer en cuisinant seul avant ou après les autres car ils veulent continuer le
              travail mais tous les midis et tous les soirs, des repas sont préparés et chaque Centaure vient se servir et apporter leur repas aux membres de leur famille. Même si certains
              mangent dans leur coin ou dans leur atelier, il est plus fréquent que les Centaures s'installent sur la Place du Village, le long du lac, dans le verger ou même dans la salle
              commune au rez-de-chaussée ou à l'étage.
            </p>
            <hr />
            <h3>Préparer des repas :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:per|comp:Survie]</p></li>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
            </ul>
            <hr />
            <h3>Apporter leur repas à certains Centaures :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:cha|comp:Diplomacie - Empathie]</p></li>
            </ul>
            <hr />
          </div>
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_cuisine1.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_cuisine2.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_cuisine4.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_cuisine6.webp" width="100" height="100" />

          <h2>Cuisine Diplomatique :</h2>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} rentrent de la chasse avec un magnifique cerf qu'ils déposent dans la cuisine
            collective en bombant le torse quand il passe à côté du Personnage. Les trois centaures repartent avec un grognement pour aller se laver et se reposer. Le PJ peut préparer le
            cerf avec la complexité que cela représente.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:agi|diff:10|comp:Délicatesse - Précision]</p></li>
            <li><p class="paragraphe">@Test[car:for|diff:15|comp:Force physique]</p></li>
            <li><p class="paragraphe">@Test[car:per|diff:20|comp:Survie]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si le Personnage échoue :</strong> il sera lourdement réprimandé par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} et
                  ses fils devant tout le village.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Par contre, si le PJ réussi :</strong> les trois chasseurs seront étonnés et ils auront un peu plus d'estime pour le Personnage. Lors du repas,
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} fera même un signe de tête au PJ.
                </p>
                <p class="paragraphe">
                  <strong>Si la réussite est critique :</strong> les trois centaures, en goûtant le repas, éclateront de rire, les yeux entre l'étonnement et la reconnaissance.
                </p>
              </li>
            </ul>
          </ul>
          <hr />

          <h2>Douleurs Intenses :</h2>
          <p class="paragraphe">
            L'après-midi à préparer le repas est finie aux côtés de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} qui ne sont pas avares de compliments. Ils tendent un large bol au PJ et lui demande
            d'aller l'apporter dans la Salle Commune à @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga} qui est enceinte. En entrant, le PJ
            entend des gémissements de douleur au fond de la pièce derrière le paravent. Il trouve
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga} pliée en deux par les douleurs de sa grossesse. Elle transpire à grosses gouttes
            et elle tend la main vers une serviette et une bouteille d'eau. L'aventurier peut l'aider directement ou aller chercher son conjoint,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.V9ITbgWBBsUeixHA]{Kaihoroi}, ou un autre habitant. Dans tous les cas,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.V9ITbgWBBsUeixHA]{Kaihoroi} et la soigneuse
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} seront très reconnaissant envers le Héros d'Ispier pour son aide ou son alerte.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:10|comp:Empathie - Réconfort]</p></li>
            <li><p class="paragraphe">@Test[car:per|diff:15|comp:Premiers secours]</p></li>
            <li><p class="paragraphe">@Test[car:agi|diff:15|comp:Délicatesse pour déplacer la future mère]</p></li>
          </ul>
          <hr />

          <h2>Apprenti Empoisonneur :</h2>
          <p class="paragraphe">
            Avant l'aube, tandis que le PJ entre dans la cuisine collective pour prendre un petit déjeuner, il tombe nez-à-nez avec le jeune
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.1TJXdxZkBi0ZRvGn]{Taitamariki} qui semble effrayé par sa présence. Il tient dans sa main une petite fiole
            contenant un liquide blanchâtre qu'il cache de suite dans son dos, l'air de rien. CHA-PSY DD20 pour discuter et questionner, CHA-FILOU DD20 pour baratiner et manipuler ou
            FOR-COMM DD15 pour intimider et impressionner le jeune centaure. Si le test est réussi,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.1TJXdxZkBi0ZRvGn]{Taitamariki} donnera la fiole au PJ et le suppliera de garder le silence. C'est une fiole
            de poison qu'il voulait utiliser pour tuer son père @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu}.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:20|comp:Empathie - Discuter - Questionner]</p></li>
            <li><p class="paragraphe">@Test[car:cha|diff:20|comp:Baratiner - Manipuler]</p></li>
            <li><p class="paragraphe">@Test[car:for|diff:15|comp:Intimider - Impressioner - Gronder]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong> le test est réussi :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.1TJXdxZkBi0ZRvGn]{Taitamariki} donnera la fiole au PJ et le
                  suppliera de garder le silence. C'est une fiole de poison qu'il voulait utiliser pour tuer son père
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu}.
                </p>
              </li>
            </ul>
          </ul>
        </div>
