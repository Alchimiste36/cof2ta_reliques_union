  - sort: 1900000
    name: 'R : Alambic'
    type: text
    _id: obLqAf9asfalqU1K
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>R. Alambic et Préparation de Breuvages</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/r_alambic_remedes.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">
              Cette pièce est majoritairement remplie par une machine complexe et esthétiquement magnifique. Les tubes et tuyaux métalliques ainsi que les vannes, leviers, cadrans et cuves
              forment une sorte d'alambic étrange. Des jets de vapeurs sortent de certaines valves et dans l'angle de la pièce, on peut contempler une nouveau bassin remplie de charbon et
              gravé de nombreuses séquences de runes magiques permettant une combustion constante et précise sous la cuve principale. Des odeurs alcoolisées remplissent la pièce et il faut
              régulièrement ouvrir la fenêtre et la porte sous peine de finir saoule sans avoir bu.
            </p>
            <p class="paragraphe">
              Toutes sortes de distillats sont préparés grâce à cette machine que se soit pour la fabrication d'alcool, de base pour des soins, de concentrés de plantes tinctoriales ou
              modifier la viscosité de certains fluides.
            </p>
            <p class="paragraphe">
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} est la responsable de l'alambic mais, bien souvent, on trouve dans ce bâtiment,
              la jeune et dynamique @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} en train de préparer des mixtures complexes avec un
              sourires jusqu'aux oreilles. Cette jeune femelle est passionné par les huiles essentielle et une de ses trouvailles porte son nom.
            </p>
            <p class="paragraphe">
              A l'étage, on trouve tout le nécessaire pour préparer les plantes, champignons, racines et autres minéraux pour les préparations de breuvages, soins, huiles… L'ordre n'y est
              pas la priorité mais l'hygiène des outils et des récipients y est impeccable pour éviter de corrompre une préparation.
            </p>
            <hr />
            <h3>Comprendre et utiliser l'alambic :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:int|comp:Connaissances magiques]</p></li>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
              <li><p class="paragraphe">@Test[car:cha|comp:Ressentir la machine]</p></li>
            </ul>
            <hr />
            <h3>Préparer les ingrédients et les recettes :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:per|comp:Survie]</p></li>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
            </ul>
          </div>
          <hr />

          <h2>Une Visite Excitée :</h2>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} est une jeune femelle centaure passionnée et très expressive. Si un PJ souhaite
            travailler dans ce bâtiment, elle commencera une visite détaillée de la grande machine incroyable qui occupe presque toute la pièce. Elle parle vite et montre quatre trucs et
            machins en même temps. Elle fait des démonstrations des effets de chaque levier, poignée, cadran… Il est bien compliqué de tout comprendre mais, malgré cela,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} arrive à captiver le Personnage.
          </p>
          <ul>
            <li>
              <p class="paragraphe">
                @Test[car:int|diff:15|comp:Culture générale - Connaissances mécaniques] pour comprendre les descriptions et informations
                d'@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa}.
              </p>
            </li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si réussi :</strong> la jeune centaure sera très impressionnée par l'intelligence et la compréhension du PJ. Elle pourra lui demander de l'aide à l'avenir.
                </p>
              </li>
            </ul>
          </ul>
          <p class="paragraphe"><strong></strong>Si le Personnage a des connaissances dans une voie mystique ou en magie :</p>
          <ul>
            <li><p class="paragraphe">@Test[car:int|diff:15|comp:Culture générale - Connaissances mécaniques]</p></li>
            <li>
              <p class="paragraphe">
                @Test[car:int|diff:20|comp:Connaissances magiques] (bonus de +5 si le PJ à la Voie de l'Alchimie) pour comprendre les runes et les parties magiques de l'alambic.
              </p>
            </li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong></strong>Si réussi, l'aventurier comprend même comment fonctionne l'alambic. Les multiples runes magiques, finement gravées sur la machine, sont limpides et assez
                  logiquement disposées. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} prendra le PJ comme assistant s'il le souhaite.
                </p>
              </li>
            </ul>
          </ul>
          <hr />

          <h2>Cobaye Consentant :</h2>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} viennent voir le Personnage. Les trois expertes en anatomie, soins et fabrication de
            médicaments souhaiteraient essayer des produits sur une autre espèce que les centaures. Il faut bien savoir si les produits utilisés pour soigner les habitants d'Arkanov
            fonctionnent sur les autres races des Terres d'Arran. Il y a peu de danger pour le PJ, assurent-elles ! Si le PJ accepte, il sera fortement remercié. Hei Tunu et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} assemblent différents produits, préparent des mixtures. Elles demandent au PJ de
            boire, d'appliquer le baume sur sa peau, respirer ou encore goûter plusieurs recettes. De son côté
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} observe, questionne et ausculte le Personnage.
          </p>
          <ul>
            <li>
              <p class="paragraphe">
                @Test[car:con|diff:15|comp:Résistance multiples] pour résister aux effets quelques fois puissants (vertiges, aigreur d'estomac, sensations de brûlure…).
              </p>
            </li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si réussi :</strong> les tests se répéteront plusieurs fois avec des très bons résultats d'après les dires de
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}. Des effets intéressants seront trouvés (guérison rapide, constitution
                  renforcée, perception visuelle aiguisée, somnifère foudroyant…).
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si raté :</strong> les trois centaure arrêteront rapidement les tests et remercieront grandement le PJ en lui offrant une petite flasque en métal contenant un
                  délicieux sirop d'une plante du village.
                </p>
              </li>
            </ul>
          </ul>
          <hr />

          <section class="sallemj">
            <p class="paragraphe">
              Chaque MJ pourra créer des baumes, potions, huiles ou autres pouvant servir pour le reste de la campagne. Il est aussi possible de permettre au Joueurs de créer, avec l'aide
              et l'accord du MJ, une mixture qu'il souhaite.
            </p>
          </section>
        </div>
