  - sort: 1300000
    name: 'L : Murailles - Salles d''entrainement'
    type: text
    _id: fqQEw5YAUk6zHgZm
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>L. Murailles et Entraînement Martial</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/l_muraille_armurerie_entrainements.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">
              Le mur d'enceinte d'Arkanov est très grand avec ses longs couloirs et ses tours de chaque côté. Dans ces pièces de nombreux objets militaires sont stockés. Spécialisés dans
              l'utilisation des armes d'hast, les centaures sont, pour la plupart, formés à tous les types d'armes. Tous les adultes s'entraînent régulièrement même si certains Centaures
              talentueux sont devenus maître de l'art du combat et des danses de conflit.
            </p>
            <p class="paragraphe">
              Tous les jours, on peut croiser @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}, le fils du chef du village, ainsi que sa
              conjointe @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.dEFsexceQ4AhgJf1]{Karekau} dans les murailles pour l'entretien de l'équipement ou pour des
              entraînements intensifs. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa}, la maître d'arme du village, passe aussi beaucoup de temps
              dans ces pièces pour entrainer les habitants et surtout les plus jeunes.
            </p>
            <p class="paragraphe">
              Autant pour les entraînements physiques et la maitrise des armes, les aventuriers ne seront pas trop perdus par rapport à leur vie passée mais lorsqu'on leur explique, montre
              et apprend les bases des danses de conflit les choses se compliquent. Les rythmes, les pas, les gestes sont d'une complexité phénoménale et d'une précision chirurgicale. Il
              faudrait plus d'une vie pour apprendre à maîtriser l'une des danses du conflit et surtout avoir 4 sabots à la place des bottes .<br />
            </p>
            <hr />
            <h3>Entraînements martiaux :</h3>
            <ul>
              <li><p class="paragraphe">Le PJ réalise des tests d'attaque de contact ou à distance avec les armes qu'il souhaite utiliser.</p></li>
            </ul>
            <hr />
            <h3>Exercices physiques :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:for|comp:Musculation]</p></li>
              <li><p class="paragraphe">@Test[car:con|comp:Endurance]</p></li>
              <li><p class="paragraphe">@Test[car:agi|comp:Réflexe - Souplesse]</p></li>
            </ul>
            <hr />
            <h3>Entretien des armes :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:per|comp:Survie]</p></li>
            </ul>
          </div>
          <hr />

          <h2>Entraînement Commun :</h2>
          <p class="paragraphe">
            Afin de renforcer sa musculature et sa résistance, le PJ s'entraîne au RdC d'une des tours de la muraille. Il enchaîne les manœuvres de puissance avec des exercices
            d'assouplissement et continue par des frappes lourdes sur les mannequins d'entraînement. Il gravit de multiples fois les rampes pour monter dans les étages en courant et ne
            fait des pauses que pour boire et essuyer la sueur de son visage. Après une heure d'entraînement, le Personnage est surpris par
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} qui l'observe dans l'encadrement de la porte. Elle est là pour s'entraîner
            également et surtout sa souplesse comme à peu près tous les jours. Elle fait un signe de tête au PJ et attrape des gants matelassés, les enfile, et se positionne devant
            l'aventurier les deux bras tendus, l'invitant à frapper dans les gants. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} est d'une
            rare rapidité et souplesse et permet au PJ de développer ses réflexes et son cardio.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:for|diff:15|comp:Athlétisme]</p></li>
            <li><p class="paragraphe">@Test[car:agi|diff:15|comp:Réflexes - Souplesse]</p></li>
            <li><p class="paragraphe">@Test[car:con|diff:15|comp:Endurance]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ réussi plusieurs tests :</strong> elle est impressionnée et invitera le PJ pour d'autres séances d'entraînement plus intensive dès le lendemain. Les
                  phases d'entraînement avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} sont très agréable bien et les conversations
                  viennent compléter la sueur et l'effort. Elle racontera les séances d'entrainement souvent aux autres centaures.
                </p>
                <p class="paragraphe">
                  Si le PJ est réellement accidue et compétent, elle demandera à @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} l'autorisation
                  de lui offrir le tatouage du ??? pour récompenser ses talents. C'est un immense honneur pour le PJ et il doit bien le comprendre.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ échoue la plupart des tests :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} lui fera comprendre
                  qu'elle l'attendra tous les après-midi après la distribution des repas pour poursuivre l'entraînement avec elle.
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} est vraiment très gentille donc elle ne se moquera pas du PJ mais elle pourra
                  être déçu s'il n'accepte pas sa proposition de l'aider à s'améliorer ou s'il abandonne rapidement.
                </p>
              </li>
            </ul>
          </ul>

          <hr />

          <h2>La Danse du Chef :</h2>
          <p class="paragraphe">
            Un Personnage, voulant s'entraîner rapidement avant d'aller se coucher, entre dans les murailles et entend immédiatement des bruits rythmés de sabots au premier étage de la
            tour Ouest. En montant la rampe, il voit @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} en train d'exécuter une danse de combat
            méditative au centre de la pièce, les yeux fermés. Il fait des gestes précis et rapides, mêlant puissance dans l'impact et fluidité dans les enchaînements. Ce moment est comme
            sorti du temps tellement la danse est enivrante pour le PJ qui observe. A la fin de la danse, au moment où
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} ouvre les yeux, il voit le PJ. En fonction de la réaction du Personnage, le chef du
            village proposera à l'aventurier de lui expliquer les gestes de cette danse permettant de se concentrer et de décharger son stress.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:agi|diff:20|comp:Souplesse - Chorégraphie]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ réussi :</strong> il parvient à reproduire assez bien la danse et
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} le gratifie pour cette performance.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ échoue :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} est amusé et incite le Personnage a
                  continuer ses efforts pour la danse mais aussi au sein du village.
                </p>
              </li>
            </ul>
            <li>
              <p class="paragraphe">
                Dans tous les cas @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} discutera quelques minutes avec le Personnage pour lui
                expliquer qu'il est déchiré entre son plaisir de découvrir de nouvelles têtes étrangères et sa nécessité de protéger le village et de maintenir une cohésion du groupe.
              </p>
            </li>
          </ul>

          <hr />

          <h2>Concours de Tir à l'Arc :</h2>
          <p class="paragraphe">
            <strong>En fin de Phase 2 :</strong> pour les PJs à l'aise avec l'utilisation des arcs ou des arbalètes,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa}, la maître d'arme du village, vient les trouver un soir pour leur proposer de
            participer à un concours de tir à l'arc organisé tous les ans. Les PJs qui acceptent sont attendu dans une semaine sur la place publique à l'aube. Le village ne parle que de
            cet événement durant toute la semaine et on peut voir certains centaures s'entraîner ou fabriquer leurs propres flèches ou améliorer leur arc. Lorsque le concours commence, les
            PJs sont en concurrence avec 7 centaures munis de leurs arcs et flèches.
          </p>
          <p class="paragraphe">
            Le concours se déroule en plusieurs manches. Il faut réaliser un test d'Attaque à Distance avec son arme et chaque participants ayant atteint la difficulté recule de quelques
            mètres et la difficulté augment de 5 points à chaque nouvelle manche.
            <strong>le PJ ne peut utiliser qu'un seul Point de Chance durant toute la compétition (chaque centaure a aussi un PC a dépenser)</strong>. Le Personnage a deux essais par
            manche. Le difficulté commence à 5 pour la première manche.
          </p>
          <p class="paragraphe">Le but du PJ tenir le plus de manche et si possible être le dernier archer dans le concours. , Si le personnage est premier, ,</p>
          <ul>
            <li>
              <p class="paragraphe"><strong>Si le PJ est parvenu à une bonne place et que la Phase 2 est déjà bien engagée :</strong> ce concours lui ouvrira les portes de la Phase 3.</p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Si le Personnage atteint le podium :</strong> les habitants du village sont impressionnés. le village propose de tatouer le symbole du chasseur au Personnage sur
                l'avant-bras droit. Un honneur immense pour leur culture.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Si le personnage est premier :</strong> en plus du tatouage du Chasseur et ce grand honneur, le PJ pourra recevoir un enchantement sculpté sur son arc réalisé par
                @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.fTbuMNahY2sBxbQd]{Kaiwhakairo} (envisagez un petit pouvoir ou un petit bonus).
              </p>
            </li>
          </ul>
          <section class="salleplus">
            <h3>Participants :</h3>
            <ul>
              <li><p class="paragraphe">@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri} : Attaque à Distance +14</p></li>
              <li><p class="paragraphe">@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} : Attaque à Distance +14</p></li>
              <li><p class="paragraphe">@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} : Attaque à Distance +13</p></li>
              <li><p class="paragraphe">@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.NOuO9E41cHVJuhh8]{Iti} : Attaque à Distance +11</p></li>
              <li><p class="paragraphe">@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} : Attaque à Distance +9</p></li>
              <li><p class="paragraphe">@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HMpPEtlwshgIOybw]{Te'Wikitoria} : Attaque à Distance +9</p></li>
              <li><p class="paragraphe">@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako} :Attaque à Distance +8</p></li>
            </ul>
          </section>
          <hr />

          <h2>Combats Démonstratifs :</h2>
          <p class="paragraphe">
            Pendant qu'un PJ qui s'entraîne au combat au Corps à Corps, au premier étage d'une des tours de la muraille, De bon matin, il est interrompu par le couple
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} venu, eux aussi, pour s'entraîner. Ils proposent au Personnage une séance de
            combats démonstratifs. Sans vouloir se blesser, les deux centaures souhaitent, tout de même, des combats intenses, à un contre un. Il est possible de jouer le combat de façon
            classique en convertissant tous les dégâts létaux en non-létaux ou juste quelques test d'ATT-CONTACT vs ATT-CONTACT de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} ou
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha}.
          </p>
          <ul>
            <li>
              <p class="paragraphe"><strong>Si le PJ emporte le combat :</strong> le centaure vaincu et son conjoint en parlera pendant de nombreux jours.</p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Si le PJ est battu :</strong> le couple de centaures rigolera avec le PJ et ils lui proposeront de continuer des entraînements régulièrement.
              </p>
            </li>
          </ul>
        </div>
