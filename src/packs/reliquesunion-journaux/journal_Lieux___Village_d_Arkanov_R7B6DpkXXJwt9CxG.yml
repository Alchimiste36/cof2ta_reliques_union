  - sort: 1100000
    name: 'J : Forge'
    type: text
    _id: w5pMCoYMA92Enjdp
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>J. Forge et Atelier de Forge</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/j_fonderie_forge_atelier.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">Au delà des bruits que l'on peut entendre derrière les portes de ce bâtiment, on perçoit toujours de la fumée qui sort de sa cheminée.</p>
            <p class="paragraphe">
              La forge est une grande pièce dont le cœur est magnifique. Une forge incroyable digne des plus grande Forteresse-État naines des Terres d'Arran. Le foyer est divisé en deux
              cercles concentriques recouverts de runes finement ciselées et rayonnantes d'une énergie bleutée. Les braises du centre sont teintées de bleue et permet de monter les
              creusets à très haute température tandis que le cercle extérieur, plus classique permet de travailler le métal entre les coups de marteaux. Un autre foyer magique est
              positionné dans un coin de la pièce.
            </p>
            <p class="paragraphe">
              Le reste du rez-de-chaussée est équipé de plusieurs enclumes, racks à outils de très bonne qualité, chariots roulants et autre meules d'affûtage et de façonnage. Sur le mur
              du fond, sous le large tuyau d'évacuation des fumées, se trouve des caisses remplies de différentes pépites de minerais pour réaliser les alliances, les épurer et les
              transformer en lingots facilement utilisables.
            </p>
            <p class="paragraphe">
              Marteaux, pinces, moules, sacs à charbon, étaux, enclumes… il y a tout pour faire un travail exceptionnel pour les équipements du quotidien, les armes ainsi que les éléments
              de structure, les pièces mécaniques et la quincaillerie.
            </p>
            <p class="paragraphe">
              Par une des fenêtre du RdC et du premier étage, deux cordes permettent d'actionner des soufflets qui maintiennent la température des foyers grâce à l'énergie hydraulique de
              la cascade du village.
            </p>
            <p class="paragraphe">
              Au premier étage, le travail de finition commence avec un plus petit foyer enchanté aussi par une forte magie. A part la coupole de la forge du RdC qui prend une grosse
              partie du centre de la pièce, on peut trouver ici quelques enclumes et plans de travail pour réaliser des travaux de forge plus précis avec plus de calme mais aussi pour
              graver les runes magiques qui peuvent rendre les réalisations exceptionnelles.
            </p>
            <p class="paragraphe">Le long d'un mur, ce trouve deux bacs pour le traitement thermique du métal.</p>
            <p class="paragraphe">
              Dans une pièce plus petite au deuxième étage, on trouve un espace de travail spécialement conçu pour les dernières finitions. Affûtage, travail de manches et poignées, étuis
              et lanières de cuirs, polissage et nettoyage des lames et des réalisations mécaniques.
            </p>
            <p class="paragraphe">
              Un couple s'occupe le plus de la forge. La responsable est @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa}, cette centaure
              femelle avec un talent exceptionnel pour le travail du métal. Son conjoint, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara},
              possède une force impressionnante et une capacité à travailler le métal de façon subtil et dans les moindres détails pour un résultat d'une rare finesse. Ils travaillent main
              dans la main et @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} répond à toutes les exigences de sa conjointe sans broncher. Ils
              travaillent le plus souvent avec leur fils @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata} qui partage le travail de précision
              de son père et l'efficacité de sa mère. C'est derniers mois, il leur arrive souvent d'être rejoint par le jeune
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro} voulant passer ses nerfs sur l'enclume et qui aime modeler le métal en fusion
              même si ses muscles ne sont pour le moment pas très développés. Ce sont les seuls moments où on peut voir une certaine sérénité sur les traits du visage de cet adolescent
              introverti.
            </p>
            <p class="paragraphe">
              Les héros, qu'ils soient compétents ou non en forge, pourront être sollicités pour aider dans ce bâtiment. Il y a beaucoup à faire entre la fabrication des lingots raffinés,
              le trie des pépites de minerais et leur association pour réaliser des alliances, la réalisation de blocs damassés, l'entretien des foyers, le nettoyage des lieux et des
              outils…
            </p>
            <p class="paragraphe">Au premier et deuxième étage, seuls les Personnages montrant une bonne volonté pourront aider pour des réalisation plus techniques et délicates.</p>
            <p class="paragraphe">
              Ils seront continuellement sous la supervision de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} qui est une très bonne
              cheffe d'atelier et félicitera les aventuriers pour leurs belles réalisations ou leur motivation.
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} montreront, au fil de jours, leur complicité malgré les différences de ce
              couple.
            </p>
            <hr />
            <h3>S'occuper de la forge :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:for|comp:Athlétisme]</p></li>
              <li><p class="paragraphe">@Test[car:con|comp:Résistance à la chaleur]</p></li>
            </ul>
            <hr />
            <h3>Faire des réalisations de précision au RdC et dans les étages :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
            </ul>
            <hr />
            <h3>Graver des runes pour les PJs ayant la Voie de la magie runique :</h3>
            <ul>
              <li><p class="paragraphe">@Test[car:int|comp:Connaissance magique]</p></li>
              <li><p class="paragraphe">@Test[car:agi|comp:Délicatesse - Précision]</p></li>
            </ul>
          </div>
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_forge1.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_forge2.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_forge3.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiment_forge4.webp" width="100" height="100" />
          <hr />

          <h2>Un Réflexe ou un Accident :</h2>
          <p class="paragraphe">
            La forge tourne à plein régime depuis quelques jours pour transformer du minerai en plusieurs lingots de fer ou d'alliage. Après avoir retirer les déchets à la surface du métal
            fondu dans un grand creuset, le PJ entend un craquement grave. Un clignement d'œil plus tard, le creuset bascule du foyer entre
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} et lui.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:agi|diff:15|comp:Réflexes]</p></li>
            <li><p class="paragraphe">@Test[car:for|diff:20|comp:Maintenir une charge lourde]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ réussi :</strong> il attrape la longue poignée du creuset et le maintien en équilibre le temps que
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} se retourne et l'aide.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ échoue aux tests :</strong> le creuset tombe au sol, éclaboussant la zone de métal fondu : @Test[car:agi|diff:15|comp:Réflexes|echdm:3d6+8]
                </p>
              </li>
              <ul>
                <li>
                  <p class="paragraphe">
                    <strong>Si réussi :</strong> le Personnage saute, l'épaule en avant pour bousculer
                    @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} et lui éviter de terribles brûlures.
                  </p>
                </li>
                <li>
                  <p class="paragraphe">
                    <strong>Si le test échoue :</strong> Le PJ, en poussant @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa}, se retrouve
                    dans la zone de projection des boulettes de métal fondues. Il reçoit 3d6+8 DM, sera amené chez
                    @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} pour quelques soins et gardera des cicatrices de ces brûlures sur les bras et
                    la joue.
                  </p>
                </li>
              </ul>
            </ul>
          </ul>
          <p class="paragraphe">Après la chute du creuset, il faudra passer quelques heures de nettoyage et surtout fabriquer un nouveau creuset de forge.</p>
          <hr />

          <h2>Colère Juvénile :</h2>
          <p class="paragraphe">
            Les journées de travail à la forge sont agréables même si les efforts sont intenses et la chaleur étouffante.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata} forme une bonne équipe pour guider le Personnage dans le bâtiment. A part les
            blagues nulles du père de famille, l'ambiance est appréciable. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro}, le jeune centaure,
            partage souvent la forge avec cette famille et le Personnage malgré son air renfermé et sombre. Lorsqu'il est présent, le travail avance vite mais une tension s'installe et les
            coups de marteau passent d'harmonieux à colériques. Alors que @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} sont occupés à l'étage,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro}, après une erreur bête et sans conséquence, entre dans une colère violente. Il
            jette sa pince dans le foyer, donne un coup de sabot à une caisse de tige de fer et renverse le contenu d'une table. Il hurle des mots grossiers et des insultes dans le vide.
            Une vraie tornade proche de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata} et le Personnage.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:cha|diff:20|comp:Diplomacie - Apaisement] ou</p></li>
            <li><p class="paragraphe">@Test[car:for|diff:20|comp:Autorité - Intimider]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>Si le Personnage y parvient :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro} sortira de la forge, se
                  dirigera vers les habitants à l'Est du bâtiment et commencera a expliquer son traumatisme face aux actes des Atarangi Kino dont il a été témoin, il y a 6 mois. Il a vu,
                  par la fenêtre, sa grand-mère maternelle se faire massacrer et son grand-père se faire kidnapper par les Atarangi Kino alors qu'il était caché dans leur maison. Il est
                  totalement traumatisé par ces images et son quotidien balance entre colère et tristesse depuis.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ échoue :</strong> La colère de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro} se transforme en tempête dans
                  la forge. Il renverse des tables et jette des outils. Après quelques minutes, il sort en furie et se dirige vers les murailles pour taper sur des trucs dans la salle
                  d'entrainement. En fonction de la réaction du PJ, il arrivera ou pas à faire parler
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro} sur son traumatisme.
                </p>
              </li>
            </ul>
          </ul>
          <hr />

          <h2>Une Maintenance Complexe :</h2>
          <p class="paragraphe">
            <strong>En fin de Phase 2 :</strong> si un PJ a passé quelques jours de travail dans la forge et qu'il est bien perçu par le
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa}, cette dernière demandera à
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} d'intégrer le Personnage dans une grande maintenance sur une pièce de la machine
            principale du village. Pendant trois jours, le Personnage va participer à de nombreuses visites de la machine, étudier des plans et des procédures avec un groupe de 5 autres
            centaures (@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini}). Chaque étape n'est pas des plus complexes mais il va falloir enchaîner
            chorégraphie millimétrée pour démonter, transporter, installer et réparer cet engrenage énorme. Le PJ devra réussir trois tests différents, pas très compliqués, pour être, à la
            fin des opérations considéré comme une aide et non comme un frein :
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:int|diff:15|comp:Ingéniérie - Culture artisanale]</p></li>
            <li><p class="paragraphe">@Test[car:for|diff:10|comp:Travail de force]</p></li>
            <li><p class="paragraphe">@Test[car:agi|diff:10|comp:Délicatesse - Précision]</p></li>
            <ul>
              <li>
                <p class="paragraphe">
                  <strong>S'il réussi tout le processus :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} fera monter sur la tribune
                  le PJ le soir même devant tout le village réunit et lui confiera qu'il est digne de recevoir le tatouage des forgerons d'Arkanov sur le pectoral gauche. L'émotion du
                  village est palpable et le PJ ressentira l'honneur dans les mots et les émotions de
                  @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini}. Ce travail devrait faire basculer le PJ en Phase 3 sans problème.
                </p>
              </li>
              <li>
                <p class="paragraphe">
                  <strong>Si le PJ échoue :</strong> @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} remerciera au milieu de la procédure le
                  PJ et lui dira gentillement de les laisser travailler. Dans le cas où le PJ se serait vanté de ses compétences avant le début du chantier, les centaures pourront le
                  cermoner plus sévèrement sur les implications dramatiques que son incompétence aurait pu avoir sur le village.
                </p>
              </li>
            </ul>
          </ul>
        </div>
