      content: "<div class=\"journal-cof2ta-ru\">\n  <h1>Introduction</h1>\n  <img src=\"modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiments1.webp\" width=\"100\" height=\"100\" />\n  <img src=\"modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiments2.webp\" width=\"100\" height=\"100\" />\n  <img src=\"modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiments3.webp\" width=\"100\" height=\"100\" />\n  <img src=\"modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiments4.webp\" width=\"100\" height=\"100\" />\n  <img src=\"modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_batiments5.webp\" width=\"100\" height=\"100\" />\n  <hr />\n  <h2>Description globale</h2>\n  <ul>\n    <li>\n      <p class=\"paragraphe\">Entourée de montagnes avec des falaises abruptes</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">Climat tempéré malgré les neiges éternelles autour (grâce à l'Orbe Élémentaire)</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">Maisons faites de murs en pierres, en torchi enduite de chaux ou de terre, toits en chaume ou en tuiles plates</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">Aucun escalier mais des rampes</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">Un bruit continu de la casacade et des machines présentes dans le village</p>\n    </li>\n  </ul>\n  <hr />\n  <h2>Les habitants</h2>\n  <ul>\n    <li>\n      <p class=\"paragraphe\">Uniquement des centaures</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">8 familles (pour un total de 72 adultes et de 17 adolescents et enfants)</p>\n    </li>\n  </ul>\n  <hr />\n  <h2>Ambiance et état d'esprit</h2>\n  <ul>\n    <li>\n      <p class=\"paragraphe\">Harmonie générale, calme et paisible</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">Méfiance face aux étrangers</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">Village régit par des coutumes et des rituels importants pour les centaures (danses, chansons, événements, expressions, rythmes de vie…)</p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">Conflits entre famille sur l'avenir et la place des centaures :</p>\n      <ul>\n        <li>\n          <p class=\"paragraphe\">Certains veulent rester ainsi et ne rien changer</p>\n        </li>\n        <li>\n          <p class=\"paragraphe\">\n            Certains veulent conquérir la région alentour. Pour eux, les centaures sont puissants et doivent être craint. Il faut attaquer avant de se faire attaquer.\n          </p>\n        </li>\n        <li>\n          <p class=\"paragraphe\">Certains, surtout des jeunes, veulent sortir du village et découvrir le monde. Ouvrir le village, rencontrer les autres villages.\_</p>\n        </li>\n      </ul>\n    </li>\n    <li>\n      <p class=\"paragraphe\">\n        Les centaures sont inquiets ou en colères face aux meurtres et kidnappings des Atarangi Kino. Défendre le village ou sortir du village pour les attaquer, aucune décision\n        n'est prise. Les seuls étrangers ayant découvert le village sont les Atarangi Kino depuis la visite de Timaor Dunclin plusieurs années auparavant.\n      </p>\n    </li>\n  </ul>\n  <hr />\n  <h2>Entrées/Sorties</h2>\n  <ul>\n    <li>\n      <p class=\"paragraphe\">\n        <strong>Porte principale :</strong> dissimulée derrière une paroi recouverte de lierre et bien protégée (double grille, balistes, points d'observation…), elle est difficile\n        à trouver sans avoir des informations particulière.\n      </p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">\n        <strong>Les montagnes aux alentours :</strong> on peut approcher du village par les falaises entourant le village. Vu la configuration des lieux, on voit le village au\n        dernier moment et il est possible de voyager à quelques dizaines de mètres sans tomber sur le village.\n      </p>\n    </li>\n    <li>\n      <p class=\"paragraphe\">\n        <strong>Le portail de la salle de la Relique :</strong> le portail magique de la salle de la Relique de l'Union permet de se téléporter vers les autres lieux des Reliques\n        (Temple du Val Rouge, Cité-forge d'Hyrr'Tarënn, Cathédrale de Kosland, Grotte cérémoniale en Ogrie).\n      </p>\n    </li>\n  </ul>\n</div>"
