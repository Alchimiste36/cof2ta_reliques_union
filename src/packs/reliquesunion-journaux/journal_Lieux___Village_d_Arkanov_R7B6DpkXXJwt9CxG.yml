  - sort: 200000
    name: 'A : Grotte et Prison'
    type: text
    _id: KaN8MUqbIPPsXoyQ
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>A. Mines et Prison :</h1>
          <img src="modules/cof2ta_reliques_union/assets/ru_journaux/arkanov_batiments/a_prison_mines.webp" height="150" />
          <div class="description">
            <h2>Description :</h2>
            <p class="paragraphe">
              Dans les mines, bien connues du groupe d'aventuriers, il y a beaucoup de choses à faire qui peuvent rendre service aux Centaures. En plus d'améliorer les relations avec ces
              derniers, les travaux à la mine permettront aux Personnages de développer leur conditions physiques et de passer des journées à l'abri des conflits et des villageois
              lorsqu'un moment de détente se fera sentir. Une partie des Centaures du village se sert des mines pour s'isoler quelques jours, suer et trimer, changer leurs idées ou se
              défouler.
            </p>
            <p class="paragraphe">
              Si un Personnage veut partager les mines avec certains Centaures, il s'aperçoit rapidement que casser du cailloux plusieurs heures dans un environnement sombre et confiné
              permet de créer des liens et des moments de fraternité.
            </p>
            <ul>
              <li><p class="paragraphe">@Test[car:for|comp:Athlétisme] pour miner, broyer, concasser…</p></li>
              <li><p class="paragraphe">@Test[car:per|comp:Organisation - Rangement] pour ranger, nettoyer, trier les caisses ou organiser les mines.</p></li>
            </ul>
          </div>
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_mines1.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_mines2.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_mines3.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_mines4.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_mines5.webp" width="100" height="100" />
          <hr />

          <h2>Découverte Assommante :</h2>
          <p class="paragraphe">
            En arrivant pour travailler à la mine, le PJ trouve @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.NOuO9E41cHVJuhh8]{Iti} au sol inconscient. Pendant son
            travail, un bout de plafond est tombé sur sa tête. Le Personnage peut lui venir directement en aide ou aller chercher de l'aide.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.NOuO9E41cHVJuhh8]{Iti} sera très reconnaissant envers l'aventurier.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:for|diff:15|comp:Dégagement d'urgence]</p></li>
            <li><p class="paragraphe">@Test[car:per|diff:10|comp:Premiers secours]</p></li>
          </ul>
          <hr />

          <h2>Ca Brille à la Mine :</h2>
          <p class="paragraphe">
            Lors d'une journée de travail à miner les parois (avec un bon test ou une réussite critique), le Personnage va découvrir une pierre précieuse de belle taille. Si le mineur
            retire la pierre et l'a montre à un centaure, une partie des habitants viendront voir la trouvaille et féliciter le Héros. Plusieurs jours plus tard,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.fTbuMNahY2sBxbQd]{Kaiwhakairo} montrera au PJ la réalisation qu'il a fait avec la pierre. Il a sculpté un
            pendentif magnifique pour chacun des aventuriers. Chaque pendentif se connecte aux autres pour former une belle rosace avec la pierre recomposée au centre.
          </p>
          <hr />

          <h2>Infestation Inquiétante :</h2>
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_insectes_invasifs1.webp" width="100" height="100" />
          <img src="modules/cof2ta_reliques_union/assets/ru_lieux/arkanov/arkanov_insectes_invasifs2.webp" width="100" height="100" />
          <p class="paragraphe">
            En rangeant les caisses de la mine ou pendant qu'il recherche un outil ou un objet, le PJ découvre une colonie de petits insectes le long d'un mur. Il se nourrissent de bois et
            souillent les caisses de nourriture. Les insectes sont arrivés par les conduits de ventilation positionnés au plafond. Dès que les centaures seront informés, il faudra
            plusieurs jours pour déplacer, nettoyer et inspecter chaque partie de la grotte pour venir à bout de cette invasion.
          </p>
          <ul>
            <li><p class="paragraphe">@Test[car:per|diff:10|comp:Observation et comprehénsion de l'infestation]</p></li>
            <li><p class="paragraphe">@Test[car:int|diff:15|comp:Connaissance biologique des insectes]</p></li>
            <ul>
              <li><p class="paragraphe">@Test[car:agi|diff:15|comp:Traitement de l'infestation] - 3 réussites par jour (bonus de +5 par test ci-dessus réussi)</p></li>
            </ul>
            <li><p class="paragraphe">@Test[car:con|comp:Rangement, nettoyage, débayage…]</p></li>
          </ul>
          <p class="paragraphe">
            Le ou les PJ ne sont pas les seuls à s'occuper du l'infestation. S'ils ne demandent pas d'aide, la difficulté est augmentée de +5 à +10 et le travail leur prend plusieurs de
            nombreux jours. Par contre si le travail est bien fait, ils gagneront beaucoup de respect auprès des centaures.
          </p>
        </div>
