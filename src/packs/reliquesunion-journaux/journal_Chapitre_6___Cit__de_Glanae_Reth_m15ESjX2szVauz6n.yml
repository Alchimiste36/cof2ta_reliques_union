        <div class="journal-cof2ta-ru">
          <h1>Synthèse du Chapitre</h1>
          <p class="paragraphe">Ce périlleux chapitre pour le groupe d'aventuriers va faire intervenir plusieurs ennemis et combats.</p>
          <p class="paragraphe">
            Leur petit vie tranquille dans les hautes montagnes des Crocs d'Acier, au milieu d'un charmant village de centaures, va être perturbée par une attaque éclair en pleine nuit par
            les Atarangi Kino, les Ombres Blanches.
          </p>
          <p class="paragraphe">
            L'escarmouche va choquer une nouvelle fois les habitants d'Arkanov et certains villageois seront blessés, kidnappés, peut-être, tués par les elfes exsangues de la cité de
            Glanae'Reth.
          </p>
          <p class="paragraphe">
            Les PJs seront fortement sollicités pour poursuivre, traquer, attraper et éliminer ces ennemis pour récupérer les centaures kidnappés et se venger, par la même occasion. Les
            Héros d'Ispier pourront aussi, d'eux-même, vouloir secourir le ou les villageois kidnappés. Ils ont passé beaucoup de temps à leurs côtés. Ils se sont attachés à eux et cela
            devrait les pousser à intervenir.
          </p>
          <p class="paragraphe">
            Après l'attaque, les Ombres Blanches ont laissé quelques traces derrière eux mais il faut se presser pour pouvoir les suivre correctement. L'heure n'est pas aux grandes
            stratégies ni aux réunions interminables.
          </p>
          <p class="paragraphe">
            Armes, armures et sacs à dos équipés, les PJs vont parcourir plusieurs kilomètres dans les hautes montagnes neigeuses des Crocs d'Acier, en suivant péniblement les traces des
            assassins. Après deux jours de poursuite, il arrivent devant une grande paroi rocheuse, abrité du vent, où ils pourront trouver deux entrées pour pénétrer dans la cité malsaine
            de Glanae'Reth. Soit la porte principale dissimulée soit un ruisseau qui traverse la montagne.
          </p>

          <p class="paragraphe">
            Arrivé à cet endroit, il y aura plusieurs stratégies. Une infiltration discrète et difficile ou une exploration pièce par pièce en faisant le ménage sur leur passage. Dans tous
            les cas, le groupe devrait comprendre rapidement qu'il n'est pas possible de négocier avec ces elfes à la culture corrompue.
          </p>
          <p class="paragraphe">
            La progression dans la cité de Glanae'Reth est périlleuse à chaque croisement mais les bruits, les cris et les nombreuses distractions des habitants devrait permettre aux PJs
            de ne pas déclencher une alerte générale au moindre test de discrétion raté.
          </p>
          <p class="paragraphe">
            Dans cette cité souterraine, les PJs vont découvrir la perversion, les tortures, les drogues et la luxure de cette étrange culture des elfes exsangues. Mâles drogués et soumis
            à leurs supérieurs. Lieutenants utilisés comme jouets sexuels par les matrones. Esclavagisme, travail forcé et torture des personnes kidnappées et des elfes exsangues les plus
            faibles. Culte de la domination inculqué dès le plus jeune âge des jeunes femelles. Combats à mort et auto-mutilation.
          </p>
          <p class="paragraphe">
            Au bout d'un moment, le groupe devrait trouver les fermes, les ateliers de forge et les enclos pour les esclaves. A partir de ce moment, ils pourront libérer, équiper et
            commander des PNJs qui seront bien utiles pour éviter une mort probable face aux matrones exsangues, sadiques et expérimentées.
          </p>
          <p class="paragraphe">
            De plus, les équipements des esclaves, des gardes et des matrones sont particulièrement puissants. Le groupe pourra obtenir des potions et produits pour améliorer leurs
            caractéristiques et leurs pouvoirs. Des objets magiques étranges ou rares compléteront leurs équipements.
          </p>

          <p class="paragraphe">
            Pour finir, le sauvetage des esclaves et la découverte de grottes et de salles remplies de produits, outils, vivres, marchandises et trésors devrait permettre aux héros de la
            Dame d'Honneur de revenir à Arkanov glorieusement. En remerciement, les centaures mettront toute leur énergie pour aider les PJs à trouver la Ceinture de l'Union. Découverte de
            la danse traditionnelle de l'Union, cérémonie commune, ouverture de la salle secrète, des étapes qui permettront de trouver la deuxième Relique.
          </p>
          <p class="paragraphe">
            Le portail magique dans la salle secrète permettra aussi de voyager rapidement entre le village d'Arkanov et le Temple du Val Rouge, après plusieurs mois d'étude pour savoir
            comment il fonctionne.
          </p>
          <p class="paragraphe">
            Avant de quitter les centaures, il faudra aussi discuter avec eux pour les aider à choisir entre rester à l'abri dans leur magnifique petit village isolé ou permettre à
            certains habitants de parcourir le vaste monde des Terres d'Arran.
          </p>

          <p class="paragraphe">
            Attention : Vous devez vous assurer, avant de commencer, que votre groupe de joueurs est d'accord pour ce genre d'ambiance malsaine, horrible et glauque. Tout au long de leur
            exploration, prenez le pouls du groupe afin de ne pas choquer inutilement un ou plusieurs joueurs. Il est toujours possible d'édulcorer les descriptions ou même changer les
            passages les plus choquants.
          </p>
          <hr />

          <h1>Explications</h1>
          <p class="paragraphe">
            Dans ce chapitre, il y aura très certainement des combats épiques et dangereux, que ce soit lors de l'attaque sur Arkanov ou dans la cité de Glanae'Reth.
          </p>
          <p class="paragraphe">
            Le groupe de Joueurs devrait être sensibles face au kidnapping d'un des centaures, s'ils se sont correctement intégrés à la communauté. La détresse des habitants et la détresse
            du centaure captif devrait rendre furieux les Personnages.
          </p>
          <p class="paragraphe">
            Le voyage n'a que peu d'importance à part démontrer aux Héros d'Ispier qu'il n'était pas si facile pour les centaures d'Arkanov ou les humains de la Vallée de Novrak d'envoyer
            une armée pour poursuivre les elfes exsangues.
          </p>

          <p class="paragraphe">Arrivé devant la paroi rocheuse de la cité malsaine, les PJs auront plusieurs choix :</p>
          <ul>
            <li>
              <p class="paragraphe">
                S'ils attaquent de manière frontale, ils prendront un immense risque mais ils pourront s'enfuir et utiliser la puissance des centaures pour les aider, à l'extérieur, face
                au nombre d'elfes exsangues qui sortiraient de Glanae'Reth. Le risque le plus important de ce plan est l'utilisation des captifs comme boucliers vivants.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                S'ils s'infiltrent progressivement dans les couloirs souterrains, ils pourront tuer et/ou réduire au silence les occupants de la cité petit à petit et finir par libérer les
                prisonniers qui pourront les aider. Les centaures sont trop grands pour pénétrer dans la cité donc les PJs seront seuls pour cette exploration.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                S'ils décident de négocier ou intimider avec les matrones, ils auront peu de chances de réussir. Déjà que les femelles elfes exsangues ne sont pas très coopératives, elles
                sont, en plus, conscientes qu'en sacrifiant un par un les captifs, elles obtiendront du groupe à peu près tout ce qu'elles veulent.
              </p>
            </li>
          </ul>

          <p class="paragraphe">
            La façon la plus sûr de libérer les prisonniers c'est de passer par le ruisseau qui rentre dans la montagne mais plusieurs particularités de Glanae'Reth faciliteront
            l'infiltration :
          </p>
          <ul>
            <li>
              <p class="paragraphe">
                Les couloirs de la cité sont très bruyants. Le groupe entend des cris provenant des prisonniers et des mâles elfes exsangues. Les séances de tortures, les maltraitances et
                les combats sont fréquents voir permanent dans les différents lieux de la petite ville.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                La plupart des habitants sont soit drogués pour effectuer leurs tâches sans se plaindre, soit dominés et soumis par leurs maîtres et maîtresses, soit blessés par les
                remontrances régulières, soit en train de dormir ou dans des positions charnelles avec une matrone ou une sœur. Même si certaines salles comportent beaucoup d'ennemis,
                certains d'entre-eux seront attachés, endormis ou tellement soumis qu'ils ne représenteront pas une grande menace.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                La libération des prisonniers sera aussi un moment décisif pour terminer les ennemis les plus puissants. Ce groupe très varié de captifs est furieux contre les elfes
                exsangues. Ils ont subit des tortures, des agressions sexuelles, des humiliations et ils ont vu souvent des captifs se faire tuer ou laissé mourir devant leurs yeux.
              </p>
            </li>
            <li><p class="paragraphe">Les objets magiques (armes, substances et objets) qu'ils vont trouver sur leur chemin équilibreront aussi les force au fur et à mesure.</p></li>
          </ul>

          <p class="paragraphe">
            Il peut être important de répéter ces éléments pour éviter que l'exploration ne prenne trois heures de jeu à chaque croisement. Dans les premières salles, les PJs entrent à
            l'aveugle dans la cité mais au bout de quelques croisements, ils devraient accélérer le rythme histoire que cette partie de la campagne ne se transforme pas en un traditionnel
            «Porte-Monstres-Trésors».
          </p>

          <p class="paragraphe">
            Dans ce chapitre, dès qu'ils atteindront Glanae'Reth, une nouvelle règle viendra encadrer l'exploration de la cité des elfes exsangues. Le Seuil d'Alerte (SA) sera expliquer
            plus en détail plus loin mais, pour faire simple, il permettra de gérer simplement le dégré de discrétion et les précaution que prennent ou pas les joueurs pour dissimuler leur
            présence.
          </p>

          <p class="paragraphe">
            Si tout se passe bien pour les PJs, ils devraient ressortir de la cité de Glanae'Reth avec bon nombre de prisonniers qui seront ravis de revoir leur famille, quelques objets
            puissants et des milliers de pièces d'or sous forme de matériaux et produits finis.
          </p>
          <p class="paragraphe">
            Le retour à Arkanov avec les survivants, centaures ou non, pour qu'ils reçoivent des soins et se reposent amènera les habitants d'Arkanov à s'ouvrir sur le monde extérieur.
            Après la découverte de la Ceinture de l'Union, certains centaures souhaiteront sortir du village en direction de la Vallée de Novrak.
          </p>

          <hr />
        </div>
