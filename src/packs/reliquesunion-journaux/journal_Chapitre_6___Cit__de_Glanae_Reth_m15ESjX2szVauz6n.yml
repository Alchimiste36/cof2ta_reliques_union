    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>Planification de représailles</h1>
          <p class="paragraphe">
            Quelque soit le résultat de l'attaque des Atarangi Kino, Kiliko, Kara, Toa et Wakaweti proposeront aux aventuriers de les aider à traquer cet ennemi qui les traumatise depuis
            tant d'année.
          </p>
          <p class="paragraphe">
            La présence des étrangers dans le village a permis aux centaures, même les plus rétifs, d'accepter l'idée que le monde extérieur peut être magnifique ou dangereux mais qu'il
            impacte, de toutes façons, leur vie isolée. Ils ne veulent plus vivre avec cette peur au ventre et ils sont prêt à contre-attaquer.
          </p>
          <p class="paragraphe">Le temps presse à la fin de l'attaque car il faut suivre les traces et la piste laissée par les Atarangi Kino.</p>

          <h2>Les atouts apportés par les centaures</h2>
          <ul>
            <li>
              <p class="paragraphe">
                Six habitants du village veulent accompagner le groupe d'aventuriers dans les montagnes pour traquer les Ombres Blanches : Wakaweti (p.??), Kai (p.??), Maamaa (p.??), Toa
                (p.??), Whakarewa (p.??) et Ka'Huri (p.??). Chacun viendra entièrement équipé avec leurs armes et armures magiques s'ils en ont.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                Tous les équipements non magiques nécessaires pour le voyage (sacs, vêtements, armes…) ainsi que les rations de survie pour plusieurs jours de voyage.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                Une carte de la zone, dessinée par Kaiputu, représentant les hauteurs des Crocs d'Acier sur environ 20 ou 30 kilomètres de rayon autour d'Arkanov. Cette carte permet
                d'éviter la plupart des impasses et des zones dangereuses sur les premières heures de voyage.
              </p>
            </li>
            <li><p class="paragraphe">Le Duo de Marteaux de Silence du village, confié à Wakaweti, dans le cas où il faudrait être discret.</p></li>
            <li>
              <p class="paragraphe">Deux fioles par personne l'harikoa, la potion qui porte le nom de sa jeune inventrice. C'est un potion qui améliore la dextérité du consommateur.</p>
            </li>
            <li><p class="paragraphe">Des potions de soins, s'ils en font la demande.</p></li>
            <li>
              <p class="paragraphe">
                Si les PJs arrivent à justifier, arguments à l'appui, la nécessité d'emporter l'Orbe Élémentaire, Kara pourrait confier à Ka'Huri cet artefact très puissant.
              </p>
            </li>
          </ul>

          <p class="paragraphe">
            Dans la mesure où il faut réagir dans les heures qui suivent la fin de l'escarmouche des Atarangi Kino, aucun équipement complexe ne pourra être créer avant le départ du
            groupe. Si certains PJs ont une nouvelle idée dans ce temps contraint, il faudra que se soit très simple et rapide à fabriquer pour qu'ils puissent partir avec dès le lendemain
            matin.
          </p>
          <hr />

          <h1>Pister les traces</h1>
          <p class="paragraphe">
            Le voyage dans les montagnes devrait durer, en temps normal, deux jours et demi avec un rythme soutenu (soit 7 périodes de jours et deux périodes de campement). Utilisez les
            mêmes règles de voyage que celles décrites pour le voyage entre la Vallée de Novrak et le village d'Arkanov (C.??A.??p??).
          </p>
          <p class="paragraphe">
            Grâce à l'expertise des centaures qui accompagnent les Héros de la Dame d'Honneur, le Personnage Éclaireur obtient à chaque test de SAG-SURVI un bonus de +5 pour les périodes
            de voyage et les périodes de campement. Mais, afin de suivre les traces du groupe d'ennemis, le test a une difficulté plus forte que pour trouver le village d'Arkanov.
          </p>
          <ul>
            <li><p class="paragraphe">Pour chaque période de voyage, le Personnage Éclaireur effectue un test de SAG-SURVI DD20.</p></li>
            <li><p class="paragraphe">Pour chaque période de campement, grâce aux centaures, le test est SAG-SURVI DD10.</p></li>
          </ul>

          <p class="paragraphe">
            Depuis leur dernier voyage, certains PJs ont peut-être, gagner des pouvoirs qui peuvent leur servir lors de cette traque (Le Guetteur, un Compagnon Animal, un Dragon...). Si
            c'est le cas, ces aides peuvent faire largement descendre la difficulté pour trouver et traquer les ennemis. Par contre, si les Elfes Exsangues repère un PJ a dos de dragon qui
            les suit ou se sentent poursuivis sur le chemin du retour, ils changeront d'itinéraire pour faire durer le voyage un jour de plus et augmenter leur chance de semer leurs
            poursuivants.
          </p>
          <p class="paragraphe">
            Surtout, le plus important, c'est que si les Ombres Blanches se savent poursuivi, ils préviendront les Matrones Exsangues a leur retour à la cité de Glanae'Reth. La Cité sera
            déjà méfiante.
          </p>
          <p class="paragraphe">Cela augmente le Seuil d'Alerte de 5 points. Les règles du Seuil d'Alerte sont expliqués plus loin dans ce chapitre (p.???).</p>

          <h1>Événements du voyage</h1>
          <p class="paragraphe">
            Malgré la facilité des tests pour pister les traces, grâce à la présence des alliés centaures, il est possible de raté lourdement quand même avec un échec critique.
          </p>
          <p class="paragraphe">Voici des idées d'événements que peuvent rencontrer les PJs sur la route :</p>
          <ul>
            <li>
              <p class="paragraphe">
                L'un des personnage tombe dans une crevasse profonde et étroite. Il faudra plusieurs heures pour le sortir de là et la chute blesse le PJs =&gt; 3d6 DM
              </p>
            </li>
            <li>
              <p class="paragraphe">
                L'éclaireur perd totalement la piste et le groupe doit faire demi-tour sur une longue distance. En plus de la perte de temps, l'agacement et la fatigue augmente. Perte de
                deux périodes au lieu de une et chaque personnage perd 2 PR.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                Sur le chemin, malgré les traces que l'Éclaireur auraient pu apercevoir, le groupe tombe nez à nez avec un repère de Jarguals. Les bêtes affamées se jettent sur les PJs
                Soit jouer le combat contre 3 loups et 1 loup alpha (LM97) soit répartissez les dégâts suivant aux PJs (2d8+5 DM, 2d8+2 DM, 1d8+5 DM et 1d8+2 DM)
              </p>
            </li>
            <li>
              <p class="paragraphe">L'éclaireur n'est pas clair dans ses avertissements et l'un des personnages glisse sur une plaque de glace et se blesse gravement =&gt; 4d6 DM</p>
            </li>
            <li>
              <p class="paragraphe">
                En marchant le long d'une paroi rocheuse, un éboulement tombe sur le groupe, les recouvrant de petites pierres et d'une bonne couche de neige. Perte de deux période au lieu
                de une et chaque personnage perd 2 PR.
              </p>
            </li>
          </ul>
          <hr />

          <h1>Fin du voyage</h1>
          <div class="description">
            <p class="paragraphe">
              Plus les jours passent et plus les traces sont dures à suivre. Le groupe que vous suivez ne perd pas de temps, ils avancent sans se poser de questions sur la route à suivre.
              De plus, les bourrasques de vents violents, les légères chutes de neige et les quelques traces d'animaux sauvages rendent difficile le pistage.
            </p>
            <p class="paragraphe">
              Le deuxième soir alors que vous installez le campement dans une petite cavité abrité du vent, vous sentez une tension et un stresse augmenté dans le groupe de centaures au
              fur et à mesure des kilomètres qui les éloignent de leur village. Ils ne semblent pas très à l'aise avec les longs voyages et durant les discutions du soir, vous comprenez
              qu'ils ne sont pas d'accord sur la stratégie à avoir quand ils trouveront le campement des ennemis.
            </p>
            <p class="paragraphe">
              Ka'Huri, Toa et Wakaweti pensent que les centaures sont puissants et peuvent attaquer directement les Atarangi Kino alors que Kai, Maamaa et Whakarewa estiment que sans
              informations supplémentaires il vaut mieux observer et être raisonnables.
            </p>
            <p class="paragraphe">Ils se disputent gentiment et vous sentez que la nouveauté de cette situation désoriente les centaures.</p>

            <p class="paragraphe">Prenez-vous part à la discussion avec eux ?</p>

            <p class="paragraphe">Le lendemain avant même les premiers rayons du soleil, vous reprenez votre traque dans les montagnes.</p>
          </div>
          <p class="paragraphe">Poursuivre les tests de SAG-SURVI</p>

          <h2>Arrivée devant la paroi rocheuse</h2>
          <div class="description">
            <p class="paragraphe">
              Votre poursuite continue toute la matinée. Au bout de plusieurs heures à marcher en suivant les maigres traces de pas et les lignes laissées par la luges de vos ennemis, vous
              traversez une petite foret de conifères puis, à l'approche de la lisière, vous voyez une immense paroi rocheuse au bout d'une clairière d'environ 40m de large. Un petit lac
              de montagne est visible au pied de la montagne. La neige est très éparse à cet endroit protégé par le mur de roche qui vous domine.
            </p>
            <p class="paragraphe">
              Le lac, rempli par les eaux de fonte des neiges, coule le long de la montagne sur votre gauche et une partie de l'eau s'infiltre au travers de la paroi par un trou érodé par
              l'eau.
            </p>
            <p class="paragraphe">Les traces s'arrêtent au bord du lac et vous ne voyez pas d'embarcations qui permettraient de poursuivre sur le cours d'eau.</p>
          </div>
          <p class="paragraphe">
            SAG-PERC DD10 : Des traces linéaires sont légèrement visibles sur la gauche. En les suivants, vous trouvez la grande luge dissimulée derrière des un grande touffe de buissons
            denses. Il n'y a rien dessus.
          </p>
          <p class="paragraphe">
            SAG-PERC DD15 : en observant attentivement les traces, vous ne voyez pas d'endroit où attacher une barque ni de traces indiquant qu'une barque était tirer sur la berge.
          </p>
          <p class="paragraphe">
            SAG-PERC DD20 : Le trou dans la paroi rocheuse où s'infiltre une partie de l'eau peut permettre de faire passer une personne mais certainement pas un centaure, vu sa taille. En
            entrant dans le lac, il est possible de pénétrer dans la montagne en suivant le cours d'eau.
          </p>
          <p class="paragraphe">
            SAG-PERC DD25 : A quelques mètres du bord droit du lac, sur les rochers, vous remarquez que la paroi est mouillée sur environ 50cm de haut. On pourrait croire que quelqu'un
            s'est accroché à cet endroit. En vous approchant au bord du lac, le long de la paroi, vous remarquez une fente qui semble naturelle mais qui dissimule, en faite, un passage qui
            s'ouvre dans la montagne à moitié immergé. A première vue, il semble compliqué d'y faire passer un centaure facilement mais un humanoïde pourrait y entrer en se mouillant au
            trois-quart dans l'eau glacée des Crocs d'Acier.
          </p>

          <p class="paragraphe">Il est impossible pour les centaures de passer par l'un des deux passages. Ils sont trop bas et trop étroits pour leur grand corps.</p>
          <p class="paragraphe">
            Les centaures proposeront de rester à l'extérieur, cachés, pour prendre par surprise toute personne qui sort par le lac et surtout déclencher une diversion s'ils pensent que
            les PJs sont en mauvaise posture.
          </p>

          <h3>Observation longue des environs</h3>
          <p class="paragraphe">Si le groupe propose d'observer les entrées, il ne se passe strictement rien pendant cinq jours et nuits.</p>
          <p class="paragraphe">
            SAG-PERC DD10 : le premier soir d'observation alors que les bruits de la nature s'estompent, vous entendez un bruit qui ressemble à un cri. Ca pourrait aussi être le bruit
            d'une bourrasque de vent.
          </p>
          <p class="paragraphe">
            SAG-PERC DD20 : En tendant l'oreille, vous êtes persuadé de reconnaitre un hurlement lointain de douleur. C'est dur à dire mais ça donne l'impression qu'il s'agit d'une voix
            gobeline.
          </p>

          <ul>
            <li>
              <p class="paragraphe">Au cinquième jour</p>
              <div class="description">
                <p class="paragraphe">
                  Vous voyez un groupe de six Elfes Exsangues sortir par le passage dissimulé donnant sur le lac. Ils sont totalement nus et tiennent chacun à bout de bras un paquetage
                  pour éviter qu'il soit mouillé. Vous distinguez clairement une femme au regard rougeâtre, trois hommes musclés et assurés dans leur mouvements et deux hommes portant de
                  nombreuses cicatrices qui semblent anxieux.
                </p>
                <p class="paragraphe">
                  Arrivé sur la berge, ils s'habillent avec une tenue entièrement noir et moulante et mettent leurs capuches. Ils continuent en sortant de leur sac leurs armes et armures
                  pour les enfiler.
                </p>
                <p class="paragraphe">Vous êtes à environ 40m d'eux.</p>
                <p class="paragraphe">Que voulez-vous faire ?</p>
              </div>
            </li>
          </ul>
          <hr />
        </div>
