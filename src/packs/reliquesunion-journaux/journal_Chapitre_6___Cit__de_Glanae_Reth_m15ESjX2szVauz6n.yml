        <div class="journal-cof2ta-ru">
          <h1>Une sombre soirée</h1>
          <p class="intro">
            Passés d'intrus menaçants à de réels habitants d'Arkanov, les aventuriers partagent la vie des centaures depuis plusieurs semaines voir mois. Certaines amitiés sont nées et
            chacun des Héros d'Ispier sont investit et intégrés au sein de la communauté. Les aventuriers ont peut-être même mis de côté leur recherche initiale durant cette parenthèse
            apaisante. L'événement qui arrive risque de les ramener à la réalité rapidement.
          </p>
          <hr />

          <h2>Préparation du Village</h2>
          <p class="paragraphe">
            En fonction de la vie des PJs au milieu des centaures et la manière de se lier d'amitié avec eux, le groupe d'aventuriers doit avoir entendu parlé des kidnapping et meurtre des
            Atarangi Kino et le stresse que ça développe dans le village d'Arkanov.
          </p>
          <p class="paragraphe">
            Devant cette menace ponctuelle et floue, certains Joueurs peuvent avoir l'idée de mettre en place des défenses supplémentaires dans la petite ville isolée ou sur les montagnes
            aux alentours.
          </p>
          <p class="paragraphe">
            Pour les centaures, toutes les bonnes idées sont à prendre face à leur pire cauchemars. Si les PJs ont de bonnes idées, les forgerons, les menuisiers, les graveurs de runes et
            les meilleurs artisans et spécialistes d'Arkanov aideront les Personnages a mettre en place des défenses supplémentaires.
          </p>
          <ul>
            <li><p class="paragraphe">Alarmes magiques ou pièges dissimulées aux points stratégiques dans les montagnes</p></li>
            <li><p class="paragraphe">Pièges sur les toitures des bâtiments proches des falaises</p></li>
            <li><p class="paragraphe">Mettre en place un système de rondes de garde, en plus des deux tours d'observations</p></li>
            <li><p class="paragraphe">Tendre un piège aux attaquants pour les inciter à passer à un certain endroit surveillé.</p></li>
          </ul>

          <p class="paragraphe">
            Les idées peuvent être nombreuses et il faudra s'inspirer des nouvelles mesures de sécurité pour modifier l'attaque de cet acte. Pour créer de la tension supplémentaire et un
            sentiment d'urgence et de colère, il est peut-être judicieux, au minimum, de laisser le début de l'attaque se dérouler mais si les PJs ont réellement augmenté leurs chances
            face à la menace des Atarangi Kino, il serait intéressant de valoriser leurs initiatives en leur donnant un avantage important lors de l'attaque suivante.
          </p>
          <p class="paragraphe">La section suivante se base sur le cas où le village n'aurait pas été suffisamment améliorer contre la menace des Ombres Blanches.</p>
          <hr />

          <h1>Attaque des Atarangi Kino</h1>
          <p class="paragraphe">
            C'est au Maître des Jeux d'estimer le moment idéal pour lancer cet événement dans le village d'Arkanov. Les Joueurs devraient avoir vécu quelques mois au milieu de cette
            communauté. Ils ont sympathiser avec certains habitants et partager des bons moments de vie. Cette phase d'intermède doit leur avoir permis d'améliorer leur Personnage un
            minimum pour appréhender le reste de la campagne sereinement.
          </p>
          <hr />

          <h2>Situation initiale</h2>
          <p class="paragraphe">
            L'attaque des Atarangi Kino intervient au milieu d'une nuit alors que les aventuriers sont couchés. Les deux tours d'observations sont occupés par des centaures (éviter que ce
            soit un PJ), Aroha dans celle de la Salle Commune et Iti dans celle au-dessus de l'atelier de couture. Kaiwhakairo et Kara discutent dans l'atelier de sculpture et Ka'Huri
            entretient le four à tuiles de la poterie. Le petit poulain d'Haputanga l'empêche de dormir en gigotant dans son sommeil.
          </p>
          <p class="paragraphe">A part ça tout le village est paisible lors de cette sombre nuit sans lune.</p>
          <p class="paragraphe">
            Le groupe de kidnappeurs est dirigé par la Sœur Sierua, quatre Sergents Exsangues et cinq Soldats Exsangues. L'endroit où ils approchent est idéal pour ne pas pouvoir être
            détecté par les deux tours d'observation et pour pouvoir atteindre le sol facilement. Ils se positionnent à l'Est du bâtiment de la forge au niveau dans grand tas de gravats
            afin de pouvoir descendre de la falaise plus facilement et installer les filets et les cordes qui permettront de remonter les prisonniers et les membres de l'équipe.
          </p>
          <p class="paragraphe">
            Les Elfes Exsangues sont très discrets. Avant de pouvoir être repérés, ils auront déjà installé leurs filets et cordes et ils auront déjà pénétré dans la maison à l'Est de la
            forge et du tas de gravats.
          </p>
          <p class="paragraphe">
            Dans la maison, il y a seulement Mataro et Vaiata qui dorment pendant que leurs parents sont occupés dans l'atelier de sculpture. Ils viennent de se faire empoisonner par une
            dose de Crème de Sommeil à la suite d'un coup de dague dans le flanc.
          </p>
          <hr />

          <h2>Mode opératoire des kidnappeurs</h2>
          <h3>La première équipe :</h3>
          <p class="paragraphe">
            la première équipe surveille les rues et les alentours depuis le sommet de la falaise, cachée derrière de denses buissons. Composée de deux Sergents et de deux Soldats, chaque
            membre de l'équipe a une arbalète (de poing ou lourde) dont les carreaux sont trempés dans une Crème de Sommeil. Ils surveillent également les cordes pour remonter rapidement
            leurs collègues de méfaits. Dès qu'ils aperçoivent un centaures, ils utiliseront leurs armes à distance pour essayer l'endormir avant qu'il ne lance l'alerte.
          </p>
          <h3>La deuxième équipe :</h3>
          <p class="paragraphe">
            La deuxième à pour rôle de descendre au sol, installer les filets, s'introduire dans une ou plusieurs maisons afin d'assommer et/ou tuer les centaures présents le plus
            rapidement possible. S'ils ont une ou deux victimes inconscientes, ils les sortiront vers les filets, les attacheront afin que le premier groupe remonte les filets et l'équipe
            au sol. Dès que ça arrive, ils se déplaceront plus loin pour jeter les captifs sur deux grandes luges afin de retourner à la cité de Glanae'Reth le plus vite possible.
          </p>
          <h3>Si l'équipe est repérée</h3>
          <p class="paragraphe">En cas de rencontre d'un individu isolé, les elfes exsangues attaqueront le plus vite possible pour éviter que l'alerte soit donnée.</p>
          <p class="paragraphe">
            Si l'alerte générale est lancée, l'équipe au sol évacuera le plus rapidement qu'ils peuvent en utilisant les cordes et les filets installés au sol. Protéger Soeur Sierua est
            important mais tous les autres membres sont remplaçables et sans importance. Ils pourront abandonner les Sergents et les Soldats derrière s'ils en sentent la nécessité.
          </p>
          <hr />

          <h1>Situation 1 : les PJs donnent l'alerte</h1>

          <h2>Etape 1 : Des bruits étranges dans la nuit</h2>
          <p class="paragraphe">Chaque PJs effectue un test de SAG-PERC DD20 afin d'entendre les légers bruits des elfes exsangues dans leur sommeil.</p>
          <ul>
            <li>
              <p class="paragraphe">Réussite Critique ou à 30+</p>
              <div class="description">
                <p class="paragraphe">
                  Tu te réveilles en sursaut ! était-ce un rève ou la réalité, tu n'en sais rien mais tu as entendu furtivement le petit cri étouffé de Vaiata et le bruit sourd d'une masse
                  qui tombe au sol. A part la respiration de tes compagnons qui dorment dans la pièce, tu retiens ton souffle et des chuchotements parviennent à tes oreilles dans la même
                  direction.
                </p>
                <p class="paragraphe">Tu sais que Mataro et sa sœur dorment seule pendant que leurs parents passent de longues nuits dans l'atelier de sculpture.</p>
              </div>
            </li>
            <li>
              <p class="paragraphe">Réussite</p>
              <div class="description">
                <p class="paragraphe">
                  Vous entendez, au coeur de la nuit, des bruits étranges qui proviennent de l'extérieur. Même si le village est constamment englobé par le son de la cascade et de la roue
                  du moulin à eau, vous ne reconnaissez pas les bruits que vous percevez dans votre sommeil. C'est peut-être seulement Kaiwhakairo qui rentre de l'atelier de sculpture mais
                  vous avez un mauvais pressentiment qui vous fait frissonner les poils sur la nuque.
                </p>
                <p class="paragraphe">Le gémissement court que vos oreilles ont légèrement perçu provient de la maison dans laquelle dort Mataro et Vaiata, à côté de la forge.</p>
              </div>
            </li>
          </ul>
          <h2>Étape 2 : Vision du danger</h2>
          <p class="paragraphe">Lorsque les PJs réveillés se lèvent et sortent dehors, ils effectuent un nouveau test de SAG-PERC DD15.</p>
          <ul>
            <li>
              <p class="paragraphe">Réussite Critique ou à 25+</p>
              <div class="description">
                <p class="paragraphe">
                  En passant la tête à l'extérieur, la première chose qui vous choque c'est la porte de la maison à gauche de la forge qui est légèrement ouverte. Ce point particulier
                  attire votre attention et vous distinguez furtivement au travers de la porte et le long du mur entre la forge et la maison, des silhouettes humanoïdes entièrement
                  habillées de noir. Tu aperçois des capuches sombres et une paire d'yeux rougeâtres qui se cachent à l'instant où tu les vois. Sans aucun doute possible, tu sais qu'une
                  partie des intrus sont dans la maison et d'autres se trouvent dans l'espace entre les bâtiments.
                </p>
                <p class="paragraphe">
                  Un coup de tête circulaire pour analyser rapidement la situation et tu vois trois longues lignes qui tombent du haut de la falaise jusqu'au sol. Il te semble reconnaitre
                  des grosses cordes marrons.
                </p>
              </div>
            </li>
            <li>
              <p class="paragraphe">Réussite</p>
              <div class="description">
                <p class="paragraphe">
                  En passant la tête à l'extérieur, la première chose qui vous choque c'est la porte de la maison à gauche de la forge qui est légèrement ouverte. Ce point particulier
                  attire votre attention et vous distinguez furtivement au travers de la porte et le long du mur entre la forge et la maison, des silhouettes humanoïdes entièrement
                  habillées de noir. Tu aperçois des capuches sombres et une paire d'yeux rougeâtres qui se cachent à l'instant où tu les vois.
                </p>
              </div>
            </li>
            <li>
              <p class="paragraphe">Échec</p>
              <div class="description">
                <p class="paragraphe">
                  Tu sors de la maison, dans cette nuit bien noir et tu vois la porte de la maison où dorment Vaiata et Mataro qui est légèrement ouverte. Tu es de suite rassuré car, comme
                  souvent, ce n'est que Kaiwhakairo et Kara qui sont rentrés chez eux après travaillé dans l'atelier de sculpture.
                </p>
                <p class="paragraphe">Tout semble calme dans le village, tu peux retourner te coucher.</p>
              </div>
            </li>
          </ul>

          <h2>Étape 3 : Début du combat</h2>
          <p class="paragraphe">Dans le cas où un ou plusieurs PJs ont aperçu les Elfes Exsangues, déclencher le combat et l'initiative.</p>
          <p class="paragraphe">Utilisez le plan numéro 1 pour déterminer la disposition des ennemis dans cette situation.</p>
          <p class="paragraphe">
            Un Sergent et un Soldat, dans la maison, resteront occupés pour kidnapper Mataro pendant que la sœur Sierua, un Sergent et les deux Soldats restant entreront dans le combat
            avec le ou les PJs perturbateurs.
          </p>
          <p class="paragraphe">
            Les ennemis de l'équipe en haut de la falaise n'est pas immédiatement visible, derrière leur buisson mais ils utiliseront leur attaque pour tirer des carreaux d'arbalètes sur
            les cibles qu'ils peuvent voir.
          </p>
          <p class="paragraphe">
            Dès que l'alerte est donné par un Personnage, elle sera relayée par Itu et Aroha directement. Les premiers centaures qui arriveront dans le combat interviendront, par tout
            petits groupes, après minimum 3 tours. Ils seront armés mais n'auront pas prit le temps d'enfiler leurs armures.
          </p>
          <p class="paragraphe">
            Si les deux ennemis ne se font pas perturber, il faudra, au moins, 5 tours pour que Mataro soit installé dans le filet, prêt à être hissé. A partir de ce moment là, l'équipe en
            haut de la falaise commencera à soulever le centaure à l'aide de la corde (2 tours pour le hisser entièrement). Ensuite, ils s'occuperont de tirer les survivants de leur camp
            avec l'autre corde. Si toutes les cordes ne sont pas utilisées, elles seront tranchées.
          </p>
          <p class="paragraphe">Ils s'enfuiront le plus vite possible sur les plateaux rocheux de la montagne.</p>

          <hr />

          <h1>Situation 2 : L'alerte tarde à venir</h1>
          <p class="paragraphe">
            Si les Personnages ont échoué au premier test de Perception, ils sont endormis. Les PJs ne vont pas pouvoir donner l'alerte et le kidnapping se poursuivra en toute
            tranquillité, jusqu'au moment où les deux jeunes centaures seront hissés le long de la paroi par la première équipe. A ce moment là, Iti donnera l'alerte et réveillera
            quasiment tout le village d'Arkanov.
          </p>
          <p class="paragraphe">
            S'ils ont échoué au deuxième test de Perception, ils ne remarquent rien d'étrange. Même s'il vont voir dans la maison de Vaiata et Mataro, ils les trouvent endormis sur leur
            paillasse tranquillement. Les Elfes Exsangues sont dissimulés dans le coin gauche de la pièce sous la paille. Les aventuriers inquiets retournent se coucher rassurés.
          </p>

          <h2>Quelques minutes plus tard :</h2>
          <div class="description">
            <p class="paragraphe">
              Au milieu de votre sommeil, vous entendez clairement un puissant cri d'alerte. Un centaure hurle : «Morearea» à plein poumon. Le temps d'ouvrir les yeux, vous entendez du
              mouvement dans toutes les maisons autour de vous. On s'agite, on s'affole.
            </p>
            <p class="paragraphe">
              En ouvrant la porte, vous voyez rapidement, le long de la paroi rocheuse qui surplombe la forge, des silhouettes humanoïdes qui tirent sur de grosses cordes. Le bout des
              cordes sont positionnées entre la forge et la maison. Vous remarquez du mouvement dans cette zone.
            </p>
          </div>

          <p class="paragraphe">Dans cette situation, utilisez le plan numéro 2 pour établir la disposition des ennemis.</p>
          <p class="paragraphe">
            Les trois soldats resteront à s'occuper de sécuriser les centaures kidnappés et les ligoter dans les filets. Pendant ce temps, la sœur Sierua et les deux Sergents gagneront du
            temps en attaquant les PJs et les centaures qui s'approchent. Les deux sergents en haut de la falaise utiliseront leurs arbalètes en attendant le signal de hisser les filets.
          </p>
          <p class="paragraphe">
            Il faut 2 Tours pour ligoter les deux centaures et commencer l'ascension des prisonniers. Les Elfes Exsangues dans le village continueront le combat pendant les 4 tours qu'il
            faut pour hisser les deux centaures en haut de la paroi. Ensuite, ils se réuniront entre les deux bâtiments pour grimper la paroi, aidés par l'équipe en haut.
          </p>
          <hr />

          <h1>Résultat de l'attaque des Atarangi Kino</h1>
          <p class="paragraphe">
            Dès que les ennemis ont fui ou sont tous morts ou capturés, la tension descend progressivement dans le village des centaures. Dans tous les cas, la colère sera immense mais en
            fonction du résultat de l'attaque, le désespoir sera plus ou moins grand.
          </p>
          <hr />

          <h2>Aucun kidnappé</h2>
          <p class="paragraphe">
            Si les deux jeunes centaures, Vaiata et Mataro ont été sauvés grâce aux PJs et aux centaures, la colère explosera chez les centaures en voyant les corps inanimés devant eux.
            Ils ne sont pas morts mais gravement blessés et drogués par une substance inconnue. Ils respirent à peine lorsqu'on les libère des filets et il faudra plus de deux jours pour
            qu'ils reprennent conscience.
          </p>
          <p class="paragraphe">
            Kiliko, Toa, Kara et Kaiwhakairo demanderont conseille aux aventuriers pour savoir comment ils peuvent se venger des Atarangi Kino et un plan stratégique sera réfléchi durant
            le reste de la nuit avant de suivre les traces des Elfes Exsangues.
          </p>
          <hr />

          <h2>Mataro et/ou Vaiata kidnappés</h2>
          <p class="paragraphe">
            Si l'attaque a permis au Atarangi Kino de s'enfuir avec l'un des jeunes centaures ou les deux. La colère se transforme rapidement en désespoir et pessimisme dans la bouche de
            Kara et Kiliko. Les PJs aperçoivent l'impasse dans laquelle se trouve les centaures.
          </p>
          <p class="paragraphe">
            Les liens forts que les Héros d'Ispier ont développé avec les centaures devraient leur permettre de mobiliser les habitants pour que des représailles soient entreprises. Ils
            arriveront à motiver les villageois d'élaborer un plan d'action pour poursuivre les elfes exsangues et pour libérer les captifs.
          </p>
          <p class="paragraphe">Toute la nuit durant, les centaures les plus influents et les aventuriers élaboreront un plan pour secourir les deux jeunes.</p>
          <hr />

          <h2>Si des Elfes Exsangues sont prisonniers</h2>
          <p class="paragraphe">Si les PJs ont réussi à garder en vie un membre de l'équipe, ils pourront essayer de l'interroger de façon plus ou moins morale.</p>
          <p class="paragraphe">
            Kiliko et la plupart des habitants d'Arkanov ne voient pas cette violence d'un mauvais œil malgré leurs valeurs profondes. Ils sont trop énervés contre les Atarangi Kino pour
            intervenir.
          </p>
          <hr />

          <h3>Si le captif est un Soldat :</h3>
          <div class="description">
            <p class="paragraphe">
              Vous êtes devant le captif et du premier regard vous remarquez qu'il n'a pas toute sa tête. Les yeux perdu dans le vague, un filet de bave sur le bord des lèvres et de légers
              spasmes qui le secouent régulièrement, il reste immobile dans le coin où vous l'avez installé.
            </p>
            <p class="paragraphe">
              Après une heure à le secouer, le questionner voir le molester, il n'a pas prononcé un mot mais, de temps en temps, il sourit et rigole comme frappé de folie.
            </p>
            <p class="paragraphe">
              Lorsque vous arrêtez de l'interroger, il semble se détendre et prononce, dans une langue elfique ancienne et prononcée avec un accent étrange, seulement le mot «amour aux
              mamans. Vie et mort à Glanae'Reth». Il s'endort paisiblement au bout de quelques minutes.
            </p>
          </div>
          <p class="paragraphe">
            Il n'y a rien a tirer d'un soldat drogué et malmené depuis son plus jeune âge. Ils sont à moitié fous et ne comprennent pas la situation dans laquelle il se trouve.
          </p>
          <p class="paragraphe">
            Si on nourrit le captif, il mangera salement mais avec entrain et bonheur même les plats les plus simples. Par contre, étant très soumis et dominé, à chaque fois qu'on
            s'approche de lui, il aura des mouvements de recul et de peur comme un animal de compagnie battu.
          </p>
          <hr />

          <h3>Si le captif est un Sergent</h3>
          <p class="paragraphe">
            Vous êtes devant le captif qui lève haut sa tête et son regard dans votre direction. Il a un léger sourire sarcastique aux lèvres. Son visage est assez perturbant car sous ses
            traits d'elfe vous remarquez toutes les différences avec les elfes que vous connaissez habituellement. Peau très blanche, maquillage noir autour des yeux, cheveux d'une
            blancheur immaculée et des pupilles crèmes, son physique est perturbant.
          </p>
          <p class="paragraphe">
            Lorsque vous commencez à l'interroger, le secouer voir le molester, il garde son air moqueur et tente régulièrement la joue pour vous inviter à multiplier les coups. Il ne
            répond à aucune question et il ne prononce que des phrases courte du style «la mort est une joie», «je retourne voir maman», «des chatouilles oh oui des chatouilles» ou encore
            «le soleil vous rend faibles, vermines !».
          </p>
          <p class="paragraphe">Pour avoir un peu d'informations, les PJs peuvent réussir un test de soit :</p>
          <ul>
            <li><p class="paragraphe">CHA-PSYCHO DD25 pour convaincre le Soldat de parler</p></li>
            <li><p class="paragraphe">CHA-FILOU DD20 pour manipuler le Soldat et réussir à le piéger à son propre jeu</p></li>
            <li><p class="paragraphe">FOR-COMM DD20 pour l'intimider, le dominer et prendre le dessus sur lui.</p></li>
          </ul>

          <p class="paragraphe">
            Autrement, si un PJ possède des sorts qui permettent de charmer ou envoûter le Soldat, il donnera les mêmes informations qu'en le questionnant via les compétences.
            Contrairement à ses supérieurs, les Soldats ne sont pas aussi résistants au sorts de ce type.
          </p>
          <div class="description">
            <p class="paragraphe">
              Grâce à vos efforts, l'elfe qui vous fait face s'énerve au bout d'un certain temps. Il commencer à parler très vite et de façon incohérente dans l'enchaînement de ces
              phrases.
            </p>
            <p class="paragraphe">
              «Nos mères ne me sauveront pas mais elles vous tueront, vous feront couiner, brûler, hurler, pleurer. Vous avez de la chance de ne pas connaitre maman car elle aime prendre
              son temps. Au travail les canassons, vous êtes forts et on aime vous faire chialer. P'tit coup de couteau, décharge ou un sabot trancher pour les pleureuses. Vous ne
              trouverez jamais l'entrée de Glanae'Reth. Les souterrains sont trop bien cachés pour les faibles.»
            </p>
          </div>
          <hr />

          <h3>Si le groupe capture la Sœur Sierua</h3>
          <div class="description">
            <p class="paragraphe">
              Vous vous trouvez devant une très belle elfe à la peau blanche, aux cheveux immaculés et aux yeux aux reflets rouges. Elle est très élégante malgré le regard de mépris
              qu'elle vous lance au visage. Elle tient sa tête haute comme si elle n'avait aucune crainte de ce qui l'attend. A chaque fois que vous lui posez une question, elle répond
              sans attendre : «Petite merde insignifiante !» avant de cracher au sol ou en direction de l'un d'entre vous.
            </p>
            <p class="paragraphe">Lorsque vous l'a secoué, la molesté ou la brutalisé, elle garde constamment son sourire de contentement et en demande encore et encore.</p>
            <p class="paragraphe">«Vous êtes trop faibles», «Vous êtes une bande de faible vermine.», «On ne m'a jamais caressée avec autant de douceur, chouineur !»...</p>
          </div>
          <p class="paragraphe">Pour avoir un peu d'informations, les PJs peuvent réussir un test de soit :</p>
          <ul>
            <li><p class="paragraphe">CHA-PSYCHO DD30 pour convaincre la Sœur Sierua</p></li>
            <li><p class="paragraphe">CHA-FILOU DD25 pour manipuler la Sœur Sierua et réussir à la piéger à son propre jeu</p></li>
            <li><p class="paragraphe">FOR-COMM DD30 pour l'intimider, la dominer et prendre le dessus sur elle.</p></li>
          </ul>
          <div class="description">
            <p class="paragraphe">
              A force de la questionner, au bout d'un long moment, elle s'énerve et, en gardant son ton méprisant, elle vous grogne dessus. «Vous êtes impur pour Glanae'Reth. Nos
              souterrains, notre domaine, nos règles ! On vous fera couiner. Les mères viendront prendre tout votre village s'il le faut et on vous écrasera, les canassons.»
            </p>
            <p class="paragraphe">Elle finit sa diatribe par des imitations de bruits de chevaux insultants et des moqueries puériles.</p>
          </div>
          <p class="paragraphe">Autrement, si un PJ possède des sorts qui permettent de charmer ou envoûter la Sœur Sierua, il se prendra une attaque mentale en opposition.</p>
          <p class="paragraphe">
            Contrairement aux Mâles Elfes Exsangues, les femelles sont entraînées aux manipulations mentales et aux tentatives de domination. Il est possible de prendre le dessus sur elle
            mais les risques sont grands.
          </p>
          <hr />

          <p class="paragraphe">Résistance à la Domination :</p>

          <p class="paragraphe">Toutes les femelles Elfes Exsangues résistent plus facilement aux capacités permettant de les manipuler.</p>
          <p class="paragraphe">
            A chaque fois qu'un PJ utilise une capacité permettant de la manipuler (Suggestion, Amitié, Domination,…), lancez 1D100. La capacité utilisée n'a aucun effet si le résultat est
            inférieur ou égale à 100% [-10%/Rang de la capacité].
          </p>
          <p class="paragraphe">Exemple : sœur Sierua résistera au sort Amitié (Rang 4 de la Voie de l'Envoûtement) avec un résultat de 60 ou moins sur 1D100</p>
          <p class="paragraphe">Chaque fois qu'elle résiste à une capacité, l'Elfe Exsangue contre-attaque l'esprit du mage et lui inflige 3d6DM mentaux.</p>
          <p class="paragraphe">En cas d'échec, elle peut réessayer après 30 minutes.</p>
          <hr />

          <p class="paragraphe">Informations de la sœur Sierua :</p>
          <p class="paragraphe">
            Si un PJ arrive à manipuler la sœur Sierua à l'aide d'une capacité magique ou grâce à une réussite critique à l'interrogatoire, elle transmettra certaines informations contre
            son gré :
          </p>
          <ul>
            <li><p class="paragraphe">Les habitants de la cité ne sont plus très nombreux par rapport à la grandeur de la cité.</p></li>
            <li>
              <p class="paragraphe">
                Aucun habitant n'hésitera à torturer ou exécuter les prisonniers face à une menace. La pitié ou la négociation ne fait pas parti des valeurs de Glanae'Reth.
              </p>
            </li>
            <li><p class="paragraphe">Pour rentrer il vaut mieux passer par la rivière qui traverse la montagne.</p></li>
            <li><p class="paragraphe">Des centaures sont encore en vie et prisonniers. Elle connait le nom d'Anake et Wakamamae.</p></li>
            <li><p class="paragraphe">Il y a trois matrones principales et six sœurs, dont elle.</p></li>
            <li>
              <p class="paragraphe">
                Il y a quatre entrées en tout pour la cité de Glanae'Reth : le passage de la rivière souterraine au niveau du lac, l'entrée dissimulée le long de la paroi, un tunnel qui
                traverse la montagne sur plusieurs dizaines de kilomètres et l'aval de la rivière souterraine qui débouche dans une grande étendue d'eau à l'ouest d'où il est possible de
                naviguer avec des petites embarcations.
              </p>
            </li>
          </ul>
          <p class="paragraphe">
            Si la sœur Sierua reprend ses esprits et constate qu'elle divulgue des informations importantes, elle essayera de se suicider ou, si elle est ligotée par exemple, elle se
            tranchera la langue d'un coup de dents pour éviter de répondre aux questions.
          </p>
          <hr />
        </div>
