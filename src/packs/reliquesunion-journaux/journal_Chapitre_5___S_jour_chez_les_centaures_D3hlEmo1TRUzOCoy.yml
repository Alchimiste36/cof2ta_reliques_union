        <div class="journal-cof2ta-ru">
          <h1>Phase 1 : Méfiance</h1>
          <p class="intro">
            Afin de s'intégrer et de gagner la confiance des centaures, les nouveaux arrivants vont devoir découvrir les différents lieux du village d'Arkanov. Chaque bâtiment contient ses
            particularités et chaque héros pourra y vivre des événements tantôt joyeux tantôt stressants.
          </p>

          <p class="paragraphe">
            L'accès aux bâtiments du Village d'Arkanov n'est possible que si les Centaures ont assez confiance dans le Personnage. Autant il est facile de partager certaines tâches
            rapidement (bûcheronnage, minage, s'occuper du compost, des champs, du verger ou du potager…), autant certains bâtiments ou machines seront fermés.
          </p>
          <p class="paragraphe">L'accès aux bâtiments d'Arkanov est décomposé en plusieurs phases en fonction de la confiance accordée à chacun des Personnages.</p>
          <hr />

          <h1>Bâtiments accessibles :</h1>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.KaN8MUqbIPPsXoyQ]{A : Grotte et Prison}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.fh429wTzMRKO8X4G]{B : Forêt intérieure}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.13YUedrBxZY1CUBb]{C : Potager - Champs - Verger Compost}</h2>
          <h2>
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.PKaXRrmLTYIoQkbS]{D : Préparations et stockages alimentaires}
          </h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.uoJIun8wTNjIEhYY]{E : Place du village}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.WB0bl6i0ApQZTpR3]{F : École}</h2>
        </div>
