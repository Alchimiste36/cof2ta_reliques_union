        <div class="journal-cof2ta-ru">
          <h1>Phase 2 : Confiance</h1>
          <p class="paragraphe">
            Une partie des aventuriers parviennent à nouer des liens avec les centaures. Ils sont volontaires, participent aux travaux quotidiens, arrivent déjà à communiquer de façon
            simple avec les habitants.
          </p>
          <p class="paragraphe">
            Il y a bien entendu des tensions avec les centaures les plus durs et conservateurs. Il y a aussi des bourdes et incompréhensions qui amènent régulièrement des agacements ou des
            frictions comme dans toutes les communautés mais, le ou les Personnages sont respectueux des coutumes et du quotidien des Centaures.
          </p>
          <p class="paragraphe">
            Le respect d'une partie des centaures peut venir de la majorité des villageois ou seulement d'une petite partie (un Personnage qui a sympathisé avec un groupe dans le village)
            et il peut venir après des journées passées à se fondre dans la vie quotidienne ou après un ou deux événements particulièrement marquants pour les centaures (débloquer un
            conflit, réaliser une pièce avec talent et perfectionnisme, faire une action inattendue pour le bien de la communauté…).
          </p>
          <p class="paragraphe">
            Donner cette confiance aux PJs est vécu comme un grand honneur du point de vue des Centaures et il convient de marquer l'événement avec force (un grand banquet où seuls les
            aventuriers de confiance sont conviés, offrir un outil enchanté pour un PJs, une forte complicité après un entraînement durant lequel le Héros aura battu
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} ou
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa}…).
          </p>
          <p class="paragraphe">Dans tous les cas, ils vont obtenir de nouveaux droits grâce à cette intégration au sein d'Arkanov.</p>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} rendra l'entièreté de l'équipement de chaque Personnage commençant la Phase 2 (objets
            d'aventures, armes, armures, Objets Magiques, trésors…).
          </p>
          <hr />

          <h2>Cérémonie des Fleurs de Kaora</h2>
          <p class="paragraphe">Durant la Phase 2, le village organise une grande fête pour célébrer l'éclosion des fleurs des arbres de la forêt intérieure, les Kaora.</p>
          <p class="paragraphe">
            Un matin, la très heureuse @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} traverse le village au galop en criant «<span class="discussion">Timatanga</span>». Elle se place sur la place principale du village en répétant, toute excitée, ce mot. Tous les habitants sortent de leur maison, un grand sourire aux lèvres, se serrent dans
            les bras, s'embrassent et, au bout de quelques minutes, une chanson et une danse entraînent tous les villageois. L'organisation de la Cérémonie des Fleurs de Kaora peut
            commencer car la première éclosion a été aperçue par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini}.
          </p>
          <p class="paragraphe">
            Les Personnages, légèrement intégrés au sein de la communauté, verront, pendant cinq jours, tous les centaures préparer ce grand moment de l'année. Un grand banquet est
            préparé, une pièce de théâtre est répétée par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.zv16OZoKKSY6bTpN]{Kupu},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.3FZtGR85wvyjSJ4b]{Titiro} et les jeunes centaures, les rues sont nettoyées, les bâtiments rangées et des
            décorations sont installées.
          </p>
          <p class="paragraphe">
            Tout au long de la préparation, les Kaora se couvriront de magnifiques fleurs blaches à sept pétales assez grandes et odorantes. Toutes les tensions entre les différents
            habitants s'apaisent durant cette période. Le midi du cinquième jour, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} se positionne
            au milieu des villageois sur la place et lance la Cérénomie des Fleurs de Kaora en battant ses sabots en rythme au sol. Une belle danse commence, entraînée par un chanson
            dynamique. A la fin de cette représentation, les habitants mangent, rigolent, discutent et assistent à un spectacle, des chansons, des déclarations…
          </p>
          <p class="paragraphe">Les PJs remarquent que certains centaures (surtout les plus anciens) fument une drogue qui les rend particulièrement désorientés et euphoriques.</p>

          <div class="sallemj"><p class="paragraphe">Inciter les Joueurs à s'impliquer dans la préparation de la fête et à se mélanger durant les festivités.</p></div>
          <hr />

          <h1>Bâtiments accessibles :</h1>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.QYs90mKhx9fHyy79]{G : Cuisine collective}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.NDrkpxJE2qxi4A0X]{H : Stocks de produits finis - Couture}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.3AL5tLVP6FLVPXw2]{I : Atelier de Bougies - Poterie}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.w5pMCoYMA92Enjdp]{J : Forge}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.2CbnDSbhN5kjd8nt]{K : Four et artisanat divers}</h2>
          <h2>
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.fqQEw5YAUk6zHgZm]{L : Murailles - Salles d'entrainement}
          </h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.eCfT2xaJISkNtjSp]{M : Salle commune - Méditation}</h2>
        </div>
