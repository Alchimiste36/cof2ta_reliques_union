      content: |-
        <div class="journal-cof2ta-ru">
          <h1>Premières heures d'attente</h1>

          <p class="paragraphe">
            Les prisonniers peuvent s'occuper de multiples manière dans les mines. Ils peuvent miner la paroi, concasser des roches pour extraire les pépites de métaux, fabriquer de petit
            objets en bois, faire des travaux de couture… Ils trouvent rapidement des caisses, cagots et sacs permettant de cuisiner des plats de qualité grâce au foyer et au plan de
            travail.
          </p>
          <p class="paragraphe">
            Ils ont aussi l'occasion de se reposer et de se soigner si besoin. Si, a la suite du voyage dans les montagnes, un PJ était blessé gravement, lorsqu'il s'inspecte, il remarque
            qu'un baume et un bandage a été appliqué sur sa plaie ou ses ecchymoses par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} lorsqu'il
            était inconscient.
          </p>
          <p class="paragraphe">Ils peuvent aussi s'équiper avec des armes (marteaux de forge, gros marteau pour casser les cailloux, pioches, couteaux de cuisine…) ou autres.</p>
          <hr />

          <h1>Aventuriers agressifs et récalcitrants</h1>
          <p class="paragraphe">
            La coopération des Joueurs dans cette situation est l'hypothèse la plus probable. Ils se rendent bien compte que leur petit groupe ne fait pas le poids face à un village entier
            rempli de centaures aux muscles saillants et qui apprennent des techniques de combat dès le plus jeune âge.
          </p>
          <p class="paragraphe">
            En plus d'être les intrus dans cette histoire, là où les centaures n'ont rien demandé, il ne faut pas oublier que, depuis la venue de Timaor Dunclin il y a 27 ans, les seules
            présences étrangères qui atteignent Arkanov sont les Ombres Blanches. Ces derniers ont tué, kidnappé et blessé de nombreux centaures les rendant méfiants et tendus.
          </p>
          <p class="paragraphe">
            Pour finir la division au sein du village apporte déjà son lot de conflits et de pression. Alors si les aventuriers se prennent pour des caïds ou des dominants en face des
            centaures, la situation peut vite dégénérer.
          </p>
          <p class="paragraphe">
            L'agressivité des prisonniers, le manque de respect, les marques de sarcasme ou de moquerie, les coups de pression ou les familiarités brusques seront réprimés par les
            centaures. Ils commenceront par une bousculade, une torgnole ou un coup de sabot bien placé puis pourront passer à des estafilades à la lance ou une projection du PJ dans les
            caisses ou contre la paroi.
          </p>
          <p class="paragraphe">
            Si certains Personnages continuent les provocations, les centaures ne viendront plus vider les toilettes, changer les torches ou approvisionner la cuisine, laissant les PJs à
            leur sort jusqu'à ressentir un changement d'attitude de leur part.
          </p>
          <p class="paragraphe">
            Les Héros d'Ispier coopératifs seront bien traités et séparés du ou des aventuriers belliqueux. Les centaures les sortiront des mines pour les installer dans une maison fermée
            du village et ils recevront tout le nécessaire comme expliqué dans la section suivante.
          </p>
          <p class="paragraphe">
            Tant que les PJs menaçant ne modifient pas leur comportement, ils seront à peine considérés. Quelques pommes de terres par semaines, une ou deux troches neuves jetées au sol ou
            une tentative d'autorité, voici les seules choses qu'ils recevront pendant de longs jours seuls dans cette prison.
          </p>
          <p class="paragraphe">
            A bout de quelques semaines, si la situation ne s'est pas améliorée, les centaures demanderont, grâce à des gestes et des mimiques, aux PJs coopératifs de raisonner leurs
            compagnons sinon ils seront puni de façon plus «définitive».
          </p>
          <p class="paragraphe">Si cette dernière tentative est un échec, les PJs agressifs seront exécutés dans les grottes humides qui leurs servent d'habitat depuis tant de jours.</p>

          <p class="paragraphe">
            A chaque étape, si les Personnages changent d'attitude et deviennent respectueux ou, au moins, polis avec les centaures, passez à la section suivante en gardant en mémoire que
            la confiance des centaures à leur égard sera bien difficile à obtenir.
          </p>

          <p class="paragraphe">
            Dans une situation où tout le groupe de joueurs se comportent mal avec les habitants, il sera possible d'assommer le groupe puis de les relâcher sans leur équipement ni ration
            à plusieurs dizaines de kilomètres du village en plein milieu des plaines hostiles des Crocs d'Acier. S'ils arrivent à survivre jusqu'à la Vallée de Novrak, ils devront
            expliquer à Lana'Sir, Laotissa et Zagrenn pourquoi ils n'ont pas récupérer la deuxième Relique de l'Union.
          </p>
          <p class="paragraphe">Sinon vous pouvez aussi changer de groupe de joueurs pour jouer cette campagne avec des personnes moins bourrins et bornées !</p>

          <h1>Les premiers jours de captivité</h1>
          <p class="paragraphe">
            Avant de pouvoir intégrer le village et mettre en place l'Intermède avec les centaures, les PJs passeront quelques jours dans mes mines. Durant ces premiers jours, ils
            découvriront la complexité à se faire comprendre et à décrypter les intentions des habitants. Avec des gestes de la main, en pointant avec leur lance, en montrant un objet ou
            un endroit et en singeant des émotions, les certains centaures feront des efforts pour engager «la conversation» alors que d'autres s'agaceront et n'essayeront même pas de
            nouer le contact. Avec les centaures les plus réfractaires ou si les Personnages sont irrespectueux ou hostiles, des coups de poings, de sabots ou de lance peuvent tomber sur
            les prisonniers.
          </p>
          <p class="paragraphe">
            Piégés dans cette grotte, les PJs auront du mal à percevoir le passage des journées et le cycle jour-nuit. Seul l'humidité ambiante et les fines gouttelettes d'eau apparaissant
            sur les parois rocheuses leur indique que la fraiche nuit est tombée. Ce qui rythmera les matinées du groupe, c'est l'arrivée à l'aube d'une équipe de quatre centaures,
            toujours les mêmes. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}, le fils du chef, et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa}, la maître d'arme du village, s'occuperont de tenir en respect les prisonniers pendant
            que @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata}, le jeune forgeron, et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.V9ITbgWBBsUeixHA]{Kaihoroi}, le serviable, s'occuperont de remplacer les torches éteintes, vider les bacs de
            toilettes sèches, vérifier que tout est à sa place et ramener des cagettes de fruits et légumes lorsque les produits frais manqueront. Cette «inspection» dure pas plus de 10
            minutes mais il est possible de remarquer la tension qui agite @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} et la curiosité du
            jeune @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata} pour les intrus. Ce dernier a toujours un coup d'œil sur les agissements des
            PJs lorsqu'ils parlent ou qu'ils font des gestes. Ses sourires et son regard interrogatif se repèrent autant qu'un ogre au milieu d'un village elfique. Durant ces jours, les
            centaures fournissent aux prisonniers de quoi manger correctement, des vêtements propres (cousus rien que pour eux, quel honneur), des soins si nécessaire et d'autres choses
            s'ils arrivent à décrire leurs besoins aux villageois.
          </p>
          <p class="paragraphe">
            Après cette visite matinale, les captifs entendront des discutions de l'autre côté de la porte et ils percevront la mise en marche d'une machine bruyante et vibrante.
          </p>
          <p class="paragraphe">
            Si, sans ordre spécifique, les PJs se mettent à faire du travail (concassage de roches, trie de métaux, minage de la paroi, forge d'objets ou tout autre artisanat),
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} inspectera les indices laissés par le groupe et pourra envoyer des signes de
            reconnaissance si elle considère le travail bien fait (un hochement de tête, un petit sourire, une inspection détaillée de l'objet fabriqué…).
          </p>
          <p class="paragraphe">Cette routine dure au minimum cinq jours avant le premier événement. Ca devrait laisser aux Joueurs le temps de mettre en place une stratégie.</p>
          <p class="paragraphe">
            Essayeront-ils de sortir discrètement avec les outils de crochetage qu'ils ont forgé ? Créeront-ils des objets pour les centaures en cadeau ? Dessineront-ils pour tenter de se
            faire comprendre ? Mettront-ils en place une embuscade pour ligoter l'équipe de quatre centaures ?
          </p>
          <p class="paragraphe">En évitant que cette période ne prenne 100h de jeu, laissez-les élaborer un plan et prendre le pouls de leur situation un minimum.</p>
          <hr />

          <h2>Les événements pour briser la glace</h2>
          <h3>Du travail et des efforts</h3>
          <p class="paragraphe">
            Au bout de 5 jours, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} essayent d'expliquer aux prisonniers qu'ils peuvent travailler dans les mines et ils
            leur montreront le tas de pierres à concasser pour récupérer des minerais dedans. Ils amèneront des bobines de fils emmêlées, un lot d'outils à nettoyer et affûter, des caisses
            de légumes et de fruits à éplucher et couper, des bacs de racines à émincer…
          </p>
          <p class="paragraphe">Si les captifs s'exécutent et se montrent volontaires, ils percevront des signes de respect et de gratitude.</p>

          <h3>Communication difficile</h3>
          <p class="paragraphe">
            Après une semaine dans les grottes, un midi, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} viennent pour «discuter» avec le groupe d'aventuriers. Ils commenceront pas
            observer le travail qu'ils ont fait pour le village. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} ira chercher un repas préparer
            dans les cuisines du village par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} et installera des assiettes sur les tables. Les
            centaures ne semblent pas tendus mais à leurs yeux ils ne savent pas vraiment ce qui va sortir de cette rencontre .En fonction de la réaction des PJs, la situation peut prendre
            beaucoup de directions différentes. Il faudra juger la confiance gagnée ou non par ce moment étrange pour les deux parties.
          </p>

          <h3>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}, la curieuse</h3>
          <p class="paragraphe">
            Le soir de cette rencontre, alors que la nuit est presque tombée, on toque à la porte. Si les prisonniers réagissent, ils découvrent un papier glissé en bas de la porte. Dessus
            on peut voir de multiples dessins bien réalisés. Ils représentent un couple de centaures, le premier ressemblant fortement à
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} tandis que le second ressemble à une des centaures qui ont accueilli le groupe à
            leur arrivée. En dessous est dessiné les visages de deux autres centaures puis en bas de la page le visage d'une jeune centaure avec un sourire.
          </p>
          <p class="paragraphe">
            Le dessin représente @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}, ses deux parents et ses deux grand-parents. C'est une bonne
            base pour commencer une communication dessinée avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}.
          </p>
          <p class="paragraphe">
            Lorsque les Personnages répondent, ils entendent derrière la porte des rires et des réactions d'étonnement ou de curiosité. Après quelques échanges de papiers, ils entendent
            une forte voix féminine qui crie de façon autoritaire : «@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}, ka nui tenei !» et ils
            percevront les bruits de sabots qui s'éloignent rapidement.
          </p>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} reviendra régulièrement jusqu'à la libération des intrus pour essayer de
            communiquer à l'aide de dessins d'objets ou de structures accompagnés des mots correspondant et en prononçant les mots derrière la porte, attendant qu'un ou plusieurs
            aventuriers répètent. Les PJs auront déjà quelques mots de vocabulaire dans leur besace.
          </p>

          <h3>Les relations s'améliorent</h3>
          <p class="paragraphe">
            Durant les 10 jours suivants, la méfiance des centaures va diminuer en même temps qu'ils constateront les efforts des prisonniers. Les centaures de l'équipe du matin
            commenceront à saluer les PJs en prononçant «Ata Pai», la main sur le torse. Ils féliciteront les travailleur avec des tapes dans le dos ou des signes de tête et apporteront
            quasiment tous les soirs des repas préparés dans les mines.
          </p>

          <p class="paragraphe">D'autres habitants viendront rencontrer les visiteurs inattendus et les regarderont travailler (certains proposeront même de les aider dans leur tâche).</p>

          <p class="paragraphe">
            Après 20 jours, durant lesquels les relations avec les centaures s'adoucissent, les aventuriers coopératifs sont invités, par
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa}, à sortir de leur prison et sont dirigés vers la place du village après avoir traversé
            la scierie.
          </p>

          <div class="description">
            <p class="paragraphe">
              Lorsque vous suivez les deux grands centaures qui ouvrent la porte de votre prison, vous arrivez dans une grande salle remplie de planches de bois rangée, d'outils, de tables
              de travail et de copeaux de bois. Sur votre gauche vous apercevez rapidement une rampe qui monte en colimaçon vers un étage et au fond de la grande pièce une immense machine
              qui débite du bois venant d'une ouverture maçonnée dans le mur. La lumière du jour illumine la machinerie complexe présente dans la pièce.
            </p>
            <p class="paragraphe">
              On vous fait signe de sortir et vous arrivez dans une rue du village des centaures d'Arkanov. Tout autour de vous des hautes parois rocheuses entourent ce lieux isolé composé
              de plusieurs bâtiments plus ou moins grands faits de pierres, de bois ou de torchis. Derrière vous, vous sentez le nuage de gouttelettes d'eau qui provient des cascades qui
              tombent dans un joli lac de montagnes et votre regard est attiré par pleins de détails étranges que ce soir le styles des maisons, la taille des portes, les courroies et
              roulements fixés sur certaines façades ou encore le nombre d'habitants qui s'arrêtent au loin pour vous observer avant de reprendre leurs occupations.
            </p>

            <p class="paragraphe">
              On vous amène vers un espace dégagé entre plusieurs grands bâtiments avec, en son centre, un bassin d'où sort un lampadaire grandiose. Des plateaux couverts de nourriture
              sont positionnés sur la margelle du bassin et, avec un geste élégant et un sourire complice
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} vous invite à vous installer sur le rebord pour manger alors qu'elle s'allonge au
              sol après avoir attraper un bol fumant.
            </p>
          </div>
          <p class="paragraphe">
            Quelques curieux viendront saluer discrètement les PJs pendant le repas mais, à part si les PJs sont insistants, le moment sera plutôt silencieux. Les différences de coutumes
            entre les centaures et les Héros d'Ispier amèneront quelques ricanements et sourires. Ces «offenses» et «entorses» aux traditions des centaures apportent quelques situations
            cocasses ou rigolotes (par exemple, il est interdit de siffler pendant un repas, le plus vieux commence à manger, après un éternuement il faut claquer des doigts deux fois, il
            convient de se mouiller le front avant de rentrer dans l'eau du lac pour se laver ou se baigner…).
          </p>
          <div class="description">
            <p class="paragraphe">
              A la fin du repas, vous voyez trois centaures très musclés qui s'approchent de la place principal. Ils semblent fatigué et particulièrement en colère. Ils se dirigent d'un
              trot décidé dans votre direction. Les deux plus jeunes sont équipés d'un arc et d'un carquois et ils tiennent chacun le corps sans vie d'un animal qui ressemble à un petit
              grognard sur l'épaule.
            </p>
            <p class="paragraphe">
              Le centaure plus âgé vous jette un regard ténébreux et commence à hurler sur @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti},
              le brusquant et le poussant. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} garde la tête haute mais il est lourdement
              bousculé par ce centaure particulièrement puissant et agressif. A de nombreuses reprises, vous êtes pointés du doigt. Alors que
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} s'interpose entre
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} et son agresseur, une magnifique centaure à la chevelure épaisse sort d'un
              bâtiment proche et vous invite à la rejoindre. Elle montre son torse en disant «@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}»et
              elle ressemble à l'un des premiers portrait dessiné par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}.
            </p>
            <p class="paragraphe">
              Elle vous dirige avec gentillesse vers les grottes de votre maison de fortune. Elle vous laisse rentrer et ferme la porte à clef derrière vous avec un sourire gêné et un
              geste se voulant rassurant.
            </p>
          </div>

          <h2>Visite d'une partie du village</h2>
          <div class="description">
            <p class="paragraphe">
              Durant les cinq jours suivants, tous les midi, après un repas sur la place principale,
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}, la femelle centaure qui vous a ramené dans la grotte vous fait visiter certains
              bâtiments du village. Elle vous montre pendant une heure ou deux certains lieux et ce qui s'y passe. Elle commence les deux premiers jours, par la forêt intérieure, le jardin
              potager, la petite parcelle de champs, le verger et la fosse de compostage. Les deux jours suivants, elle vous montre le grand bâtiment servant à préparer les fruits,
              légumes, graines, racines, feuilles et autres denrées alimentaires.
            </p>
            <p class="paragraphe">
              Le troisième jour, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} est accompagnée par, sa fille, une jeune centaure dont vous
              reconnaissez la voix et le visage. Il s'agit de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}, la dessinatrice, qui vous fait
              visiter l'école du village avec un grand sourire et une excitation à peine masquée. A la fin de la visite, elle vous invite à vous installer sur des chaises qui semblent
              avoir été fabriquées récemment et vous voyez une dizaine de jeunes centaures mâles et femelles qui entrent dans la pièce suivis d'un magnifique centaure blond et à la posture
              assuré. Les enfants sont tous obnubilés par votre présence jusqu'au moment où @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako}, le
              professeur principal du village donne trois coup de sabot sur le sol de la classe, obtenant d'un coup le silence et le calme.
            </p>
            <p class="paragraphe">
              Vous passez l'après-midi a apprendre les bases du langage des centaures et à la fin de la journée,
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako} et
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} vous amène vers un bâtiment dans le renfoncement au Sud-Est du village. En
              ouvrant la porte vous découvrez une grande pièce aménagée avec un lit pour chacun de vous. Les matelas et les draps semblent confortables, une petite table de chevet avec une
              jolie bougie installée sur son bougeoir en métal et un petit coffre au pied de chaque lit complète le tableau. Des chaises entourent une table ronde où est posé un jeu de
              grandes serviettes et une partie de votre équipement (les bijoux, les vêtements, les dagues avec leurs étuis, les objets utilitaires…)
            </p>
            <p class="paragraphe">
              @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}, toute excitée, vous invite à prendre vos marque dans votre nouvelle maison.
            </p>
          </div>

          <p class="paragraphe">
            Maintenant que les PJs sont installés dans une maison, qu'ils peuvent se balader dans les rues du village, accéder à certains bâtiments et lieux, l'Intermède peut être
            commencé.
          </p>
          <p class="paragraphe">
            Il se déroule en trois phases de confiance. Pour le moment, en Phase 1, les PJs ont accès qu'à certaines tâches et activités. Lorsqu'ils seront plus intégrés dans la communauté
            des centaures, ils pourront passer à la Phase 2 puis la Phase 3 qui leur donnera accès à tout le village et la majorité des activités.
          </p>
          <p class="paragraphe">
            Chaque lieux du village est décrit dans les pages suivantes. On y trouve les centaures qui y travaillent le plus fréquemment, les activités qu'on peut y faire, les
            particularités du lieux et les événements qui peuvent intervenir pour les Personnages qui décident d'y travailler.
          </p>
        </div>
