      content: |-
        <div class="journal-cof2ta-ru">
          <h1>Phase 3 : Intégration</h1>
          <p class="paragraphe">
            Après deux ou trois mois de vie dans le village, tous les Personnages ou seulement une partie feront maintenant partie du village des centaures d'Arkanov. Après beaucoup
            d'efforts, d'incompréhension et d'événements, ils se mêlent aux habitants et entretiennent des relations amicales avec certaines familles de centaures.
          </p>
          <p class="paragraphe">
            Assez naturellement ou après un événement marquant pour la communauté, les PJs se voient confier des tâches avec beaucoup plus de responsabilités. Les aventuriers ont bien sûr
            déjà visité les bâtiments du village pour prévenir un ou une centaure, récupérer un outils ou un produit ou, simplement, par curiosité mais ils n'avaient pas l'autorisation d'y
            travailler ou de rester seuls dans les bâtiments décrits ci-après.
          </p>
          <p class="paragraphe">Certains PJs seront même autorisés à partager des parties de chasse, à partir chercher des plantes ou à bûcheronner au delà de l'enceinte du village.</p>
          <p class="paragraphe">
            Lors de la Phase 3, les PJs vont aussi découvrir des objets magiques importants pour le village. Que ce soit l'Orbe Élementaire, l'Alambic et certains élixirs ou le Duo de
            Marteaux de Silence, il y a certains «secrets» que les Personnages n'ont pas encore découvert.
          </p>
          <p class="paragraphe">
            Les relations avec certains des centaures seront quasiment familiales après cette longue période passée en autarcie avec cette communauté. Il faudra mettre l'accent sur la
            fraternité entre les PJs et leurs amis centaures afin que les Personnages s'impliquent dans le bien-être et la protection du village.
          </p>
          <p class="paragraphe">
            Dans la mesure où aucun habitant ne connait l'existence de la salle secrète et de la Relique de l'Union, la découverte de la fresque dans la grotte de cérémonie intriguera
            certainement les Joueurs. S'ils font des recherches, ils trouveront, au bout d'un long moment de lecture, la danse traditionnelle nommée en langue centaure «Oublier pour
            Protéger». Il faudra plusieurs semaines d'analyse des gestes, du rythme et des chants ainsi que plusieurs répétitions pour exécuter la danse à la perfection et enfin ouvrir la
            porte de la Salle Secrète.
          </p>
          <p class="paragraphe">
            Entre temps, une nuit va bouleverser le village et les PJs. L'attaque nocturne des Atarangi Kino amènera
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} à demander aux aventuriers de retrouver le jeune
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.j3OVVzmkWhACNokh]{Te'Whakama}, kidnappé par les Ombres Blanches. Les PJs suivront les traces dans les
            montagnes et trouveront l'entrée de la cité malsaine des Elfes Exsangues.
          </p>
          <hr />

          <h1>Bâtiments accessibles :</h1>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.trlohrGGHM0pfu6p]{N : Bibliothèque - Études - Cloche}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.5wcCUOCIIg6eaYVd]{O : Apothicaire, médecine et herboriste}</h2>
          <h2>
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.vv6fVlGxk0YXLq8F]{P : Gestion de l'artisanat - Sculpture}
          </h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.IeiOoPvxliVcuC3Y]{Q : le Coeur d'Arkanov}</h2>
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.R7B6DpkXXJwt9CxG.JournalEntryPage.obLqAf9asfalqU1K]{R : Alambic}</h2>
