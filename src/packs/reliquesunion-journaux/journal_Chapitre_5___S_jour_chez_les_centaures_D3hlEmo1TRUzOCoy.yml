  - sort: 700000
    name: Activités d'intermède
    type: text
    _id: Y1qOqBl9uKLcMxUR
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>Apprentissages</h1>
          <p class="paragraphe">L'intermède permet aussi aux PJs de poursuivre leur entraînement ou apprendre sur des sujets diverses.</p>
          <h2>Récupération de Points de Vie</h2>
          <p class="paragraphe">
            Les PJs n'ont peut-être pas lancé le score maximum de Points de Vie à chaque passage de Niveau et ils pourront durant l'intermède «récupérer» les PV qu'ils n'ont pas reçu au
            moment du passage.
          </p>
          <p class="paragraphe">
            Pour récupérer 3 PV de son score maximum, le Personnage devra trouver un entraineur physique (entraînement martiale avec les Centaures les plus costauds, bûcheronnage, minage…)
            et passer 5 jours d'entraînement intensif ne permettant pas d'autres activités à part discuter et renforcer des relations sociales.
          </p>
          <p class="paragraphe">
            En fonction de la relation avec l'entraîneur et des événements spéciaux, il pourrait y avoir des conséquences sur le Personnage (cicatrice, bagarres, méfiance ou au contraire
            musculature développée, confiance/respect renforcée, aide de la part du ou des Centaures…).
          </p>
          <p class="paragraphe">
            Pour accélérer ce processus, un jet de @Test[car:for|diff:20|comp:Athlétisme] peut être demandé par le PJ au risque de passer 5 jours d'entraînement sans résultat en cas
            d'échec ou de récupérer 6PV maximum au lieu de 3PV.
          </p>
          <h2>Apprentissages divers</h2>
          <p class="paragraphe">Si le PJ souhaite étudier un sujet particulier pendant l'intermède, chaque MJ pourra trouver un moyen de récompenser se temps passer à étudier.</p>
          <p class="paragraphe">
            Par exemple, en donnant un bonus aux tests liés à cette compétence sur le sujet précis ou en lui donnant des informations au moment venu (le nom d'un seigneur, la présence
            d'une organisation secrète dans une ville…).
          </p>
          <p class="paragraphe">
            Pour accélérer le processus, un jet de @Test[car:int|diff:20|comp:Culture Générale] peut être demandé par le PJ. En cas d'échec le temps d'apprentissage n'a pas aidé le
            personnage à comprendre et en cas de réussite, l'apprentissage est fluide et clair permettant de doubler le bonus à la compétence ou de trouver des informations plus précises
            sur le sujet.
          </p>
          <h2>Faire des recherche sur un sort</h2>
          <p class="paragraphe">
            Le système de magie des Terres d'Arran n'étant pas le plus détaillé, le PJ qui possède une voie mystique pourra utiliser l'intermède pour développer une version alternative
            d'un sort qu'il peut lancer. Cela prend du temps et certaines ressources. Dans le Village d'Arkanov, tant que la confiance avec certains Centaures ne sera pas assez développée,
            le Personnage devra réaliser ses recherches seuls dans son coin sous l'œil intrigué de certains habitants. Par la suite, il pourra faire appel à l'aide et aux conseils des
            Centaures les plus compétents en magie.
          </p>
          <p class="paragraphe">
            Le joueur devra discuter avec le MJ de l'effet et des caractéristique du sort qu'il souhaite créer et c'est seulement avec l'accord du Maître des Jeu que le personnage trouvera
            cet alternative.
          </p>
          <p class="paragraphe">
            <em>Prenons l'exemple du sort Brumes au rang 1 de la Voie de la Magie Élémentaliste (LJ.136) :</em>
          </p>
          <p class="paragraphe">
            Le PJ créé un brouillard très dense jusqu'à une portée de 20 m sur une zone de 20 m de diamètre. Dans cette zone la visibilité est très réduite et équivalente à de la pénombre.
            Il n'est pas possible de voir par-delà le brouillard qui persiste pendant [5 + Mod.SAG] tours.
          </p>
          <p class="paragraphe">
            En partant de cette description, le joueur et le MJ pourrait se mettre d'accord pour modifier l'élément du sort et, du coup, ne plus créer un nuage de brouillard mais une zone
            glissante ou instable au sol. La portée, la taille de la zone et la durée n'est pas modifiée.
          </p>
          <p class="paragraphe">
            <em>Deuxième exemple avec le sort Prison Végétale au rang 2 de la Voie de la Forêt (LJ.135) :</em>
          </p>
          <p class="paragraphe">Ce sort permet de faire pousser rapidement la végétation pour entraver le mouvement des ennemis.</p>
          <p class="paragraphe">
            Après discussion, le joueur et le MJ se mettent d'accord sur une variante du sort Prison Végétale qui permet de faire pousser rapidement la végétation de la même manière que le
            sort de base mais pour créer des structures plus ou moins solides (une barricade qui solidifie une porte, une tente pour les protéger, un petit pont pour traverser une
            crevasse…). Au vu de la versatilité de cette variante, le MJ décide que le sort aura une portée de contact au lieu des 20 m de base et que la durée pour créer la structure sera
            réduite à [2+Mod.SAG] tours.
          </p>

          <p class="paragraphe">Il est aussi possible de modifier un sort en fusionnant deux capacités ensemble.</p>
          <p class="paragraphe">Imaginons la Voie de l'Envoûtement. Le Personnage connait les trois premiers rangs de la Voie (Injonction, Sommeil et Confusion).</p>
          <p class="paragraphe">En discutant avec le MJ, le personnage invente une alternative au sort Confusion en y incorporant des effets de sort Injonction :</p>
          <p class="paragraphe">
            En réussissant un test d'attaque magique opposée (portée : 20 m), le PJ désoriente sa cible pendant [3 + Mod.SAG] tours. Chaque tour, lancez 1d6 : de 1 à 4 la victime agit
            normalement ; de 5 à 6, c'est le Personnage qui choisi les actions de la victime avec les mêmes contraintes que le sort Injonction (action non dangereuse pour la victime). À
            chaque fin de tour, elle fait un test de SAG DD [10 + Mod.INT] pour mettre fin au sort.
          </p>
          <p class="paragraphe">A chaque MJ de décider quelles libertés il donne à leur joueur pour créer des alternatives à leur sort.</p>
          <p class="paragraphe">
            Pour accélérer le processus de création du sort, un test de @Test[car:int|diff:20|comp:Connaissances magiques] peut être demandé par le PJ. En cas d'échec, les caractéristiques
            du sort seront diminuées et en cas de réussite, le temps de recherche peut être réduit grandement ou les caractéristiques du sort peuvent être légèrement augmentées.
          </p>
          <h2>Faire de l'artisanat ou d'autres activités</h2>
          <p class="paragraphe">
            Les personnages qui ont des compétences en artisanat peuvent utiliser cet intermède pour réaliser des objets personnalisés pour eux, les Centaures ou le village tout entier.
          </p>
          <p class="paragraphe">La discussion se mettra en place entre le Personnage et le MJ.</p>
          <p class="paragraphe">
            Dans la mesure où les Personnages seront mis à contribution dans les différents lieux de fabrication du village, le PJ devra rajouté un élément supplémentaire correspondant à
            sa volonté.
          </p>
          <p class="paragraphe">
            Par exemple : «<span class="discussion">je fais des cordes à la corderie avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe}</span>» apporte rien de plus à ce qui est demandé aux Personnages. Par contre : «<span class="discussion">j'aime passer du temps à la corderie et j'aimerais fabriquer un objet spécifique pour tel ou tel Centaure ou un grand objet pour le village. Je compte y passer beaucoup de
              temps et m'investir de façon obsessionnelle</span>» permet de rajouter un bonus aux relations avec le village.
          </p>
          <p class="paragraphe">
            Au fur et à mesure de votre implication dans le village, chaque Personnage pourra aider dans des bâtiments plus complexes (alambic, pressoir, préparation des remèdes et
            élixirs, l'armurerie, la machinerie…).
          </p>
          <p class="paragraphe">
            Certains Centaures sont extrêmement doués pour «enchanter» des objets et, si la relation avec eux est assez élevée, il sera aussi possible d'améliorer votre équipement ou de
            créer quelques objets magiques personnalisés.
          </p>
          <p class="paragraphe">
            En fonction de l'artisanat entrepris, un test peut être demandé par le PJ pour accélérer le processus ou créer des objets de meilleur qualité ou avec des caractéristiques
            supplémentaires. La compétence demandée dépend de l'activité réalisée :
          </p>
          <ul>
            <li>
              <p class="paragraphe">@Test[car:agi|comp:Artisanat de précision] (bijoux, couture, poterie, sculpture…)</p>
            </li>
            <li>
              <p class="paragraphe">@Test[car:for|comp:Artisanat de force] (forge, menuiserie, bûcheronnage…)</p>
            </li>
            <li>
              <p class="paragraphe">
                @Test[car:int|comp:Artisanat de connaissances] et @Test[car:per|comp:Artisanat de «goût»] (cuisine, agriculture, préparation de remèdes, utilisation de l'alambic…)
              </p>
            </li>
            <li>
              <p class="paragraphe">@Test[car:int|comp:Artisanat «magique»] ou @Test[car:cha|comp:Artisanat «magique»] (forge de runes, machinerie, préparation à l'alambic…)</p>
            </li>
          </ul>

          <h2>Développer ses relations au sein du village</h2>
          <p class="paragraphe">
            Bien entendu, tout au long de ce «Temps Long» quelque soit vos activités, vous développerez les relations que vous entretenez avec le village et certains Centaures en
            particulier mais certains PJs peut vouloir développer plus en profondeur ou plus précisément leur relation avec les coutumes des Centaures ou avec un groupe de Centaures
            particulier. Tous les Personnages saisissent quelques mots et phrases pour se faire comprendre et comprendre les habitants mais il est possible d'apprendre la langue de façon
            plus subtile.
          </p>

          <p class="paragraphe">Les tests relatives au développement des relations avec les Centaures seront :</p>
          <ul>
            <li>
              <p class="paragraphe">@Test[car:cha|comp:Psychologie - Diplomacie] pour comprendre s'intéresser, mettre en place une relation de confiance.</p>
            </li>
            <li>
              <p class="paragraphe">
                @Test[car:cha|comp:Manipulation - Filouterie - Bagou - Mensonge] pour créer un personnage «manipulateur» (une personnalité fantasque qui impressionne les Centaure par ses
                histoires ou ses mimiques rigolotes, par exemple. Une personnalité mythomane pour arriver à ses fins….) ou utiliser les connaissances des coutumes, rituels et routines du
                village pour feindre des émotions ou des travaux dans le village.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                @Test[car:cha|comp:Autorité - Intimidation] pour développer une relation autour d'une personnalité forte et dirigiste, pleine d'aplomb et d'une légère dose d'intimidation
                et d'autorité.
              </p>
            </li>
          </ul>

          <p class="paragraphe">
            Chaque méthode ne plaira pas à certains Centaure mais marchera parfaitement avec d'autres. A chaque PJ de savoir où il met le curseur entre les méthodes.
          </p>
        </div>
