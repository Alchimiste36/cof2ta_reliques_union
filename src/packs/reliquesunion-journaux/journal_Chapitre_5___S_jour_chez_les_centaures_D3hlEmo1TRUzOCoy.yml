  - sort: 800000
    name: Personnalités d'Arkanov
    type: text
    _id: P8neO9M6nd4MXBZK
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-cof2ta-ru">
          <h1>Famille de Kiliko et Tumuaki</h1>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/poauau.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0V16m2pDnY3utxtw]{Poauau}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 87 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Hautain, renfrogné et perte de mémoire</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Que des petites tâches</p>
            </li>
          </ul>
          <p class="paragraphe">
            Le père de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} l'actuel chef du village. Il a un mauvais caractère et est très imbu de
            sa position. En plus de perdre la mémoire, il n'aime pas du tout ces étrangers accueillis dans le village. Il est toujours assez fermé et souvent en désaccord avec les choses
            qu'on lui dit. Rien n'est assez bien pour lui et ce tempérament renfrogné est dur à vivre pour son fils.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini}, sa fille, arrive encore a lui tirer un sourire de temps en temps mais c'est bien
            la seule qui semble réussir à lui tirer un mot gentil ou un compliment.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kiliko.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 66 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Juste, dur et tiraillé entre les deux clans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Prise de décision - aide à tous les postes du village</p>
            </li>
          </ul>
          <p class="paragraphe">
            Chef du village et époux de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki}, il prend sa responsabilité très au sérieux. Toujours
            balancé entre l'envie de faire plaisir et le risque prit par la communauté face aux PJs. Il est dure mais juste. Il ne pardonne rien en cas d'erreur mais porte une grande
            attention aux efforts qui sont fait. Son couple avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} est un vrai soutien pour lui.
            Il sait qu'elle partage ses valeurs et ses responsabilités. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} aime profondément tous
            ses enfants même s'il ne veut pas les privilégier face aux autres habitants. A première vue, on pourrait le penser froid et distant à cause de cela. Son rôle de chef est
            important pour lui et combien même il ne peut plus passer ses journées à s'entraîner, il reste un très talentueux combattant bien qu'un petit peu rouillé. Depuis les premières
            attaques des Ombres Blanches, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} est tiraillé entre poursuivre ces assassins
            kidnappeurs et les faire payer pour leurs crimes et continuer de protéger le village en conservant la bulle de secret autour d'Arkanov.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} sont les seul à connaitre l'existence d'une pièce cachée dans la grotte de
            cérémonie mais ils ignorent la présence de la Ceinture de l'Union.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/tumuaki.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 63 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Sombre, colérique et manipulatrice</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> responsable de la sécurité du village et le bien-être des habitants</p>
            </li>
          </ul>
          <p class="paragraphe">
            Elle partage avec son conjoint, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko}, la responsabilité du bien-être et de la sécurité
            du village. C'est une centaure très sombre et colérique et elle peut se montrer manipulatrice lorsqu'elle se sent menacée. La plupart des villageois la perçoit sévère et
            intransigeante comme son grand frère @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha}. Elle observe tout le monde et s'occupe de tout.
            Elle aime fortement son conjoint et elle le soutiendra à chaque décision mais avant cela elle essayera de le convaincre et elle arrive souvent à lui faire durcir sa position.
            Les traditions sont importantes ou le décorum du village mais @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} sent que l'avenir
            doit changer et que les centaures vont devoir prendre leur place légitime dans la région. Elle est particulièrement déçu du choix de son fils aîné,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}, de succomber à sa passion pour sa cousine,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha}, lui qui avait un avenir tout tracé à la tête du village.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} continue de la pousser vers cette responsabilité mais elle a perdu foi en lui.
            Elle s'est enfermée depuis quelques années dans son rôle et elle se rapproche de plus en plus des idées de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} après chaque attaque des Ombres Blanches et après chaque tension entre les
            émancipateurs et les conservateurs du village.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/karekau.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.dEFsexceQ4AhgJf1]{Karekau}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 98 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Respecté, malicieux brave les interdits et drogué</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Observe les habitants, quelques tâche avec sa famille proche</p>
            </li>
          </ul>
          <p class="paragraphe">
            Le doyen du village et père de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki}, malgré son grand âge c'est un centaure respecté et
            il le sait. Il joue de sa position pour braver les interdit avec une certaine malice. Au premiers abords on dirait qu'il est très conservateur mais pourra prendre le parti des
            PJs si ça lui permet d'embêter le chef du village. Il a tendance à passer du temps à observer les membres de sa famille et en particulier
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} pour lui répéter à longueur de journée qu'il aurait du être le chef pour que le
            village soit mieux géré et sa fille, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RThMzXURSyG4AjsL]{Kite'Tihe} pour grogner avec elle sur l'avenir du
            village et sur sa maladie.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/miihini.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 63 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> ouverte d'esprit, gourmande, grande gueule et joyeuse</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Experte des machines du village et bonne cuisinière</p>
            </li>
          </ul>
          <p class="paragraphe">
            Sœur du chef, cette femelle centaure a toujours été célibataire et elle a un sacré caractère. Sa force de caractère lui permet de confronter son grand frère quand il est trop
            sévère ou qu'il manque à ses devoirs. Elle est très ouverte d'esprit et un vrai modèle pour
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}. Elle est experte de toutes les machines du village et elle passe beaucoup de temps
            avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.dEFsexceQ4AhgJf1]{Karekau}. Bonne cuisinière elle aime les personnes qui ont un bon coup de fourchette.
            Lorsque l'on arrive à passer sa méfiance, elle est très rigolote.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kitetihe.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RThMzXURSyG4AjsL]{Kite'Tihe}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 79 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Méchante, malade, harceleuse et perte de mémoire</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Atelier de fabrication de bougies</p>
            </li>
          </ul>
          <p class="paragraphe">
            Grande sœur de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki}, cette femme est d'une méchanceté profonde. Veuve depuis plusieurs
            années, elle bougonne, rage et grogne tout le temps. Une maladie l'empêche de faire le moindre effort à cause de quintes de toux et elle passe ses journées à invectiver les
            habitants. Le fait que sa seule fille décide de choisir comme conjoint @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}, le
            premier né du chef, son propre cousin, est un vrai poison pour elle. En plus de cette déception profonde, elle commence à perdre la mémoire et elle se répétera souvent et
            redécouvrira les PJs à chaque rencontre.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/wakaweti.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 43 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Dur, renfrogné, obtus et clair dans ses décisions</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Protection du village, responsable de l'armurerie et responsable de la cloche</p>
            </li>
          </ul>
          <p class="paragraphe">
            Le premier né de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} a le caractère pour prendre la succession de son père à la tête du
            village, dur, tranchant lors des conflits et obtus. Cette avenir est bousculé par son amour pour
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha}, sa cousine directe. La loi leur interdisant de se reproduire,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} choisi de protéger le village par sa grande maitrise des armes et des danses de
            combat. C'est un combattant impressionnant avec un mental serré autour des traditions, rites et dogmes de la communauté. Il prend la défense de son père à chaque fois que la
            famille de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} l'attaque sur les décisions qui sont prises ou sur sa vision sur le
            village. Il est le responsable de l'armurerie et s'occupe en priorité de frapper la cloche du village pour créer la bulle de silence. Il aime de tout son coeur ses parents mais
            est de plus en plus en conflit avec les pensées de sa mère.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/aroha.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 43 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> calme, introvertie, dur au mal et focalisée sur son travail</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> combattante et experte des machines du village</p>
            </li>
          </ul>
          <p class="paragraphe">
            Conjointe de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}, son cousin, il leur ai interdit de se reproduire. Ca ne les empêche
            pas de vivre un vrai amour depuis aussi longtemps qu'elle s'en souvient. Elle soutient son conjoint et elle est aussi compétente que lui avec une lance, un épieu ou un arc
            entre les mains. Tous les matin dans la grotte de prière, ils se retrouvent tous les deux pour une séance de prière puis d'un entraînement intensif aux danse de combat et à la
            maitrise des armes. Calme et introvertie, elle s'occupe des machineries complexes au niveau de la cascade ou dans les différents bâtiments du village.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kamura.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 41 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> fort charisme, exigeante, travailleuse et rigoureuse</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> responsable des besoins artisanaux du village, bonne sculptrice, menuisière, forgeronne</p>
            </li>
          </ul>
          <p class="paragraphe">
            Cette femelle centaure rigoureuse, exigeante et doté d'un charisme fort est persuadée que son avenir est de prendre la place du chef. Elle décide de se mettre en couple avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.NOuO9E41cHVJuhh8]{Iti}, le premier né d'une famille influente du village. Elle a de nombreuses qualités et
            s'occupe en particulier des besoin en artisanat et du suivi des fabrications. Bonne sculptrice, menuisière, forgeronne, elle aime le travail bien fait. Même si elle se montrera
            dure avec les PJs ceux qui travailleront consciencieusement auront son attention. Son rôle et son travail lui prenant toutes ces journées elle n'a pas beaucoup de temps à
            consacrer à son conjoint et malgré de nombreuses années de couple et leur quarantaine passée, ils n'ont pas encore d'enfant.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaiwhakairo.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.fTbuMNahY2sBxbQd]{Kaiwhakairo}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 23 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> aimant, serviable, optimiste et tendre</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> atelier de sculpture</p>
            </li>
          </ul>
          <p class="paragraphe">
            Ce centaure mâle aime particulièrement sa famille, s'entraîner avec son grand frère
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti} malgré leurs caractères diamétralement opposés et rendre service à la communauté.
            Il n'a aucune envie de devenir chef du village et il est un soutien discret de sa sœur
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura}. En couple avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}, ils partagent leur optimisme et leur envie de rendre leur prochain heureux. Père de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} et de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro}, il vit une existence calme dans le travail du bois et surtout dans l'atelier de
            sculpture où il peut passer des nuits entières, rejoint par sa conjointe ou ses enfants pour de longues discussions ou l'invention d'histoire sur le monde extérieur. Il a
            beaucoup d'intérêt pour les PJs mais garde ses distances pour ne pas embarrasser son père.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kara.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 30 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> très respectée, à l'écoute, calme et fortes convictions</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Soigneuse, psychologue, préparatrice de médicaments, responsable de l'Orbe Élémentaire</p>
            </li>
          </ul>
          <p class="paragraphe">
            La mère de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} est une femelle centaure très respectée au village. Sa connaissance des
            plantes, breuvages, potions et baumes en font une femme précieuse. Sa mère lui a apprit les recettes et les secrets de fabrication et d'utilisation de l'immense alambic du
            village. Soigneuse et psychologue à son insu, elle connait très bien tous les petits tracas et les grands secrets des habitants. Elle sait trouver les mots pour réconforter les
            peines de coeur et elle saura amputer un bras sans broncher. Elle tient son conjoint
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.fTbuMNahY2sBxbQd]{Kaiwhakairo} et ses enfants d'un main de maître et elle peut élever la voix de façon ferme
            lors des réunions de village. Les PJs apprendront que sa mère à été tuée par les Ombres Blanches alors que son père a été kidnappé lors de la même attaque, il y a environ 6
            mois. Véritable modèle pour @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} a plus de mal avec son fils
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro}.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/vaiata.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 18 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> curieuse, espiègle, dispersée dans le travail, passionnée de tout</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> aide dans plusieurs tâches du village, s'occupe des jeunes centaures</p>
            </li>
          </ul>
          <p class="paragraphe">
            la flamme de la jeunesse incarnée dans cette jeune centaure femelle à la curiosité maladive et à l'espièglerie dans chaque fibre de son corps. Toujours souriante, ses yeux
            trahissent souvent son manque d'attention. Après avoir trépigner sur les bancs de l'école en début de journée, elle passe son temps à aider qui le souhaite mais surtout pas
            trop longtemps. Douée dans beaucoup de tâches du Village, elle ne sera peut-être jamais assez assidue pour devenir experte d'un sujet ou d'un artisanat. En fin de journée, elle
            est souvent avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EeHmNrec4W6ZBwu5]{Peepi} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.9HdmSAxScK9Twvch]{Taiohi}, un frère et une sœur de 7 et 6 ans a les faire marrer, faire des pirouettes ou
            leur raconter des histoires d'aventures, de voyages et de dragons. Elle passe aussi beaucoup de temps avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.gWWGE6tcGj7MOU2j]{Miihini} a se raconter des ragots et pur l'aider dans l'entretien des machines du Village.
            Les seuls moments où elle peut être triste, c'est lorsqu'elle constate la distance qui commence à les séparer avec son petit frère,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro}. Elle n'arrive pas a comprendre cette colère bloquée de son frère et son sérieux
            depuis quelques temps. L'arrivée des Aventuriers étrangers sera une bénédiction pour
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} : de la nouveauté, des histoires, des découvertes et la perspective d'en apprendre
            plus sur le vaste monde extérieur. Elle bravera tous les interdits pour leur parler et les aider.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/mataro.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 16 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> coléreux, introverti, renfrogné, mauvaise humeur, passionné de la forge</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> forge, surtout au RdC pour façonner les pièces</p>
            </li>
          </ul>
          <p class="paragraphe">
            Autrefois un jeune garçon heureux et souriant, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro} a changé ses sourires pour une
            froide colère, depuis quelques mois. Il est renfermé et introverti malgré sa passion pour la forge. Il passe beaucoup de son temps à jouer du marteau et façonner le métal
            rougeoyant. Il a un certain talent mais ne semble pas prendre de plaisir malgré les encouragements. Ses explications à sa mère ou son père tournent autour de la place du chef
            qui devrait être confiée à son père selon la tradition. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} sait qu'une souffrance plus
            profonde est cachée mais elle n'arrive pas à la déceler et ce genre de discussions apportent plus de colère, de cris et de disputes. Si un PJ partage la forge avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro} et commence à se lier d'amitié avec lui, il pourra apprendre qu'il était présent
            quand sa grand-père maternelle s'est faite massacrée devant ses yeux et qu'en plus du traumatisme, il est en colère contre son inaction et la peur qui l'a paralysée. Il s'en
            veut, il est triste, il dort mal et surtout il est en colère car personne ne veut faire payer à ces Ombres Blanches.
          </p>
          <hr />

          <h1>Famille de Kaha</h1>
          <p class="paragraphe">
            Cette famille est la seconde la plus influente du village. Tenue d'une main de fer par l'aîné de la famille
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha}, le frère de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} et de ses deux fils,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko}. Beaucoup de conflits se développent entre cette branche de la famille et la
            nouvelle génération. La plupart des conflits du village d'Arkanov viennent des idées expansionnistes théorisées par
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} et une partie de cette famille.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaha.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 78 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> intransigeant, expansionniste, déterminé et méfiant</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Bûcheronnage et chasse à l'extérieur</p>
            </li>
          </ul>
          <p class="paragraphe">
            Malgré son âge, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} est une force de la nature tant par son physique, son expertise du
            combat et son caractère intransigeant. Veuf depuis plus de 40 ans, à la naissance de son dernier fils, il a une place importante à Arkanov et ne se prive pas de confronter le
            chef @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko} lorsqu'il désapprouve une décision. Pour lui le village doit se développer,
            s'agrandir et revendiquer les parcelles qui entourent l'entrée. Les centaures sont bien assez forts et déterminés pour s'émanciper de cette prison. Il enrage de la décision du
            chef de ne pas partir chercher les Ombres Blanches pour leur faire payer leurs attaques et même s'il se méfie énormément des étrangers, pour lui les montagnes et tout ce
            qu'elle contiennent appartiennent aux centaures et à eux seuls. Ces deux fils les plus jeunes,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko}, ont les mêmes idées d'expansion alors que son aîné,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako}, partage plus la position du chef pour le plus grand désespoir de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha}. A 78 ans,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} est un guerrier expérimenté, peut-être le seul qui pourrait battre
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaiako.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 49 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> fier de sa famille, pédagogue, gentil et attentif</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Professeur du village</p>
            </li>
          </ul>
          <p class="paragraphe">
            Professeur principal du village, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako} est un centaure mâle qui passe la plupart de son
            temps avec sa conjointe @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} et les parents de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}. Il n'a presque plus aucun rapport avec son père
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} ni avec ses deux frères et leurs idées de conquêtes. Moqué par sa famille, sa
            conjointe @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} sait calmer ses beaux-frères à coup de grandes claques dans leurs tronches
            lors des entraînements aux armes ou aux danses de combats. La plus grande fierté de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako}
            est ses enfants, deux jeunes femelles centaures à la passion aussi tranchante que leur mère et un jeune centaure mâle d'à peine 17 ans qui a le cerveau rempli d'idées,
            d'inventions et de connaissances.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/toa.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 47 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> rigoureuse et précise, combative, inquiète par les Atarangi Kino</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> maîtresse d'arme du village</p>
            </li>
          </ul>
          <p class="paragraphe">
            La conjointe de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako} est la maître d'arme du village. Elle connait la rigueur et la
            précision de chaque danse de combat des centaures. Elle possède une technique parfaite même si sa puissance ne pourrait rivaliser avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.btvS9qEFveBlGv7J]{Aroha} ou
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.tP0ihTOJIthKq66b]{Wakaweti}. Elle profite de son rôle pour mettre quelques branlées à ses beaux-frères quand
            ils dépassent les bornes. Elle passe beaucoup de temps avec ses enfants et partage l'amour que porte son fils,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.j3OVVzmkWhACNokh]{Te'Whakama} pour
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}. Depuis les attaques des Ombres Blanches, elle cherche un moyen de les stopper et
            on se rend vite compte que son impuissance face à cette menace la ronge de plus en plus.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/teina.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 27 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> charmeuse et manipulatrice, raisonnable et bonne élève</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> multiples tâche au village et chasse de temps en temps</p>
            </li>
          </ul>
          <p class="paragraphe">
            Bien qu'elle soit certainement la meilleure amie de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina} ne partage pas vraiment sa fougue. Beaucoup plus raisonnable, on peut dire qu'elle
            porte sur ses épaules le rôle de grande sœur pour la naïve @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} et son renfermé petit
            frère @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.j3OVVzmkWhACNokh]{Te'Whakama}. Sa mère est un vrai modèle pour elle et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Zzi0NCKrrHWdSfMy]{Teina} voudrait pouvoir être aussi forte et stratège qu'elle. Ces derniers temps, elle
            ressent la même peur et colère que @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa} face aux Ombres Blanches. Elle comprend bien que sa
            force ne viendra jamais de sa maitrise des danses de combat comme sa mère mais avec les années qui passent elle se rend compte que ses yeux, son caractère et une bonne touche
            de manipulation permettaient d'atteindre un objectif plus facilement qu'un conflit physique. Elle en use beaucoup sur ses deux oncles, leur donnant un discours qu'ils veulent
            entendre tout en leur instillant quelques idées. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} l'amènent depuis un an à la chasse avec eux, lui confient des secrets et semblent
            l'apprécier au delà de leur détestation pour ses parents. C'est peut-être la seule villageoise qui peut faire entendre raison à
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} lorsqu'elle se met en tête une nouvelle folie. Elle pousse discrètement son frère
            à, enfin, déclarer officiellement sa flamme pour son amie.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/harikoa.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 24 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> optimiste, joyeuse, patiente et rigoureuse</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> alambic, invention de nouvelles formules</p>
            </li>
          </ul>
          <p class="paragraphe">
            Cette jeune femelle Centaure est, à l'image de sa famille, optimiste et plutôt joyeuse au quotidien. Elle n'a jamais vraiment eu beaucoup d'amie et quand elle était petite elle
            essayait de traîner avec sa grande sœur. A 18 ans, elle passa une journée avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu}
            pour l'aider à gérer les préparations de l'Alambic. La jeune @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} est tombée amoureuse
            de cette machine et de la transformation qu'elle permet. L'étude des plantes et de leurs extraits, la distillation des huiles, la fermentation des céréales, le dosage pour
            rendre délicieux une bière râpeuse… autant de chose qu'elle étudie, expérimente et teste presque tous les jours aux côtés de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu}. Elle doit faire d'autres tâches pour la communauté mais à chaque instant ses
            pensées sont tourner vers la prochaine recette qu'elle va modifier ou inventer. L'une des huiles essentielles porte son nom
            l'@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa}. Elle a découvert, avec l'aide et le soutien de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} une huile qui permet de détendre tous les muscles du corps après inhalation pendant
            plusieurs minutes et accentue l'agilité et la précision de consommateur. Très appréciée des travailleurs et des combattants, cette huile, extraite d'une racine et mélangée à
            des spores de champignons, est assez rare.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/tewhakama.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.j3OVVzmkWhACNokh]{Te'Whakama}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 17 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> timide, introverti, naïf et focalisé sur les livre</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> passionné par les traditions, rites et cérémonies, excellent danseur et chanteur</p>
            </li>
          </ul>
          <p class="paragraphe">
            Cet adolescent assez timide a pour passion les rites et rituels des centaures. A chaque cérémonie, danse, union ou décès, il participer aux préparations, aux discours et au
            respect des traditions sacrées de son peuple. Il y voit de la beauté et une certaine harmonie. Plongé dans les livre de la bibliothèque, il a remis en place une ancienne
            tradition pour célébrer la perfection de leur village : la Danse de l'Union. Une fois tous les deux ans, les meilleurs danseurs de combat prépare une cérémonie sur la place du
            village mélangeant une grande chorégraphie guerrière et synchronisée. Grâce à ses recherches il a pu refaire vivre ce rituel pour la première fois l'année dernière. Il est
            amoureux de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} depuis aussi longtemps qu'il s'en souvient et même s'il a un peu de mal
            à suivre son rythme, à chaque fois qu'elle est là, le jeune @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.j3OVVzmkWhACNokh]{Te'Whakama} s'illumine.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/tetipu.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 47 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Combatif, revendicateur, sévère, un peu paranoïaque et colérique</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Bûcheronnage et chasse</p>
            </li>
          </ul>
          <p class="paragraphe">
            Le premier fils de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} est très similaire à son père autant par leur physique que par
            leur état d'esprit. Combatifs, revendicateurs, sévères et colériques, les deux font la paire. Dans la lignée de son père et sous l'influence de sa tante
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RThMzXURSyG4AjsL]{Kite'Tihe}, il voit chaque conflit ou problème comme une offense contre sa famille. Il
            perçoit les regards et les sourires autour de lui comme des moqueries orchestrées par le chef
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko}. La chose qui irrite le plus
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} c'est de voir ses deux petits enfants,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.9HdmSAxScK9Twvch]{Taiohi} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EeHmNrec4W6ZBwu5]{Peepi}, jouer avec la désinvolte et irresponsable
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}. Que son gendre
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.V9ITbgWBBsUeixHA]{Kaihoroi} soit un faible passe encore mais que sa propre fille,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga}, partage cette joie, le rend fou de colère.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et son frère
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} passent la plupart de leur temps au bûcheronnage à l'intérieur ou à l'extérieur du
            Village pouvant concentrer leur colère et leur rage sur les troncs. Il leur arrive fréquemment de partir chasser dans les montagnes environnantes malgré l'interdiction de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko}.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} est certainement le centaure le plus désagréable et agressif du village envers les
            intrus. Il est aussi violent et méprisant avec sa conjointe @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe}. Pour Té'Tipu, il faut
            un chef fort et intransigeant suivi par un village qui obéi sans discuter. Il n'acceptera jamais que son père,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha}, ne soit pas le chef d'Arkanov.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaihoko.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 42 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> puissant, intransigeant, mauvaise foi et grognon</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Bûcheronnage et chasse</p>
            </li>
          </ul>
          <p class="paragraphe">
            Il est rare de voir @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} sans son grand frère
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu}. Il est comme son ombre et il partage une grande partie de ses idées. Il est en
            couple avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri}, une centaure lunatique et qui ne lui pardonne aucune erreur.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri} est particulièrement acerbe depuis que leur deux enfants, Anake et Tumanako ont
            été kidnappés par les Atarangi Kino. Elle reproche sans cesse à @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} sa faiblesse et sa
            soumission à son frère @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu}.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko}, intérieurement, n'est pas aussi intransigeant que son frère et son père mais le
            moindre signe de faiblesse lui revient au visage avec moult réprimandes et moqueries. Au fil des années, depuis qu'il a découvert le comportement de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe}, il essaye de se détacher de ce côté de sa famille. Il discute régulièrement avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.G9TJ6YEFAnSIbNAM]{Toa}, partage des moments avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura} et montre des marques d'affection pour
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga} pour apaiser sa colère face à son père.
          </p>
          <p class="paragraphe">
            Si les PJs révèlent au village les agressions de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} sur
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} en profitera pour témoigner et chercher le pardon auprès des habitants.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaimoe.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 51 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> soumise, discrète, traumatisée</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> tisseranderie et corderie</p>
            </li>
          </ul>
          <p class="paragraphe">
            Cette femelle centaure très discrète subit la violence de son conjoint, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} mais elle
            ne pourra jamais lui dire ou s'opposer à lui. Craignant ces colères, elle reste soumise à son conjoint malgré les coups qu'elle peut recevoir régulièrement. Elle passe beaucoup
            de temps seule dans le long couloir de la tisseranderie. Elle ne parle presque à personne et préfère passer ses journées dans des endroits où on ne risque pas de la rencontrer.
            Devant le rouet de filage, avec le bruit et les vibrations de la machinerie, il lui est possible de laisser ses larmes couler.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}, soigneuse et psychologue du village a deviné par ses blessures et derrière ses
            paroles la violence régulière de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} mais malheureusement elle ne peut pas faire grand
            chose au risque d'envenimer la situation pour cette centaure perturbée. Les agressions de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et le silence imposé par
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} sur la situation sont des fardeaux bien lourd à porter pour cette centaure qui
            accordera rapidement sa confiance à un PJ qui lui témoigne de l'attention.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/haputanga.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 29 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> radieuse, épanouie, amoureuse et enceinte</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> salle commune et tisseranderie avant les douleurs de la grossesse</p>
            </li>
          </ul>
          <p class="paragraphe">
            La fille aînée de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} est une magnifique femelle Centaure radieuse et épanouie aux
            côtés de son conjoint, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.V9ITbgWBBsUeixHA]{Kaihoroi}. Elle ne partage rien des idées de son père ou de son
            oncle mais elle préfère se taire, les laisser parler et faire sa vie en famille. Elle garde un fort contact avec sa mère,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} et elle essaye de la convaincre de quitter son conjoint depuis des années pour
            s'émanciper de l'influence de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha}. Son père l'a déjà frappé pour son insolence mais cette
            épisode l'a rendu encore plus déterminée. Elle est maman de la petite @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.9HdmSAxScK9Twvch]{Taiohi} de 7ans et du
            petit @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EeHmNrec4W6ZBwu5]{Peepi} de 6 ans. Des enfants très agréables et rieurs. Elle est enceinte d'un
            troisième enfant qui devrait voir le jour d'ici un mois (grossesse de 11 mois sur 12). Sa grossesse la met en joie même si ces dernières semaines à a de plus en plus de
            douleurs et de mal à faire des activités. Elle passe beaucoup de temps dans la salle commune ou auprès de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}, la soigneuse. Elle ressent souvent une crainte que son père, son oncle ou son
            grand-père ne s'en prennent un jour à son conjoint.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaihoroi.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.V9ITbgWBBsUeixHA]{Kaihoroi}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 31 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> serviable, souriant, maniaque, toujours partant, impliqué</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> nettoyage, compost, potager et transport de charges lourdes</p>
            </li>
          </ul>
          <p class="paragraphe">
            Quand on doit déplacer une charge lourde, tirer un tronc énorme ou soulever un rocher, on peut compter sur ce Centaure à la musculature impressionnante. Il ne possède que les
            base du combat et préfère échapper aux entraînements mais rien qu'une claque et on ne relève pas rapidement. Il est costaux mais garde un sourire constant sur son visage.
            Toujours heureux et serviable, rien ne semble le toucher même les nom d'oiseaux qu'il entend de la part de la famille de sa conjointe. Il est très attentionné avec ses enfants
            et ne cache pas son empathie face aux douleurs de la grossesse de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga}. Au village,
            il s'occupe beaucoup du compost et il aime nettoyer les rues, les bâtiments et les outils. Un vrai maniaque qui apprécie que chaque chose soit à sa place et bien propre.
            Lorsqu'il jardine au potager, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka} ne cesse de la réprimander car pour elle rien n'est
            aussi propre et ranger dans la nature.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/taitamariki.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.1TJXdxZkBi0ZRvGn]{Taitamariki}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 13 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> traumatisé, presque muet, sous pression, envie de meurtre sur son père</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> apprentissages multiples</p>
            </li>
          </ul>
          <p class="paragraphe">
            Ce jeune centaure de 13 ans est presque muet et garde en permanence la tête baissée. Il est sensible à la détresse de sa mère,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.x2OiiqdCZOlxz94v]{Kaimoe} et il est souvent témoin des colère de son père,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu}, sur elle. Sans pour autant en avoir la capacité, il pense de plus en plus à
            empoisonner mortellement son père et il souhaite, qu'un jour, il ne rentre pas de sa partie de chasse. Ce jeune, un soir après un cauchemar, c'est confié à son grand-père
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} sur les agissements de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu}.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} a fortement insisté sur la nécessité de son silence pour le bien de leur famille et
            des mauvaises conséquences pour sa mère et lui s'il racontait ses mensonges à qui voulait l'entendre. Un des PJs se fera-t-il voler une dose de poison par cet adolescent
            perturbé.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/teriri.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 34 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> lunatique, crise de colère, pas confiance en elle, sur la défensive</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> atelier de poterie, tisseranderie, corderie</p>
            </li>
          </ul>
          <p class="paragraphe">
            La conjointe de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} est une Centaure très maigre qui peut passer d'un moment de calme
            et de concentration à une grande colère contre le premier venu. Dans la plupart des situation elle est assez gentille et malicieuse, jouant avec ces deux adolescents en toute
            tranquillité mais en quelques secondes, un regard désapprobateurs, une trop grande excitation, un dégât ou un mot de travers et la colère influe dans les veine de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri}. Elle est rarement violente mais elle pourra s'acharner verbalement sur un
            villageois pendant plusieurs heures s'il le faut. Ses crises de colère n'épargnent pas son conjoint
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} ni même son beau-père,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} malgré son fort caractère. Les deux enfants de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri}, de 14 et 13 ans, partagent les valeurs de cette famille plus par peur des
            représailles que par réelle conviction. Ayant besoin de concentration, de calme et d'éviter tout stresse,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri} est devenue experte du tissage, de la corderie et passe aussi beaucoup de temps
            dans l'atelier de poterie sur le banc à bâton.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/taiohi.webp" width="100" height="100" />
          <h2>
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.9HdmSAxScK9Twvch]{Taiohi} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EeHmNrec4W6ZBwu5]{Peepi}
          </h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 7 et 6 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> innocents, gentils et souriants, toujours prêt pour des bêtises et chamailleries</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> aucun</p>
            </li>
          </ul>
          <p class="paragraphe">
            Les deux jeunes enfants de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RD6SRAYZuC4Wypgi]{Haputanga} sont de vrais bouilles d'amour, toujours un sourire et un mot gentils à la
            bouche. Ils sont souvent entraînés dans des bêtises par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}. Cette dernière aime passer
            du temps avec eux surtout depuis que leur mère est affaiblie par sa grossesse. Les parents de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.9HdmSAxScK9Twvch]{Taiohi} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EeHmNrec4W6ZBwu5]{Peepi} leur laissent beaucoup de liberté mais sont très attentif à leurs études et à leurs
            apprentissages. Très bons élèves, ils sont quand même inquiets par la fatigue et les douleurs de leur mère. Ils se battent presque tous les jours sur le sexe du futur petit
            frère ou de la future petite sœur. Aucun des deux n'est d'accord sur ce qui serait le mieux pour eux
          </p>
          <hr />

          <h1>Famille de Kaipara et Whakarewa</h1>
          <p class="paragraphe">
            Cette famille est très appréciée dans le village et possède une réelle influence sur la vie de tous les jours. De part leur gestion et leur talent dans la forge et leur
            proportion à aider les habitants d'Arkanov, cette famille semble indispensable pour le bon déroulé des jours.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} donne son avis lors des réunion du village de façon péremptoire et affirmée
            tandis que @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara}, de part sa maitrise des runes, est un réel soutien pour améliorer les
            machines ou la vie des villageois.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaipara.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 68 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> Concentré, déterminé, perfectionniste, réservé et bon pédagogue (mauvaises blagues)</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> forge, expert en gravure de runes</p>
            </li>
          </ul>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} et sa conjointe
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} sont les deux experts en forge du village. Tous les villageois savent forger un
            clou ou tordre une barre de fer mais mettez un marteau dans les mains puissante de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara}
            et la forge devient un art subtil, respectueux, presque mystique. Il semble ressentir la matière pour l'amener à se plier mieux que sa propre volonté. Ce centaure ne parle pas
            beaucoup et il ne vaut mieux pas le déranger quand il affûte une lame ou réalise un trempe sinon il vous sortira de la forge à coup de sabot dans le joufflu. Il a appris l'art
            des runes aux côtés de sa mère depuis son plus jeune âge et transmets patiemment son savoir à deux de ses enfants,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.3FZtGR85wvyjSJ4b]{Titiro}. Depuis quelques temps, il accueille le jeune
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vtQwznCk8jlT2WXW]{Mataro} dans la forge et il semble fortement apprécier ce jeune sous tensions. Les blagues
            de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} sont catastrophiques mais il pense que ça va aider le jeune garçon.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/whakarewa.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 61 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> hautaine, méprise le travail bâclé, dur au mal, réfléchie</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> experte de la forge, restauration des pièces mécaniques</p>
            </li>
          </ul>
          <p class="paragraphe">
            Cette femelle centaure à la musculature discrète est capable de tenir un marteau de forge durant plusieurs jours sans avoir une seule courbature. Contrairement à son conjoint
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} elle est très exigeante et elle peut se montrer hautaine voir méprisante face à un
            travail bâclé ou un épuisement physique. Elle n'est pas là pour faire de la dentelle, des runes ou des fioritures, sa forge est efficace, maîtrisée et fonctionnelle. On lui
            confie souvent la restauration des pièces mécaniques des différentes machines du Village. Elle a entre autre remplacé l'engrenage principal de la machine reliée à la roue de la
            cascade. Sans aucune contradiction, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} est la cheffe de la forge et il faudra son
            aval pour l'utiliser. Leur différence de caractère n'empêche par @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} de s'aimer comme au premier jour même si cette dernière est souvent atterrée par
            l'humour vaseux de son conjoint.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/iti.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.NOuO9E41cHVJuhh8]{Iti}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 38 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> efficace, touche-à-tout, réservé, maladroit en amour</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> pressoir, meunerie, mine et scierie</p>
            </li>
          </ul>
          <p class="paragraphe">
            C'est un travailleur touche-à-tout qui peut passer de la scierie, à la tisseranderie ou à la mine sans aucun problème. Il fait un boulot correct partout et il aime, comme sa
            mère @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} le travail bien fait et efficace. Depuis qu'il est en couple avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.4N3OVVj0dI5LPfNR]{Kamura}, il s'occupe car elle n'est pas très disponible. Il apprécie travailler à ses côtés
            dans la scierie ou au pressoir mais il est assez impuissant face à la distance qu'il y a entre eux. Il n'ont pas d'enfants et ça ronge
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.NOuO9E41cHVJuhh8]{Iti} depuis que son frère et sa sœur ont fondé une famille. Les trois enfants de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} se portent volontaire pour «s'occuper» des PJs lorsqu'ils seront dans les mines
            à leur arrivée.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kakata.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 37 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> minutieux, curieux, blagueur, père aimant et passionné</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> forge et gravure de runes</p>
            </li>
          </ul>
          <p class="paragraphe">
            Ce Centaure est très proche de ses parents et de leur amour de la forge. Il a les même capacités que son père pour la minutie du travail de finition mais contrairement à lui,
            son humour est toujours percutant et juste. Passionné par ses deux filles @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZATNz2uVmXwpoX4W]{Tamariki} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.6rsGepWy5twVXkbs]{Hunga}, il passe beaucoup de temps avec eux et les amène dans chaque bâtiment d'artisanat
            du village. Il est en couple avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} qui s'occupe en particulier de la cuisine
            collective avec son père. Ils ont deux jeunes femelles, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZATNz2uVmXwpoX4W]{Tamariki} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.6rsGepWy5twVXkbs]{Hunga}.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/titiro.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.3FZtGR85wvyjSJ4b]{Titiro}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 30 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> créative, curieuse, perfectionniste, joyeuse et enceinte</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> atelier de couture et forge</p>
            </li>
          </ul>
          <p class="paragraphe">
            La seule fille de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa} est une pure beauté. Même si elle a beaucoup de talent pour la forge et qu'elle
            aime bien partager des moments avec ses parents et son grand frère, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata} autour du
            foyer et des enclumes, son plus grand plaisir se trouve dans l'atelier de couture où elle peut y passer des heures à confectionner des vêtements, toiles, sacs, pièces de cuir
            ou jouets pour les enfants. Lorsque son conjoint, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.zv16OZoKKSY6bTpN]{Kupu}, lui décrit un projet de costume
            pour un spectacle ou une pièce de théâtre, elle le dessine et le confectionne avec beaucoup de patience et de plaisir. Enceinte depuis peu, elle est transportée par cette
            nouvelle. Plus radieuse que jamais, elle est illuminée par la joie. Son conjoint est un peu trop protecteur à son goût mais elle apprécie son imagination et sa façon de
            raconter les histoires.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kupu.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.zv16OZoKKSY6bTpN]{Kupu}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 23 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> créatif, heureux, distingué, aimé de tous et surtout des enfants, sans du rythme et des histoires</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> animateur, créateur de spectacles, touche-à-tout</p>
            </li>
          </ul>
          <p class="paragraphe">
            Mâle très distingué et parlant avec de grandes tirades très longues, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.zv16OZoKKSY6bTpN]{Kupu} est l'une des
            figures les appréciées du village. Il a prit le rôle de sa mère depuis 4 ans pour organiser les soirées théâtres et c'est souvent lui qui anime les veillées dans la salle
            commune. Il raconte les histoires avec de grandes envolées lyriques et beaucoup de mise en scènes ponctuées de «Bam» «Plouf» «Haaaa» ou encore «Hum Miam miam» très expressifs.
            Peu de jongleurs ou ménestrels des Terres d'Arran atteignent son talents pour captiver une assemblée de spectateurs. Les enfants l'adorent et la plupart des adultes apprécient
            sa gentillesse et sa bonhomie. Il aime tendrement sa conjointe @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.3FZtGR85wvyjSJ4b]{Titiro} et il n'hésite pas à
            lui demander de participer à ses histoires quand c'est nécessaire. Grâce à son écoute assidue des PJs, il sera certainement le premier à comprendre la langue commune et à
            pouvoir communiquer avec eux par la parole. Lorsqu'il n'organise pas les soirées, il s'occupe, avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.3FZtGR85wvyjSJ4b]{Titiro}, de l'atelier de couture, il aide
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako} à l'école, il écrit les événements du village sous forme de contes et d'histoires
            romancées et il peut aider dans la plupart des postes pour assister un autre Centaure. Depuis qu'il est au courant de la grossesse de sa conjointe,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.zv16OZoKKSY6bTpN]{Kupu} est euphorique et très protecteur avec elle.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/tamariki.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZATNz2uVmXwpoX4W]{Tamariki}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 12 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> routinière, souriante, réfléchie, observatrice</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Cuisine collective, entraînement souplesse</p>
            </li>
          </ul>
          <p class="paragraphe">
            Très jeune femelle qui suit les traces de sa mère avec passion. Que se soit à la cuisine collective ou lors des séances d'entraînement,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZATNz2uVmXwpoX4W]{Tamariki} est la copie conforme de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa}.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZATNz2uVmXwpoX4W]{Tamariki} préfère le couteau de lancer à l'arc mais elle sait déjà réaliser des manœuvres
            aussi impressionnantes que celle de sa mère. La routine de ses parents lui convient très bien et seule les soirées contes et légendes dans la salle de cérémonie lui fait
            retarder le moment où elle va dormir. Elle participe à toutes les soirées communautaires et elle adore participer aux pièces de théâtre ou aux soirées ludiques.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/hunga.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.6rsGepWy5twVXkbs]{Hunga}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 11 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> capricieuse, coquette, presque muette, perturbée</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> balade et nage</p>
            </li>
          </ul>
          <p class="paragraphe">
            Malgré ses 11 ans, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.6rsGepWy5twVXkbs]{Hunga} est restée un bébé précieux. Elle souffle à chaque effort, à peur
            de se casser un ongle, préfère se balader dans le verger et passe une bonne partie de sa journée à nager dans le lac ou à se coiffer les cheveux. Elle est très moyenne à
            l'école et son esprit papillonne en moins de 10 minutes. La psychologue @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} ne comprend
            pas cette jeune femelle que l'on retrouve de temps en temps seule posée sur la margelle du bassin de la place principale, les yeux de la vague, pendant des heures.
          </p>
          <hr />

          <h1>Famille de Kai et Kahao</h1>
          <p class="paragraphe">Ce couple est expert en cuisine et leurs enfants prennent leur suite avec le même talent.</p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kai.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 59 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> bon, attentif aux autres, gourmand, aimant</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> cuisine collective, archer à l'intérieur, aide à la forge</p>
            </li>
          </ul>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} est un centaure assez débonnaire. Il est d'une grande bonté et tout le temps favorable
            aux envies et exigences des villageois. Son plus grand plaisir avec sa fille, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa}, est
            de préparer des repas dans la cuisine collective, de trouver de nouvelles recettes, de nouveaux goût et associations de saveurs. Il aime beaucoup l'union de sa fille avec le
            talentueux @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.0zLeG9iYDxAcg6Sk]{Ka'Kata} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} passe beaucoup de temps avec le couple de forgeron du village,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZFFGsUvkAO1nS9PD]{Kaipara} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.5A4aNmciTnCqcjvX]{Whakarewa}. En plus de ses talents en cuisine,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} est un archer d'élite mais il ne souhaite pas participer aux chasses à l'extérieur du
            village. Il chasse seulement les animaux qui volent au dessus du village ou les mammifères qui s'aventurent sur les parois et les hauteurs des montagnes visibles depuis des
            habitations.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kahao.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kahao}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 60 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> solitaire, susceptible, paranoïaque, peu affectueuse</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Préparation des vivres, jardinière</p>
            </li>
          </ul>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kahao} est une femelle qui s'occupe beaucoup des préparations sortantes du potager, du
            verger ou des champs. Saumures, séchage, conserves, triage et stockage, elle peut passer ses journées enfermée dans ce grand bâtiment du village. La plupart des gens la trouve
            dure dans ces relations et elle-même préfère rester seule avec les fruits et légumes à préparer. Elle peut se montrer très agressive lorsque l'on critique son travail ou ses
            méthodes et elle pourra même devenir violente avec les PJs qui ne la comprennent pas. Elle ne supporte simplement pas d'être critiquer ou qu'on l'a regarde de travers. Elle ne
            se sent pas soutenue par son conjoint, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai} mais c'est une illusion. Elle est assez
            paranoïaque. Elle n'en a jamais parlé à personne, pas même @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} mais elle a toujours été
            amoureuse de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko}, le chef du village et elle enrage de sa position dégradée. Elle
            ressent beaucoup de rancoeur envers @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.EhKag5p5a4F31dar]{Tumuaki} sans qu'elle n'y soit pour rien dans les
            illusions de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kahao}.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/maamaa.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 39 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> matinale, créative, passionnée, sportive et joyeuse</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> cuisine collective, récoltes et entrainement</p>
            </li>
          </ul>
          <p class="paragraphe">
            Elle adore préparer les repas dans la cuisine collective aux côtés de son père, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.vU8X9FHu74kiJtcM]{Kai}. Ils
            partagent se plaisir d'adapter les recettes en fonction des goûts des villageois et de varier en fonction des fruits ou légumes de saison. Elle, comme son père, est une
            combattante très douée et elle a remporté beaucoup de combat lors des cérémonies du village. Elle se lève tous les jours très tôt pour récolter quelques légumes, s'occuper de
            la cuisine puis, avant de préparer les repas du soir, on peut la trouver dans les murailles à faire du sport et des entraînements pour développer sa souplesse et ses techniques
            peu conventionnelles. Très peu musclée, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.h7x0EB6tAL2BuJkZ]{Maamaa} est d'une rare souplesse. Elle peut bondir,
            glisser ou manœuvrer autour d'un adversaire en évitant tous ses coups. Elle est extrêmement douée un arc à la main, également.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/whakaaro.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.N0rh5EXxLtPGjz5r]{Whakaaro}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 31 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> constant, refus du conflit, efficace, sobre et austère</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> aide et soutien sur toutes les tâches du village</p>
            </li>
          </ul>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.N0rh5EXxLtPGjz5r]{Whakaaro} est un centaure qui peut tout faire dans le village. Il travaille pour tout le
            monde et avec tout le monde sans distinction des conflits ou des tensions entre les familles et les habitants. Toutes ces gesticulations lui passe bien au-delà de la tête. Pour
            lui seul le «bien faire» est important et il met toute son énergie à aider, fabriquer, soutenir et anticiper. Il a peur de sa capacité à être un bon père et la grossesse de sa
            conjointe, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} le divise entre la joie et le stresse. On ne peut pas vraiment dire
            que @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.N0rh5EXxLtPGjz5r]{Whakaaro} divertissant. Il a un caractère sobre et assez austère et il ne comprend pas
            le second degré ou la plupart des blagues ou plaisanteries. Il voit les PJs arrivés au village comme une menace pour son futur enfant et il se méfiera d'eux mais à aucun moment
            il ne sera désobligeant ou agressif envers eux
          </p>
          <hr />

          <h1>Famille de Kaiputu et Ka'Huri</h1>
          <p class="paragraphe">
            Cette famille est assez éclatée car entre les parents et les enfants, on peut dire que les tensions sont marquées. Certains sont pour conserver l'harmonie et les traditions
            ancestrales du village tandis que d'autres souhaitent s'étendre et exploiter les alentours de la montagne. Ces derniers sont influencés par la famille de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha}. Les autres qui aimeraient bien s'intégrer dans le monde et ouvrir leur culture vers
            les Terres d'Arran se positionnent contre cette idée de conquête, de force et de prise de contrôle. Souvent séparés car sinon des étincelles se créent entre eux, cette famille
            est divisée.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kaiputu.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 58 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> excentrique, amoureux de la nature, rigoureux, tactile et blagueur</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> botaniste, jardinier, scribe</p>
            </li>
          </ul>
          <p class="paragraphe">
            Ce grand et maigre centaure à la barbe longue et hirsute aime les plantes, les arbres et la nature. Il passe son temps dans le verger, le potager et la forêt a récolter,
            chouchouter et entretenir les plantes. C'est un des seul Centaure du village autorisé à quitter le village pour aller trouver et ramener des plantes non cultivables dans
            l'enceinte du village. Il est très calme et discret et certains adolescents ou enfants le pensent un peu fou. Il est très tactile avec la nature mais aussi avec les autres
            personnes (la main dans les cheveux, des serrages dans ses bras…), ce qui peut agacer certains villageois. Depuis une dizaine d'années, il entreprend de répertorier la faune et
            la flore locales dans plusieurs grands volumes en dessinant le plus précisément possible chaque caractéristiques et chaque propriété. Les 4 tomes de plusieurs dizaines de pages
            sont des ouvrages magnifiques et assez inestimable pour un botaniste. Il ne supporte plus sa conjointe,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri} , depuis qu'elle traîne avec
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha},
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko}. Il l'a trouve plus violente, plus stressée et surtout elle parle de plus en plus
            de son envie de «conquérir» la montagne et de prendre le contrôle de leur région. De la même manière, il aime passer du temps avec deux de ses filles,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HMpPEtlwshgIOybw]{Te'Wikitoria} et
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} mais a de plus en plus de mal à supporter la colère de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri} et les prises de positions de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka}.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kahuri.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 58 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> violente, stressée, expansionniste, intransigeante</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> fabrication de bougie, poterie et chasse</p>
            </li>
          </ul>
          <p class="paragraphe">
            Ses sourires cachent une grande violence et un stresse de chaque instant pour @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri} .
            Elle traîne beaucoup avec @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} et ses deux fils et elle partage de plus en plus leur envie
            de prendre le contrôle de la région et de la montagne. Les attaques des Ombres Blanches sont des plaies pour ce groupe et ils revendiquent leur place dans cette région. Il faut
            éradiquer les Ombres Blanches, il faut étendre le village et occuper les terres environnantes. Les centaures sont plus forts que tous les autres peuples. Au delà de ses idées,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri} est une bonne artisane et surtout à la poterie et à la fabrication des bougies
            (c'est d'ailleurs une des seule qui arrive à supporter @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RThMzXURSyG4AjsL]{Kite'Tihe}). Elle sait combattre et
            elle est assez douée à la chasse donc cela lui arrive de suivre les frères hors du village.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/tewhikitoria.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HMpPEtlwshgIOybw]{Te'Wikitoria}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 35 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> joyeuse, dynamique, fort caractère, à l'écoute et attentive</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> Soigneuse, préparation des médicament</p>
            </li>
          </ul>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HMpPEtlwshgIOybw]{Te'Wikitoria} a longtemps été poussée a devenir une grande guerrière ou une talentueuse
            chasseresse par sa mère, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri} , mais l'influence passive de son père,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu}, et sa joie devant toutes les merveilles de la nature a séduit Te'wikitoria. Elle
            se passionne rapidement pour l'étude de la faune et de la flore et la découverte des particularités de chaque espèces.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara}, la soigneuse, la prend sous son aile et s'accorde sur ses compétences et son goût
            pour la préparation de baumes, potions et autres remèdes. Grâce au soutien de sa petite sœur,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} et de sa connaissance dans de l'alambic, elle apprend vite et prend plaisir à
            aider @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} avec les blessés ou les malades.
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} lui raconte même les secrets et émotions des villageois pour que Te'wikitoria puisse
            l'aider lors de ses séances de psychologie.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/heitunu.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 32 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> sérieuse, efficace, terre-à-terre, réfléchie, aucun second degré</p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Rôle/Poste :</strong> responsable de l'alambic, mentor de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa}
              </p>
            </li>
          </ul>
          <p class="paragraphe">
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} est jeune mais un ancien du village, aujourd'hui décédé, lui a appris tout le
            savoir nécessaire pour s'occuper de l'Alambic, cette magnifique machine d'une complexité extrême. Elle connait toutes les vannes, cadrans, courbes et tuyaux de l'Alambic et
            elle prend son rôle très au sérieux. Depuis quelques temps elle initie @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} à son
            métier et reconnait en elle un grand talent et une belle inventivité. @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HhfWAaUYHXKxHMFj]{Hei Tunu} a un
            caractère très stable, elle est patiente et très réfléchie dans chacun de ses gestes. Elle sait que sa machine peut faire «péter» la moitié du village si elle fait une mauvaise
            manipulation. Elle est enceinte et la joie de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.CJXonzJKD36jl2VD]{Harikoa} est une bénédiction pour ses
            journées. Son conjoint, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.N0rh5EXxLtPGjz5r]{Whakaaro} et elle passent beaucoup de temps avec la famille de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata} et celle de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.RfNtemPbHymoV2zK]{Kaiako}. Elle n'a presque plus aucun rapport avec sa propre famille, à part son père,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2t5SemjHrF5ukWua]{Kaiputu} qui lui apprend beaucoup de choses sur la nature et avec sa sœur,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.HMpPEtlwshgIOybw]{Te'Wikitoria} avec qui elle a beaucoup de rapport pour la confection de remèdes.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/peka.webp" width="100" height="100" />
          <h2>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka}</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 33 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> peureuse, stressée, oppressée, soumise, expansionniste</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Rôle/Poste :</strong> jardinière</p>
            </li>
          </ul>
          <p class="paragraphe">
            Cette centaure est tout le temps fourrée avec sa mère ou enfermée dans le jardin potager. Elle est plutôt peureuse et stressée et, malgré quelques remarques de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} sur sa faiblesse apparente, elle partage les idées de ce groupe. Elle en a marre
            d'avoir peur et de vivre dans cette «prison» alors que la race des centaures est puissante. Elle se sent en sécurité au milieu des plantes et elle parle très peu aux villageois
            qui se bercent dans les valeurs du respect des traditions ou de l'ouverture du village sur le monde avec bienveillance et partage. Lorsqu'elle est aux côtés de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.A0N0QlLLdB170Ccf]{Te'Tipu} ou de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.hf1UN77UaRB6Yuqb]{Kaihoko}, elle se sent en sécurité mais lorsque
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.AUMVOCux3piDen0C]{Kaha} est là,
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka} est écrasée par son autorité et ses paroles guerrières. Son conjoint a été kidnappé
            lors de la dernière attaque des Ombres Blanches et au-delà de la tristesse, elle ressent une profonde injustice pour sa situation et l'inaction de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.elGCQN2rjOxAynF3]{Kiliko}, le chef du village.
          </p>
          <hr />

          <h1>Les centaures Kidnappés</h1>

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/wakamamae.webp" width="100" height="100" />
          <h2>Wakamamae</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 61 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> calme, appliqué, autain, sarcastique</p>
            </li>
          </ul>
          <p class="paragraphe">
            Wakamamae est un centaure très grand et élancé. Il n'a jamais été un très grand combattant préférant soigner les blessures plutôt que de les provoquer. Sa connaissance des
            plantes, de la médecine et de l'alchimie est immense. Il a partagé une grande partie de son savoir à sa fille
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.T99bZAdCe7gkYs3V]{Kara} et il a grandement participé à la création de nombreux remèdes ou potions pour le
            village grâce à des plantes rares qu'il cultive à l'étage de l'apothicaire et à l'Alambic, cette incroyable machine. Il a été kidnappé par les Atarangi Kino il y a six mois. Il
            ne sait pas que sa conjointe a été tuée lors de l'attaque.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kahaki.webp" width="100" height="100" />
          <h2>Kahaki</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 31 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> romantique, délicat, artiste, sensible</p>
            </li>
          </ul>
          <p class="paragraphe">
            Kahaki est un centaure follement amoureux de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka}, avec un caractère attentionné et
            romantique. Depuis son plus jeune âge, il est à des sentiments pour elle et il a tout fait pour la séduire, multipliant les attentions, les petits gestes et les grandes
            déclarations. Kahaki est très sensible et il a toujours été très apprécié par les sœurs de
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka}. Bien qu'il ait les bases du combat et des armes, Kahaki excelle surtout dans les
            arts. Ce centaure apporte de la beauté partout où il va. Kahaki a été kidnappé par les Atarangi Kino il y a six mois en même temps que Wakamamae. Il reviendra traumatisé par
            son séjour auprès des Elfes Exsangues. L'amour de @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.nqHJEcBPmuo9cAKT]{Peka} arrivera-t-il a le faire sourire à
            nouveau ?
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/tumanako.webp" width="100" height="100" />
          <h2>Tumanako</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 15 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> en colère, attaché à sa famille, fier</p>
            </li>
          </ul>
          <p class="paragraphe">
            Avant le kidnapping de sa sœur, Tumanako était un jeune centaure plutôt joyeux et ouvert d'esprit. Face à son père, ses oncles et son grand-père, il restait aligné sur leurs
            idées guerrières mais, intérieurement, il a du mal à comprendre les raisons qui pousseraient les centaures à quitter leur vie idéal à Arkanov. Il y a trois ans, lorsque sa sœur
            fut kidnappée par les Atarangi Kino, la colère s'introduit immédiatement dans l'esprit du jeune centaure. Il met toute sont énergie dans l'entrainement physique et
            l'apprentissage des armes malgré les multiples mises en gardes des autres familles. Lors d'une attaque des Ombres Blanches, Tumanako fonce à la poursuite des ennemis sans
            réfléchir seulement guidé par la haine. Il ne reviendra jamais au village depuis.
          </p>
          <hr />

          <img class="left" src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/anake.webp" width="100" height="100" />
          <h2>Anake</h2>
          <ul>
            <li>
              <p class="paragraphe"><strong>Âge :</strong> 14 ans</p>
            </li>
            <li>
              <p class="paragraphe"><strong>Caractère :</strong> intransigeante, dure, sur la défensive, suceptible</p>
            </li>
          </ul>
          <p class="paragraphe">
            Anake est une jeune centaure de 14 ans aujourd'hui mais depuis trois ans, elle est réduite en esclavage. Depuis sa tendre enfance, Anake redoute les crises de colère de sa mère
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.LKvlCv4BVu6hBg0p]{Te'Riri} et passe la plupart de son temps avec sa grand-mère
            @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.2vLFu6uOkNcJhn7e]{Ka'Huri} . Elle prend pour modèle son sens de l'honneur inaltérable. Anake ne partage pas
            les idées expansionnistes de sa famille mais, avant sa disparition, elle était persuadée que le village d'Arkanov était le centre du monde. Trois ans de captivité dans les
            prisons de Glanae'Reth ont fait d'Anake une centaure robuste, déterminée et intransigeante.
          </p>
        </div>
