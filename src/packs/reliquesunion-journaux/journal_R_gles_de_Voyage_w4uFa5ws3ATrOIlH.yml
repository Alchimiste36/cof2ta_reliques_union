    text:
      format: 1
      content: "<h1>Introduction aux règles du voyage</h1><p>Ces règles s'appliquent surtout pour les régions difficiles ou dangereuses. N'appliquez pas forcément ces règles pour des voyages par la route classique ou dans des zones où il y a peu de chance de se perdre ou de tomber sur des obstacles (crevasses, cul-de-sac, éboulements…).</p><p>Pour les voyages dangereux, ces règles inventées pour la campagne permet de donner un rôle aux PJ, de valoriser leurs compétences et de rajouter de l'aléatoire sur leur avancée.</p><p>Pour résumer, chaque journée de voyage se décompose en 4 périodes (matin, midi, après-midi et soir) et les PJ peuvent prendre des rôles à responsabilités (Explorateur, Campeur, Chasseur/Cueilleur ou Gardien). Pour chaque période, les PJ effectuent des tests de compétences avec leurs bonus et leurs malus pour savoir s'ils sont efficaces ou non dans leur rôle et déterminer s'il obtiennent des bonus en cas de réussite majeur ou subissent des malus en cas d'échec majeur.</p><p>La période du soir permet d'établir un campement et de savoir si le groupe est bieninstaller pour la nuit ou s'ils ont des difficultés durant la nuit.</p><hr /><h1>Les périodes</h1><p>Chaque journée se divise en 4 périodes :\_</p><ul><li><p>Le matin</p></li><li><p>le midi</p></li><li><p>l'après-midi</p></li><li><p>le soir</p></li></ul><p>Durant chaque période, les PJ ont le choix de leur action et de leurs rôles. Il n'est pas obligatoire d'avancer durant les 3 périodes du jour et d'établir le camp durant la période de nuit.\_ Dans la plupart des cas, le voyage sera classique mais dans certaines situations, le groupe de PJ pourra faire autrement.</p><p>Lors de chaque période, les PJ ayant un rôle feront leur test de compétence et tous les PJ feront les tests spécifiques en fonction du terrain (test d'endurance, test de résistance au froid, test de résistance à la chaleur…). En fonction de leur réussite ou de leur échec, la progression du groupe sera facilité ou ralenti. En cas de réussite ou d'échec majeur, un rôle ou l'ensemble du groupe subira un événement bénéfique ou handicapant.</p><h2>Durée des périodes</h2><p>Dans la majorité des situation, chaque période dure 6 heures. Dans certaines situations, une période pourra être plus longue ou courte sans pour autant durer deux périodes. C'est à chaque MJ de déterminer la durée de chaque période en fonction du terrain et de l'avancée des PJ.\_</p><h2>Avancée par période</h2><p>C'est le MJ qui détermine la distance de base parcourue par le groupe pour chaque période du voyage. En fonction de la nature du terrain (accidenté, montagneux, forêt dense, prairie…), de la fatigue des PJ, de leur encombrement, de leur équipement (montures, raquettes, chariot…) et de tout autre facteur, le groupe pourra avancer plus ou moins vite pour chaque période.</p><p>Si le voyage est représenté sur une carte avec des cases hexagonales, le MJ déterminera si l'avancement moyen est de 1, 2, 3 ou plus héxagone par période.\_</p><p>Si le voyage est juste déterminé par un nombre de période d'avancement à effectuer pour atteindre l'arrivée, le MJ pourra ajuster ce nombre en fonction des choix du groupe et des événements qu'ils rencontrent.</p><hr /><h1>Les Rôles</h1><p>Lors de chaque période, les membres du groupe peuvent choisir un rôle pour augmenter leurs chances de voyager rapidement, en sécurité et en pleine forme. Chaque rôle doit réaliser un test en début de période pour déterminer s'il réussi ou échoue dans sa tâche. Pour chaque test, les PJ peuvent utiliser des Points de Chances pour tranformer un échec en réussite ou une réussite en réussite majeure, par exemple.</p><p>C'est au MJ de déterminer la difficulté en fonction de la région traversée par le groupe. Une zone civilisée avec des routes aura une difficulté de 5, une région de plaines au climat tempéré sans chemin ni route pourra avoir une difficulté de 10, par contre, une région de hautes montagnes enneigées et sauvages aura une difficulté de 25 voir de 30. La difficulté pourra changer au cours du voyage si le groupe passe dans différentes zones.</p><p>En plus d'estimer la difficulté de la région, le MJ pourra ajouter des modificateurs en bonus ou malus pour chaque rôle.\_ Il est compliqué de voyager de nuit ou dans un brouillard dense. Cela devrait entrainer des lourds malus pour les tests effectués par les différents rôles. A contrario, avoir une carte récente de la région, avoir un équipement adapté ou posséder un compagnon animal qui vole au dessus du groupe devrait ajouter des bonus appréciés par le groupe.</p><p>Chaque PJ ou PNJ ayant un rôle effectue son test pour la période et compare le résultat avec la difficulté établie par le MJ :</p><ul><li><p><strong>Si le test est une réussite</strong>, son rôle est rempli de façon normale.</p></li><li><p><strong>Si la réussite du test dépasse de 10 points ou plus la difficulté</strong>, en plus d'un effet supplémentaire (avance rapide, campement confortable…), un événement majeur bénéfique arrive. Utliser la Table Aléatoire du rôle pour tirer au hasard un événement ou choisissez vous-même l'événement qui arrive.</p></li><li><p><strong>Si le test est un échec</strong>, le rôle ne produit pas d'effet ou un effet imprévu. Pour l'Explorateur, par exemple, un échec ne signifie pas rester sur place durant toute la période mais une progression plus lente que prévue, un chemin plus long que prévu, une décision nécessitant un retour en arrière…</p></li><li><p><strong>Si l'échec du test est inférieur de 10 points ou plus par rapport à la difficulté</strong>, un événement majeur néfaste arrive au PJ ou au groupe dans son ensemble. Utilisez la Table\_ Aléatoire du rôle pour tirer au hasard un événement ou choisissez celui qui arrive.</p></li></ul><p>Pour chaque rôle suivant, vous trouverez les tests pour le rôle, des exemples de bonus et de malus pour le rôle et les liens vers les Tables aléatoires des événements bénéfiques et néfastes pour ce rôle.\_</p><h2>Explorateur</h2><ul><li><p><strong>Tests :</strong> @Test[car:per|comp:Explorateur : Observation lointaine] ou @Test[car:agi|comp:Explorateur : Mobilité]</p></li><li><p><strong>Bonus :</strong> carte de la région, monture rapide, informations sur la zone, compagnon animal volant, connaissance du terrain…</p></li><li><p><strong>Malus :</strong> voyage de nuit, météo mauvaise, région sauvage, fatigue forte, saison défavorable (hiver et été)…</p></li><li><p><strong>Événements pour l'Explorateur :</strong>\_</p><ul><li><p>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-tables.RollTable.nwhtWWTv3pR8qNl6]{Explorateur : Événements bénéfiques}</p></li><li><p>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-tables.RollTable.NlJZ2G9Uvc04BgtC]{Explorateur : Événements néfastes}</p></li></ul></li></ul><hr /><p>Un seul PJ peut prendre la place de l'Explorateur mais l'Explorateur peut changer pour chaque période.</p><p>L'Explorateur recherche le bon chemin pour progresser dans le voyage, le plus rapidement possible mais également en évitant les risques ou les rencontres dangereuses. Savoir analyser les alentours, observer les indices, reprérer les changements dans le paysage sont des qualités fondammentales pour l'Explorateur. Le PJ qui prend cette responsabilité ne voyage pas forcément loin devant le groupe. Il se déplace par contre beaucoup pour monter sur un point haut ou pour suivre une piste sur quelques centaines de mètres pour vérifier une information.</p><p>L'Explorateur est très mobile et devrait avoir des compétences en survie assez élevées. En plus de ces propres qualités, un Explorateur peut utiliser un compagnon animal volant pour observer la région aux alentours, une monture rapide pour prendre un peu d'avance et bien sur une bonne carte récente de la région ou à défaut, des informations sur les zones à privilégier ou à éviter.</p><p>Pour finir, l'Explorateur est souvent le premier à entrer en contact avec des habitants de la région, des fermes isolées ou des petits villages. Sa faculté a paraitre amicale et son sens de la diplomacie sera un avantage certain dans certaines circonstances.</p><hr /><h2>Campeur</h2><ul><li><p><strong>Tests :</strong> @Test[car:per|comp:Campeur : Survie] ou @Test[car:int|comp:Campeur : Analyser un lieux]</p></li><li><p><strong>Bonus :</strong> équipements adaptés à la région et la saison (tente, couvertures…), outils pour nettoyer la zone (pelle, pioche…), connaissances de la région, temps de préparation du camp, structures d'accueil (vieille ruine, grotte…)…</p></li><li><p><strong>Malus :</strong>\_durée faible pour trouver et établir un camp, arrêt de nuit, fatigue forte, saison défavorable, distractions fréquentes, manque de nourriture revigorante…</p></li><li><p><strong>Événements pour le Campeur :</strong>\_</p><ul><li><p>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-tables.RollTable.Gjd4qCqpezczdjH2]{Campeur : Événements bénéfiques}</p></li><li><p>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-tables.RollTable.ApIs8BbOOPm5USuD]{Campeur : Événements néfastes}</p></li></ul></li></ul><hr /><p>Chaque PJ peut prendre le rôle de Campeur pour chaque période durant laquelle le groupe décide de se reposer. Dans la logique, chaque personnage peut décider de monter son propre camp et faire un test pour lui-même. Dans la pluaprt des cas, un PJ fera un test pour tout le groupe car c'est lui qui déterminera le lieu du campement et son organisation. Ce PJ ayant des compétences de survie adaptées sera plus efficace pour établir un camp et permettre ainsi aux autres de réaliser d'autres tâches durant ce temps.\_</p><p>Le Campeur doit trouver un lieu adapté pour passer la période de repos (qui peut être la nuit ou non) et il détermine comment le campement sera installé pour éviter tous les problèmes qui pourraient arriver durant la période. Ce rôle est important car il va déterminer le temps nécessaire pour monter le camp, si le groupe récupère de sa fatigue du voyage ou, encore, si le groupe a des chances de passer inaperçu dans les zones à risques.</p><hr /><h2>Gardien</h2><ul><li><p><strong>Tests :</strong> @Test[car:per|comp:Gardien : Survie] ou @Test[car:con|comp:Gardien : Vigilance et Endurance]</p></li><li><p><strong>Bonus :</strong>\_objets pour effrayer les animaux, connaissances de la région et de la faune sauvage, monture puissante…</p></li><li><p><strong>Malus :</strong>\_voyage de nuit, saison de réproduction d'animaux dangereux, fatigue importante, météo défavorable…</p></li><li><p><strong>Événements pour le Gardien :</strong>\_</p><ul><li><p>s</p></li><li><p></p></li></ul></li></ul><hr /><p>Le Gardien est là pour protéger le groupe durant le voyage. Il observe autour, analyse les zones à risques potentielles, repère les traces d'animaux sauvages et réagit à chaque mouvements ou bruits alentour. Chaque PJ peut prendre le rôle de Gardien pour chaque période mais dans la plupart des situations, le personnage le plus compétent remplira ce rôle pour le groupe.\_</p><p>En plus d'une bonne vision périphérique, le Gardien doit resté concentré et vigilant pendant plusieurs heures d'affilées. Dans de nombreuses situations, face à des animaux sauvages, le Gardien montrera les muscles, hurlera ou intimidera pour éviter le danger et faire fuir la bête curieuse. Lorsque le danger devient sérieux, le Gardien évitera que la groupe soit prit par surprise et, en fonction de ses compétences, pourra même prendre par surprise les ennemis sur la route.</p><hr /><h2>Chasseur-Cueilleur</h2><ul><li><p><strong>Tests :</strong> @Test[car:per|comp:Chasseur-Cueilleur : Pistage] ou @Test[car:agi|comp:Chasseur-Cueilleur : Chasse ou Cueillette]</p></li><li><p><strong>Bonus :</strong> connaissances de la faune et/ou la flore locale, saison favorable, armes adaptées au type de gibier, durée longue…</p></li><li><p><strong>Malus :</strong>\_durée faible, chasse ou cueillette de nuit, fatigue forte, saison défavorable, météo défavorable…</p></li><li><p><strong>Événements pour le Chasseur-Cueilleur :</strong>\_</p><ul><li><p>s</p></li><li><p></p></li></ul></li></ul><hr /><p>Chaque PJ peut prendre le rôle de Chasseur-Cueilleur pour chaque période. Chaque PJ qui rempli ce rôle devrait être assez compétent pour réussir à ne pas empoisonner ses compagnons de route avec un champignon toxique ou une viande avariée. Il devra aussi réussir à chasser et/ou cueillir des vivres assez rapidement pour ne pas retarder la progression du groupe ou réaliser cette tâche durant les périodes de campement ou de pause.</p><p>Dans les régions réellement inhospitalières, le Chasseur-Cueilleur sera en concurence avec tous les animaux sauvage pour trouver de la nourriture. Ce rôle n'est pas sans danger surtout si le Chasseur-Cueilleur s'éloigne du campement, du groupe ou du Gardien.</p><p>Si les PJ sont assez prévoyants et qu'ils possèdent des rations en quantité, il ne sera pas nécessaire de recourir à ce rôle. En cas de voyage imprévu ou mal préparé ou de perte de rations durant le voyage, ce rôle sera important pour ne pas mourrir de faim ou subir des désagréments liés à la faim.</p><hr /><h1>Stratégies spéciales pour le voyage</h1><p>Lorsqu'ils sont pressés, le groupe peut décider d'adopter une stratégie risquée pour le voyage. Une bonne préparation du voyage pourra, à l'inverse, augmenter le confort du voyage.\_Les exemples suivants ne sont pas exhaustifs. Il convient à chaque MJ d'adapter les règles du voyage en fonction des stratégies employées par le groupe de PJ.</p><h2>Marche forcée</h2><p>Choisir d'avancer vite lors d'un voyage, même dans une zone civilisée, est toujours un risque pour un groupe.\_</p><p>Le groupe peut progresser deux fois plus vite que la normale lors de chaque période de marche forcée mais la difficulté du voyage augmente clairement.</p><ul><li><p>Malus de -5 minimum pour les rôles d'Explorateur et de Gardien.</p></li><li><p>Test de\_@Test[car:con|comp:Endurance] pour chaque période et perte obligatoire d'un DR par période.</p></li><li><p>Rôle de Chasseur-Cueilleur impossible.</p></li><li><p>Certains événements bénéfiques majeurs impossible et amplification des événements néfastes majeurs</p></li></ul><h2>Voyage de nuit</h2><p>Même avec une vision nocture, voyager de nuit est toujours une épreuve tendue pour un groupe. Une crevasse dissimulée, un animal dangereux dérangé dans son sommeil, faire du bruit la nuit à proximité d'un camp de bandit… ce ne sont pas les risques qui manquent.</p><ul><li><p>Malus de -5 minimum pour les rôles d'Explorateur, de Campeur et de Gardien.</p></li><li><p>Rôle de Chasseur-Cueilleur impossible.</p></li><li><p>Certains événements bénéfiques majeurs impossible et amplification des événements néfastes majeurs</p></li></ul><h2>Encombrement</h2><p>Le poids ou le volume d'objets transportés par les individus et les montures influence beaucoup la progression du groupe. Sans calculer le poids au kilogramme près, il est évident que de porter un coffre rempli d'objets d'art dans un marais n'est pas chose aisée.</p><p>En fonction de leurs montures ou s'ils possèdent un chariot ou une charette, les PJ devront réaliser des test de\_@Test[car:con|comp:Endurance] et/ou de\_@Test[car:for|comp:Athlétisme] pour pouvoir avancer sans se fatiguer (perte de DR).</p><h2>Fatigue et voyage long</h2><p>Un voyage de quelques jours dans une région extrême ou un voyage de plusieurs semaines dans une zone calme apporte son lot de fatigue et de courbatures même pour des aventuriers habitués. La durée totale n'est pas le seul critère pour épuiser les PJ car ils seront soumis à des événements stressants ou fatiguants, des nuits difficiles, un manque de nourriture ou des vivres de mauvaises qualités, des blessures ou des maladies ou des périodes de marche forcée par exemple.</p><p>Utilisez le nombre restant de Dé de Réscupération de chaque PJ pour détermniner leur état de fatigue ainsi que leur nombre de Points de Vie. Déterminez les malus à appliquer pour les PJ ayant 1, 2 ou 3 DR restant ou pour ceux qui ont moins de la moitié de leur PV maximum. La fatigue peut réduire la distance parcourue par période de marche, appliquer des malus aux tests de certains rôles ou, encore, infliger des DM aux PJ les plus fatigués car ils glissent ou se cognent.</p><h2>Montures, véhicules et compagnons</h2><p>Durant un voyage avoir une bonne monture, un chariot pour se reposer et un compagnon animal adapté à la situation est un avantage non négligeable. Dans d'autres situations, une monture ou compagnon non adapté au climat ou à la région ou un véhicule encombrant sera plutôt un désavantage pour progresser. Tandis qu'on peut se séparer d'une charette au milieu de la montagne, il est plus dur d'abandonner sa fidèle monture pour traverser une zone escarpée. En fonction des choix de chaque groupe, le MJ doit adapter la difficulté de la région en fonction de ces éléments, ajouter des malus aux tests ou effectuer des tests physiques pour estimer la résistance de la monture ou du compagnon.</p><hr /><h1>Les autres tests</h1><p>Durant un voyage dans des zones sauvages, il peut être demandé aux individu du groupe d'effecter des tests spécifiques durant chaque période ou régulièrement. Imaginez tous les tests pouvant influencer grandement le voyage et surtout ajouter de l'enjeu lors de ces phase d'exploration et de danger.</p><h2>Résistance au chaud ou au froid</h2><p>Sous un soleil de plomb ou de la neige jusqu'aux mollets, les climats extrêments sont des dangers souvent plus importants qu'une meute de loups. Dans ce genre de stituation demandé un test de @Test[car:con|comp:Résistance au climat] durant toutes les périodes pour savoir si les PJ subissent des DM ou des malus. La difficulté est à déterminer en fonction de l'intensité du climat tandis que les PJ pourront recevoir des bonus ou des malus à leur test en fonction de leur équipement ou de leur préparation.</p><h2>Endurance</h2><p>Lors de voyage très longs et/ou rapides, le MJ peut demander pour chaque période durant laquelle le groupe décide d'avancer, des tests de\_@Test[car:con|comp:Endurance]. En cas d'échec, le PJ perdra un ou plusieurs Dé de Récupération ou se verra infliger le statut Affaibli, par exemple.</p><h2>Tests physiques</h2><p>En fonction de la région, des tests physiques peuvent être demandé pour chaque période. Si le groupe avance dans un marais ou sur la neige, des tests de\_@Test[car:agi|comp:Garder son équilibre] seront demandés. Si le groupe doit gravir de forts dénivelés voir escalader des zones des tests de\_@Test[car:for|comp:Athlétisme] seront nécessaires pour progresser.</p><p>Pour des régions remplies d'énergies mystiques comme une ancienne forêt elfique ou le territoire d'un nécromant puissant, le MJ peut éxiger des test de\_@Test[car:cha|comp:Volonté et détermination] ou de\_@Test[car:int|comp:Garder ses esprits] pour éviter de sombrer dans la folie ou de se morfondre dans le désespoir.</p>"
