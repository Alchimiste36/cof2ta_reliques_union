      content: >-
        <h1>Règle du Seuil d'Alerte - SA</h1><p class="paragraphe">Comme
        expliqué dans l'introduction du chapitre, la cité des Elfes Exsangues
        est bruyante, agitée et remplie de personnes violentes et plus ou moins
        droguées.</p><p class="paragraphe">Progresser dans les couloirs,
        attaquer des groupes d'elfes, parler normalement et même laisser des
        traces de sangs au sol ne devrait pas attirer l'attention auprès des
        occupant des lieux. La plupart des Atarangi Kino se jetteront dans les
        combats sans penser à fuir pour déclencher l'alerte. Quelques cris ou
        sons de bagarres ne devrait pas, outre mesure, déranger les elfes.</p><p
        class="paragraphe">Par contre, certaines situations provoqueront des
        questionnements voir des réactions auprès des habitants :</p><ul><li><p
        class="paragraphe">Utilisation d'équipements explosifs
        +2SA</p></li><li><p class="paragraphe">Découverte de cadavres de soumis
        +1SA</p></li><li><p class="paragraphe">Découverte de cadavres de Soldats
        ou de Sergents +2SA</p></li><li><p class="paragraphe">Découverte de
        cadavres de Commandants +3SA</p></li><li><p
        class="paragraphe">Découverte de cadavres de Filles, Sœurs ou Matrones
        +4SA</p></li><li><p class="paragraphe">Destruction d'une porte ou d'un
        équipement voyant +1SA</p></li><li><p class="paragraphe">Si certains
        elfes, non soumis, sont morts, pour chaque «longue période» passée +1SA
        (repos, attente…)</p></li><li><p class="paragraphe">…</p></li></ul><p
        class="paragraphe">Il ne faut pas oublier que les habitants sont mobiles
        dans la cité. Ils ne restent pas toujours au même endroit et pourront
        donc tomber sur des cadavres laissés visibles par les aventuriers. Ces
        derniers pourront dissimuler les corps et équipements dans le cours
        d'eau, derrière des caisses… pour éviter d'être repéré.</p><p
        class="paragraphe">De plus, s'ils entendent des bruits trop suspects,
        les Elfes Exsangues Soldats, Sergents ou Commandants iront voir dans les
        salles adjacentes ce qu'il se passe.</p><ul><li><p
        class="paragraphe"><strong>SA 10+ : Un truc bizarre :</strong> Une
        méfiance augmente dans la cité. Les Soldats, Sergents et Commandants
        seront attentifs et plus réactifs. Les Elfes Exsangues endormis seront
        réveillés sans pour autant être équipés.</p></li><li><p
        class="paragraphe"><strong>SA 15+ : Sur leur garde :</strong> Tous les
        Elfes Exsangues seront équipés et attentifs. Les Mâles en train de se
        nettoyés seront équipés prêts au combat. Les déplacements dans la cité
        seront plus fréquents</p></li><li><p class="paragraphe"><strong>SA 20+ :
        Il y a des Intrus :</strong> Les rondes seront constantes. Certaines
        pièces seront fouillées. Les prisonniers sont tous placés sous
        surveillance constante. Les Matrones sont prévenues.</p></li><li><p
        class="paragraphe"><strong>SA 25+ : Alerte Générale :</strong> Les
        Matrones protègent les endroits sensibles (le dortoir des filles, les
        captifs, le temple, les ateliers et la garnison). Les Sœurs accompagnent
        les Mâles dans leurs rondes dans toute la cité de
        Glanae'Reth.</p></li></ul><hr />
