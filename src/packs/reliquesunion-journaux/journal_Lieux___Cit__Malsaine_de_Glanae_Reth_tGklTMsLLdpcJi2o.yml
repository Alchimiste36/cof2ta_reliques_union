      content: |-
        <div class="journal-cof2ta-ru">
          <h1>Mise en garde</h1>
          <h2>Explications</h2>
          <p class="paragraphe">
            La cité malsaine de Glanae'Reth est une société matriarcale extrêmement violente et dégénérée. Les habitants pratiquent et subissent de la torture, des viols, des agressions en
            tout genre. La pression psychologique est permanente et l'ambiance y est très lourde.
          </p>
          <p class="paragraphe">
            C'est une caricature de tout ce qui peut se faire de pire. Dans la logique, la attaque de cette cité horrible a pour but de faire vivre des émotions révoltantes pour les
            joueurs et unir les captifs et les PJ autour d'un ennemi commun sans aucune nuance possible. Même le plus sanguinaire des humains face à cette cité devrait se fédérer avec les
            PJ pour attaquer les membres de cette cité. De plus, mettre les Personnages face à des choix moraux est une bonne manière de créer de la tension dans le groupe et des
            questionnements sur la propre moral des PJ face à un manque radical de moral.
          </p>
          <p class="paragraphe">Les questions soulevés par l'organisation de la cité malsaine seront nombreuses :</p>
          <ul>
            <li>
              <p class="paragraphe">Tous les elfes exsangues sont-ils aussi violents et horribles que ceux-ci ?</p>
            </li>
            <li>
              <p class="paragraphe">Doit-on les éradiquer sans forme de procès ou sans essayé de les "sauver" de leur propre hiérarchie ?</p>
            </li>
            <li>
              <p class="paragraphe">Sont-ils par nature malsains ou est-ce ce système hiérarchique basé sur l'emprise, la violence et la peur qui les rend ainsi ?</p>
            </li>
            <li>
              <p class="paragraphe">Que vont-ils faire de cette cité après avoir supprimer la menace des Ombres Blanches / Atarangi Kino ?…</p>
            </li>
          </ul>
          <p class="paragraphe">
            Pour finir, la mise en place de cette cité d'elfes dégénérés est importante pour le reste de la campagne car, quelque soit les choix des PJ, la nature de la cité de Glanae'Reth
            sera, plus tard, connue dans les régions aux alentours et cela devrait faire augmenter grandement le racisme et la haine des elfes pour les habitants déjà bercés par des
            préjugés sur ce peuple. Le MJ devra être attentif aux moyens misent en place par les PJ pour raconter cette histoire aux villes et villages après leur départ d'Arkanov afin de
            limiter les amalgames entre une cité d'elfes violents et tous les elfes des Terres d'Arran.
          </p>
          <p class="paragraphe">
            Au moment de leur retour à la Vallée de Novrak avec une bonne partie des survivants de la cité malsaine et accompagné, peut-être, par de puissants et inquiétants centaures,
            leur discours et leurs explications vont déterminer beaucoup de choses sur la monter extrême ou non de l'intolérance envers les races anciennes.
          </p>
          <h2>Adaptation de la cité</h2>
          <p class="paragraphe">
            Chaque MJ doit être très attentif aux joueurs durant l'exploration de la cité. Vous devez adapter le niveau de violence à l'acceptation de votre groupe de joueurs et joueuses
            afin de ne pas réveiller des traumatismes conscients ou inconscients.
          </p>
          <p class="paragraphe">
            Il est possible de réduire fortement le degré de corruption des elfes exsangues tout en conservant des choix moraux et un sentiment d'urgence à libérer les captifs et combattre
            les elfes exsangues. Le MJ pourra en premier supprimer les violences sexuelles et codifier la reproduction des femelles exsangues par des rituels complexes et cachés. Vous
            pouvez aussi réduire (voir supprimer entièrement) la présence ou la vision sur les jeunes enfants (Fillettes ou Jeunes). Les drogues et les tortures peuvent être suggérés
            plutôt qu'explicite aussi.
          </p>
          <p class="paragraphe">
            Dans toutes les situation, le MJ doit parler avec son groupe régulièrement pour écouter leurs emotions et sentiments par rapport à ce passage de la campagne et modifier en
            conséquence l'environnement de Glanae'Reth. Il est aussi possible de limiter grandement le temps passé dans la cité en organisant "un grand combat final" et réaliser une
            pirouette narrative en décrivant les événements jusqu'à la libération des captifs et la prise de la cité malsaine.
          </p>
          <hr />
          <h1>Introduction</h1>
          <h2>Description globale</h2>
          <ul>
            <li>
              <p class="paragraphe">
                Très peu de lumière. A part quelques feux dans l'espace des captifs, au niveau des ateliers pour les esclaves ou autour des cages pour faire souffrir les prisonniers.
              </p>
            </li>
            <li>
              <p class="paragraphe">Bâtiments maçonnés ou grotte brute</p>
            </li>
            <li>
              <p class="paragraphe">3 m de plafond dans la plupart des bâtiments et hauteur très diverse dans les grottes</p>
            </li>
            <li>
              <p class="paragraphe">Sol en pierres taillées et bien plat partout</p>
            </li>
            <li>
              <p class="paragraphe">
                Beaucoup de bruit tout le temps. Des cris, des pleurs, des échos de travail (forge, concassage…), des bruits d'entrainements physiques et de combat, bruit des chutes d'eau
                et des clapoties…
              </p>
            </li>
            <li>
              <p class="paragraphe">Très forte humidité. Les murs scuintent des gouttes d'eau. flaques d'eau au sol à certains endroits.</p>
            </li>
            <li>
              <p class="paragraphe">Température fraiche et stable toute l'année. Fort courant d'air au niveau des bras de la rivière souterraine.</p>
            </li>
            <li>
              <p class="paragraphe">Aucune patrouille de gardes en temps normal. Les elfes exsangues se sentent entièrement en sécurité.</p>
            </li>
            <li>
              <p class="paragraphe">
                Des elfes exsangues soumis et esclaves un peu partout qui s'occupent des tâches quotidiennes, la tête et les yeux baissés, drogués fortement, la peur au ventre.
              </p>
            </li>
          </ul>
          <hr />
          <h2>Les habitants</h2>
          <h3>Les femelles elfes exsangues :</h3>
          <p class="paragraphe">Il y a trois types de femelles totalement dominantes dans la cité.</p>
          <ul>
            <li>
              <p class="paragraphe">
                <strong>Les Matrones</strong> sont les dirigeantes ultimes de Glanae'Reth. Elles sont vicieuses, oppressantes et ont tout pouvoir sur tous les autres habitants. Elles
                restent très souvent dans les quartiers privés des femelles mais fréquemment elles se baladent dans la cité et peuvent tuer ou torturer n'importe quel habitant du coup sans
                raison apparente.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Soeurs</strong> sont les lieutenantes des Matrones. Elles ont beaucoup de pouvoir sur les habitants de la cité. Contrairement aux Matrones, les Soeurs sont en
                concurences les unes avec les autres. Elles essayent d'attirer l'attention des Matrones à tout moment et cherche à limiter au maximum de les contrarier. Elles rivalisent de
                sauvagerie et de violence pour plaire aux Matrones.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Fillettes</strong> sont de jeunes femelles elfes exsangues. Elles sont encore en apprentissage mais elles jouent déjà un rôle important de domination sur les
                mâles de la cité. De la même manière que les Soeurs, les Filettes jouent entièrement la concurrence entre elles pour monter plus vite dans la hiérarchie, plaire aux Soeurs
                ou directement au Matrones. Elles n'hésitent pas à se tirer dans les pattes et à dénoncer une autre Filette ou une Soeur ayant échoué quelque part. Leur jeune âge les rend
                redoutables car elles utilisent de leur jeunesse pour charmer, manipuler et torturer mentalement les mâles elfes exsangues et les captifs.
              </p>
            </li>
          </ul>
          <hr />
          <h3>Les mâles elfes exsangues :</h3>
          <p class="paragraphe">
            Dans cette cité, les mâles elfes exsangues sont dominés par les femelles. L'organisation des mâles est très hiérarchisée et obéit à des grades. Les grades apportent des droits
            et des devoirs et imposent une supériorité sur les grades inférieurs. Ce système militaire est pratique et efficace pour créer un climat d'oppression et de violence entre les
            différents grades. Chaque haut gradé doit soumettre les échelons d'en dessous pour imposer leurs volontés tandis que chaque grade inférieur cherche la faille chez les
            responsables pour enfin prendre leur place.
          </p>
          <p class="paragraphe">Pour faire simple, l'organisation des mâles exsangues est décomposée en 6 grades mais le système est bien plus complexe dans la réalité.</p>
          <ul>
            <li>
              <p class="paragraphe">
                <strong>Les lieutenants</strong> ne sont pas très nombreux. Ils sont assez proches des Soeurs et peuvent même être abordés directement par une Matrones. Ils usent de
                violence mais préfèrent souvent donner des ordres aux échelons inférieurs.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Caporaux</strong> sont toujours aux ordres d'un Lieutenant. L'obéissance est nécessaire mais n'oubliez pas leur désir le plus profond : prendre la place de
                Lieutenant.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Soldats</strong> sont assez nombreux. Ils sont maltraités et poussés à la performance à chaque instant. Leur statut social dans la cité est supérieur aux mâles
                Soumis mais ça n'empêche pas le peur de les frapper au quotidien. L'entrainement martial est intense et douloureux. Le moindre signe de faiblesse pour un Soldat est une
                hantise car ça signifie des sévices physiques et mentaux, la perte de leur statut de Soldat ou la mort dans le déhonneur et la honte.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Apprentis</strong> ne sont pas encore Soldats. Ils sont jeunes et têtes brûlés car les deux options qui s'offrent à eux sont une place dans le groupe des
                Soldats ou une vie d'esclavage en dévenant un Soumis drogué et maltraité. Il est fréquent de voir des assassinat entre Apprentis pour éliminer une concurrence ou juste
                attirer l'attention des supérieurs. Ce grade est attribué rapidement pour les jeunes mâles et leur entrainement physique est intense dès le début permettant de séparer les
                futurs Soldats des futurs Soumis.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Soumis</strong> n'ont rien à envier aux captifs. Ils sont légèrement mieux traités mais ils subissent au quotidien des tortures physiques ou psychologiques par
                les autres mâles ou les femelles exsangues. Ils s'occupent de toutes les tâches du quotidien (cuisine, nettoyage, travaux dans les ateliers…). Ils sont en permanence
                drogués et affaiblis par le manque de sommeil et les maltraitances qu'ils subissent. Cet état second leur permet de supporter un minimum leur vie mais chaque Soumis sait
                que, sans aucune raison, ils peuvent se faire tuer à n'importe quel moment même en pleine nuit.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Jeunes</strong>, âgés de maximum 6 ans, sont écartés de la violence physique mais subissent la pression psychologique dès les premières semaines. Ils sont
                dressés à obéir et à se soumettre aux ordres. Leurs apprentissages sont sommaires (parler, écrire et lire quelques mots, une culture générale minimale). Ils reçoivent
                régulièrement la visite des Filettes pour imposer leur domination et leur manipulation sur eux. Sur les Jeunes, les Filettes se montrent souvent assez douces et charmantes
                et tous les Jeunes sont imprégnés par des comptines et des histoires pensées pour implanter un ancrage profond dans leur pensées. La voie des femelles exsangues est ainsi
                associé dès la naissance à l'amour et à la peur.
              </p>
            </li>
          </ul>
          <hr />
          <h3>Les captifs :</h3>
          <p class="paragraphe">En observant la vie des elfes exsangues Soumis, on peut imaginer le calvaire vécu par les captifs de la cité de Glanae'Reth.</p>
          <p class="paragraphe">
            Il y en permanence entre 30 et 50 captifs dans la cité mais vu leur situation, il y a beaucoup de changements. Certains captifs sont dans la cité depuis des années mais ce sont
            des cas assez rares. La pluaprt des captifs arrivent à survivre quelques semaines voir quelques mois mais finissent toujours par mourrir d'épuisement, de désespoir ou sous la
            torture d'un elfes exsangue.
          </p>
          <p class="paragraphe">
            Les captifs sont de tous les peuples des Terres d'Arran. Autant des elfes, des nains, des humains, des peaux vertes ou même des cenatures d'Arkanov et des mangeurs des plaines.
            Les plus agressifs sont enfermés dans les cages de la prison à la vue des autres habitants, cuisant à petit feu à cause des braséros ou ils sont soumis par la drogue, la menace
            et la violence. Les captifs plu dociles sont utilisés pour le travail et pour tous les désirs des mâles (pas les Soumis) ou des femelles exsangues.
          </p>
          <p class="paragraphe">
            La plupart des captifs travaillent et vivent dans les grottes près des fermes souterraines et seulement une minorité peuvent sortir régulièrement de cet espace pour aller
            travailler dans les ateliers ou pour servir de jouet pour les femelles exsangues.
          </p>
          <hr />
          <h2>Ambiance et état d'esprit</h2>
          <p class="paragraphe">
            L'un des points les plus importants pour les PJ de la cité de Glanae'Reth, c'est le sentiment de sécurité des habitants face aux menaces extérieures. Autant dans les couloirs
            et les tunnels, l'insécurité et la violence est partout, autant personne ne s'attend à recevoir la visite d'ennemis hors de la cité. Ils sont insouciants car Glanae'Reth n'a
            jamais été découvert par des étrangers. Les expéditions pour réaliser des kidnappings ont souvent été tués mais aucune menace n'a jamais atteinte la cité.
          </p>
          <p class="paragraphe">
            Comme dit plus tôt, l'ambiance de la cité est bruyante à tout moment de la journée. Il est d'ailleur très difficile, après quelques jours dans les souterrains de savoir s'il
            fait jour ou nuit et on perd vite la motion du temps qui passe. Le bruit est permanent. Que ce soit le travail des captifs à la forge ou au cassage des pierres, les cris de
            peurs ou de douleurs et les pleurs dans les dortoirs, les sons ont tendance à résonner dans les couloirs. Les Soldats, Caporaux et Lieutenants s'entrainent aussi régulièrement
            dans les grognoments, les bruits de passes d'armes et les hurlements des blessés. Pour finir, il est fréquent d'entendre les sons de coïts dans les tunnels quand une femelle
            décide d'utiliser un habitants pour son seul plaisir.
          </p>
          <p class="paragraphe">
            En abordant ce sujet, tous les mâles de la cité malsaine peuvent être choisis par une Matrone, une Soeur ou un Filette pour servir de jouet sexuel à n'importe quel moment.
            L'hygiène est importante pour les femelles donc le mâle sera lavé avant dans la plupart des cas. Tous les mâles sont soumis aux désirs des femelles mais certains peuvent être
            attachés et/ou drogué. C'est coïts peuvent être réalisés en privé ou en public, dans une salle commune, le Temple ou juste au détour d'un couloir.
          </p>
          <p class="paragraphe">
            Il arrive, plus rarement, que des captifs soient aussi violés par les femelles ou les mâles de la cité. Dans ce cas, les drogues aident à maintenir la victime docile et
            d'éviter tous les risques malgré la puissance et les pouvoirs des Matrones ou des Soeurs.
          </p>
          <hr />
          <h3>Décorations</h3>
          <p class="paragraphe">
            La décoration de la cité est aussi malsaine que ses habitants. Des peintures explicites représentant des Matrones nues ou en train de torturer des mâles ou des captifs, des
            statues représentants la force et la puissance, des meubles rustiques et brute dans les parties communes en contradiction avec les dorures, les draperies et le luxe des parties
            réservées aux femelles… autant de décorations qui sont perturbantes et qui impose à chaque croisement les règles hiérarchiques de la cité.
          </p>
          <hr />
          <h3>Réaction face aux PJ</h3>
          <p class="paragraphe">Les réactions de chaque type d'habitant sont assez prévisibles pour qui connait l'organisation de la cité.</p>
          <ul>
            <li>
              <p class="paragraphe">
                <strong>Les Soumis</strong> peuvent avoir deux réactions. Soit ils identifient une menace directement et ils peuvent se jeter sur les intrus sans arme ou avec leur outil de
                travail (couteau de cuisine, marteau, tournevis, casserole…) en espérant mourrir vite ou bloquer les ennemis et être récompensé par un mâle exsangue. Soit ils ne
                comprennent pas la situation et ils baisseront la tête, se blotiront dans un coin ou continueront leur tâche actuelle.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Soldats et les Jeunes</strong> se jetteront sur la menace dès qu'ils la voient. Que le groupe d'intrus soit supérieur en nombre ou en puissance, ils essayeront
                d'éliminer leurs ennemis sans réfléchir. Leur stratégie n'est pas vraiment subtile. Ils consommeront une drogue pour augmenter leur puissance s'ils en ont sur eux,
                dégaineront leurs armes ou attraperont le premier objet mortel à leur portée et se jetteront dans la mêlée en chargeant. Si l'un d'eux arrive à tuer un ennemi, ils pourront
                s'acharner sur le corps sans s'inquiéter des autres ennemis autour. Ils voudront un trophé à montrer à leur responsable pour espérer grimper dans les échelons.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Lieutenants et les Caporaux</strong> sont plus tacticiens et réfléchis. Ils donneront des ordres pour envoyer les sousfifres en premières lignes et attaqueront
                soit à distance avec une arbalète soit en traitre sur les flancs ou par derrière. Ils ne penseront pas directement à déclencher une alerte dans la cité sauf si le Seuil
                d'Alerte est déjà trop haut et que la cité est en alerte. Après quelques Soldats, Jeunes ou Soumis tués, un Lieutenant ou un Caporal essayera de sortir du comabt pour
                alerter les femelles. Il ne faut pas oublier que pour les responsables il y a toujours un risque d'être accusé de lacheté s'ils quittent le combat. Ce n'est pas une
                décision qu'ils prendront rapidement au risque d'être réprimandé lourdement par une Soeur ou une Matrone.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Filettes et les Soeurs</strong> pourront se jeter dans le combat en utilisant toute la panoplie de leurs pouvoirs si elles sont isolées des mâles ou elles se
                placeront en commandantes des mâles aux alentours pour les faire attaquer les intrus ou pour les protéger. Le pouvoir magique des Soeurs les rend arrogantes. Elles ont
                l'habitude de diriger et de dominer. Elles ne seront pas différentes avec un groupe de PJ ennemis qu'avec les captifs. Après une démonstration de puissance des PJ, une
                Soeur peut décider de quitter le combat pour aller prévenir les autres Soeurs ou les Matrones mais, comme pour les Lieutenants, elle pense, à raison, que ce comportement
                lui apportera mépris et honte devant sa couardise.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>Les Matrones</strong> sont, au final, assez rarement en danger dans la cité. A part, les conspirations entre elles et les menaces d'une Soeur voulant prendre sa
                place, une Matrone n'est pas habituée à une situation de danger. Elles déveleoppent leurs pouvoirs magiques et elles s'entrainent souvent aux maniement des armes mais elles
                n'ont que peut d'occasion de pratiquer en réalité. Les Soeurs sont souvent envoyées en missions de kidnapping dans les montagnes mais les Matrones restent en sécurité dans
                la cité. Elles n'en restent pas moins un danger extrême quand ont voit leurs capacités mais elles auront du mal à estimer le rsique qu'elles prennent face au groupe de PJ,
                aux centaures ou aux capitifs libérés. En dernier recours, si certaines Matrones sont tuées par les PJ et que les dernières sont au courant, elles essayeront de récupérer
                le maximum de Filettes encore vivantes, quelques mâles exsangues et essayeront de prendre la fuite dans un des bâteaux du port ou via le passage secret (vers A4) ou dans
                les tunnels du nord (en A2).
              </p>
            </li>
          </ul>
          <p class="paragraphe">
            Tous les elfes exsangues de la cité (sauf les Soumis) n'hésiteront pas une seule seconde d'utiliser des captifs comme boucliers humains ou comme menace. Pour eux ce sont des
            ressources aussi éliminables qu'efficaces.
          </p>
          <hr />
          <h2>Entrées/Sorties</h2>
          <ul>
            <li>
              <p class="paragraphe">
                <strong>A1 :</strong> au niveau du lac, il y a deux entrées. La première, vers B1, est une porte dissimulée dans la paroi rocheuse. Elle n'est pas fermée mais assez
                difficile à voir. La deuxième, vers E1, est le boyau creusé par la rivière souterraine qui donne sur une partie de la cité.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>A2 :</strong> débouchant à environ deux kilomètres au nord de la cité, ce dédale de tunnels a été creusé par les elfes exsangues pour exploiter les minerais de la
                montagne et pour entrer ou sortir des objets volumineux dans la cité. Les tunnels, grottes et cavernes servent de mines, de déchetterie et de lieux de chasse pour les elfes
                exsangues. Ces couloirs sont habités par une multitudes de créatures des souterrains. Ce passage arrive dans la cité vers les grottes B12 et B8.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>A3 :</strong> il est impossible de passer dans le boyau de la rivière souterraine au nord des grottes B12. Très étroit et escarpé, le tunnel peut uniquement servir
                de cachette sur les première mètres.
              </p>
            </li>
            <li>
              <p class="paragraphe">
                <strong>A4 :</strong> cette sortie, au sud de la cité, est laval de la rivière souterraine. Accessible depuis le port (en E10), cet accès est fermé par une lourde herse en
                métal. La rivière poursuit sa voie dans des tunnels assez larges pour laisser passer une embarcation moyenne sur une vingtaine de kilomètres. La rivière débouche au
                nord-ouest dans un lac d'altitude. En suivant la petite rivière qui continue son chemin après le lac, on se dirige vers les Grandes Plaines de l'Ourann à quelques dizaines
                de kilomètres de la Forteresse-état d'Arkar'Um.
              </p>
            </li>
          </ul>
        </div>
