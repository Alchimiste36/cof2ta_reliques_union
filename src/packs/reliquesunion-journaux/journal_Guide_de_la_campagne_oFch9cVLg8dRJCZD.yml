      content: >-
        <div class="journal-cof2ta-ru"><h1>Histoires imbriquées</h1><h2>Braenor
        du Temple</h2><p class="paragraphe"><strong>Peuples requis : Nain du
        Bouclier, du Temple, de la Forge ou du Talion</strong></p><h3>Histoire
        initiale</h3><p class="paragraphe">Braenor est un nain du temple,
        exorciste assez puissant, il recherche le Traité de la Matière et de
        l'Ether pour redonner la puissance du peuple nain. Il parcourt les
        ruines abandonnées de mines, citées, lieux importants des nains pour
        trouver un exemplaire. Cette recherche le rend de plus en plus sombre et
        malfaisant.</p><p class="paragraphe">Braenor est prit au piège dans une
        ancienne mine par le même démon que Ramell pour l'aider à résoudre sa
        quête. Le démon développe sa corruption, sa puissance et son
        intolérance.</p><p class="paragraphe">Au réveil de Ramell, le démon
        immortel prend contact avec Braenor pour l'aider à trouver la Relique
        des Nains en échange de ressources pour sa propre recherche du
        Traité.</p><p class="paragraphe">Enfermé dans Hyrr'Tarënn, Braenor
        développe une profonde haine contre Ramell se sentant trahi et abandonné
        par l'humain immortel.</p><h3>Rôle du PJ</h3><p class="paragraphe">Le PJ
        ayant cette histoire est soit un guerrier du bouclier ou de la forge, un
        érudit du temple, un marchand du Talion. Il accompagne Braenor avec une
        équipe d'exploration vers un ancien temple nain dans les montagnes au
        nord d'Akar-Bram. Attendant Braenor à l'entrée du temple, la compagnie
        se fait attaquer par un démon tentaculaire sortant de la caverne et
        décimant toute la compagnie sauf le PJ tombé dans une crevasse. Les mots
        prononcés par Braenor et le massacre de l'expédition ne laissent aucun
        doute sur l'implication de l'exorciste dans cette attaque.</p><p
        class="paragraphe">Le PJ a pour mission de retrouver Braenor du Temple,
        le détruire et rendre justice pour ces compagnons morts dans les
        montagnes.</p><h3>Impact sur la campagne</h3><p
        class="paragraphe">Braenor est enfermé dans la cité d'Hyrr'Tarënn depuis
        plusieurs semaines. Il est a moitié fou à cause de l'influence du démon
        Mangeur des Rêves. Il recherche le Traité de la Matière et de l'Ether
        sans grand succès.</p><p class="paragraphe">Les informations de Braenor,
        dans son carnet, auront un impact sur l'implication de Ramell et une
        première piste sur la présence d'un démon au-dessus de lui.</p><hr
        /><h2>L'honneur des Errants</h2><p class="paragraphe"><strong>Peuple
        requis : Nain errant</strong></p><h3>Histoire initiale</h3><p
        class="paragraphe">Dans la région des hautes collines de l'Ourann, au
        sud de la cité d'Edenskar, une multitude de village de nains errants
        s'est développé depuis plusieurs années. La vie y est dure et fatigante
        mais les tribus s'entraident face à la météo, aux récoltes manquantes ou
        aux attaques de peaux vertes.</p><p class="paragraphe">Malgré leur
        isolement, la Grande Route de l'Ourann permet à certaines
        cité-forteresse naine d'atteindre plus facilement cette région et depuis
        quelques années, les soldats du Bouclier, les noble du Talion et les
        puissants de la Forge réclame un impôt de plus en plus élevé aux
        Errants. Les persécutions augmentent, les discriminations sont
        nombreuses et la colère des Errants s'intensifie surtout chez les
        jeunes. Un vent de révolte se propage dans les villages.</p><h3>Rôle du
        PJ</h3><p class="paragraphe">Le PJ est un jeune nain voyant ses parents
        être opprimé par des soldats. Il comprend que le nom des ses parents,
        par la figure de sa mère est connu et reconnu pour ces appels à la
        révolte et à la liberté. Des textes politiques sont transmis de villages
        en villages pour fédérer les Errants contre l'injustice de leur statuts,
        écrit par sa mère.</p><p class="paragraphe">Le/la jeune naine est fière
        jusqu'au jour où une armée du Bouclier débarque dans les collines et
        qu'une guerre se déclenche. Les parents du PJ sont capturés et exécutés
        pour l'exemple et le PJ doit fuir pour sa vie. Il/elle a perdu ses amis,
        sa famille, son village mais le PJ a gagné une rage intense et une envie
        de justice dans les tripes.</p><p class="paragraphe">Son nom est
        dangereux mais la philosophie de sa mère doit se propager dans les
        grandes plaines de l'Ourann pour que les Errants se soulèvent un jour,
        enfin.</p><h3>Impact sur la campagne</h3><p class="paragraphe">Tout au
        long des voyages dans l'Ourann et dans les montagnes, le PJ obtiendra
        plus d'informations et de convivialité des Errants qu'il croise. Si son
        nom venait à être révélé, une menace suivrait le parcourt des
        aventuriers.</p><p class="paragraphe">Lors du confinent dans la cité
        d'Hyrr'Tarënn, des villages de Errants seront enfermés avec les
        aventuriers. Avec son nom et ses objectifs, le PJ deviendra un point
        clef dans la reconnaissance de l'ordre des Errants face aux autres
        ordres du peuple nain.</p><p class="paragraphe">La persécution des nains
        Errants est également un symbole de la persécution des anciennes races
        par les humains et de ce racisme qui se propage dans les Terres
        d'Arran.</p><hr /><h2>Tel'Quessir</h2><p
        class="paragraphe"><strong>Peuple requis : Elfe blanc ou
        sylvain</strong></p><h3>Histoire initiale</h3><p
        class="paragraphe">Cette histoire est ancienne et largement oubliée par
        la plupart des elfes.</p><p class="paragraphe">La prophétie de
        Tel'Quessir est lié à une organisation nommée Tel'Quess'Aar Tilka, les
        Gardiennes du Basculement. Mais pour comprendre il faut remonter
        quelques siècles plus tôt avec la naissance et la chute du Culte de la
        Balance.</p><p class="paragraphe">Le culte de la balance est une
        ancienne religion aujourd'hui oubliée et méprisée par les quelques
        érudits qui s'en souviennent. Son rôle initial était de conserver les
        équilibre entre les peuples elfiques afin d'annuler l'effet du grand
        schisme et réunifier les elfes en un seul peuple.</p><p
        class="paragraphe">Si cette idéologie parait saine et inoffensive, son
        application a vite créé d'énormes problèmes au sein des communautés
        elfiques. De nombreux débats ont bouleversés la politique des hauts
        dignitaires face aux "accomplissements" du culte de la Balance.</p><p
        class="paragraphe">Pour équilibrer la balance géopolitique, d'abord au
        sein des peuples elfes puis de toutes les espèces des Terres d'Arran, il
        convient d'intervenir le plus vite possible et s'interposer entre les
        puissants du monde. Assassinats, raids meurtriers, empoisonnements,
        kidnapping, menaces et tortures, les prêtres de la Balance justifiaient
        leurs actes à chaque fois. Eviter une guerre, placer le bon dirigeant,
        inciter un mariage… des excuses qui permirent au culte de manœuvrer dans
        un silence des quelques personnes misent au courant de leurs
        agissements.</p><p class="paragraphe">Nenandir, un prêtre du culte de la
        balance, utilisa ses pouvoirs de divinations pour son propre intérêt
        entrainant l'assassinat d'une jeune elfe sylvaine de 8 ans. Le scandale
        qui suit ce meurtre met la lumière sur cette religion agissant dans
        l'ombre des puissants.</p><p class="paragraphe">Le nom de la juge du
        procès de Nenandir devint un symbole, à cette époque, de la lutte contre
        la corruption et la vanité des puissances elfiques sur les Terres
        d'Arran. Tintaëlle Siar'yn fut anoblie quelques années après le procès
        et consacra le reste de sa longue vie à traquer et juger les dirigeants
        vaniteux, interventionnistes et aux idées coloniales. D'après certains
        passages du grimoire, la juge Siar'yn aurait pu être la créatrice des
        Tel'Quess'Aar Tilkaa, les Gardiens du Basculement, sans qu'aucune preuve
        ne puisse attester ces dires.</p><p class="paragraphe">Les histoires
        racontent que la descendance de la juge Siar'yn serait parcouru d'une
        forte magie et de pouvoirs pouvant renverser les rois et les empereurs.
        Aucune manipulation, aucun mensonge, aucune manigance ne pourrait faire
        fléchir la volonté des femmes de cette lignée. Leurs pouvoirs
        permettraient de connaitre les sombres pensées de leurs interlocuteurs
        et de révéler les complots rampants dans l'ombre.</p><p
        class="paragraphe">Le terme Tel'Quessir fait référence a une descendante
        de cette lignée qui pourrait décider entre laissé le basculement se
        faire ou intervenir pour l'empêcher. Ce papillon voyant le monde avec
        les yeux d'un nouveau né pourra influencer le cours de
        l'histoire.</p><h3>Rôle du PJ</h3><p class="paragraphe">Le PJ qui vit
        dans un endroit isolé des turpitudes du monde se retrouve expédier vers
        Blanche Paix quasiment du jour au lendemain après une expérience
        mystique avec sa mère. Cette dernière change totalement de tempérament
        avec le PJ qui entend des chuchotements entre son père et sa mère avant
        de se faire chasser de la ville.</p><p class="paragraphe">Le seul mot
        qui reste gravé dans son esprit est « Tel'Quessir ». Ce mot inconnu
        prononcé par sa mère est un mystère. « Si c'est le Tel'Quessir nous
        devons le/la faire partir quelque soit les dangers. »</p><p
        class="paragraphe">Le PJ se retrouve dans une région inconnue bien loin
        de sa vie d'avant bien décidé de suivre sa voie et de découvrir en même
        temps la signification du Tel'Quessir.</p><h3>Impact sur la
        campagne</h3><p class="paragraphe">Cette histoire est importante pour la
        campagne car elle donnera au PJ le moyen de détruire définitivement des
        démons grâce au pendentif des deux phalènes que sa mère lui donne en le
        chassant. Permettant de détruire une bonne fois pour toute Ramell et le
        démon Mangeur des Rêves à Hyrr'Tarënn, cette histoire imbriquée est
        assez dure à jouer pour le joueur qui restera longtemps dans le flou sur
        les concepts, organisations et explications sur son rôle.</p><p
        class="paragraphe">Dans tous les cas, le PJ aura un impact important sur
        la campagne car en fonction de ses idées, ses actions et son
        interprétation des événements, il pourra décider de détruire Ramell ou
        le laissé prospérer.</p><hr /><h2>Rescapé amnésique</h2><p
        class="paragraphe"><strong>Peuple requis : Peau
        Verte</strong></p><h3>Histoire initiale</h3><p class="paragraphe">Aidée
        par Hisp Galik, Amanori Bellara a trouvé et activé le Plastron de
        l'Union dans une région sauvage au nord de l'Ogrie. Les pouvoirs de la
        relique et l'influence de Ramell permet à cette femme de contrôler des
        Peaux Vertes des villages environnants en les manipulant.</p><p
        class="paragraphe">Elle utilise les peaux vertes pour se constituer une
        large armée et conquérir d'autres lieux pour étendre son influence avec
        une visée suprémaciste des humains sur les races anciennes.</p><p
        class="paragraphe">Longtemps positionnée dans la grande ville Orcs où
        elle a découvert le Plastron au niveau de l'immense statue du couple
        enlacé, Amanori Bellara n'est pas tendre avec les orcs présents sur
        place usant de torture, de menace et de drogue sur eux.</p><h3>Rôle du
        PJ</h3><p class="paragraphe">Le PJ est une peau verte particulièrement
        compétente qui se réveille dans une cellule des prisons de Blanche Paix
        sans savoir comment il a atterri là. Il n'a plus aucun souvenir depuis
        des mois. Le dernier souvenir flou qui lui revient en rêve
        régulièrement. Il voit une grande ville Orc au pied d'une falaise sur
        laquelle une immense statue d'un couple d'Orc s'enlace tendrement. Il
        ressent un sentiment de plénitude à chaque fois qu'il repense à cet
        endroit.</p><p class="paragraphe">Au fur et à mesure de leur découverte
        des manigances de Ramell et d'Amanori, les souvenirs du PJ reviendront
        pour découvrir qu'il vivait dans cette ville avant qu'Amanori utilise la
        relique sur lui et sa famille. Il a été le pantin pour elle pendant
        plusieurs semaines et elle l'envoya dans les grandes plaines de l'Ourann
        pour recruter des Peaux Vertes et les envoyer vers l'Ogrie pour grossir
        les rangs d'Amanori.</p><p class="paragraphe">Molesté par des brigands
        et laissé pour mort proche de la ville de Blanche Paix, le PJ se fait
        emprisonné dans une cellule. Après plusieurs jours, la manipulation du
        Plastron n'agit plus et le PJ retrouve son libre arbitre. Il ne lui
        manque plus que ses souvenirs !</p><h3>Impact sur la campagne</h3><p
        class="paragraphe">Ce PJ sera certainement plus hargneux que les autres
        face aux agissements d'Amanori Bellara, de Hisp Galik ou de Ramell quand
        ses souvenirs reviendront des tourments qu'il a vécu sous le joug de «
        la Compagnie de justice ».</p><p class="paragraphe">Le rôle de ce PJ est
        de tendre vers une vengeance face aux ennemis mais aussi de pouvoir
        fédérer les peuples de Peaux Vertes face à cette menace qu'il a vécue
        dans sa chair.</p><hr /><h2>Lien de corruption</h2><p
        class="paragraphe"><strong>Peuple requis : Elfe Sylvain, Humain, Orc ou
        Gobelin</strong></p><p class="paragraphe"><strong>Profil requis :
        Mystique</strong></p><h3>Histoire initiale</h3><p class="paragraphe">Le
        lien avec les forces de la nature, aussi appelé le chant de la terre par
        les elfes, est plus ou moins fort entre les différents habitants des
        Terres d'Arran. La façon dont un elfe, un orc, un gobelin ou un humain
        se connecte à ces sensations et perçoit cette force est très variable
        mais dans tous les cas ce « pouvoir » rend l'individu capable de
        percevoir des flux, des connexions et des relations qui se créent, se
        brisent ou se modifient.</p><p class="paragraphe">Ce pouvoir peut se
        déclencher dans des rêves plus ou moins abstrait ou par des visions
        mettant la personne dans une transe éveillée.</p><p
        class="paragraphe">La vie quotidienne d'un homme du peuple est souvent
        trop intense pour percevoir cette capacité mais d'en de rare cas, les
        rêves, les visions ou les sensations sont tellement fortes qu'on ne peut
        pas les ignorer. Dans la plupart des cultures, révéler ce genre de
        capacité peut venir avec un risque de stigmatisation ou de rejet.</p><p
        class="paragraphe">Les bouleversements apportés par Ramell, Amanori et
        l'attaque du village des elfes sylvains sont tellement grands que, même
        à plusieurs milliers de kilomètres certains habitants ressentent la
        corruption et le sentiment de danger qui augmentent.</p><h3>Rôle du
        PJ</h3><p class="paragraphe">Le PJ habite un village ou une ville. Il
        est ni détesté ni apprécié car il aime la solitude de ses recherches ou
        les grandes explorations solitaires dans sa région. Il mène une vie
        simple et heureuse au milieu d'une communauté agréable.</p><p
        class="paragraphe">Sans trop savoir pourquoi, il est plutôt doué pour
        ressentir les gens et les situations depuis qu'il est petit sans que ça
        ai un impact significatif sur sa vie. Il a quelques souvenirs de moments
        où il ressenti un danger avant qu'il n'arrive ou un autre où ses pas le
        dirigèrent vers un endroit où il devait parfaitement se rendre sans
        savoir pourquoi.</p><p class="paragraphe">Il y a 7 ans, lorsque le
        Plastron de l'Union a été activé par Amanori Bellara, alors que le PJ
        est seul a ces études ou en exploration, il a un vision de désastre.
        Tout son environnement se noirci, le silence s'abât autour de lui et un
        vent de mort lui prend les tripes. Il sait catégoriquement qu'il n'a pas
        rêvé et qu'un grand danger va déferler sur les Terres d'Arran.</p><p
        class="paragraphe">Si le PJ a un compagnon animal, il peut faire sa
        rencontre durant cet évènement.</p><p class="paragraphe">Personne ne le
        croit et sa vie reprend son cours même s'il se retrouve un peu plus seul
        et rejeté par certains membres de sa communauté.</p><p
        class="paragraphe">Il y a quelques semaines, un nouvel évènement
        propulse le PJ dans une vision de carnage, de mort et de désespoir. Il
        parcourt les rues du village ou de la ville avec tous les habitants
        mourant sous ses yeux, les ombres recouvrir les habitations. Un seul
        endroit semble protégé sur la place principale de la ville. Un rayon de
        lumière forme au sol une zone à cinq côtés qui est protégé de la menace.
        Apeuré au centre de la lumière, il entend la voix du Doigt de l'Union de
        son peuple : « Protège-nous. L'arbre-mère du Val Rouge est en danger.
        Contre la fascination, l'oubli. » ; Le message se termine par le nom
        inconnu du Doigt de l'Union.</p><p class="paragraphe">Le PJ averti les
        anciens de la ville sans aucun succès. Il réalise quelques recherches
        sur l'Arbre-mère du Val Rouge et décide de faire ses bagages en
        direction du nord de l'Ourann. Arrivé à Blanche Paix, il apprend que les
        sylvains sont en conflit avec les humains de la Cité d'Ispier et cherche
        un moyen pour atteindre le village du Val Rouge dans la
        forêt.</p><h3>Impact sur la campagne</h3><p class="paragraphe">Le PJ
        avec cette histoire ressentira à chaque étape les émotions des doigts de
        l'Union ainsi que les forces qui se développent autour des Reliques de
        l'Union.</p><p class="paragraphe">Hypersensible, le PJ sera un grand
        atout pour débloquer les mystères de la campagne et prendre le bon
        chemin tout au long de cette aventure.</p><hr /><h2>Solitaire
        insoumis</h2><p class="paragraphe"><strong>Peuple requis : Gobelin,
        Humain ou Elfe Noir</strong></p><p class="paragraphe"><strong>Profil
        requis : Assassin ou Voleur</strong></p><h3>Histoire initiale</h3><p
        class="paragraphe">Vaerna'yn, un elfe noir, a entendu parler d'un vieil
        objet de pouvoir puissant pouvant mettre les elfes sous domination des
        autres peuples. D'après ces recherches, cette relique est dangereuse et
        pourrait représenter un risque majeur pour les elfes noirs si elle
        venait à être récupérée.</p><p class="paragraphe">Il se met en quête des
        informations concernant cette relique et commence à espionner le mage
        Hisp Galik en comprenant qu'il cherche également cet objet. Alors que
        Vaerna'yn essaye de capturer Hisp Galik pour lui soustraire son savoir,
        l'elfe noir sous-estime le mage et se fait tuer par Hisp Galik. Cet
        événement arrive quelques mois avant l'attaque du village des
        sylvains.</p><p class="paragraphe">Ce que Hisp Galik ne sait pas c'est
        que Vaerna'yn avait un apprenti elfe noir ou un sous-fifre humain ou
        gobelin.</p><h3>Rôle du PJ</h3><p class="paragraphe">Le PJ était au
        service de Vaerna'yn soit en tant qu'apprenti s'il est elfe noir soit en
        tant que serviteur s'il s'agit d'un humain ou d'un gobelin.</p><p
        class="paragraphe">Ayant appris les base du vole et/ou de l'assassinat,
        le PJ utilise les notes et les ressources de Vaerna'yn pour continuer
        ses investigations et essayé de mettre la main sur la Relique de l'Union
        des elfes sans vraiment connaitre son pouvoir.</p><p
        class="paragraphe">Il constate les manipulations du mage et il arrive à
        se faire remarquer et mettre au service de Jaspar Bonarion pour
        poursuivre les kidnappeurs de sa fille Lana'Sir.</p><h3>Impact sur la
        campagne</h3><p class="paragraphe">Ce personnage navigue dans les ombres
        en ce qui concerne ses compétences de voleur ou d'assassin et de ses
        motivations réelles. Au début de la campagne, il cherche à mettre la
        main sur une relique pour son usage ou son profit personnel mais la vie
        avec ses nouveaux compagnons et les menaces de Ramell et d'Amanori
        Bellara suffiront-elles a revoir ses plans ?</p></div>
