  - sort: 300000
    name: Effets passifs de la Relique
    type: text
    _id: 32NfjzrUEYzotzzn
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>Le porteur a de nouvelles \"connaissances\" sur le peuple associé.</p><p>Il connait :</p><ul><li><p><strong>Toutes les langues et patois de ce peuple</strong>. Il peut les\_lire, les écrire et les parler.</p></li><li><p><strong>Les grandes lignes de l’histoire de ce peuple</strong>, les\_personnalités importantes, les légendes pas trop\_enfouies de ce peuple</p></li><li><p><strong>Les traditions et rituels classiques ou communs\_de ce peuple</strong>\_des différents lieux des Terres d’Arran</p></li><li><p><strong>Les expressions et «bonnes manières»</strong> des\_différentes cultures du peuple associé</p></li></ul><p>Ces connaissent donne <strong>un bonus de +10 à tous les test d'INT relatives à de la culture générale en rapport avec le peuple associé.</strong></p><p>Le porteur <strong>ne peut pas vraiment activement fouiller\_dans ses connaissances</strong>. Il réagit instinctivement lorsqu’il doit utiliser ces savoirs.</p><p><em>Par exemple pour le Bracelet de l'Union : lorsqu’il trouve un texte écrit dans un\_ancien dialecte elfique (comme le pendentif), il arrive\_à lire sans problème les mots et les phrases. Lorsqu’il\_interagit avec un elfe, il connait d’instinct les gestes et\_formules de politesse. Lorsqu’il entend le nom d’un\_personnage historique de la culture elfique, il sait\_directement les grandes lignes de son histoire et de\_ses actions.</em></p><hr /><p>De plus, <strong>la Relique offre au porteur un pouvoir d'attraction envers les membres du peuple associé</strong>. Une sensation de confiance ou de respect englobe le porteur face à ce peuple mais aussi légèrement avec les autres peuples.</p><p>Le porteur gagne <strong>un bonus de +5 à tous\_ces tests de Charisme lorsqu’il interagit avec le peuple associé</strong>. Ce bonus est de <strong>+2 face aux autres peuples</strong>.</p><p></p>"
