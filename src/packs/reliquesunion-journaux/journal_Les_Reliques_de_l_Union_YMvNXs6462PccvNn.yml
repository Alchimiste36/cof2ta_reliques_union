name: Les Reliques de l'Union
_id: YMvNXs6462PccvNn
pages:
  - sort: 100000
    name: Introduction sur les Reliques
    type: text
    _id: pW9ujS5jVAO2wr5H
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<h2>Description</h2><p>La Relique possède une légère vibration magique.</p><p>Lorsqu’on l’étudie, on comprend que c’est un objet magique permettant d’obtenir un grand\_savoir sur le peuple associé à la Relique.</p><ul><li><p>Le Bracelet pour les elfes et semi-elfes</p></li><li><p>Le Plastron pour les peaux verts</p></li><li><p>La Ceinture pour les centaures et les animaux</p></li><li><p>La Botte pour les nains</p></li><li><p>Le Pantalon pour les humains</p></li></ul><p>Chaque relique est un objet très beau et bien fabriqué sans être non plus une oeuvre d'art incroyable. A la base se sont des objets réels offert en signe de paix et de coopération.\_</p><h2>Les personnalités des Reliques</h2><p>La véritable magie de la relique est bien cachée car elle vient surtout des deux personnalités qui sont emprisonnées dedans.</p><h3>Les Doigts de l'Union</h3><p>La première personnalité est un des Doigts de l'Union. Ils souhaitent, tous les cinq,\_apporter paix, cohésion, rencontres et apaisement entre les peuples des Terres d'Arran. Chaque Doigt de l'Union a son propre caractère, son sens de l'humour, ses agacements particuliers et ses manières de réagir. Ils sont enfermés dans les Reliques depuis des siècles. Ils partagent la place avec Ramell depuis longtemps et ils n'ont pas eu de porteur depuis des siècles également. En fonction des réactions et des actions du porteur, la personnalité du Doigt de l'Union sera plus ou moins gentille ou autoritaire pour le PJ.</p><p>Détails sur les Doigts de l'Union :\_@UUID[Compendium.cof2ta_reliques_union.reliquesunion-journaux.JournalEntry.YMvNXs6462PccvNn.JournalEntryPage.3tHITRS4FBGHT7kn]{Les Doigts de l'Union}</p><h3>Ramell</h3><p>La deuxième personnalité antagoniste se nomme Ramell. C'était un humain avant de devenir un démon immortel. Il a propagé des théories racialistes et ségrégationnistes pronant la supériosité du peuple humain sur les \"Races Inertes\" comme il les nomme. Il a corrompu les Reliques de l'Union avant d'être emprisonné par l'Ordre de l'Union dans un cercueil scellé dans les caves du Manoir Écarlate à Kosland. Depuis quelques années, il a réussi à s'échapper et il aimerait bien mettre la main sur les cinq reliques pour développer ses plans suprémacistes. Le groupe de PJ découvriront bien plus tard que Ramell a manipulé Amanori Bellara et Hisp Galik dans leur entreprise de soumission des Peaux Vertes.</p><h2>Rôles des Reliques</h2><p>Les Reliques de l’Union sont des artefacts extrêmement puissants qui peuvent être utilisés pour\_émanciper, souder et diriger les peuples associés en canalisant\_les motivations et en inspirant l’espoir et la passion, si les porteurs sont guidés par les Doigts de l'Union et réalisent de \"bonnes actions\" envers leurs prochains.</p><p>Si les porteurs cèdent aux manipulations et aux théories de Ramell, les Reliques de l'Union peuventt être aussi utilisées pour manipuler, soumettre et\_asseoir sa domination sur les peuples en leur inspirant de\_la peur ou du désespoir.</p><h2>Retirer la Relique et Mort du porteur</h2><p>Le porteur d'une Relique ne pourra pas la retirer sans périr sauf s'il découvre le rituel des Cinq Doigts de l'Union qu'il faut réaliser avec tous les porteurs.</p><p>A la mort du Porteur, la Relique met 2d6 heures avant de se détacher du corps du porteur si elle n'a pas été activée. Si elle a été activée par le porteur, la Relique de l'Union mettra [rang]d4 jours pour se détacher du porteur.</p><p></p><p></p>"
