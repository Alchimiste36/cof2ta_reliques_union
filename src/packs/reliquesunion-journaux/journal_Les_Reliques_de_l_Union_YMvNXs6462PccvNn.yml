      content: "<h1>Faïlass, noble elfe blanche</h1><h2>Histoire</h2><img src=\"modules/cof2ta_reliques_union/assets/ru_acteurs/main_des_cinq/main_des_cinq_failass_elfes.webp\" width=\"300\" /><p>Faïlass était une elfe blanche, née sur les Îles Blanches. Après quelques années dans ce havre de paix enveloppé de sérénité, elle suivit sa famille en direction des Grandes Plaines de l'Ourann bercée par les idéaux et l'harmonie présentes sur les îles des elfes blancs.</p><p>Arrivée dans l'Ourann, la famille de Faïlass est confrontée aux idées reçues sur les elfes blancs (peur, croyances, respect disproportionné…). Diplomate, sa mère parcourt la région pour entretenir les relations avec les autres peuples.</p><p>Faïlass suivie cette voie entre diplomacie, négociation et relations commerciales. Sans les préjugés répandus sur les nains, les humains et surtout les peaux vertes, Faïlass discute avec tous les clans, tous les villages, dans toutes les régions.\_Elle est convaincue que la corruption ou la méchanceté n'est pas affaire de peuple ou d'individus mais de l'organisation des sociétés et des préjugés racistes inscrit dans les éducations.</p><p>Après plusieurs décennies à assister sa mère dans son rôle, Faïlass se retrouve seule quand ses parents décident de retourner sur les Îles Blanches. Elle poursuit sa tâche diplomatique avec les dirigeants du grand continent. Elle discute beaucoup avec les forteresses-états naines pour entretenir les relations tendues entre les deux peuples et trouver des arrangements commerciaux et les alliances. Par contre, elle se tient assez éloignée des humains regroupés, à l'époque, en petites villes désorganisées et peu importantes.</p><p>La vie de Faïlass a beaucoup changé après sa rencontre avec Darrag, un jeune orc fils du chef d'un clan important clan orc situé à l'ouest des montagnes des Crocs d'Acier au nord de la Birkanie. Elle a parlementé avec lui durant des mois pour obligé son père et le dirigeant d'un grand village d'elfes sylvains a établir un cessez-le-feu après des années de guerres et de conflits.</p><p>Tout semblait prêt pour arrêter les combats mortels, les deux chefs avaient accepté les conditions et un traité avait été rédigé par Faïlass et Darrag, devenus amis. C'était sans compter sur la trahison des deux camps simultanément. Les chefs orc et elfes décidèrent de briser le traité avant même de la ratifier. Faïlass et Darrag comprirent qu'il ne serait jamais possible de rapprocher les peuples entre eux par des avantages économiques, territoriaux ou des belles paroles. Il faut absolument briser les idées suprémacistes et racistes des peuples sur les autres. Tant que chaque peuple se considérera supérieur aux autres, voudra dominer ou anéantir son voisin et même éduquer leurs enfants avec des idées reçues mensongères, rien ne pourra progresser.</p><p>Devant la trahison de son père, Darrag décida de quitter son clan et de suivre Faïlass dans son nouvel objectif : parcourir les Terres d'Arran pour éduquer et rapprocher les peuples.</p><h2>Caractère\_</h2><p>Faïlass a un caractère très calme et réfléchi. Elle pense avant de parler et elle ne donne son avis que si elle est sur d'elle.\_</p><p>Par contre, elle est vite déçue face à des promesses non tenues et elle a la facheuse tendance à bouder quand une chose l'agace. Elle n'accorde pas sa confiance facilement lorsqu'elle est face à un individu ayant du pouvoir ou vivant dans une grande ville. Faïlass n'a jamais réussi à prendre l'ascendant sur la personnalité de Ramell mais elle n'a pas, non plus, été écarté par le Démon Immortel. Ramell déteste Faïlass et essayera toujours de la perturber dès qu'elle doit organiser ses pensées.</p><p>Elle \"parle\" avec le porteur avec des concepts philosophiques assez complexes et elle peut dévier rapidement de la discution initiale vers de grandes généralisations abstraites et éloignées de la vraie vie. SI le porteur écoute Faïlass et utilise les pouvoir de Dévotion de la Relique, elle pourra l'aider à évaluer les individus que le porteur cotoie. Elle sera également d'une grande aide pour apaiser les peurs et les craintes du porteur.</p><hr /><h1>Darrag, loyal orc</h1><h2>Histoire</h2><img src=\"modules/cof2ta_reliques_union/assets/ru_acteurs/main_des_cinq/main_des_cinq_darrag_peaux_vertes.webp\" width=\"300\" /><p>Ce jeune orc n'était pas le stéréotype du sauvage peau verte impulsif et sanguinaire qui parcourt les histoires des villes humaines, naines ou elfes.</p><p>Mlagré sa naissance comme premier fils du chef de ce grand clan de Birkanie, Darrag n'a jamais eu le physique ni la mentalité d'un grand guerrier, au désespoir de son père. Darrag passait la plupart de son temps avec le chaman du village, les mères ou dans la nature montagneuse du coin. Deux événements de jeunesse forgèrent ses idéaux.</p><p>Le premier intervint à ses 10 ans alors que son oncle l'emmena à la chasse au sangliers dans la vallée voisine. On l'obligea à tuer une grande truie. Malgré les félicitations et célébrations, Darrag retourna sur les lieux quelques jours plus tard et constata la mort d'une portée de sept porcelets innocents. Conséquences invisibles de son acte, les corps froids traumatisèrent le jeune orc.</p><p>Cinq ans plus tard, alors qu'il récoltait des plantes sauvages médicinales à quelques kilomètres du village, Darrag tomba nez à nez avec un groupe de trois chasseurs humains. Les arcs furent bandés des deux côtés, la tension éait intense. Les deux frères et leur soeur ne voulaient pas risquer une blessure mortelle et Darrag n'avait rien contre eux à part les idées reçues sur la méchanceté des hommes.</p><p>Un  geste et un unique mot du plus jeune frère bascula la situation. Il baissa son arc et dit simplement \"Salut !\". La situation tourna à la rigolade générale. Ils partagèrent une soirée à rire, d'anecdotes et de complicité. Cette expérience bâtit profondément le pacifisme de Darrag et sa méfiance envers tous les préjugés des adultes sur les autres peuples.</p><p>Il passa le reste de sa vie à militer contre les guerres et les discriminations. Cela lui permit de rencontrer Faïlass l'année de ses 30 ans. L'elfe blanche et l'orc travaillèrent des mois à la négociation d'un traité de paix entre le clan de Darrag et le village des elfes sylvains proche. A deux doigts de finaliser l'accord, la trahison des deux camps, le père de Darrag et le maître de chasse sylvain, anéanti toutes les chances de rapprochement.</p><p>Darrag prit la décision de quitter son clan et de suivre Faïlass dans ses missions diplomatiques avec pour seul regret de laisser derrière lui sa mère et sa soeur.</p><h2>Caractère</h2><p>Darrag est la définition de l'idéaliste. Il est optimiste et il voit le bon côté de chaque personne et de chaque situation. L'orc a la peau dure sur les insultes ou les critiques qu'il reçoit. Il perd rarement son sang froid et il a appris au contact de Faïlass le besoin de tourner sa langue sept fois dans sa bouche avant de parler. Il a un pouvoir bien utile : il arrive rapidement à créer des liens avec des inconnus. Son sourire et son attitude désamorce souvent les situations tendues.</p><p>Darrag est un non violent radical et il est très légaliste. Ses voyages et ses lectures lui ont apporter beaucoup de connaissances sur les lois et coutumes des différentes régions de l'Ourann. Il rappelle les règles et moeurs dans toutes les situations même face à un chef de clan ou un seigneur.</p><p>Darrag \"parle\" avec le porteur dans un langage assez protocolaire et il a tendance à lister tous les cas particuliers d'une situation ou de trouver des excuses aux personnes ayant fautées. Devant le mépris d'Amanori Bellara pour ses conseils et ses idées, Darrag s'est forgé une carapace introspective et ne s'exprimait que pour rappeler les lois à cette femme ambitieuse manipulée par Ramell. Si un autre porteur équipe le plastron après Amanori, Darrag deviendra un moulin à parole après tant d'années à se taire. Il pourra aider le porteur à analyser les situations avec précision et en prenant du recul.\_</p><hr /><h1>Tissra, puissante naine\_</h1><h2>Histoire</h2><img src=\"modules/cof2ta_reliques_union/assets/ru_acteurs/main_des_cinq/main_des_cinq_tissra_nains.webp\" width=\"300\" /><p>Cette naine, née dans les villages de montagnes au nord d'Akar-Bram, n'a pas eu une jeunesse facile. Les attaques des nains d'Ulfrim étaient fréquentes , apportant leur lot de morts, de stress et de colère pour les habitants de la région.</p><p>Tissra vivait au sein d'une famille de cognards dans un village de cognards. Entourée par des guerriers, des combattants du bouclier, elle grandit avec cette inquiétude persistante, celle qui émanait de sa mère chaque fois que les soldats de la famille partaient en campagne.</p><p>Après la mort de son père et des ces deux frères, Tissra tranforma sa peur en résignation aidant sa mère au quotidien avec l'aide des famille du petit hameau. La jeune naine aidait tout le monde, prêtait main forte pour les semailles ou les récoltes, écoutait les problèmes de couples, de maladie et elle passait du temps avec les anciens et surtout les veuves esseulées.</p><p>Son humour acéré, son bagou et son empathie étaient très appréciés des habitants et Tissra savait ridiculiser ou tenir tête aux voyageurs rustres qui passaient par là.</p><p>Le jour où le village subit une attaque de peaux vertes venues des montagnes, sans aucunes protection des nains du bouclier et du roi d'Akar-Bram, la grande majorité des habitants fut massacrée. Deux jours plus tard à l'arrivée de la compagnie du Bouclier, Tissra reçu comme un coup de poignard le mépris du commandant qui qui embarquait sans ménagement les orphelins mâles pour grossir les rangs de l'armée.</p><p>Tissra déversa sa rage sur le commandant, hurlant insultes et finit par lui décrocher une méchante droite au menton. Avant d'être arrêtée, elle s'enfuit sachant parfaitement que les conséquences de ses actes allaient retomber sur les derniers survivants du village.</p><p>Elle vécue comme une errante pendant plusieurs années avant de rencontrer Faïlass et Darrag. L'elfe blanche et l'orc reussirent à transformer la colère et l'indignation de Tissra en une puissante détermination.</p><p>Tissra n'a que trop bien connue le résultat des guerres, de la haine et de la discorde. Elle est déterminée à mettre son énergie à combattre les impérialismes et toutes les sortes de suprémacisme.</p><h2>Caractère</h2><p>Tissra est une naine avec un fort caractère et une langue bien pendue. Elle aime provoquer ses interlocuteurs avec beaucoup de sarcasmes et d'ironie. Elle énonce les vérités sans détour ni souplesse et recadre souvent les discussions qui tournent en rond.</p><p>Elle ne supporte pas les petits chefaillons qui usent de leur position. Toute personne qui n'écoute pas et n'essaye pas de comprendre les différents points de vue est insupportable pour Tissra. A part durant sa période de fuite, elle n'a jamais baissé les yeux devant un seigneur, chef de guerre ou un roi et ce n'est pas prêt d'arriver.\_</p><p>Lorsqu'elle était errante pour se cacher des responsables du Bouclier, Tissra a connu la discrimination de ces nains méprisés et maltraités. Elle n'acceptera plus jamais de rester passive devant une scène de répression d'un nain errant ou, de façon plus général, d'un faible.</p><p>C'est le seul Doigt de l'Union qui résiste efficacement aux pensées et manipulations de Ramell grâce à son fort caractère et sa détermination. Ramell l'a hait de toutes les fibres de son \"corps\" et cette idée remplie de joie Tissra en l'imaginant fulminer dans un coin sombre de la Relique.</p><p>Elle \"parle\" avec le porteur dans un langage direct et sans chichi. Elle n'hésite pas à l'engueuler quand elle considère qu'il prend une mauvaise décision ou qu'il tourne en rond trop longtemps. Tissra est experte pour trancher dans les doutes du porteur et elle pourra canaliser l'énergie du porteur lors de grands discours ou dans des moments de tensions.</p><hr /><h1>Tuatahi, intimidante centaure</h1><h2>Histoire</h2><img src=\"modules/cof2ta_reliques_union/assets/ru_acteurs/main_des_cinq/main_des_cinq_centaures_total.webp\" width=\"300\" /><p>Tuatahi est née dans une petite harde de centaures parcourant les grandes plaines de l'Ourann. Elle et ses proches galopaient joyeusement de vallées en vallées, de collines en collines. Toute la tribu vivait dans une certaine harmonie avec une gestion horizontale et des décisions prises tous ensemble. Ils avaient des rapports sociaux avec les petits hameaux de la région. Que ce soit les hameaux de nains errants, les clans isolés de peaux vertes, les forêts elfiques ou les voyageurs humains, la harde partageait son savoir et son énergie avec tout le monde contre des objets, des renseignements ou juste pour passer de bons moments avec d'autres personnes.</p><p>Tuatahi, jeune et heureuse, avait trois frères et deux soeurs même si la notion de famille dans la harde était plus complexe que seulement un lien de parenté. Comme la plupart des centaures de l'Ourann, elle n'avait aucune haine contre les autres peuples et regardait d'un yeux étonné les conflits entre les elfes, les nains, les peaux vertes ou les humains. Les conceptes de territoire, de ville à défendre, de ressources et de possession étaient étrangers pour les centaures du Pays des Vents.\_Assez nombreux mais dispercés, les centaures préféraient partager que guerroyer.</p><p>Pourtant, ce caractère et le manque d'alliance a conduit ce peuple proche de l'extinction. Malgré leurs bons rapports avec tous les peuples, les centaures n'avaient aucun traité, accord ou partenariat. Dans de nombreuses zones de l'Ourann, les autres peuples se développaient rapidement, construisant des villes, des fermes, des palissades et des avant-postes militaires. Ils réclamaient les terres, bloquaient les chemins, exploitaient les ressources des plaines et chassaient les animaux ou les voisins. Les centaures furent progressivement repoussés dans les zones les plus reculées de l'Ourann, de la Birkanie et du territoire des Mangeurs des Plaines. Partageant un territoire de plus en plus petit avec d'autres peuples en développement, les conflits commencèrent entre les centaures et les humains ou les peaux vertes avant même la naissance de Tuatahi. Aucune aide ne vint des elfes sylvains cloitrés dans leur forêt ni des nains cachés derrière leur murailles épaisses.</p><p>Durant la jeunesse de Tuatahi, la situation se dégrada rapidement et la plupart des centaures étaient menacés par les esclavagistes orcs ou les entrepreneurs humains. Certaines hardes se cachaient dans les montagnes ou les bosquets tandis que d'autres voulaient répliquer en attaquant. La harde de Tuatahi décidèrent d'attaquer un clan orc d'esclavagistes pour libérer les centaures. L'attaque échoua et toute la harde fut tuée ou réduit eux-même aux travaux forcés. A 14 ans, la jeune centaure connue la peur, la douleur, les privations et les discriminations durant plus de 10 ans.</p><p>Elle assistat aux meurtres de la plupart des membres de sa harde. Elle survécut uniquement grâce à son objectif secret ; anéantir jusqu'au dernier les esclavagistes et leurs complices. Elle passait pour une idiote auprès des orcs mais discètement elle récoltait des plantes toxiques, elle volait des matériaux pour fabriquer une lance mortelle et elle piégait le village orc. Le soir de la mort de sa plus jeune soeur, Tuatahi passat à l'action en empoisonnant le chef orc et sa famille, attaquant les gardes et les conduisant dans les pièges. Elle libéra les centaures pirsonniers et ils réussirent à s'enfuirent dans les montagnes. </p><p>Tuatahi ressentie un bonheur immense de voir les 12 centaures survivre grâce à elle. Ce sentiment la guida dans beaucoup de ses choix futurs. Au péril de sa vie et avec une maitrise de plus en plus forte des techniques de combat, Tuatahi créa un groupe de centaures pour attaquer les camps d'esclavagistes et libérer le plus de prisonniers possible. Elle comprit vite que les esclaves venaient de tous les peuples et que les orcs n'hésitaient pas à kidnapper et exploiter d'autres orcs aussi.</p><p>Après plusieurs coups d'éclat, Tuatahi, à 27 ans, rencontra un duo étrange, une elfe blanche nommée Faïlass et Darrag, son coéquiper orc. Ils se battaient pour faire interdir l'esclavage dans cette région des Terres d'Arran en moblisant les seigneurs elfes, nains et humains. Tuatahi témoigna face aux puissants de ce monde avec l'aide de Faïlass et Darrag. Leur détermination permis de faire avancer grandement les idées d'un avenir sans esclave même si le chemin semblait encore long avant que tous les peuples ne s'accordent sur ce point. Tuatahi sympathisa grandement avec le duo et elle les suivit pour assurer leur protection avec une dizaines de guerriers et de guerrières centaures.</p><p>Mois après mois, Tuatahi devint le symbole de la puissance juste et devint une crainte pour tous les malfrats exploitant le malheur des faibles pour leurs profits.</p><h2>Caractère</h2><p>Tuatahi est intransigeante et sévère. Ses valeurs sont inscrites dans sa chair et n'est pas né celui qui la fera broncher. Elle est sèche dans les discussions et elle se méfie énormément des beaux discours et des promesses. Pour la centaure, la fin justifie les moyens et une bonnes paires de tornioles sont parfois nécessaires pour changer les idées d'un individu borné.</p><p>Elle possède un amour profond pour la nature sauvage et les animaux qui ne ressentent ni haine ni rancoeur ni suceptibilité. Pour elle, la faune sauvage est le symbole d'un monde qui peut vivre en harmonie et en équilibre. Elle est très proche de Tissra malgré les étincelles qui jaillissent entre elles quand elles ne sont pas d'accord sur une action.</p><p>Enfermée dans la Relique, elle est piégée et séquestrée. Avant même la corruption de Ramell et ses pensées intrusives, Tuatahi n'a jamais supporté cette prison mentale. Elle est très introvertie dans cette cage fermée et ses pensées se tournent souvent vers la nostalgie des grands espaces verdoyants des plaines de sa jeunesse. Elle a grandement laissé la place à Ramell et elle ne fera pas facilement des efforts pour aider le porteur.</p><p>Elle \"parle\" peu avec le porteur au début et elle l'aidera uniquement à calmer ses pensées vers un objectif clair et efficace. Tuatahi veut ressentir la liberté et le soutien. Si le porteur arrive à comprendre ce besoin et à agir pour libérer l'esprit de la centaure de cette sensation d'impuissance, elle retrouvera une force mentale impactante contre Ramell. En utilisant à bon escient les pouvoirs de la Relique et en impactant le monde qui l'entoure, le Porteur prouvera à Tuatahi qu'elle peut encore se battre pour un monde meilleur et contre les idées suprémacistes et rétrogrades du Démon Immortel.</p><hr /><h1>Sura, érudit humain</h1><h2>Histoire</h2><img src=\"modules/cof2ta_reliques_union/assets/ru_acteurs/main_des_cinq/main_des_cinq_sura_humains.webp\" width=\"300\" /><p>Sura est un humain d'une famille noble de la citadelle d'Orkadia. Il reçu une éducation, il grandit loin des problèmes et il avait une vie toute tracée vers un métier intellectuel comme son père, premier conseiller du conseil des seigneurs de la cité. Son apprentissage des langues, des textes anciens et des lois lui ouvrit les portes des meilleurs professeurs de la cité et Sura reçu en parallèle les bases de la magie élémentaliste. Il suivait les traces feutrés de son père avec le soutien de sa mère, une écrivaine à la renommée montante dans les cercles de lectures des soirées mondaines. Sa vie à la cour et son esprit affuté conduisit Sura vers le clergé de Solima, une religion puissante et répandue chez les privilégiés dans les villes humaines. Autant le bas peuple priait une multitude de divinités toutes plus utilitaire que l'autre autant Solima avec un cadre et un dogme qui plaisait dans les châteaux, les manoirs et les quartiers nobles.</p><p>Sura monta dans les échelons de cette religion et après quelques années de bons et loyaux services, il devint évèque de Solima dans la cathédrale d'Orkadia à 37 ans à peine. Il suivait les évolutions de l'église de Solima, propageait ses idées et aidait à conceptualiser les textes anciens pour mieux comprendre le grand plan de Solima. Son envie était de permettre à tous les habitants, même les plus pauvres et les moins éduqués, de comprendre la pensée fondamentale de ce culte.</p><p>L'un des premiers principe de Solima d'après un des anciens textes fondateur de la religion était l'équilibre parfait entre le corps, l'esprit et la lumière. Sura se consacra donc à développer les trois piliers en même temps. Il s'entraina, se muscla et développa son agilité et ses réflexes pour avoir un corps à l'abri des maladies et des blessures. Il étudia encore plus dans tous les domaines et cultiva sa réthorique et sa logique pour obtenir un esprit plus affuté qu'une lame de rasoir. Enfin, il passa de nombreuses heures à aider son prochain et à parcourir les bas quartiers d'Orkadia pour soigner, conseiller et soutenir les nécessiteux pour propager la lumière intérieure de Solima autour de lui.\_</p><p>Il fut consacré Paladin de Solima par le cardinal d'Orkadia avec une fierté immense. Il allait pouvoir maintenant propager cette belle et douce religion au-delà des fortifications de la cité d'Orkadia et parcourir le monde, guidé par l'énergie de Solima.</p><p>Les problèmes commencèrent quelques temps après son départ de la grande ville. Lors de ses voyages, il découvrit une autre version des préceptes de Solima dans les villages, les campagnes et les villes humaines de taille moyenne. Sura rencontra des curés et des prêtres maltraitant le dogme pour leur propres intérêts. Ces \"adorateurs de Solima\" tournaient les phrases pour culpabiliser les fidèles, les obliger à faire des offrandes et des sacrifices à l'église et pour propager le rejet et même la haine des autres religions des villageois. Partout où il se rendait, Sura constatait un clergé verolé par des ambitieux prêtres et cardinaux corrompus et travestissant les principes les plus simples de Solima. Ces serviteurs divins vivaient dans le luxe, la pervertion et la soumission des fidèles. Ils usaient de leur position dans l'église pour silencier leurs actes abjectes. Personne n'osait parler par peur ou complicité même dans les hautes sphères politiques.\_</p><p>En quelques années, malgré ses efforts et ses recours auprès des plus importantes instances de Solima, Sura fut témoin du changement progressif du clergé de Solima et l'augmentation de sa puissance dans toutes les strates de la scoiété. Des rois, surtout d'Yrlanie, édictèrent des lois punissant de mort les hérétiques, emprisonnant les croyants de certaines vieilles religions et obligeant les fermiers, les artisans et commerçants à verser des impôts à l'église en échange d'une vie parfaite pour leurs descendants ou dans les contrées de l'après-vie. Ce concept d'après-vie, totalement absent des textes fondateurs de Solima, rendait fou Sura car elle permettait aux prêtres de maltraiter les habitants en leur promettant un futur meilleur dans leur tombe.</p><p>Sura se dressa contre ses nouveaux principes devant le conseil de la cathédrale d'Orkadia et il reçu une excommunion définitve des cardinaux ayant tous remplacé leurs robes de lin blanches aux rayons de Solima bleus par des robes drapées en soie brodées de fils d'or et accompagnées par des bijoux tous plus gros et ostentatoires que les autres.</p><p>Sura se battit plusieurs mois pour essayé de faire entendre sa voie auprès des rois et des seigneurs puis dans les quartiers populaires mais malgré son charisme, il se heurtait à un mur trop épais pour lui.</p><p>A 45 ans, il rencontra un groupe de quatre compagnons étranges qui partageait les principes de Solima même s'ils ne portaient pas son nom. L'elfe blanche Faïlass, l'orc Darrag, la centaure Tuatahi et la naine Tissra se battaient au quotidien pour aider les peuples à s'entendre, développer des accords diplomatiques et commerciaux ou apporter la paix dans des régions entières. Sans utiliser les pricnipes de Solima, ils équilibraient le corps, l'esprit et la lumière autour d'eux.\_</p><p>Sura mit son épée et son armure à leur service, bien décidé de propager la vraie vision de Solima sur son passage.</p><h2>Caractère</h2><p>Sura est un humain aux convictions marquées au fer rouge dans son coeur et son esprit. Il est extrêmement cultivé et peut parler un grand nombre de langues et de dialectes. Il est convainquant et enflammé quand il développe des concepts mystiques autour du rôle de chaque individu et du lien entre les êtres vivants.</p><p>Sura est persuadé qu'il réussir à retrouver la religion réelle de Solima et que ses convictions vont le guider sur le bon chemin pour abattre la corruption du clergé et libérer les fidèles. Il tient tête à Ramell avec coeur même si ce dernier se moque frontalement de ses idées et méprise grandement sa naïveté. Les deux personnalités peuvent entrer dans des débats explosifs. L'ancien Paladin est convaincu que les fidèles auront la force d'ouvrir les yeux sur l'absurdité de leur croyance alors que Ramell se réjouï des milliers d'humains si facilement manipulables pour la grandeur du peuple dominant. Un troupeau obéissant contre les races inertes.</p><p>Sura \"parle\" au porteur avec toute ses convictions. Il pousse le porteur avec beaucoup d'insistance ver des actions nobles, pures et parfaites. Il essayera de faire du porteur un modèle de vertu dans le dogme premier de Solima. Il envoie beaucoup d'énergie au porteur et peut devenir un phare d'espoir si le porteur l'écoute beaucoup.</p>"
