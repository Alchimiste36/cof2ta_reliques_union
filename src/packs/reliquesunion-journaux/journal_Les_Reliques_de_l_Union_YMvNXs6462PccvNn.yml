  - sort: 600000
    name: La Voie de la Relique de l'Union
    type: text
    _id: GKVJ7NgWcRHZ8pgl
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>Composée de cinq capacités, la Voie est identique pour chaque Relique de l'Union. Elle offre à chaque rang de nouvelles capacités pour le porteur.\_</p><p>Le MJ doit garder secret au maximum la distiction entre les pouvoirs liés au Fanatisme et ceux liés à la Dévotion afin que le porteur utile les pouvoirs sans chercher à jouer avec la jauge. A force d'utiliser les pouvoirs, le porteur devrait se rendre compte de l'influence grandissante du Doigt de l'Union ou de Ramell sur sa personne.</p><h2>Influence de la Relique sur le porteur</h2><p>Les capacités sont puissantes. Les Reliques de l'Union sont des objets magiques qui doivent avoir un vrai impact sur les situations quand le porteur les utilise. Par contre, le MJ doit contre-balancer leur pouvoir en augmentant l'impact des personnalités de la Relique sur le quotidien du PJ :</p><ul><li><p>Des rèves étranges et perturbants</p></li><li><p>Des hallucinations lancées par la personnalité de la Relique ou par Ramell</p></li><li><p>Des trous de mémoires inquiétant</p></li><li><p>Des séances de somnambulisme qui amène le PJ dans des endroits incongrus</p></li><li><p>Des informations stratégiques récoltées par Ramell à l'insu du PJ</p></li><li><p>Des signes physiques qui seront visibles par des quidams (des yeux luisants, la couleur de la peau qui prend celle du peuple associé à la Relique, la voix qui change, le PJ qui lévite légèrement pendant qu'il réfléchi…). Ces signes créeront du rejet ou au contraire une fascination malsaine des gens.</p></li><li><p>et même des actions imposées au PJ s'il utilise fréquemment les pouvoirs des Reliques (autoriser un test de CHA en augmentant la difficulté en fonction de la jauge du porteur ou de son nombre d'utilisation des pouvoirs de la Relique)</p></li></ul><p>Chaque MJ devra créer une nécessité d'utiliser la Relique et une tension liée à elle en fonction de chaque porteur, de leurs motivations, de leur jauge Dévotion/Fanatisme et des différence entre la personnalité du Doigt de l'Union ou de Ramell avec le caractère du personnage.</p><h2>Capacités de la Relique\_</h2><h3>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-objets.Item.0R3zW8mdiv7Xaovx]{Télépathie/Lecture de pensées}</h3><ul><li><p>Télépathie : <strong>Dévotion</strong></p></li><li><p>Lecture de pensées : <strong>Fanatisme</strong></p></li></ul><p>Uniquement utile sur le peuple associé à la Relique, ces deux pouvoirs peuvent être utiles pour obtenir des informations ou pour communiquer discrètement avec en autre PJ du groupe ou un allié.</p><h3>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-objets.Item.m2EUkMmrpORfkGBb]{Inspiration/Intimidation}</h3><ul><li><p>Inspiration : <strong>Dévotion</strong></p></li><li><p>Intimidation : <strong>Fanatisme</strong></p></li></ul><p>Pour ajouter des bonus aux alliés ou infliger des malus aux ennemis, ces deux pouvoirs fonctionnent sur tout le monde mais est beaucoup plus efficace avec les membres du peuple associé à la Relique.</p><p>Les effets durent longtemps et peuvent donc être utilisés en dehors des combats.</p><h3>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-objets.Item.GuAJdNYamhwdNgHG]{Corrompre/Éveil de la mémoire}</h3><ul><li><p>Éveil de la mémoire : <strong>Dévotion</strong></p></li><li><p>Corrompre la mémoire : <strong>Fanatisme</strong></p></li></ul><p>C'est deux pouvoirs sont moins utiles en combat ou pour développer la \"puissance\" du porteur mais ils contribueront largement à la légende de PJ. En apaisant des traumatismes profondément ancrés sur un individu ou en récupérant une information secrète sur une autre, le porteur verra son influence grandir.</p><p>Les pouvoirs sont utilisable sur tous les peuples avec plus de difficulté pour les membres qui ne viennent pas du peuple associé à la Relique.</p><h3>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-objets.Item.JsB9b2NGQiCtRI0E]{Exaltation/Aliénation}</h3><ul><li><p>Exaltation : <strong>Dévotion</strong></p></li><li><p>Aliénation : <strong>Fanatisme</strong></p></li></ul><p>Arrivé au rang 4 de la voie de la Relique, le porteur débloque un pouvoir extrêmement puissant pour ses alliés et un autre particulièrement redoutable pour les ennemis. A partir de ce moment, le porteur devient réellement capable de faire pencher le cours d'un combat ou d'une situation à son avantage.</p><p>Que ce soit par sa grande zone d'effet, ses effets impactant et sa longue durée, l'utilisation d'un pouvoir du rang 4 devrait toujours être accompagnée par des conséquences bonnes et/ou mauvaises pour le porteur (peur dans les yeux des ennemis subissant Aliénation mais aussi dans ceux des alliés face à la puissance de ce pouvoir, chansons ou histoires racontant les pouvoirs du porteur dans les tavernes, sentiment d'impunité du porteur, adorateurs/adoratrices du porteur…).</p><h3>@UUID[Compendium.cof2ta_reliques_union.reliquesunion-objets.Item.RjLqKMiJV0JaFOIU]{Ascension/Domination/Asservissement}</h3><ul><li><p>Ascension: <strong>Dévotion</strong></p></li><li><p>Domination: <strong>Fanatisme</strong></p></li><li><p>Asservissement : <strong>Fanatisme</strong></p></li></ul><p>Les pouvoirs Ascension et Domination sont une combinaison encore plus puissante des pouvoirs du rang 2 et du rang 4 avec en plus une régénération ou une blessure à tous les tours pour les personnes affectées.\_On peut considérer ces pouvoirs comme quasiment divin pour une grande majorité des habitants des Terres d'Arran. L'uilisation d'un de ces pouvoirs sera un événement majeur s'il y a des témoins qui peuvent raconter la scène (le porteur pourrait être prit pour cible par un seigneur ayant peur de lui, des alliés pourraient rompre les ponts avec le PJ, une religion pourrait apparaitre avec pour avatar le porteur…).</p><p>Le pouvoir Asservissement est, pour la plupart des cultures, une abomination. Prendre le contrôle total d'un individu est très mal vu pour la totalité des peuples. Utiliser ce pouvoir revient à franchir une limite dont on revient difficilement et la tenation sera très forte de recommencer pour ressentir une nouvelle fois cette sensation grisante d'avoir une ou plusieurs marionettes au bout de sa volonté. Le Doigt de l'Union de la Relique sera outré de l'utilisation de la Relique et en fonction de la situation, la personnalité pourrait bloquer l'accès à tous les pouvoirs de Dévotion de la Relique pendant plusieurs heures ou plusieurs jours en quise de protestation.</p><p>Chaque MJ doit imaginer les réactions bénéfiques et négatives pour le porteur et ses alliés lorsqu'un pouvoir de rang 5 est utilisé avec des témoins. Il ne faut non plus oublier les réactions des Doigts de l'Union et de Ramell lorsqu'on utlise un de ces pouvoirs.</p>"
