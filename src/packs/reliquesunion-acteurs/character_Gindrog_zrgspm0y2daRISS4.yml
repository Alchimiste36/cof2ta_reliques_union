  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Gindrog verra cette nouvelle cité libérée
        comme une belle opportunité commerciale et il fera tout pour devenir un
        personnage important pour développer cet avant-poste dans les montagnes.
        Si personne se méfie de lui, il pourra rapidement dévoiler l'emplacement
        de la cité libérée et apporter dans son sillage des marchands avides,
        des brigands ou une population de nécessiteux sentant l'odeur de
        l'or.</p><p>Gindrog voudra aussi connaitre les secrets du Village
        d'Arkanov et des centaures. Il n'a aucun difficulté à voir un diamant
        brut quand il apparait sous ses yeux. La culture exotique et les objets
        étranges des centaures se vendraient à prix délirants dans toutes les
        Terres d'Arran.</p><p>Il reste pessimiste sur l'avenir de cité libérée
        mais tant qu'elle lui apporte des richesses et des opportunités, il
        s'impliquera dans cette aventure.</p>
      public: >-
        <p>145 ans - Nain - Mâle - Captif depuis 8 mois</p><p>Gindrog est un
        marchand, un itinérant. Il transporte ses marchandises un peu partout,
        achète et revend avec une belle marge au milieu. Il avait une vie idéal
        sur les routes, sur les marchés et dans les tavernes. Il en a vu du pays
        mais il préfère toujours se retrouver loin des cités naines là où la
        concurence est moins grande.</p><p>Il passe souvent ses soirées en
        compagnie de bavettes chics qui lui tiennent compagnie et auprès de qui
        il raconte ses périples avec toujours plus d'exagérations et
        d'inventions.</p><p>Pour lui, le quotidien se résume à étaler ses
        marchandises, négocier, charmer et compter ses nouvelles pièces. Tout ce
        vend et à n'importe quel peuple tant que leur bourse est
        pleine.</p><p>Kidnappé durant l'un de ses voyages en transit de Mordrian
        à Arkar'Um, Gindrog fait profil bas et essaye de survivre en se
        rapprochant de ses compagnons d'infortune. Il utilise son bagou et ses
        charmes pour s'intégrer auprès des combattants les plus forts et dociles
        des esclaves pour obtenir de la protection. Il a réussi avec facilité
        face à Bramban, le soldat obéïssant.</p><p>Il fait aussi beaucoup
        d'effort pour être bien vu des elfes exsangues mâles en collaborant avec
        eux lorsque les expéditions rapportent des documents nains ou des objets
        précieux à estimer. Il réussi également à s'attirer les bonnes grâces
        des femelles exsangues dans leur couchettes en simulant (sans grande
        difficulté) son immense plaisir lors des coïts.</p><p> </p>
