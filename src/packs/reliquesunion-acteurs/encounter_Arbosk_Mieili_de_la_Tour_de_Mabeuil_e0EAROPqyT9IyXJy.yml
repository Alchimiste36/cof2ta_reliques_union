    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> Veut plaire à tout le monde - ambiguë sur les anciennes races - noble mais maladroit</p><p><strong>Propos :</strong></p><ul><li><p><em>Je comprend votre colère et votre inquiétude mais soyons uni contre les menaces</em></p></li><li><p><em>je suis sûr que les centaures ne sont pas une menace !\_</em></p></li><li><p><em>la Montagne nous protège et nous protègera</em></p></li><li><p><em>je vous ai bien protégé contre les bandes de pillards Orcs de la région.</em></p></li><li><p><em>Je m'engage à prendre toutes les dispositions nécessaire lorsque viendra un problème avec les centaures</em></p></li></ul>"
      public: "<p>Seigneur de la Vallée de Novrak.</p><p>C'est un homme imposant et charismatique qui porte tous les signes d'un seigneur d'une petite ville. Regard froid et digne, prestance, vêtements et attributs ainsi que sa façon de parler ne font aucun doute sur sa position.\_</p><p>Il est ferme dans ses propos et il se base sur la loi à tout moment pour prendre des décisions.</p><p></p>"
