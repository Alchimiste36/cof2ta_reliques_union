  details:
    biography:
      private: >-
        <p>Si elle survit à Glanae'Reth, Bik réagir différemment en fonction de
        la situation. Si ses amis Benxia et Farmir meurent, elle développera une
        motivation incontrôlable de vengeance envers les peuples, les
        organisations ou les individus oppressifs. Elle pourraient, après
        quelques mois seule, rejoindre l'organisation de la Toile
        Vivante.</p><p>Si ses amis survivent, son caractère optimiste grandira.
        Bik s'impliquera dans la cité libérée et développera une forte relation
        avec les centaures d'Arkanov. Elle s'occupera de son père plongé dans
        une lourde dépression mais cela ne l'empêchera pas de prendre sa place
        dans les prochains événements qui secoueront les Terres d'Arran.</p>
      public: >-
        <p>12 ans - Orc - Femelle - Captive depuis 11 mois</p><p>fille de
        Zarzukk, elle est déjà très amie avec Benxia et Farmir depuis qu'ils ont
        partagé ces mois d'enfermement. Elle ne comprend pas la dépression de
        son père. Ils sont vivants contre toute attente et il devrait fêter ça
        tous les jours.</p><p>Pour Bik, seul le quotidien est important. Sa
        faculté a "oublier" les événements passés ou à dépasser ses malheurs
        rende Bik toujours optimiste. Elle amène un peu de joie et de naïveté
        parmi les esclaves et elle a toujours un mots réconfortant ou gentil
        pour un captif.</p><p>Bik est déjà forte et robuste. Mettez-lui une lame
        dans les mains, elle saura s'en servir et elle ne tournera pas les
        talons pour protéger ses amis.</p>
