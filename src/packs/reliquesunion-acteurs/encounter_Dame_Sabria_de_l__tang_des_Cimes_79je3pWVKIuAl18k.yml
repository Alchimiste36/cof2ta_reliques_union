  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: >-
        <p><strong>Caractère :</strong> Politicienne - ambitieuse -
        Manipulatrice - Populiste</p><p><strong>Propos
        :</strong></p><ul><li><p><em>Je suis d'accord avec vous, au delà
        d'accueillir les centaures, nous devons nous montrer fort face à eux. Je
        suis prête à leur faire confiance et j'entend les craintes de certains
        Novraks et Novrakis. Les centaures devront faire leur
        preuves</em></p></li><li><p><em>Moi Sabria de l'Étang des Cimes a
        toujours milité pour aller sauver nos villageois kidnappés. On ne m'a
        pas suivi mais je suis heureuse de saoir cette menace enfin réglée.
        Toutes les familles qui n'ont pas retrouvée leur proches kidnappés
        seront largement dédommagés par la maison de l'Étang des
        Cimes.</em></p></li><li><p><em>Ne nous voilons pas la face, les races
        inertes sont indispensables pour l'économie de notre belle cité. On
        devons les accueillir mais nous n'avons pas à supporter leur supériorité
        non plus !</em></p></li><li><p><em>Nous sommes fort ensemble et ma
        famille s'engage à protéger la Vallée de Novrak contre toutes les
        menaces</em></p></li></ul>
      public: "<p>Noble de la Vallée de Novrak - dirigeante de la deuxième famille la plus influente de la ville.</p><p>Dame Sabria est une femme élégante et noble qui arbore une large sourire constamment. Femme très influente à la Vallée de Novrak, Sabria dirige d'une main ferme la deuxième plus grande famille de la ville.</p><p>Des accusions et des rumeurs disent qu'elle n'hésiterait devant rien pour prendre la place du seigneur\_@UUID[Actor.e0EAROPqyT9IyXJy]{Arbosk Mieili de la Tour de Mabeuil}.</p><p></p>"
