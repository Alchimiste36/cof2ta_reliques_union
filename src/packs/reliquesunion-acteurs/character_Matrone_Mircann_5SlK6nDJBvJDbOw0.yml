  details:
    biography:
      private: "<p>Mircann est la matrone la plus colérique des trois. Elle semble tout le temps en colère et il lui arrive de passer ses nerfs sur les esclaves ou les soumis sans prévenir et sans raison. Elle est responsable des esclaves de la cité malsaine et de la gestion des stocks et des fermes. C'est la seule matrone qui sort à l'extérieur de la cité de temps en temps (deux à trois fois par an) pour aller chasser ou prendre part à une expédition de pillage ou de kidnapping sur une tribu de peaux vertes.</p><p>Mircann est tout le temps suivit par son compagnon animal, une buse vicieuse et agressive. La matrone est aussi bestiale que sa passion pour les prédateurs de la nature. Cela ne la rend pas très douée pour les interrogatoire ou les séances de torture car elle perd rapidement patience et achève le questionné.</p><p>Son tempérament imprévisible rend cette matrone la plus détestée des Soeurs et des Filettes. Elle se sent régulièrement menacer pour sa place et elle déjoue quelques fois par an des tentative d'assassinat ou des espionnages. Dernièrement, Mircann a massacré, dans un excès de colère, trois Filettes et deux Jeunes qu'elle avait surpris en train de torturer @UUID[Actor.cKeTPsuA3TZ6X2Zn]{Mojod}, un esclave orc très travailleur. Depuis, et après une sévère remontrance de la @UUID[Actor.ehEEcZYq4y7nToNO]{Matrone Zarsa}, Mircann est très isolée parmi les femelles elfes exsangues.</p><hr><p>Les Matrones sont, au final, assez rarement en\_danger dans la cité. A part, les conspirations entre\_elles et les menaces d’une Sœur voulant prendre sa\_place, une Matrone n’est pas habituée à une situation\_de danger. Elles développent leurs pouvoirs magiques\_et elles s’entraînent souvent au maniement des armes\_mais elles n’ont que peut d’occasion de pratiquer\_en réalité.</p><p>Les Sœurs sont souvent envoyées en\_missions de kidnapping dans les montagnes mais<span style=\"background-color: rgba(0, 0, 0, 0);\">les Matrones restent en sécurité dans la cité. Elles\_</span>n’en restent pas moins un danger extrême quand\_ont voit leurs capacités mais elles auront du mal à\_estimer le risque qu’elles prennent face au groupe de\_PJ, aux centaures ou aux captifs libérés. En dernier\_recours, si certaines Matrones sont tuées par les PJ et\_que les dernières sont au courant, elles essayeront de\_récupérer le maximum de Fillettes encore vivantes,\_quelques mâles exsangues et essayeront de prendre\_la fuite dans un des bateaux du port ou via le passage\_secret (vers A4) ou dans les tunnels du nord (en A2).</p>"
      public: "<p>Les Matrones sont les dirigeantes ultimes de Glanae’Reth.\_</p><p>Elles sont vicieuses, oppressantes et ont tout pouvoir sur\_tous les autres habitants. Elles restent très souvent dans les\_quartiers privés des femelles mais fréquemment elles se\_baladent dans la cité et peuvent tuer ou torturer n’importe\_quel habitant du coup sans raison apparente</p>"
