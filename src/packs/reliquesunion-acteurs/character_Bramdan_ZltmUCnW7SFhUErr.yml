  details:
    biography:
      private: >-
        <p>Si Bramdan survit à Glanae'Reth, il retournera à la Porte des Grav et
        il pourra avoir une grande influence pour convaincre son commandant
        d'envoyer une partie des forces du Bouclier face aux armées d'Amanori
        Bellara.</p>
      public: >-
        <p>184 ans - Nain - Mâle - Captif depuis 3 ans</p><p>Soldat du bouclier
        de la Porte des Grav, Bramdan aimerait retrouver son barraquement et ses
        compagnons à la forteresse. Il ne parle pas beaucoup mais, le soir venu,
        il chante de magnifiques chansons de combats, d'aventures et
        d'honneur.</p><p>Bramdan est un pur soldat du Bouclier. Obéïssant, calme
        et respectueux de la hiérarchie, Bramdan est toujours partant pour
        prendre sa place dans le rang face à un ennemi. Depuis sa capture par
        les elfes exsangues, Bramdan est plutôt stoïque. Il ne cherche pas à
        s'échapper, il fait ses tâches et il reste passif face aux violences. Le
        seul moment où il perd son calme arrive lorsqu'un captif sans défense
        reçoit des violences non loin de Bramdan. Dans cette situation, le
        soldat n'hésite pas à s'interposer pour recevoir la correction à la
        place de la victime initiale.</p>
