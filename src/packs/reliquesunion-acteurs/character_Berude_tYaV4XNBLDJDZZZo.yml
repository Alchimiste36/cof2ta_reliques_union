  details:
    biography:
      private: >-
        <p>Si elle survit à Glanae'Reth, Berude aura pour première priorité de
        retrouver sa tribu. Elle espère revoir Mirtao mais elle aura une dette
        envers les aventuriers qui ont aidé à sa libération.</p><p>Berude sera
        un atout important pour unir les tribus de Mangeurs des Plaines face aux
        armées d'Amanori Bellara si les les Sauveurs de la Dame d'Honneur
        l'incite dans cette direction.</p>
      public: >-
        <p>19 ans - Mangeur des Plaines - Femelle - Captive depuis 2 ans et
        demi</p><p>Cette Mangeuse des Plaines est introvertie et elle observe
        constamment son environnement. Elle a un don pour voir les petits
        détails qui peuvent faire basculer une situation d'où son rôle de
        pisteuse et d'éclaireuse dans sa tribu de Mangeurs des Plaines. Si on
        arrive à créer une relation de confiance avec Berude, elle parlera
        souvent de Mirtao, son Sanpurock, avec qui elle passait la plupart de
        ses journées. Solitaire, Berude a quand même un grand sens de la
        famille.</p><p>Depuis deux ans et demi enfermée et esclavagisée dans la
        cité malsaine, Berude s'est rapprochée de Ghan et de Krakk. Berude
        attend le bon moment pour tenter une nouvelle évasion.</p>
