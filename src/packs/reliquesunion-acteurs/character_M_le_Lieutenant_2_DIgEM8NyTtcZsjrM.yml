  details:
    biography:
      private: "<p>Les Lieutenants et les Caporaux sont plus tacticiens\_et réfléchis. Ils donneront des ordres pour envoyer les\_sous-fifres en premières lignes et attaqueront soit à distance\_avec une arbalète soit en traître sur les flancs ou par\_derrière. Ils ne penseront pas directement à déclencher une\_alerte dans la cité sauf si le Seuil d’Alerte est déjà trop haut\_et que la cité est en alerte. Après quelques Soldats, Jeunes\_ou Soumis tués, un Lieutenant ou un Caporal essayera de\_sortir du combat pour alerter les femelles. Il ne faut pas\_oublier que pour les responsables il y a toujours un risque\_d’être accusé de lâcheté s’ils quittent le combat. Ce n’est pas\_une décision qu’ils prendront rapidement au risque d’être\_réprimandé lourdement par une Sœur ou une Matrone.</p>"
      public: "<p>Les lieutenants ne sont pas très nombreux. Ils sont assez\_proches des Sœurs et peuvent même être abordés directement par une Matrones. Ils usent de violence mais préfèrent\_souvent donner des ordres aux échelons inférieurs.</p>"
