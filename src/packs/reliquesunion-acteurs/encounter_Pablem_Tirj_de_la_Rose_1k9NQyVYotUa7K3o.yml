  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: >-
        <p><strong>Caractère :</strong> Raciste - interventionniste -
        colonialiste - impérialiste</p><p><strong>Propos
        :</strong></p><ul><li><p><em>Au lieu de se replier sur nous-même, ça
        fait des années qu'on aurait du investir les sommets et réclamer la
        montagne. Maintenant on a peur de quelques chevaux qui
        débarquent.</em></p></li><li><p><em>Lors de mes campagnes dans les
        Cités-Etats de Tarascon, nous avons su montrer la puissance des humains
        dans les terres hostiles peuplés d'elfes et de nains. On a pas montrer
        de signe de faiblesse, ils attendent que ça.</em></p></li><li><p><em>La
        montagne est à nous et Arbosk est un faible qui a laissé des saloperie
        d'elfes tuer les notre et kidnapper nos familles et nos enfants. Allons
        nous faire la même erreur avec ces centaures.</em></p></li><li><p><em>La
        Cité des Ombres Blanches doit revenir à la Vallée de Novrak sinon ce
        sont des nains qui vont l'infester dès qu'on aura le dos
        tourné.</em></p></li></ul>
      public: >-
        <p>Noble de la Vallée de Novrak et ancien militaire longtemps parti en
        campagne.</p><p>C'est un vieux militaire fier d'avoir servi les armées
        de Kosland et d'Elykoss. Il raconte souvent la grandeur des hommes dans
        les batailles et il semble nostalgique des campagnes militaires
        expansionnistes sur les terres des peaux vertes en Birkanie.</p><p>Selon
        lui, son armée a libéré Mordrian de ces barbares et il trouve normal
        d'avoir été anobli après ses massacres.</p>
