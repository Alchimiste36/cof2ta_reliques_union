    notes:
      private: >-
        <p><strong>Caractère :</strong> alcoolique - dépressif et
        rancunier</p><p><strong>Propos :</strong></p><ul><li><p><em>Vous ne
        m'avez jamais cru. J'ai tout perdu à cause de vos têtes de
        cons</em></p></li><li><p><em>je suis heureux de revoir les centaures qui
        ont plus d'honneur que vous tous réunis, bande d'inbéciles
        !</em></p></li></ul>
      public: >-
        <p>Ancien marchand et vieux fou de la Vallée de Novrak.</p><p>Timaor est
        malpoli, odorant, aigri et renfrogné. Il a tout perdu après sa rencontre
        avec le village d'Arkanov et le procès qui lui a retiré son droit de
        commercer.</p><p>Il garde une forte rancune et une énorme colère contre
        tout ceux qui ne l'ont pas cru, c'est-à-dire tout le monde.</p><p>Il
        noie sa misère dans l'alcool et il vit seul et isolé dans une vieille
        cabane en ruine dans le quartier pauvre de la Vallée de Novrak.</p>
