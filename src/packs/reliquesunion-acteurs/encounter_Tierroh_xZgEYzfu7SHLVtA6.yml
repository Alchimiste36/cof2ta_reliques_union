    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> progressif et rationnel</p><p><strong>Propos :</strong></p><ul><li><p><em>Maintenant que les centaures sont là, on va pas les foutre dehors.\_On est pas des monstres - J'ai hâte de rompre le pain avec eux</em></p></li><li><p><em>Rappelez vous des histoires venu de forêts lointain où les centaures et les elfes vivent côte-à-côte</em></p></li><li><p><em>maintenant que les Ombres Blanches ne sont plus là nous allons pouvoir vivre en paix</em></p></li></ul>"
      public: >-
        <p>Boulanger de la Vallée de Novrak.</p><p>Malgré son travail fatiguant,
        Tierroh est toujours prêt à aider la ville et il s'implique dans
        beaucoup de domaine. Il prend souvent la parole durant les réunions
        publiques, il va régulièrement au château pour interpeler sur un soucis
        ou un conflit, il aide à la préparation des festivités, par
        exemple.</p><p>Il est apprécié des petit-gens de la Vallée de Novrak car
        il fait payer moins cher pour les nécessiteux voir il lui arrive
        d'offrir des miches aux plus pauvres. Sa boulangerie a été plusieurs
        fois vandalisée surement à cause de ses idées progressistes.</p>
