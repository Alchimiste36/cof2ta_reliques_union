  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Kahaki retournera au village d'Arkanov
        auprès de son amour, Peka. Il revient brisé, traumatisé, pleins de
        cauchemars et d'angoisses. Tout la village se demande si l'amour de Peka
        arrivera à apaiser Kahaki et, si oui, après combien d'années
        ?</p><p>Dans tous les cas Peka et les autres habitants seront là pour le
        soutenir.</p>
      public: "<p>31 ans - Centaure - Mâle - Captif depuis 6 mois</p><p>Kahaki est un centaure follement amoureux de Peka, avec un caractère attentionné et romantique. Depuis son plus jeune âge, il a des sentiments pour elle et il a tout fait pour\_la séduire, multipliant les attentions, les petits gestes et les grandes déclarations. Kahaki\_est très sensible et il a toujours été très apprécié par les sœurs de Peka. Bien qu’il ait les\_bases du combat et des armes, Kahaki excelle surtout dans les arts. Ce centaure apporte\_de la beauté partout où il va. Kahaki a été kidnappé par les Atarangi Kino il y a six mois\_en même temps que Wakamamae.</p><p>Il est totalement déprimé depuis qu'il a intégré la cité malsaine. Il pleure souvent, il tremble à chaque fois qu'un elfes exsangue ouvre l'enclos et il a perdu son sourire depuis le premier jour. Grâce à @UUID[Actor.GSigRIwLnNvZKmc9]{Anake},\_@UUID[Actor.qUDaYhzwTBz4pzXM]{Tumanako} et\_@UUID[Actor.MEhd7yB3bzxsLtyG]{Wakamamae}, il arrive à chasser les idées les plus sombres au quotidien mais il ne sait pas si il supportera encore cette situation longtemps. Il passe mettre fin à ces jours quotidiennement surtout depuis qu'on lui a amputé une de ses pattes arrière à cause d'une vilaine blessure.</p>"
    appearance:
      private: ''
      public: >-
        <img
        src="modules/cof2ta_reliques_union/assets/ru_acteurs/arkanov/kahaki_total.webp"
        width="200" height="200">
