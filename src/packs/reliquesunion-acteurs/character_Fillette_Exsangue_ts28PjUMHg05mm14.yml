  details:
    biography:
      private: "<div class=\"cof1-import-block\"><p>Les Fillettes et les Sœurs pourront se jeter dans\_le combat en utilisant toute la panoplie de leurs\_<span style=\"background-color: rgba(0, 0, 0, 0);\">pouvoirs si elles sont isolées des mâles ou elles se\_</span>placeront en commandantes des mâles aux alentours\_pour les faire attaquer les intrus ou pour les protéger. </p><p>Le pouvoir magique des Sœurs les rend arrogantes.\_Elles ont l’habitude de diriger et de dominer. Elles ne\_seront pas différentes avec un groupe de PJ ennemis\_qu’avec les captifs. Après une démonstration de\_puissance des PJ, une Sœur peut décider de quitter\_le combat pour aller prévenir les autres Sœurs ou les\_Matrones mais, comme pour les Lieutenants, elle\_pense, à raison, que ce comportement lui apportera\_mépris et honte devant sa couardise.</p></div>"
      public: "<div class=\"cof1-import-block\"><p>Les Fillettes sont de jeunes femelles elfes exsangues. Elles\_sont encore en apprentissage mais elles jouent déjà un rôle\_important de domination sur les mâles de la cité. De la\_même manière que les Sœurs, les Fillettes jouent entièrement la concurrence entre elles pour monter plus vite dans\_la hiérarchie, plaire aux Sœurs ou directement au Matrones. </p><p>Elles n’hésitent pas à se tirer dans les pattes et à dénoncer\_une autre Fillette ou une Sœur ayant échoué quelque part.\_Leur jeune âge les rend redoutables car elles utilisent de\_leur jeunesse pour charmer, manipuler et torturer mentalement les mâles elfes exsangues et les captifs.</p></div>"
