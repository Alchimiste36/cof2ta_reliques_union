  details:
    biography:
      private: "<p>Les Soumis peuvent avoir deux réactions. Soit ils identifient une menace directement et ils peuvent se jeter sur\_les intrus sans arme ou avec leur outil de travail (couteau\_de cuisine, marteau, tournevis, casserole…) en espérant\_mourir vite ou bloquer les ennemis et être récompensé par un mâle exsangue. Soit ils ne comprennent pas la\_situation et ils baisseront la tête, se blottiront dans un coin\_ou continueront leur tâche actuelle.</p>"
      public: "<p>Les Soumis n’ont rien à envier aux captifs. Ils\_sont légèrement mieux traités mais ils subissent au\_quotidien des tortures physiques ou psychologiques\_par les autres mâles ou les femelles exsangues. Ils\_s’occupent de toutes les tâches du quotidien (cuisine,\_nettoyage, travaux dans les ateliers…). Ils sont en\_permanence drogués et affaiblis par le manque de\_sommeil et les maltraitances qu’ils subissent. Cet\_état second leur permet de supporter un minimum\_leur vie mais chaque Soumis sait que, sans aucune\_raison, ils peuvent se faire tuer à n’importe quel\_moment même en pleine nuit.</p>"
