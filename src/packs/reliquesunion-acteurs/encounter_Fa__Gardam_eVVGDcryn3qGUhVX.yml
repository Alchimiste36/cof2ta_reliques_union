  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> baroudeuse - joyeuse - curieuse - très intelligente - charmeuse</p><p><strong>Propos</strong> :</p><ul><li><p><em>Je voyage beaucoup, j'en ai vu du pays, et je suis toujours heureuse de revenir ici vous conter mes histoires.\_</em></p></li><li><p><em>Faites bien attention à la vague d'intolérance qui vient des Marches du Venkor. Là-bas les persécutions, les conflits et les agressions ne viennent pas des anciennes races mais bien des humains.\_</em></p></li><li><p><em>Vous me parler des vols et pillages commmis par les Peaux Vertes, des manipulations de nains ou de la prétention des Elfes mais regardez votre nombril mes amis. Les bandes de pillards qui ont dévasté le grenier l'année dernière c'était des Orcs ? Non ! une bande de racailles humaines. Le marchand qui est parti avec la plupart de vos économies en vous vendant la fameuse crème de jeunesse, y a trois ans, c'était un opportuniste du Talion ? toujours pas ! Juste une belle gueule tout droit venu d'Yrlanie. Pour finir, la prétention des elfes ??? Écoutez-vous un peu \"la montagne est à nous\" que j'entend de plus en plus. \"On est assez fort pour se défendre tout seul\" blablabla. Ya pas plus prétentieux qu'un groupe de Novraks qui sortent d'une taverne pour aller déflorer une paysanne. Le racisme vous tuera si vous ne réfléchissez pas à vos paroles.</em></p></li><li><p><em>Certains d'entre vous le savent mais je ne peux plus prendre le risque d'aller dans les Marches ou plus loin à l'Est. Les semi-Elfe ne sont plus les bienvenu dans les villages et dans les villes. J'espère que je serais toujours acceptée à la Vallée de Novrak pour vous compter les nouvelles du monde dans quelques années.</em>\_</p></li></ul>"
      public: >-
        <p>Jongleuse demi-Elfe très populaire à la Vallée de Novrak malgré
        quelques "agressions" qu'elle a subit à cause de son
        métissage</p><p>Elle appelle tous les villageois par leur prénom et elle
        part souvent plusieurs semaines pour aller glaner les dernières
        informations de l'Ourann et au-delà. Depuis quelques mois, elle ne
        parcours plus les Marches du Venkor à cause du risque qu'elle y
        rencontre.</p><p>C'est une semi-elfe très joyeuse et à la voix d'or
        surtout quand elle l'assemble aux accords de sa mandoline.</p>
