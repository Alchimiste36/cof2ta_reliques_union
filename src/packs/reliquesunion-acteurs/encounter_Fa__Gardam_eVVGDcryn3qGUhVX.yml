  - folder: r7vQCSttib8wG8VR
    name: Caractéristique d’expert
    type: capacity
    img: icons/skills/trades/academics-merchant-scribe.webp
    _id: cxKNPxT0HCya0Kdd
    system:
      description: "<p>En accord avec le MJ, <strong>choisissez une «caractéristique de métier»</strong> entre FOR, AGI, INT et CHA,\_qui doit être en rapport avec l’activité exercée. </p><p>Le\_personnage <strong>augmente la valeur de cette caractéristique de +1.</strong></p>"
      source: ''
      origin: Atlas d'Osgild et Règles Optionnelles p177
      slug: ''
