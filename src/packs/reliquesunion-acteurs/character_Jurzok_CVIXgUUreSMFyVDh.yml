  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Jurzok réagira de la même manière si sa
        fille survit avec lui ou non. Après avoir passé autant de temps avec les
        autres captifs, Jurzok ne voit pas l'intérêt de partir rejoindre les
        plaines et la vie nomade. Il souhaiterai, comme sa fille, rester avec
        ses nouveaux amis au service de la cité libérée, à la Vallée de Novrak
        aux côtés de Geemav, Mojod, Ghan ou Zarzukk et ses enfants.</p><p>Il
        peut devenir un vrai enseignant de la cité libérée ou un atout précieux
        où qu'il se trouve.</p>
      public: >-
        <p>Jurzok est un orc mais il n'a rien du combattant idiot qu'on peut
        imaginer. Il a pris le rôle d'éducateur dans sa tribu nomade voyageant
        au sud de l'Ogrie et il aime apprendre et partager son savoir aux
        enfants, aux adolescents et aux adultes. Il arrive à se faire respecter
        par les guerriers de la tribu car il apporte beaucoup de savoirs et de
        techniques aux membres du clan.</p><p>Grâce à son bagou et ses
        connaissances, il a sorti la tribu de situation dangereuse sans affusion
        de sang ni mort. Il élève sa fille, Alviv, seul depuis la mort tragique
        de sa compagne. Il se débrouille bien et ils sont très proches l'un de
        l'autre.</p><p>Ils ont été capturés tous les deux après une attaque
        sanglante sur leur tribu et ils se serrent les coudes depuis. Alviv
        grandit vite dans cet environnement hostile même si Jurzok essaye de
        diminuer au maximum les traumatismes subis par sa fille grâce à son
        humour et ses histoires.</p><p>Jurzok chante correctement et raconte
        souvent des histoires faisant voyager les captifs dans des mondes
        magnifiques et grandioses. Le sourire sarcastique de Jurzok lui vaut
        souvent des claques de la part des mâles exsangues et quelques séances
        de torture mais dans la plupart des situations il fait profil bas.</p>
