  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> aigrie - je-sais-tout - désagréable - déteste le seigneur Arbosk</p><p><strong>Propos :</strong></p><ul><li><p><em>Avec un mou du cul comme toi Arbosk, on aurait jamais résisté aux Ombres Blanches.\_il a fallu une bande de traine la merde pour résoudre le problème.</em></p></li><li><p><em>J'en ai connu des années et je vous garanti que si on fait pas gaffe les anciennes races prendront jusqu'à notre futal !</em></p></li><li><p><em>Tant que les centaures font l'effort de parler la langue et de respecter nos coutumes, y'aura pas de problème</em></p></li></ul>"
      public: "<p>Vieille dame de la Vallée de Novrak.</p><p>Malgré son apparence de gentille petite vieille qui arpente les rues de la ville, il vaut mieux se méfier de sa canne si on lui manque de respect. Il arrive souvent à Rochania de coller un bon coup dans le pif d'un villageois qui l'a contredit sans ménagement.</p><p>Elle est tout le temps dans les parages et elle se retrouve régulièrement au château pour engueuler le seigneur ou ses serviteurs. D'aucun dise qu'elle discute souvent avec\_@UUID[Actor.79je3pWVKIuAl18k]{Dame Sabria de l&#x27;Étang des Cimes}. Cette dernière se servant de la hargne de Rochania pour hurler à qui veut l'entendre l'incompétence du seuigneur\_@UUID[Actor.e0EAROPqyT9IyXJy]{Arbosk Mieili de la Tour de Mabeuil}.</p>"
