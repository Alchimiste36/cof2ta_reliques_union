  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: >-
        <p><strong>Caractère :</strong> optimiste - progressiste - aventurière
        dans l'âme - anti-discrimination</p><p><em><strong>Propos
        :</strong></em></p><ul><li><p><em>Je vous entend, tous les vieux du
        village et je suis triste. La plupart de mes amis peuvent rigoler avec
        tous les peuples qui passent par la ville. Nous ne sommes pas si
        différents des Orcs, des Nains ou des centaures. Regardez-les, ces
        centaures, ils ont la classe et je suis sur qu'ils ne souhaitent que
        vivre heureux comme chacun de vous. Trouver leur place, manger, boire,
        rire et vivre heureux.</em></p></li><li><p><em>J'en ai marre d'entendre
        certains hommes cracher sur notre amie Faë Gardam depuis qu'ils savent
        qu'elle est à moitié elfe alors que la veille vous baviez sur ses yeux
        noisettes et vous vous battiez pour savoir qui l'a mettra dans son lit
        !!</em></p></li><li><p><em>Vous voulez quoi au final : crever de peur et
        grogner à longueur de journée sur la méchanceté des elfes ou des nains,
        partir en guerre contre tous les peuples d'Arran et crever sur des
        champs de bataille pour rester entre humains ou simplement vivre une
        belle vie dans notre village ?</em></p></li><li><p><em>Avec mon père
        nous partagions la route avec des groupes d'orcs, des caravanes de nains
        et même une fois un groupe d'elfes blancs traversant la montagne à la
        recherche d'un grand dragon blanc. Je n'ai jamais entendu de haine autre
        part dans dans les paroles de certains Novraks et
        Novrakis.</em></p></li><li><p><em>Je préfèrerais pouvoir avoir des amis
        gobelins ou centaures que de devoir trainer une seconde avec les jeunes
        Novraks qui écoute tous les weekends, les conneries de prêtre Dertirn et
        les mensonges de Solima</em></p></li></ul>
      public: >-
        <p>Jeune fille de la Vallée de Novrak, d'environ 16 ans.</p><p>Elle est
        révoltée contre les habitants depuis plusieurs années et il lui arrive
        de passer quelques nuits en prison après avoir frappé un villageois qui
        tenait des propos tantôt sexistes, tantôt racistes, tantôt
        impérialistes.</p><p>Ceux qui la connaisse savent qu'elle enrage de plus
        en plus et qu'un jour elle ira trop loin. Ce jour là, elle finira soit
        en prison soit dans un cercueil.</p>
