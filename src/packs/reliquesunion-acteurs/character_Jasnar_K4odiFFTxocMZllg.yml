  details:
    biography:
      private: >-
        <p>Si elle survit à Glanae'Reth, Jasnar voudra retourner rapidement à
        Arakar'Um. Elle ne peut pas envisager de déserter l'armée et elle doit
        faire son rapport à son commandant même après les expériences qu'elle a
        vécue. Par contre, par fidélité, elle partira quand tous les captifs
        seront soignés et elle pourra accompagner tous les survivants qui
        voudront rejoindre les Grandes Plaines de l'Ourann.</p>
      public: >-
        <p>63 ans - Nain - Femelle - Captive depuis 31 mois</p><p>Garde en
        cheffe de la forge d’Arkar’Um, cette naine courageuse et débrouillarde
        est une digne descendante de Tiss du bouclier. Son engagement dans la
        garde de la forteresse d'Arkar'Um est un honneur pour elle et sa
        famille.</p><p>Jasnar est forte, loyale, légaliste et soucieuse de la
        hiérarchie. Elle a grimper les échelons de l'armée d'Arkar'Um petit à
        petit avec détermination et sans aucun passe-droit. Si la méritocratie
        existait elle en serait l'exemple significatif. D'une famille de
        professeurs d'histoire naine à l'academie des sicences d'Arkar'Um,
        Jasnar est devenue la responsable d'une brigade de 25 poilues de l'ordre
        de la Forge servant à protéger les dignitaires de la
        Forteresse-État.</p><p>Jasnar a été récupéré par les elfes exsangues
        alors qu'elle devait délivrer un message urgent aux compagnies de nains
        protégeant la frontière entre les Marches du Venkor et le Diggenfald.
        Kidnappée avec quatre de ses poilus, elle est la seule survivante après
        autant de mois de tortures et de sévices.</p><p>Elle passe son temps
        dans les forges de la prison ou a briser des rochers pour en récupérer
        les métaux bruts. Elle tient le travail de la forge d'une main de fer
        pour éviter tous les ennuis mais rien ne lui retire de l'esprit la
        moment où elle pourra prendre les armes et libérer les esclaves. Elle
        est proche de Thonur et de Urmdar avec qui elle élabore des plans
        d'évasion. De plus, elle impose à Tchanar le respect depuis qu'il est
        arrivé dans l'enclos de la cité malsaine.</p>
