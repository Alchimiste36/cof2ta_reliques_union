  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, le second capitaine de la garde de la
        Vallée de Novrak, Edric, sera impatient de faire son rapport au Seigneur
        Arbosk Mieilli de la Tour de Mabeuil et, enfin, annoncer aux habitants
        qu'ils peuvent dormir tranquillement. Il sera très reconnaissant envers
        ce groupe d'aventuriers et ces centaures impressionnants venu les
        sauver. Il espère, sans grande conviction, que le seigneur de la Vallée
        de Novrak le nommera comme représentant de la ville dans cette nouvelle
        cité !!</p><p>Edric défendra les Sauveur de la Dame d'Honneur et les
        centaures d'Arkanov face à tous les racistes ou intolérants de la ville.
        Il s'opposera aux soldats de la garde qui auraient des mots ou des actes
        hostiles envers les étrangers.</p><p>Grâce à sa motivation Edric sera
        abordé par la Toile Vivante mais il préfèrera garder sa place à la
        Vallée de Novrak et auprès de la cité libérée et le village d'Arkanov
        plutôt que de rejoindre cette organisation.</p><p>Durant le conflit
        contre les armées d'Amanori Bellara, Edric sera comme une bannière pour
        unir les soldats et les miliciens humains contre cette menace.</p>
      public: >-
        <p>26 ans - Humain - Mâle - Captif depuis 21 mois</p><p>Edric est très
        connue à la Vallée de Novrak. C'est le second capitaine de la garde de
        la ville et il est respecté par la plupart des habaitants. Il aime son
        travail et surtout organiser ses soldats et ses miliciens pour assurer
        la tranquilité des Novraks ou des Novralis.</p><p>Edric a, depuis
        toujours, un sentiment d'imposture dans tout ce qu'il fait. Il ne
        comprend pas pourquoi il a atteint ce niveau de responsabilité ni ce qui
        lui vaut tant d'honneur. Il est souvent humble et cela vient de ses
        origines sociales très pauvres. Toute sa jeunesse l'amenait a devenir un
        petit malfrat dans les ruelles de la Vallée de Novrak mais sa prise de
        parole devant l'ancien seigneur, en tant que témoin, d'un meurtre d'un
        voyou par un soldat de la ville a fait grande impression. Son sens de la
        justice, sa compréhention des lois et sa manière de convaincre lui ont
        ouvert les portes de la milice, puis de l'armée, puis du
        commandement.</p><p>Autant dire qu'Edric reçoit toutes les critiques en
        plein coeur mais il sait faire la part des choses entre une attaque
        personnelle percutante et son devoir de faire respecter les lois et
        d'encadrer ses troupes.</p>
