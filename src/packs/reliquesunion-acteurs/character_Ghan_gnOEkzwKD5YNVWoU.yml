  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Ghan pourrait devenir un allié important
        pour les Sauveurs de la Dame d'Honneur. Il sait motiver des combattants,
        il peut s'imposer face aux forte têtes et il pourra distribuer des
        torniolles si besoin. Avec son ami Krakk (si il a survécu), Ghan est
        réellement intouchable. Mieux vaut l'avoir de son côté.</p><p>Ghan n'est
        pas très subtil mais il est honorable et dans la plupart des cas, il est
        juste. Ne lui demandez pas d'organiser les stocks de vivre d'une cité
        mais Ghan peut être un très bon chef de la sécurité. Ce qui est bien
        avec lui, c'est qu'il ne possède aucune dose de racisme. Pour lui, tout
        le monde se vaut. Seule la loi est importante.</p><p>Il développera un
        profond respect pour Urmdar et Thonur si ils survivent. En s'entrainant
        ensemble, ils apprendront à dépasser les anciennes tensions entre les
        nains et les peaux vertes.</p><p>Pour fédérer des tribus de Peaux Vertes
        face aux armées d'Amanori Bellara ou dans les cavités d'Hyrr'Tarënn,
        Ghan est un atout pour tout le monde.</p>
      public: >-
        <p>48 ans - Orc - Mâle - Captif depuis 10 mois</p><p>Chef de tribu
        massacrée de l’Ourann, c'est un combattant né qui sait se faire
        respecter avec ses poings ou sa grande gueule. S'il faut montrer les
        dents et botter des culs, il est parfait. S'il faut caliner ou
        discutailler, mieux vaut demander à un grognard. Il respecte l'honneur
        et la force.</p><p>Il a défendu son village comme il a pu durant le raid
        des elfes exsangues mais il a fini assomé et prisonnier. Depuis 10 mois,
        il n'accepte pas sa condition de captif. Dès qu'il le peut il moleste
        les gardiens, il essaye de récupérer une arme pour massacrer le premier
        soldat qui passe proche ou il insulte, intimide ou menace.</p><p>Les
        autres captifs ne le connaissent pas trop car il passe le plus clair de
        son temps en séance de torture, dans les cages de la prison, attacher
        dans le lit des femelles ou a se faire rafistoler avant la prochaine
        torture. Dans les prisons, Ghan a rencontrer Krakk, le gobelin assassin,
        et ils se sont liés d'une amitié aussi forte que leur envie de massacrer
        les elfes exsangues.</p><p>Ghan est plus tétu qu'un Jargal sauvage, plus
        robuste qu'un bison et plus fort qu'un ours. Il crache sa haine tous les
        jours contre les elfes exsangues et il rêve du jour où l'un d'entre eux
        commettra une erreur et qu'il pourra parcourir cette cité pour commencer
        la grande f^te du massacre.</p>
