  details:
    biography:
      private: >-
        <p>Si elle survit à Glanae'Reth, Arié et Trevin s'uniront officiellement
        et Arié transformera ses traumatismes en un force de caractère
        incroyable. Elle s'affirmera rapidement avec de bonnes idées et une
        analyse précise des situtations et des personnes. En quelques semaines,
        elle prendra une place importante dans la cité libérée, à la Vallée de
        Novrak ou à l'endroit où elle serait utile.</p><p>Un jour, Arié pourrait
        devenir une femme importante et une réelle meneuse.</p>
      public: >-
        <p>21 ans - Humain - Femelle - Captive depuis 5 mois</p><p>Femme d'un
        commerçant d'un village du Venkor en couple avec Trevin depuis
        l'emprisonnement. Elle est très timide et traumatisée. D'après ses dires
        elle aime ranger et organiser.</p><p>Arié sursaute au moindre bruit et
        elle a souvent des crises de panique. Aux côtés de Trevin, elle se sent
        protégée mais les tortures et les intimidations des elfes exsangues ont
        brisés le mental de cette jeune humain de Kosland tant qu'elle est
        enfermée.</p>
