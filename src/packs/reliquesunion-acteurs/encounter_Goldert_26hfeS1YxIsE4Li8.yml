  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> amicale avec les centaures mais avec de mauvaises solutions</p><p><strong>Propos :</strong></p><ul><li><p><em>On pourrait construire un quartier pour eux un peu à l'extérieur de la ville ? Ce serait une bonne ssolution pour toutle monde. S'il le faut on installe une palissade ... je sais pas moi mais il doit y avoir une solution simple.</em></p></li><li><p><em>Si on veut que ça se passe bien, on pourrait instaurer un statut spécial pour les centaures avec des obligations et des autorisation spéciales pour eux. ca éviterait les problèmes, non ?</em></p></li><li><p><em>Même nos portes ne sont pas vraiment adaptées pour eux. Leur culture est différente mais, peut-être qu'on peut les installer dans un coin. Ou leur faire payer une taxe spéciale !\_</em></p></li><li><p><em>Seigneur Arbosk, il faut instaurer des lois nouvelles pour adapter notre ville à la présence des centaures !</em></p></li></ul>"
      public: >-
        <p>Cordonnier de la Vallée de Novrak.</p><p>Bon travailleur, Golbert est
        un marchand prospère de la ville grâce à sa maitrise du cuir de
        bouquetin de Novrak. Si il avait plus d'ambition et de jugeote certains
        disent qu'il pourraient être plus riche qu'un seigneur mais ses choix
        sont souvent à côté de la plaque.</p>
