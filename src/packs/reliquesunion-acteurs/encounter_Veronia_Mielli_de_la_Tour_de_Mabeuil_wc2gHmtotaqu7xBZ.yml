  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> Assez énervée contre les anciennes races - limite raciste - veut protéger les intérêts de la ville</p><p><strong>Propos :</strong>\_</p><ul><li><p><em>Invasion des Centaures si on ne fait pas attention</em></p></li><li><p><em>La Montagne est à nous</em></p></li><li><p><em>Les Elfes sont responsables de nos malheurs, comme d'habitude</em></p></li><li><p><em>On aurait du les massacrer depuis longtemps</em></p></li></ul>"
      public: "<p>Épouse du Seigneur de la Vallée de Novrak, @UUID[Actor.e0EAROPqyT9IyXJy]{Arbosk Mieili de la Tour de Mabeuil}.</p><p>Véronia est une femme plutôt autoritaire. Elle s'occupe beaucoup des affaires de la ville et elle a toujours son mot à dire qur les décisions de son époux. Certains disent même que c'est Véronia qui dirige officieusement la ville.</p><p>Elle veut depuis toujours faire rayonner la Vallée de Novrak plus fort et plus loin car la vie isolée dans les montagnes n'est pas son idéal. Elle exprime souvent son désir de vivre dans une grande ville humaine comme la Cité d'Orkadia, Blanche Paix ou, plus récemment, Kosland.</p><p>Dernièrement Véronia a trouvé une oreille puissante et influente dans l'église de Solima. A cause de cela, elle devient de plus en plus intolérante et agressive envers les anciennes races.</p><p>Elle passe beaucoup de temps avec\_@UUID[Actor.79je3pWVKIuAl18k]{Dame Sabria de l&#x27;Étang des Cimes} malgré les tensions entre les deux familles nobles.</p>"
