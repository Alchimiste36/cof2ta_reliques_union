  details:
    biography:
      private: "<p>Les Soldats et les Jeunes se jetteront sur la menace dès qu’ils\_la voient. Que le groupe d’intrus soit supérieur en nombre\_ou en puissance, ils essayeront d’éliminer leurs ennemis\_sans réfléchir. Leur stratégie n’est pas vraiment subtile. Ils\_consommeront une drogue pour augmenter leur puissance\_s’ils en ont sur eux, dégaineront leurs armes ou attraperont\_le premier objet mortel à leur portée et se jetteront dans la\_mêlée en chargeant. Si l’un d’eux arrive à tuer un ennemi, ils\_pourront s’acharner sur le corps sans s’inquiéter des autres\_ennemis autour. Ils voudront un trophée à montrer à leur\_responsable pour espérer grimper dans les échelons.</p>"
      public: "<p>Les Apprentis ne sont pas encore Soldats. Ils sont\_jeunes et têtes brûlés car les deux\_options qui s’offrent à eux sont\_une place dans le groupe\_des Soldats ou une vie\_d’esclavage en devenant\_un Soumis drogué et\_maltraité. Il est fréquent\_de voir des assassinats entre Apprentis pour éliminer une\_concurrence ou juste\_attirer l’attention des\_supérieurs. Ce grade\_est attribué rapidement\_pour les jeunes mâles\_et leur entraînement\_physique est intense dès\_le début permettant de\_séparer les futurs Soldats\_des futurs Soumis.\_</p>"
