  details:
    biography:
      private: "<p>Zarsa est la matrone en cheffe de Glanae'Reth. C'est elle qui dirige la cité malsaine même si elle consulte beaucoup et tout le temps les deux autres matrones. Zarsa est totalement impitoyable et c'est un experte en torture et en interrogatoire. Elle passe beaucoup de temps dans l'atelier Arcanique pour préparer des mixtures, fabriquer des potions ou étudier de vieux recueils de magies nécromantiques ou élémentalistes.\_</p><p>C'est la matrone la moins obsédée par les plaisirs de la chair même si ça lui arrive de participer aux orgies de la cité. Elle préfère largement les cris de peur et de douleur que les gémissements charnelles.</p><hr><p>Les Matrones sont, au final, assez rarement en\_danger dans la cité. A part, les conspirations entre\_elles et les menaces d’une Sœur voulant prendre sa\_place, une Matrone n’est pas habituée à une situation\_de danger. Elles développent leurs pouvoirs magiques\_et elles s’entraînent souvent au maniement des armes\_mais elles n’ont que peut d’occasion de pratiquer\_en réalité.</p><p>Les Sœurs sont souvent envoyées en\_missions de kidnapping dans les montagnes mais<span style=\"background-color: rgba(0, 0, 0, 0);\">les Matrones restent en sécurité dans la cité. Elles\_</span>n’en restent pas moins un danger extrême quand\_ont voit leurs capacités mais elles auront du mal à\_estimer le risque qu’elles prennent face au groupe de\_PJ, aux centaures ou aux captifs libérés. En dernier\_recours, si certaines Matrones sont tuées par les PJ et\_que les dernières sont au courant, elles essayeront de\_récupérer le maximum de Fillettes encore vivantes,\_quelques mâles exsangues et essayeront de prendre\_la fuite dans un des bateaux du port ou via le passage\_secret (vers A4) ou dans les tunnels du nord (en A2).</p>"
      public: "<p>Les Matrones sont les dirigeantes ultimes de Glanae’Reth.\_</p><p>Elles sont vicieuses, oppressantes et ont tout pouvoir sur\_tous les autres habitants. Elles restent très souvent dans les\_quartiers privés des femelles mais fréquemment elles se\_baladent dans la cité et peuvent tuer ou torturer n’importe\_quel habitant du coup sans raison apparente</p>"
