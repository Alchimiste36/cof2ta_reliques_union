  details:
    biography:
      private: "<p>Si elle survit à Glanae'Reth, le destin de Benxia sera très différent en fonction du nombre de morts parmi ses amis, surtout Farmir.\_</p><p>Si Farmir et la plupart des captifs meurent durant la libération de la cité, Benxia, effondrée, partira rejoindre une tribu de gobelins vers les grandes plaines de l'Ourann.</p><p>Si Farmir et ses amis survivent, Benxia restera à leur côtés et développera une vraie, belle et forte amitié avec les survivants. Elle suivra Farmir partout, apprendra à ses côtés, s'entrainera avec lui et ils formeront un duo étrange. Ils pourront être des atouts importants pour chercher des alliés pour la bataille contre les armées d'Amanori Bellara et pour diffuser un message de paix et de tolérance entre les peuples.</p>"
      public: "<p>13 ans - Gobelin - Femelle - Captive depuis 11 mois</p><p>Sa famille, capturée dans les montagnes, est morte entièrement dans la cité malsaine. Elle est traumatisée et elle ne quitte pas Farmir en lui répétant sans cesse : \"tu me protègera quand tu seras fort, hein dit !\". Elle n'est pas avare de sourire et d'attention mais elle subit encore beaucoup de crises d'angoisse et de panique. Elle est également très proche de Bik, la jeune gobeline de 12 ans qu'elle considère comme sa petite soeur.</p><p>Cet gobeline a un fort caractère. Elle sait ce qu'elle veut et quand elle le veut. Tout est toujours raison d'apprentissage et elle se découvre des facilités pour soigner les captifs blessés et pour réconforter facilement ses amis. Elle trouvera toujours les mots pour diminuer la tension ou pour motiver les captifs.\_</p><p>D'après certains esclaves, il n'y a pas mieux que Benxia pour improviser un spectacle épique devant la plupart des prisonniers réunis.</p>"
