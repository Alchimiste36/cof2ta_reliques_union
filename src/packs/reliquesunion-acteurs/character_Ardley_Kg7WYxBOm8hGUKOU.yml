  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Ardley mettra toute son énergie à aider
        les aventuriers libérateurs et les centaures. Que ce soit dans la cité
        libérée, à la Vallée de Novrak ou autre part, il diffusera des chansons
        et des histoires épiques sur ce qui s'est passé.</p>
      public: >-
        <p>38 ans - Humain - Homme - Captif depuis 3 mois</p><p>Ardley est un
        voyageur qui gagne sa vie en chantant des chansons et en intégrant des
        troupes d'artistes. Il a du bagou, ce qui lui vaut de temps en temps
        quelques bourre-pifs. Il est assez manipulateur surtout quand sa bourse
        est vide. Il peut charmer de quelques mots une jeune femme ou un veuve
        épleurée pour arriver à ses fins.</p>
