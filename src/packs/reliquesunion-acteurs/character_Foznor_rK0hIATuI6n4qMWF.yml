  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Foznor sera félicité par Urmdar et Thonur
        (si ils survivent) pour son courage et son aide dans leur captivité. Il
        aimerait bien rentrer dans sa ferme au sud d'Arkar'Um mais il pourra
        rester un temps à la cité libérée pour aider.</p><p>A son retour auprès
        de sa famille, il racontera son histoire et mettra ses dernières années
        de vie pour plaider la place des errants auprès des nobles et des
        dirigeants de la Forteresse-État. Les fils et filles de Foznor entreront
        avec joie dans les rangs qui partiront sur le champs de bataille face
        aux troupes d'Amanori Bellara.</p>
      public: >-
        <p>230 ans - Nain - Mâle - Captif depuis 34 mois</p><p>Errant de
        l’Ourann, Foznor est un vieux fermier qui a tenu une houe toute sa vie.
        Il aime le travail bien fait et se soumet à toutes les formes d'autorité
        sans cligner des yeux. Foznor a toujours vécu le mépris, la violence et
        l'oppression depuis sa plus jeune enfance. Un nain errant dans une ferme
        proche de la Forteresse-État d'Arkar'Um signifie une vie d'insultes et
        d'ordres injustes de l apart des autres ordres.</p><p>Foznor a appris à
        baisser la tête, obéïr et à ne pas faire de vagues. Il a observé ses
        parents, ses voisins et ses amis et il maîtrise l'art subtil de vivre
        avec la présence constante et directe d'une oprression qui peut arriver
        à tout moment.</p><p>Depuis qu'il a rejoint les rangs des esclaves de
        Glane'Reth, sa vie a changé de lieu et de quotidien mais la peur et les
        injustices ne sont pas bien différentes. Par contre, partager sa
        condition avec des nains honorable venant des quatre grands ordres a
        réussi à modifier son regard sur eux. Il a trouver de l'honneur chez
        Thonur et Urmdar ainsi qu'un certain charme chez Gindrog.</p><p>Foznor
        est un solide guaillard malgré son âge et même si il garde la tête
        baissée et le dos vouté, au moment où il faudra prendre les armes face à
        leurs bourreaux, Foznor sera rendre chaque blessure et chaque
        humiliation avec joie.</p>
