  details:
    biography:
      private: "<p>La matrone Farti'Un est responsable des ateliers et des expéditions de la cité. Elle gère la plupart des Soeurs et elle doit s'occuper des Filettes et de leur éducations. Cette matrone est calme et toujours sereine. Elle n'a peur de rien car elle sait sa domination sur les Filettes et les Soeurs. Personne ne peut prévoir les agissements de Farti'Un.\_</p><p>De son côté, la matrone maîtrise certains pouvoirs de divination qui sont bien pratiques en cas de crise. Elle s'en sert régulièrement pour trouver les responsables d'un crime ou d'un vol. </p><p>La matrone Farti'Un aime séduire, charmer et manipuler les elfes exsangues mâles comme femelles ou les esclaves. Elle copule souvent n'importe où dans la cité malsaine avec n'importe qui voir toute seule devant les prisonniers. A cause de cette obsession, elle est responsable de plus grand nombre de mort parmis les captifs lors d'ébats trop violents ou trop épuisants.</p><hr><p>Les Matrones sont, au final, assez rarement en\_danger dans la cité. A part, les conspirations entre\_elles et les menaces d’une Sœur voulant prendre sa\_place, une Matrone n’est pas habituée à une situation\_de danger. Elles développent leurs pouvoirs magiques\_et elles s’entraînent souvent au maniement des armes\_mais elles n’ont que peut d’occasion de pratiquer\_en réalité.</p><p>Les Sœurs sont souvent envoyées en\_missions de kidnapping dans les montagnes mais<span style=\"background-color: rgba(0, 0, 0, 0);\">les Matrones restent en sécurité dans la cité. Elles\_</span>n’en restent pas moins un danger extrême quand\_ont voit leurs capacités mais elles auront du mal à\_estimer le risque qu’elles prennent face au groupe de\_PJ, aux centaures ou aux captifs libérés. En dernier\_recours, si certaines Matrones sont tuées par les PJ et\_que les dernières sont au courant, elles essayeront de\_récupérer le maximum de Fillettes encore vivantes,\_quelques mâles exsangues et essayeront de prendre\_la fuite dans un des bateaux du port ou via le passage\_secret (vers A4) ou dans les tunnels du nord (en A2).</p>"
      public: "<p>Les Matrones sont les dirigeantes ultimes de Glanae’Reth.\_</p><p>Elles sont vicieuses, oppressantes et ont tout pouvoir sur\_tous les autres habitants. Elles restent très souvent dans les\_quartiers privés des femelles mais fréquemment elles se\_baladent dans la cité et peuvent tuer ou torturer n’importe\_quel habitant du coup sans raison apparente</p>"
