    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> idéaliste et optimiste - souhaite la grandeur de la ville</p><p><strong>Propos :</strong></p><ul><li><p><em>Les centaures sont les bienvenus</em></p></li><li><p><em>Je marchande avec les nains, les elfes, les orcs depuis toujours et ça n'apporte que du bon pour moi comme pour la ville\_</em></p></li><li><p><em>Grace à ces nouveauté la Vallée de Novrak deviendra bientôt une ville connue et puissante.</em></p></li><li><p><em>Vous voulez qu'à chaque fois que vous franchissez une ville naine on vous envoie des tomates à la gueule ? le respect va dans les deux sens. Si vous voulez être respecter commencer par respecter ses nouveaux venus</em></p></li></ul>"
      public: >-
        <p>Noble de la famille Blanche Barbe de la Vallée de Novrak.</p><p>Cet
        homme charnu et à la longue barbe peut passer d'un sourire charmand à un
        visage dur et fermé en quelques minutes. Il gère efficacement l'héritage
        de la famille Blanche Barbe grâce à ses ateliers divers et le commerce
        avec les villes de Mordrian et Kosland.</p><p>Une main de fer dans un
        gant de velour lui sied à ravir pour les affaires.</p>
