  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> très raciste - fasciste - partisan de l'extermination des \"races inertes\"</p><p><strong>Propos :</strong></p><ul><li><p><em>Arrêtons de laisser les races inertes envahir nos villes et villages. Les humains sont les seuls légitimes à réglés sur Arran.</em></p></li><li><p><em>Avec les centaures faut faire comme avec les chevaux, leur mettre des coup de trique sinon ils n'obéhiront jamais.\_</em></p></li><li><p><em>Des années à accepter de se faire rançonner par les nains qui vous font les poches et maintenant les elfes nous tuent et kidnappent nos enfants et des centaures viennent voler votre travail et envahir vos maisons.</em></p></li><li><p><em>Le premier sabot qui rentre dans ma boutique, je le vends ou j'en fais du paté de cheval. Nous devrions installer des panneaux devant nos magasins pour interdir les races inertes d'y rentrer. On acceptent pas les chiens, pourquoi accepter un elfe ou un centaure ?</em></p></li><li><p><em>J'entend déjà des habitants voulant offrir à manger aux centaures mais que se passera-t-il quand les récoltes manqueront ?</em>\_</p></li></ul>"
      public: "<p>Marchand malhonnète de la Vallée de Novrak. La plupart des honnètes villageois se méfie de lui mais beaucoup en ont aussi peur.\_</p><p>Il est mêlé à de nombreuses affaires de corruption et n'hésite pas à menacer pour arriver à ses fins. Son implentation dans la ville est profonde et il n'est jamais inquiété de rien grâce à ses relations chez les miliciens, les nobles et les voyoux de la région.</p>"
