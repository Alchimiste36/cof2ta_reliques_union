  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Krakk réagira différemment en fonction de
        son implication dans la libération de la cité. Si il a pu se venger
        comme il se doit, il jubilera de joie. Si par contre, les Sauveurs de la
        Dame d'Honneur lui ont refusé sa vengeance, il pourrait devenir
        dangereux pour eux (énervement, menaces, attaque…).</p><p>Après la
        libération de la cité, Krakk fera une belle sépulture pour sa famille et
        se mettra au service de Ghan. Dans la cité libérée ou autre part, il
        devrait finir sa vie son arme à la main, bondissant d'une ombre sur un
        ennemi mortel.</p>
      public: "<p>32 ans - Gobelin - Mâle - Captif depuis 7 mois</p><p>Krakk est un vieux gobelin. Il a un physique sec et extrêment agile. Krakk est un assassin expert qui a passé plusieurs années dans une horde d'orcs comme espion et tueur. Il accédait dans les camps ennemis pour exécuter les chefs de clans ou piéger la zone. Il a repris ça liberté et sa retraite il y a trois ans aux côtés d'une belle gobeline charmante et qui connaissait tout de sa vie passée. Ils ont eu une charmante fille qui rendait Krakk heureux et apaisé.</p><p>Lorsque sa famille fut capturée par les elfes exsangues, Krakk n'attendit pas deux secondes pour en filer son vieil équipement et suivre les traces dans les montagnes. Contrairement aux autres esclaves, Krakk est rentré seul dans la cité de Glanae'Reth, sa rapière à la main, caché dans les ombres. A lui seul, il tua une bonne vingtaine de mâles exsangues (sans compter les soumis), deux Soeurs, une Matrone et pas moins de cinq Fillettes. Ressortir de la cité malsaine en protégeant sa compagne et sa fille, c'étatit trop dur pour lui et il fut capturé.</p><p>Les trois Matrones torturèrent ses deux amours sous ses yeux et Krakk sera les dents, souriant à sa fille tout du long et lui parlant calmement de joie, de bonheur et de leur prochaine rencontre. Lorsqu'elle furent achevées, Krakk lança un grand sourire aux Matrones.</p><p>Krakk n'a pas rencontré les autres captifs car il a passé la plupart de son temps dans une cage non loin de\_@UUID[Actor.gnOEkzwKD5YNVWoU]{Ghan}, grillés à petit feu par les lourd braséros. Il est régulièrement torturé puis soigné mais il lui arrive de profiter d'une erreur des elfes exsangues pour en égorger un ou le rouer de coups, en chantant à tue-tête.</p><p>Krakk est impulsif, caractériel et il se valorise beaucoup sans qu'on puisse réellement savoir si ses anecdotes sont vraies ou de lourds mythos. Très ami avec Ghan, il le suivra dans la mort si le chef lui demande. Il n'a de toutes façons plus rien à perdre et la seule pensée qui le met en joie est la vision des Matrones tuées par sa rapière.</p>"
