  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Hooper voudra rapidement explorer toute
        la région de montagnes autour de la cité libérée à la découverte de ce
        monde inconnu. Il voudra faire le lien entre la nouvelle cité, les
        centaures et les villes de l'Ourann.</p><p>Si on lui demande, il pourra
        prendre une place importante dans la cité libérée mais il faudra qu'il
        puisse voyager régulièrement ou rencontrer des nouvelles personnes sinon
        il s'ennuiera au bout de quelques mois. Si Hooper se retrouve dans la
        cité-forge d'Hyr'Tarënn durant le confinement, il devrait être une belle
        ressource pour explorer chaque recoin de cette immense ville
        déserte.</p>
      public: >-
        <p>42 ans - Humain - Mâle - Captif depuis 9 mois</p><p>Hooper est la
        définition même de l'aventurier. Il arpente les Terres d'Arran depuis sa
        plus tendre enfance avec sa famille puis tout seul depuis 12 ans. Il vit
        de contrat pour retrouver un objet, une personne ou un lieu. Il passe
        des messages de villes en villages ou il marchande des trouvailles
        brillantes aux nobles. Il a tendance à rester plusieurs semaines voir
        plusieurs mois dans la même région pour faire le tour des histoires
        locales, obtenir la confiance des habitants et répondre à leur besoins
        contre d'épaisses bourses de pièces avant de ranger ses bagages légères
        et atteindre une nouvelle maison.</p><p>Hooper connait tous les
        continents des Terres d'Arran accessibles aux humains et il marchande et
        traite avec tous les peuples sans distinction. D'après ses dires il
        aurait même aidé un couple d'ogre à retrouver leur enfant dans des
        montagnes, ce qui est tout à fait avéré.</p><p>Il parle assez
        correctement le dialecte le plus commun des nains, des elfes, des orcs
        et des gobelins ainsi que quelques mots d'ogres et du patois
        Lutanne.</p><p>Depuis son kidnapping, il travaille beaucoup, subit les
        réprimandes avec fierté et sympathise avec les autres captifs. On peut
        lui faire confiance mais Hooper ne retirera pas sa carapace facilement.
        Il racote volontier ses aventures mais au final il ne parle quasiment
        jamais de ses émotions ou ses peurs.</p><p>Les femelles exsangues
        l'utilisent souvent comme jouet sexuel et les mâles comme
        souffre-douleur, lui imposant beaucoup de tâches ingrates ou
        épuisantes.</p>
