  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: "<p><strong>Caractère :</strong> humaniste - rationnel - fataliste</p><p><strong>Propos :</strong></p><ul><li><p><em>J'en ai\_ connu des corniauds comme vous à raconter que tous les malheurs du monde viennent des nains ou des Peaux Vertes, à se lamenter sur leur petit pouvoir. En 20 ans à arpenter les rues de la Citadelle d'Orkadia et les 10 ans à surveiller les allées de la Vallée de Novrak dans la milice, j'ai connu plus de problèmes avec les poivrots et les bagareurs qu'avec les nains, les elfes ou les orcs.\_</em></p></li><li><p><em>Depuis environ un an, je vous entend débiter vos conneries cher prêtre Dertirn et envoyer votre poison dans l'esprit des Novraks et Novrakis. Il est facile de jeter les problèmes des pauvres gens sur le dos des anciennes races car le bonheur ne rempli pas les temples et un habitant content ne donne pas ses maigres économies dans votre paroisse.</em></p></li><li><p><em>Le problème de la ville ne vient pas des nains ni des orcs, il vient de l'isolement et de vos esprits rétrécis. Accueillez les Centaures, Intégrez-les et tout ira pour le mieux, bandes de tarés.</em></p></li><li><p><em>Je pense pour ma part que le Prêtre Dertirn devrait être emprissoné pour ces propos ou renvoyé de là où il vient à Kosland, le plus tôt possible.</em></p></li></ul>"
      public: "<p>Viel alcoolique de la Vallée de Novrak - ancien milicien</p><p>Il est bourru et ne mâche pas ses mots. Il a aidé d'une manière ou d'une autre chaque habitant de la ville quand il était milicien et il se sait intouchable grâce à la sympatie du Seigneur\_@UUID[Actor.e0EAROPqyT9IyXJy]{Arbosk Mieili de la Tour de Mabeuil}.</p><p></p>"
