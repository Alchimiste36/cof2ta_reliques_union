  details:
    biography:
      private: "<p>Si il survit à Glanae'Reth, Gridley retournera le plus vite possible à la Vallée de Novrak mais il ne retournera pas de ci-tôt dans les hauteurs des montagnes seul à surveiller les Bouquetins de Novrak. Il lui faudra aussi du temps avant de passer des nuits sans cauchemars. Tout le monde lui souhaite de rencontrer des amis et un amour qui lui feront oublier les tourments qu'il a vécu dans la cité malsaine.</p><p>Si les centaures s'ouvrent au monde extérieur, ,\_ @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.Nuzfpv18FiNwewCJ]{Vaiata}, @UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.6rsGepWy5twVXkbs]{Hunga},\_@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.ZATNz2uVmXwpoX4W]{Tamariki} et\_@UUID[Compendium.cof2ta_reliques_union.reliquesunion-acteurs.Actor.j3OVVzmkWhACNokh]{Te'Whakama} pourraient devenir très amis avec Gridley.</p>"
      public: >-
        <p>16 ans - Humain - Mâle - Captif depuis 12 mois</p><p>Gridley est un
        berger de la Vallée de Novrak. Il aime les grands espaces bien aérés de
        la montagne au miieu des Bouquetins de Novrak de sa famille. Il peut
        passer plusieurs semaines d'affilées dans sa petite cabane seul avec son
        chien de troupeau.</p><p>Il n'est pas très à l'aise avec les autres
        adolescents de la ville et encore moins quand il s'agit des filles et
        des histoires d'amour, de coeur ou de drague. Pour cela, il reçoit des
        moqueries régulièrement, certains prétendant qu'il préfère ses
        bouquetins. Il repart très vite dans sa petite cabane avec
        Papatte.</p><p>Il a été récupéré pendant son sommeil par les elfes
        exsangues. La dernière chose qu'il ai vu fut le corps massacré de
        Papatte devant la porte et il s'est réveillé dans sa nouvelle vie
        d'esclave. Gridley est réservé et docile. Il discute avec les autres
        prisonniers, ne se mêle pas trop des conflits et il est bercé par les a
        priori sur les peuples qu'on raconte dans les histoires.</p><p>Ca
        jeunesse en fait une victime favorite pour les Filettes exsangues et
        certaines soeurs pour l'apprentissage des ébats et de la pratique du
        charme et de l'intimidation.</p><p>Gridley est proche d'Ida qu'il
        connaissait de la Vallée de Novrak et il s'est lié d'amiié avec Trevin
        et Arié.</p>
