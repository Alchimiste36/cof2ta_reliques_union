  details:
    biography:
      private: >-
        <p>Si elle survit à Glanae'Reth, Anake retournera au Village d'Arkanov.
        Elle militera pour ouvrir le village sur l'extérieur et arrêter de vivre
        isolé dans la peur. Au debut, elle proposera de faire le lien entre la
        Vallée de Novrak, la cité libérée de Glanae'Reth et le village
        d'Arkanov.</p>
      public: "<p>14 ans - Centaure - Femelle - Captive depuis 37 mois</p><p><strong>Caractère :</strong> intransigeante, dure, sur la défensive, susceptible</p><p>Anake est une jeune centaure de 14 ans aujourd’hui mais depuis trois ans, elle est réduite\_en esclavage. Depuis sa tendre enfance, Anake redoute les crises de colère de sa mère\_Te’Riri et passe la plupart de son temps avec sa grand-mère Ka’Huri. Elle prend pour\_modèle son sens de l’honneur inaltérable. Anake ne partage pas les idées expansionnistes\_de sa famille mais, avant sa disparition, elle était persuadée que le village d’Arkanov était\_le centre du monde. Trois ans de captivité dans les prisons de Glanae’Reth ont fait d’Anake\_une centaure robuste, déterminée et intransigeante.</p>"
    appearance:
