    notes:
      private: >-
        <p><strong>Caractère :</strong> méprisant les hommes - désagréable -
        sauter sur les occasion de faire du business</p><p><strong>Propos
        :</strong></p><ul><li><p><em>C'est toujours la même chose avec les hums.
        Vous tortillez du cul à chaque boulversement et vous chier dans vos
        chausses devant chaque menace.</em></p></li><li><p><em>J'en ai marre de
        vos regards à chaque fois que j'arrive dans votre mourroir. Si ça
        s'trouve je ferais plus d'affaire avec les centaures qu'avec des
        corniauds comme vous</em></p></li><li><p><em>Depuis que la route
        marchande est ouverte, on est bien obligé de passer par là. Ca apporte
        que du profit pour vos boutiques et vos commerces. Fermez vos portes et
        vous mourrez entre humains !!</em></p></li></ul>
      public: "<p>Marchand Nain faisant du commerce avec la Vallée de Novrak.\_</p><p>Il est connu à la Vallée de Novrak pour ses prix élevés et sont caractère de cochon. D'après les rumeurs, il n'est pas toujours aimable avec les habitants locaux et ses histoires tournent souvent autour des humains qu'il a réussi à pigeonner.</p><p></p>"
