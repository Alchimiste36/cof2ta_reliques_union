  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Farmir s'engagera rapidement dans les
        forces de la cité libérée, aux côté de Benxia et de Bik si elles ont
        survécu. Ses rêves les plus intenses le montrent sur le dos d'un immense
        cochon de guerre, dans une armure rutilante, marteau de guerre à la
        main, pourfendant des centaines de créatures démoniaques.</p><p>Du rêve
        à la réalité, les choix de Farmir devraient lui permettre d'atteindre
        cet objectif. Ses idéaux pourraient lui permettre d'enflammer les nains
        errants face à toutes les formes d'oppression comme la figure quasiment
        légendaire d'Oösram des errants.</p>
      public: >-
        <p>24 ans - Nain - Mâle - Captif depuis 14 mois</p><p>Farmir est un nain
        courageux malgré son jeune âge. Il est déjà bien charpenté et robuste
        grâce au travail dans la ferme de cochon avec ses parents et ses deux
        soeurs. On lui a toujours appris à aider les autres et il a bien intégré
        cette leçon qu'il applique dès qu'il le peut. Jeune nain peu instruit,
        Farmir est toujours là pour prêter sa main ou so énergie pour soulager
        quelqu'un ou aider.</p><p>Depuis sa capture et le massacre de ses deux
        soeurs et de son père par les elfes exsangues, Farmir serre les dents et
        profite de toutes les tâches ingrates à faire pour ses tortionnaires
        pour se muscler et s'entrainer. Il a développer une très forte amitié
        avec Bik et surtout Benxia. S'il n'a pas pu sauver ses soeurs, il
        sauvera quoiqu'il en coute ses deux amis à la peau verte.</p><p>Farmir
        est un idéaliste qui rêve d'un monde rempli d'héroïsme, de combat du
        bien contre le mal et de victoire des justes sur les impérialistes. Il
        écoute avec intérêt chaque histoire de valeur et d'honnêteté venant
        d'Urmdar, les récits pleins d'aigreur de Thonur, les aventures soupoudré
        de filouterie de Vrek et les enseignements égalitaires de
        Whakamamae.</p>
