  details:
    biography:
      private: "<p>Jumelle de la\_@UUID[Actor.FXvpazChGnAsp1uR]{Soeur Miiria}.</p><hr><p>Les Fillettes et les Sœurs pourront se jeter dans\_le combat en utilisant toute la panoplie de leurs\_pouvoirs si elles sont isolées des mâles ou elles se\_placeront en commandantes des mâles aux alentours\_pour les faire attaquer les intrus ou pour les protéger.\_</p><p>Le pouvoir magique des Sœurs les rend arrogantes.\_Elles ont l’habitude de diriger et de dominer. Elles ne\_seront pas différentes avec un groupe de PJ ennemis\_qu’avec les captifs. Après une démonstration de\_puissance des PJ, une Sœur peut décider de quitter\_le combat pour aller prévenir les autres Sœurs ou les\_Matrones mais, comme pour les Lieutenants, elle\_pense, à raison, que ce comportement lui apportera\_mépris et honte devant sa couardise.</p>"
      public: "<p>Les Sœurs sont les lieutenantes des Matrones. Elles ont\_beaucoup de pouvoir sur les habitants de la cité. Contrairement aux Matrones, les Sœurs sont en concurrences les\_unes avec les autres. Elles essayent d’attirer l’attention des\_Matrones à tout moment et cherche à limiter au maximum\_de les contrarier. Elles rivalisent de sauvagerie et de violence\_pour plaire aux Matrones.</p>"
