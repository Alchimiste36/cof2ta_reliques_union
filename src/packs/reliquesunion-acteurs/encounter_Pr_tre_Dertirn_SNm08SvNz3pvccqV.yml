  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: >-
        <p><strong>Caractère :</strong> posture dominante et paternaliste - en
        colère - se cache derrière la foi pour déverser ses idées racistes -
        conspirationniste</p><p><strong>Propos :</strong></p><ul><li><p><em>Ca
        commence toujours comme ça. On accueille, on est gentil et PAF on se
        fait marcher dessus.</em></p></li><li><p><em>Le Pontife Faringue de
        Solima des Marches du Venkor l'a vu de ses yeux. Ils ont ouverts leur
        bras aux compagnies naines pour soi-disant les protéger des géants du
        Tannhoser et ils ont fini ruinés, trahis et abandonnés par les
        courtes-guiboles. Au final, l'alliance avec le Tannhoser est bien
        plusprofitable qu'avec les nains qui mordent la main
        tendue.</em></p></li><li><p><em>Les Ombres Blanches étaient des Elfes !!
        Quelle surprise. Ils contrôlent le monde entier. Ce sont les elfes qui
        tirent les ficelles dans l'ombre de leur château. Sous la lumière
        chaleureuse de Solima, nous voyons les choses telles qu'elles
        sont.</em></p></li><li><p><em>La venue des Centaures sera une bonne
        chose s'ils se soumettent à la bienveillance de Solima et acceptent nos
        croyances et nos traditions.</em></p></li></ul>
      public: >-
        <p>Prêtre de Solima de la Vallée de Novrak - très respecté d'une partie
        importante des habitants - Il est rattaché et originaire à l'église de
        Solima des Marches du Venkor.</p><p>Cet homme, musculeux malgré un
        ventre bien rebondi, est autoritaire et sur de lui. Il apporte la parole
        de Solima et il n'est pas tolérant avec ceux qui l'a remette en question
        ouvertement ou non.</p><p></p>
