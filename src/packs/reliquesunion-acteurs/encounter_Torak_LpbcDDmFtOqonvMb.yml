  details:
    category: humanoid
    size: medium
    description:
      private: ''
      public: ''
    notes:
      private: >-
        <p><strong>Caractère :</strong> bourru - sarcastique -
        piquant</p><p><strong>Propos :</strong></p><ul><li><p><em>Ca fait bien
        longtemps que je vous cotoie et à chaque fois vous criez avant d'avoir
        mal</em></p></li><li><p><em>Rien qu'en les regardant, je suis sur que
        ces Centaures sont plus accueillants que vous, les
        pleureuses</em></p></li><li><p><em>Si y'en a un qui a un problème avec
        les anciennes races qu'ils viennent me le dire en face - j'ai soit une
        bonne bière et un excellent travail soit un gros marteau pour son pif
        !!</em></p></li><li><p><em>Démerdez-vous, mes venez pas chialer si plus
        personne ne fout les pieds dans votre village glaciale si on apprend que
        vous êtes tous de foutu Racistes</em></p></li></ul><p><strong>Notes au
        MJ :</strong></p><p>Torak peut devenir un PJ au besoin mais il est très
        puissant et il ne faudrait pas qu'il puisse partir en campagne avec les
        armes et les armures traditionnelles les plus puissantes de sa
        collection. Sinon cela risque de déséquilibrer le groupe.</p><p>Lors du
        passage dans la cité d'Hyrr'Tarënn, Torak pourra être un atout majeur
        pour la cité si le groupe amène des habitants de la Vallée de Novrak
        grâce au portail.</p>
      public: >-
        <p>Ancien membre gradé d'un compagnie du Bouclier, Torak est aujourd'hui
        reclu dans la ville de la Vallée de Novrak. Il passe ses journées à
        forger, boire et grogner dans sa barbe. Devenu boitard (handicapé
        réformé de l'armée) lors d'une expédition dans les plaines du Sud de
        l'Ouran, il est compliqué pour lui de ravaler sa frustration.</p><p>Une
        de ses passion est de collectionner et récupérer des Armes et Armures
        Traditionnelles de tous les peuples. Il a un vrai petit musée dans son
        atelier. Il ne vendra ni ne se séparera d'une de ses pièce de collection
        que pour des vraie amis, contre une pièce encore plus rare ou en cas de
        nécessité absolue.</p><p>Il participe aux événements de la Vallée de
        Novrak mais souvent sans se mélanger à la population. C'est un solitaire
        mais de temps en temps il aide à la rénovation ou à la fabrication d'un
        pièce métallique complexe.</p>
