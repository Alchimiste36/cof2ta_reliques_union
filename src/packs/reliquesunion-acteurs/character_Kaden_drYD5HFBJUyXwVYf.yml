  details:
    biography:
      private: >-
        <p>Si il survit à Glanae'Reth, Kaden retournera à la Vallée de Novrak et
        il devrait rapidement reprendre sa vie d'avant. Tout le monde sait qu'il
        est traumatisé par ces longs mois de captivité mais son tempérament
        semble l'accepter plutôt bien. Les autres disent qu'il est simplet mais
        pour en être sur il faudrait le faire parler plsu que trois mots.</p>
      public: >-
        <p>35 ans - Humain - Mâle - Capturé depuis 17 mois</p><p>Kaden est
        milicien à la Vallée de Novrak. Il mène une vie tranquille avec ses
        frères d'armes. Il écoute les ordres, patrouille, répond aux questions
        et aux soucis du quotidien des habitants et profite de ses permissions
        pour boire un verre à la taverne et dormir.</p><p>Kaden n'est pas le
        milicien le plus doué de la ville ni le plus malin mais on a jamais rien
        à lui reprocher. Il a été capturé avec Orrick par les Ombres Blanches
        lors d'une patrouille sur les hauteurs de la Vallée de Novrak. Depuis,
        il suit les ordres d'Edric comme si de rien était. Il ne parle pas
        beaucoup et réagit lentement dès qu'il faut faire quelque
        chose.</p><p>Sans le savoir, son bec de lièvre semble dégouter les elfes
        exsangues. Il reçoit souvent des coups et des réprimandes mais il n'a
        jamais été torturé ni violé dans la cité malsaine.</p>
